B("NLP","int",1,"TF-IDF vs embeddings: is TF-IDF obsolete?","No. Lexical scoring still beats dense retrieval on rare terms, identifiers and exact matches, which is why hybrid search exists.","Dense retrieval generalises meaning but blurs exact tokens; BM25 is exact but has no synonym handling. They fail on opposite queries, so fusing them is strictly better than either.","Searching for error code E-4021 or part number AX-9931 works with BM25 and fails with embeddings alone.","Run both indexes and fuse with RRF; it is the production default and costs little.","How do you combine the ranked lists?","'They fail on opposite queries' is the sentence that wins this question."),
B("NLP","int",0,"What is NER and would you use an LLM for it?","Named entity recognition tags spans as entities. For a fixed entity set at volume, a small fine-tuned encoder is cheaper, faster and more consistent than an LLM.","LLMs generalise to new entity types with no training data, which is valuable for cold start and long-tail schemas; encoders win on cost, latency and determinism.","PII detection at scale uses Presidio or a fine-tuned model, not a frontier LLM per request.","Use the LLM to bootstrap labels, distil into a small model, keep the LLM as a low-confidence fallback.","How do you evaluate NER?","The bootstrap-then-distil pattern is a strong, practical answer."),
B("NLP","int",0,"How do you measure semantic similarity between two texts?","Embed both and compute cosine similarity, or score the pair jointly with a cross-encoder for higher accuracy.","Bi-encoder similarity is cheap and precomputable; cross-encoders are more accurate but cost a forward pass per pair, so they are used for reranking small candidate sets.","Deduplicating support tickets: embed all, cluster, then cross-encode borderline pairs.","Calibrate the threshold on labelled pairs — raw cosine values are not comparable across models.","What is a 'good' cosine score?","Stress that thresholds are model-specific and must be calibrated, not assumed."),

/* ---------- Transformers ---------- */
B("Transformers","int",1,"Walk me through self-attention.","Project each token into query, key and value vectors; score queries against keys with scaled dot products; softmax to weights; take the weighted sum of values.","The √d_k scaling keeps score variance near 1 so softmax does not saturate. Causal masking prevents attending to future tokens in decoders.","Resolving 'it' to 'invoice' is attention routing information from one position to another.","Cost is quadratic in sequence length, which is why FlashAttention, sliding-window and grouped-query attention exist.","What is the KV cache?","Have the formula verbatim: softmax(QKᵀ/√d_k)·V. It is asked constantly."),
B("Transformers","adv",1,"What is the KV cache and why does it constrain serving?","Cached keys and values for past tokens, reused each decoding step instead of recomputed. Its memory grows with batch × sequence × layers and usually caps concurrency.","Without it, every generated token would recompute attention over the whole prefix. With it, decoding is linear, but the cache can exceed the weights in memory for long contexts.","A long-context request can hold gigabytes of KV cache, limiting how many concurrent requests one GPU serves.","PagedAttention (vLLM) pages the cache in blocks to remove fragmentation, which is what makes high concurrency practical.","How does quantising the KV cache help?","Say 'the KV cache, not the weights, is usually what limits concurrency' — that is the production insight."),
B("Transformers","int",0,"Why do transformers need positional encoding?","Attention is permutation-invariant, so without position information the model cannot distinguish word order.","Sinusoidal encodings were original, learned embeddings are used in BERT, and rotary (RoPE) is standard in modern LLMs because it encodes relative position and can be scaled to extend context.","'dog bites man' and 'man bites dog' are identical to attention without positional information.","RoPE scaling (position interpolation, YaRN) is how 8k-context models are extended to 128k.","How is context length extended?","Connect RoPE directly to context extension — it shows current knowledge."),
B("Transformers","int",0,"Encoder-only vs decoder-only: which for embeddings and which for chat?","Encoder-only for embeddings and reranking because bidirectional attention is better for understanding; decoder-only for generation because of the causal objective.","A RAG stack uses both: an encoder for embeddings, a cross-encoder (encoder) for reranking, and a decoder-only LLM for the answer.","BGE or E5 for embeddings, a BGE cross-encoder for reranking, a frontier decoder model for generation.","Naming this mapping explicitly is a strong signal of practical familiarity.","Why is a cross-encoder better at relevance?","Give the three-model mapping unprompted — it is memorable and correct."),
B("Transformers","adv",0,"What is grouped-query attention and why does it exist?","Multiple query heads share fewer key/value heads, shrinking the KV cache with little quality loss.","Multi-head attention stores KV per head; multi-query shares one KV across all heads (cheapest, some quality loss); grouped-query is the middle ground used by most modern models.","Llama-family models use GQA to make long-context serving affordable.","It directly raises how many concurrent requests a GPU can hold, so it is a serving-cost decision as much as an architecture one.","How does it affect quality?","Frame it as a KV-cache memory optimisation — the 'why' behind the architecture choice."),
B("Transformers","adv",0,"What does temperature actually do mathematically?","It divides the logits before the softmax, so low values sharpen the distribution toward the argmax and high values flatten it.","At temperature 0 sampling becomes greedy. Very high temperature approaches uniform sampling over the vocabulary, producing incoherence.","Temperature 0.1 for JSON extraction, 0.8 for brainstorming.","Expose presets, not raw temperature, or users will break your output parsing.","Why is temperature 0 not fully deterministic?","Pair the maths with the production note about presets — it shows both depth and judgement."),
B("Transformers","int",0,"Where do most of a transformer's parameters live?","In the feed-forward networks, typically about two-thirds of each block's parameters at 4× hidden width.","Attention projections are comparatively small. This is why mixture-of-experts replaces the FFN with many experts and routes to a few.","A 7B dense model's FFN layers dominate both parameter count and memory.","It explains why MoE models have huge total parameters but modest active compute — and why VRAM still tracks total size.","What is the operational catch with MoE?","This detail is a quick credibility signal in architecture discussions."),

/* ---------- LLM ---------- */
B("LLM","beg",1,"What is a context window and how do you manage it?","The maximum tokens for prompt plus completion. You manage it with an explicit budget per segment and a truncation policy.","Budget: system prompt + tool schemas + history + retrieved context + expected output. Truncate the lowest-value segment first, usually old conversation turns.","A 128k window still costs money and latency per token, so you rarely want to fill it.","Track token usage per segment in telemetry; unbounded history growth is the most common cost regression.","What do you drop first?","Talk about a budget, not a limit — budgeting is the engineering behaviour being tested."),
B("LLM","int",1,"When do you fine-tune instead of using RAG?","Fine-tune for behaviour, format and style; use RAG for knowledge, especially knowledge that changes or needs citations and permissions.","Fine-tuning bakes patterns into weights: it cannot cite sources, cannot be updated in seconds, and cannot enforce per-user access. RAG cannot teach a model a consistent output style as cheaply as a LoRA can.","LoRA to enforce a strict clinical note format; RAG for the current formulary.","Production systems often use both: RAG for facts, a small adapter for format adherence.","Can fine-tuning reduce hallucination?","'Fine-tuning changes behaviour, retrieval changes knowledge' — the one-liner to memorise."),
B("LLM","int",0,"What is LoRA and why is it the default fine-tuning method?","It freezes base weights and learns low-rank adapter matrices added to them, training a tiny fraction of parameters.","Cheap to train, small to store, hot-swappable at serving, and it avoids catastrophic forgetting of base capabilities. QLoRA adds 4-bit quantisation of the base so it fits on one consumer GPU.","A 7B model fine-tuned with QLoRA on a single 24GB GPU for a few dollars.","Serve one base model with many adapters to support multiple tasks or tenants without multiplying GPU memory.","What do rank and alpha control?","Adapter hot-swapping is the production point that distinguishes a real answer."),
B("LLM","adv",1,"How do you reduce hallucination?","Ground with retrieval, constrain generation with an explicit context-only instruction and citation requirement, validate output, and add a refusal path with a relevance floor.","Most hallucination in a RAG system is a retrieval failure. Fix retrieval before touching the prompt. Then measure faithfulness so you know whether anything helped.","A policy question answered from a chunk missing its qualifying clause produces a confident wrong answer — a chunking bug, not a model bug.","Track faithfulness and refusal rate as first-class metrics with alerts.","What if retrieval returns nothing relevant?","'Most hallucination is a retrieval failure' is the highest-signal sentence in this topic."),
B("LLM","adv",0,"What is quantisation and what does it cost you?","Storing weights and activations at lower precision to cut memory and raise throughput, at some quality cost.","FP16 is effectively lossless; INT8 is usually fine; INT4 degrades reasoning and arithmetic noticeably while keeping fluency, which makes the regression easy to miss.","A 7B model drops from ~14GB to ~4GB at INT4, fitting a consumer GPU.","Always re-run the eval suite after quantising; fluency is preserved so smoke tests pass while instruction-following quietly degrades.","When is INT4 acceptable?","The 'fluency survives, reasoning degrades' observation is the expert detail."),
B("LLM","int",0,"What are top-k and top-p, and how do they differ?","Top-k keeps the k most likely tokens; top-p keeps the smallest set whose cumulative probability exceeds p, so the candidate count adapts to the distribution.","Top-p is generally preferred because it adapts: when the model is confident it considers few tokens, when uncertain it considers more.","Top-p 0.9 with temperature 0.7 is a common conversational setting.","Change one knob at a time; combining aggressive temperature and top-p produces unpredictable output quality.","Which would you tune first?","'Top-p adapts to the distribution' is the distinguishing statement."),
B("LLM","prod",1,"How do you control LLM cost in production?","Cache (exact, semantic and provider prompt caching), route to cheaper models by complexity, cap output tokens, budget context, batch offline work, and set per-tenant quotas.","Caching and routing typically dominate savings. Context growth from unbounded history is the most common source of a silent cost increase.","Support workloads often see 25–40% semantic cache hit rates because users ask the same things.","Meter tokens in the gateway so every path is counted, and alert on daily spend anomalies by tenant and feature.","Where do you meter?","Order the levers by impact — that ordering is the answer, not the list."),
B("LLM","adv",0,"How do you evaluate an LLM feature before shipping?","Curate a labelled set from real questions, define metrics (faithfulness, correctness, format validity), run them as a CI gate with thresholds, then canary online with sampled judging.","Exact-match testing does not work; you need metric thresholds and tolerance. The dataset matters more than the tool.","A 200-case golden set curated from production failures beats 5,000 synthetic cases.","Every prompt or model change runs the gate; each trace carries its prompt and model version so regressions are attributable.","How do you stop eval flakiness blocking deploys?","'The dataset is the asset' — say it, it is the mature view."),
B("LLM","int",0,"What is prompt caching and how do you exploit it?","Providers cache a stable prompt prefix so repeated calls reuse it at reduced cost and latency.","It requires the cacheable content to come first and be byte-identical. Putting volatile content (timestamps, user ids) early destroys the hit rate.","A 3,000-token system prompt plus tool schemas cached across millions of requests is a large saving.","Structure prompts as: stable system and schemas, then retrieved context, then the user turn.","What breaks the cache?","The 'volatile content early destroys it' detail is the actionable part."),
B("LLM","adv",0,"Explain speculative decoding.","A small draft model proposes several tokens which the large model verifies in one forward pass, accepting the matching prefix.","It reduces latency without changing the output distribution when done correctly, because verification is exact. Gains depend on draft acceptance rate.","A 1B draft model with a 70B target can cut latency substantially on predictable text.","Mostly relevant if you self-host; managed providers apply it internally.","Does it change output quality?","'Verification keeps the distribution exact' is the key correctness point."),
B("LLM","prod",0,"A provider deprecates the model version you use in 30 days. What is your plan?","Pin versions so you know exactly what you use, run the candidate model through the eval suite, canary it on a traffic slice, compare quality and cost, then cut over with rollback ready.","Model upgrades change behaviour subtly — formatting, verbosity, refusal patterns. Without an eval suite this migration is a guess.","A prompt tuned for one model version producing longer answers on the next, raising cost 30%.","Keep prompts and model versions as separately deployable configuration so the cutover needs no code release.","What if quality drops on the new model?","Emphasise that pinning is what makes this manageable — unpinned systems get upgraded without knowing."),

/* ---------- RAG ---------- */
B("RAG","beg",1,"Explain RAG to a non-technical stakeholder.","It is search plus writing: the system finds the relevant passages in your documents, then the model writes an answer using only those passages, with links to the sources.","This framing sets correct expectations — answer quality depends on document quality, and the system can say it does not know.","'Like an analyst who looks up the policy before answering, and shows you the page.'","It also explains why ingesting bad documents produces bad answers, which is the conversation you will have repeatedly.","What can go wrong?","Having a non-technical explanation ready is itself a senior signal."),
B("RAG","int",1,"What are the components of a RAG pipeline?","Ingestion: load, parse, chunk, embed, index with metadata. Query: rewrite, retrieve (hybrid), fuse, rerank, assemble prompt under budget, generate with citations, validate, log.","The two pipelines are independent and must be: ingestion is async and idempotent, the query path only reads.","Ingestion on Kafka workers; query path in a FastAPI service with a semantic cache in front.","Keeping ingestion out of the request path is the single most important structural decision.","Where does the queue go?","List it as two pipelines, not one — interviewers notice the distinction immediately."),
B("RAG","int",1,"How do you choose chunk size and overlap?","Empirically against an eval set, measuring context recall and faithfulness. Start at 300–800 tokens with 10–20% overlap, and prefer structure-aware splitting.","Too small loses context and fragments clauses; too large dilutes the embedding so it matches nothing precisely and wastes the token budget.","Contract clauses need larger chunks or parent expansion; FAQ entries work at 300 tokens.","Prepend the heading breadcrumb to every chunk — one of the cheapest quality wins available.","What does too-large chunking cost?","'Sweep and measure' plus the breadcrumb tip — concrete, not theoretical."),
B("RAG","adv",1,"Explain hybrid search and why it beats dense-only retrieval.","Run dense (semantic) and lexical (BM25) retrieval in parallel and fuse the ranked lists, usually with Reciprocal Rank Fusion.","Dense retrieval handles paraphrase but fails on rare tokens, identifiers and exact phrases; BM25 is the inverse. Fusing covers both query types.","A query containing a specific SKU plus a descriptive question needs both branches.","RRF avoids normalising incomparable score scales, which is why it is the production default over weighted score blending.","Why RRF over score averaging?","Explain RRF as 'rank-based, so no score normalisation' — the reason it is used."),
B("RAG","adv",1,"Why is reranking worth the latency?","Embedding similarity compares query and document independently; a cross-encoder reads them together and judges actual relevance, which is far more accurate.","The standard shape is retrieve 50–100 for recall, rerank to 3–8 for precision. Cross-encoding the whole corpus is computationally impossible, which is why it is two-stage.","Cohere Rerank or a BGE cross-encoder at 100 candidates adds ~150–300ms and typically gives the biggest quality jump after chunking.","The rerank score is also your relevance floor for refusing to answer.","Why not cross-encode everything?","Mention using the rerank score as a refusal threshold — it connects quality to safety."),
B("RAG","adv",0,"What is a parent document retriever?","Index small chunks for precise matching but pass the larger enclosing section to the LLM for context.","It decouples the retrieval unit from the generation unit, resolving the tension where small chunks match better but read as fragments.","Retrieve a 200-token paragraph, generate from its 1,200-token section.","Cap parent size or you blow the token budget and pull in irrelevant siblings.","What is the downside?","'Decouples retrieval unit from generation unit' is the phrase that shows understanding, not memorisation."),
B("RAG","adv",1,"How do you handle a multi-hop question in RAG?","Decompose it into sub-questions, retrieve per sub-question, then synthesise — or use Graph RAG when the pattern is common.","Single-pass top-k structurally cannot answer a question requiring facts from many documents, because the top-k is a local sample.","'Which suppliers appear in both the 2023 audit findings and the current risk register?' needs two retrievals and a join.","Route by query type so only the queries that need the expensive path pay for it.","How do you detect multi-hop queries?","Say 'structurally cannot' — it shows you understand why, not just what to do."),
B("RAG","adv",0,"What is query rewriting and why is it near-mandatory in chat?","Rewriting a context-dependent follow-up into a standalone question before retrieval.","A raw follow-up like 'and the refund window?' has almost no retrievable meaning. Its embedding matches nothing useful.","Rewritten to 'What is the refund window for international orders?' using the last two turns.","Use a small fast model, cache the rewrite per turn, and measure retrieval recall with and without it.","How do you evaluate the rewriter?","Call it the highest-ROI addition to conversational RAG — it usually is."),
B("RAG","adv",0,"What is contextual retrieval?","Prefixing each chunk with a short generated description of its place in the document before embedding, so isolated chunks carry their context.","It fixes chunks that are ambiguous alone ('the limit is 30 days' — for what?). The cost is one LLM call per chunk at ingestion, made affordable by prompt caching over the document.","'This passage is from the 2024 refund policy, international orders section: the limit is 30 days.'","Pay once at ingestion to save on every query — the right direction of trade since queries outnumber ingestions.","What does it cost?","The 'pay at ingestion, save at query' framing is the reasoning being tested."),
B("RAG","adv",0,"What is MMR and where in the pipeline does it belong?","Maximal Marginal Relevance selects results balancing relevance to the query against redundancy with already-selected results. It belongs after reranking.","Top-k from a vector index is often near-duplicate chunks from the same section, wasting context and narrowing the evidence base.","Five chunks of the same paragraph replaced by five distinct relevant sections.","Also dedupe at ingestion; MMR is a query-time mitigation, not a substitute for a clean index.","What controls the trade-off?","Placing it after reranking (diversity among the best) is the detail that gets it right."),
B("RAG","prod",1,"🔥 How would you design a scalable RAG system for 10 million documents?","Async idempotent ingestion on a queue; structure-aware chunking with metadata and ACLs; sharded hybrid index with quantised vectors; query path of rewrite → hybrid retrieve with ACL pre-filters → RRF → cross-encoder rerank → relevance floor → grounded generation with citations; plus caching, evaluation gates and full tracing.","The scale-specific decisions are: shard the vector index and merge with a heap; quantise vectors to control memory; keep the index rebuildable from object storage so embedding upgrades are possible; and run re-embedding as batch work on spot capacity.","500M chunks at 768 dims quantised, sharded by department, with 4× over-fetch before reranking.","Ingestion cost and index memory dominate, not query cost. Design the migration path before the first index.","What breaks at 100M documents?","Say the index is a derived, rebuildable artefact — that single idea carries the whole answer."),
B("RAG","prod",1,"🔥 Your RAG system is accurate in testing but users say it is wrong in production. Diagnose.","Compare distributions: production queries are shorter, more ambiguous, more multi-turn and cover topics your eval set does not. Instrument first, then fix.","Typical causes: no query rewriting for follow-ups, coverage gaps in the corpus, ACL filters silently removing the right documents, and an eval set written by engineers rather than drawn from real users.","Log queries whose top rerank score falls below the floor — that list is your content-gap and retrieval-gap report.","Grow the eval set from production traffic continuously; a static eval set decays.","What metric would reveal a coverage gap?","'Your eval set does not look like your traffic' is the diagnosis interviewers are hoping for."),
B("RAG","prod",0,"How do you keep a RAG index in sync with changing documents?","Event-driven incremental updates keyed on content hash, with versioned documents, tombstoned deletes, delete-by-filter in the index, and cache invalidation for answers citing changed documents.","Full re-index on every change does not scale; mutating in place without versioning leaves stale and current text coexisting, so retrieval returns both.","A corrected policy published while the old version remains indexed produces contradictory citations.","Expose per-document indexing status so users can see freshness rather than guessing.","What about an ACL change?","The cache-invalidation-on-document-change detail is the one most candidates miss."),
B("RAG","adv",0,"When would you not use RAG?","When the knowledge is small and stable enough to fit in a prompt, when the task needs no external knowledge, when latency forbids retrieval, or when the answer needs computation rather than recall.","A short stable policy can simply live in the system prompt with prompt caching, which is cheaper, faster and simpler than a retrieval stack.","A 2,000-token style guide belongs in the prompt, not in a vector database.","Do not build infrastructure you do not need; the smallest system that passes your eval bar is the right one.","At what corpus size does RAG become worthwhile?","Being willing to say 'no RAG needed here' reads as senior judgement, not ignorance."),
B("RAG","adv",0,"How do you evaluate retrieval separately from generation?","Label relevant chunks per question and measure context recall, context precision, MRR and NDCG for retrieval; measure faithfulness, answer relevancy and correctness for generation.","Separating them tells you where to invest. High recall with bad answers is a generation or prompt problem; low recall means no prompt fix will help.","Recall@20 at 0.95 but answers wrong → check whether the correct chunk survives into the final prompt.","Log final prompt chunk ids so this check is a query, not an investigation.","What if the right chunk is retrieved but truncated away?","'Different metrics, different fixes' is the organising idea."),

/* ---------- Vector DB ---------- */
B("VectorDB","int",1,"What is ANN and why not exact search?","Approximate nearest neighbour trades a small amount of recall for orders of magnitude less computation than scanning every vector.","Exact search is O(n·d): 10M vectors at 1,536 dims is billions of operations per query. ANN indexes navigate structure (graphs or clusters) instead.","HNSW touches a logarithmic number of nodes rather than all 10M.","Measure recall@k against brute force on a sample so you know what your approximation actually costs.","How do you measure recall loss?","Quantify the exact-search cost out loud — it justifies the whole category."),
B("VectorDB","adv",1,"HNSW vs IVF-PQ: how do you choose?","HNSW for high recall at low latency when RAM allows, typically under ~10M vectors. IVF-PQ when memory is the binding constraint at larger scale.","HNSW stores full vectors plus graph edges, so memory is high; IVF-PQ compresses vectors 8–32× at some recall cost, recovered by over-fetching and reranking.","500M chunks makes HNSW with full vectors infeasible; IVF-PQ plus rerank is the standard answer.","Whichever you choose, over-fetch and rerank — it recovers most approximation loss cheaply.","What are the tuning knobs?","Tie the choice to a memory budget number, not a preference."),
B("VectorDB","adv",1,"Why does metadata filtering hurt ANN recall, and what is the fix?","Post-filtering searches then discards, so a selective filter can leave you with nothing. The fix is pre-filtering inside the index or partitioning.","With a filter matching 0.1% of documents, a top-100 ANN search may contain zero matching results. Filterable indexes restrict traversal to eligible nodes instead.","Qdrant payload filters with filterable HNSW, Weaviate/Milvus partitions, or separate collections per tenant.","Multi-tenant ACL filtering must be pre-filtered and server-derived — this is a correctness and security issue, not just performance.","When would you use separate collections?","The 0.1%-selectivity example makes the problem vivid and memorable."),
B("VectorDB","int",0,"How do you size a vector database?","n × d × 4 bytes for float32 vectors, plus index overhead (HNSW commonly 30–100%), plus payload and text. Then decide on quantisation.","10M chunks at 1,536 dims ≈ 61GB of vectors alone; with HNSW overhead plan ~100GB RAM, or quantise to cut it several-fold.","Reducing to 768 dims with scalar quantisation brings the same corpus to roughly 15GB.","Memory, not disk, is the cost driver. Dimension choice is therefore an infrastructure decision, not just a quality one.","How do you decide dimensions?","Do the arithmetic aloud — it is the fastest way to demonstrate real experience."),
B("VectorDB","adv",0,"How do you handle deletions and updates in a vector index?","Soft-delete with tombstones and periodic compaction for graph indexes; delete-by-filter for bulk removal; upsert with deterministic ids for updates.","HNSW cannot cheaply remove a node from the graph, so deletes are marked and skipped until a rebuild. Ignoring compaction degrades both memory and recall over time.","A GDPR deletion must remove vectors, source text, and any cached answer citing the document.","Schedule compaction and monitor tombstone ratio; treat it as routine maintenance like VACUUM in Postgres.","What about a deleted document appearing in a cached answer?","The tombstone/compaction detail plus the cache point is a complete, senior answer."),
B("VectorDB","prod",0,"How do you migrate to a new embedding model on a live index?","Build a shadow index by re-embedding into a new collection, dual-write new documents to both, evaluate both on the labelled set, then flip reads behind a flag and retire the old collection.","Vectors from different models are not comparable, so a partial migration silently destroys retrieval. It must be all-or-nothing per collection.","Re-embedding 50M chunks on batch spot capacity with a double-storage window budgeted.","This is why the index must be rebuildable from object storage — design for it before you need it.","How do you keep both in sync during migration?","Dual-writing during migration is the detail that proves you have done one."),

/* ---------- LangChain / LangGraph ---------- */
B("LangChain","beg",0,"What problem does LangChain solve?","It provides standard interfaces over models, stores and retrievers, plus composition with streaming, batching, retries and fallbacks.","Its value is integration code you would otherwise write; its risk is abstraction hiding behaviour you are accountable for.","A retriever-to-prompt-to-model chain with a provider fallback in a few lines.","Wrap it behind your own interfaces and always log the rendered prompt.","Would you use it in production?","Answer with both value and risk — uncritical enthusiasm reads as inexperience."),
B("LangChain","int",0,"What is a Runnable and why does the pipe operator matter?","A common interface giving invoke, batch, stream and async variants, so components compose with `|` and inherit streaming, retries and fallbacks.","It means a chain you built synchronously can stream without restructuring, and fallbacks attach declaratively.","chain = retriever | prompt | llm.with_fallbacks([cheaper]) | parser","Streaming and fallbacks are exactly the two things you need in production, so this is the part of the library worth using.","How do you stream intermediate steps?","Name with_fallbacks and astream — the two production-relevant features."),
B("LangChain","int",0,"How do you get validated structured output?","Bind a Pydantic schema with with_structured_output, which uses the provider's native structured-output or tool-calling mode and returns a validated object.","Prompt-only JSON instructions fail a few percent of the time; schema-constrained decoding plus validation plus one retry removes almost all failures.","A SupportAnswer model with an intent literal, confidence and citations list.","Keep a tolerant fallback parser and log every validation failure with the prompt version.","What do you do on a validation error?","Mention retrying with the validation error appended — a concrete recovery strategy."),
B("LangGraph","int",1,"What is LangGraph and when do you need it over a chain?","A state-machine framework: typed shared state, nodes as functions, conditional edges for routing, with checkpointing. You need it when control flow branches, loops or must pause.","Chains are linear; real agents retry, grade, rewrite, loop and wait for approval. A graph makes that flow explicit, testable, resumable and boundable.","A corrective RAG loop: retrieve → grade → rewrite → retrieve → generate, capped at three attempts.","Checkpointing in Postgres is what makes long runs survive restarts and support human approval.","What does the checkpointer store?","'Chains are linear, real agents branch' is the one-line justification."),
B("LangGraph","adv",1,"How does human-in-the-loop work in LangGraph?","interrupt_before on a node halts execution with state checkpointed; the run resumes when a decision is merged into state.","Because state is durable, the pause can last minutes or days across deployments. The approval and approver are recorded for audit.","A refund node that stops and surfaces the proposed action with its evidence to a reviewer.","The backend must still re-authorise the action independently — approval is a workflow gate, not an authorisation mechanism.","What if nobody approves?","Add the TTL/escalation detail — it converts a framework answer into an operations answer."),
B("LangGraph","adv",0,"How do you prevent an agent graph from looping forever?","Cap total steps and per-node visits in state, detect repeated state signatures, enforce a wall-clock timeout and a dollar budget, and terminate into an explicit failure node.","Reducers on state make counters easy; the terminal node should emit a partial answer plus the trace rather than failing silently.","attempts field incremented per retrieval, routed to a refuse node at three.","Alert on budget-exhaustion rate — a rising rate means the grader or the tools are miscalibrated.","What does the user see when it trips?","Give all four budgets: steps, node visits, time, dollars."),
B("LangGraph","adv",0,"How do you test a LangGraph agent?","Unit-test each node as a pure function over state, test routing functions with table-driven state fixtures, and run end-to-end graphs against stubbed tools with recorded model responses.","Nodes as plain functions over a typed state is exactly what makes the graph testable, in contrast to an opaque loop.","A route() function tested across grade and attempt combinations without any model calls.","Add adversarial cases (injected instructions in retrieved content) to the suite and gate deploys on them.","How do you test non-deterministic behaviour?","Separating deterministic routing tests from model-dependent evals is the structure being probed."),

/* ---------- Agents ---------- */
B("Agents","int",1,"What distinguishes an agent from a workflow?","An agent decides its own next action at runtime; a workflow follows a predefined path. Use a workflow whenever you can draw the flowchart.","Agents cost more, are slower and harder to debug, and are justified only when the required steps vary per request.","Triaging an unknown production incident is agentic; issuing a refund after three fixed checks is a workflow.","Most production 'agents' are workflows with one or two decision points — and that is the correct design.","How do you decide the boundary?","'If you can draw the flowchart, write the flowchart' — quotable and correct."),
B("Agents","int",1,"How does tool calling actually work?","The model receives tool schemas, returns a structured request naming a tool and arguments, and your code validates, authorises, executes and returns the result for the next step.","The model never executes anything. Its request is a suggestion; the authority is entirely in your code.","A Pydantic-validated RefundArgs checked against the caller's permissions and the order's refundable amount before any payment call.","Authorise server-side on every call, keep tool surfaces minimal per role, and make destructive tools idempotent.","What stops an agent from doing something destructive?","'The model proposes, the code authorises' — the sentence that answers most agent security questions."),
B("Agents","adv",1,"What is ReAct?","Interleaving reasoning traces with actions and observations: the model thinks, acts via a tool, observes the result, and repeats.","It makes the model's intermediate reasoning available for tracing and gives it the opportunity to correct course based on real observations.","Thought: I need the order status → Action: get_order → Observation: shipped → Answer.","Trace every thought/action/observation triple; it is the only way to debug why an agent went wrong.","When is plan-and-execute better?","Contrast with plan-and-execute: cheaper and more auditable when structure is knowable."),
B("Agents","adv",0,"Your agent calls the wrong tool repeatedly. How do you fix it?","Improve tool names, descriptions and parameter schemas; reduce the number of exposed tools; and route to a relevant subset per request.","Tool descriptions are prompt content — the model selects from them. Overlapping or vague descriptions cause far more misrouting than model weakness does.","Two tools both described as 'search documents' — renamed to search_policies and search_tickets with explicit when-to-use guidance.","Log tool-selection accuracy per tool and treat it as a quality metric with its own eval cases.","How many tools is too many?","'Tool descriptions are prompt surface' reframes the problem correctly."),
B("Agents","adv",1,"How do you give an agent memory?","Separate short-term thread state (checkpointed) from long-term facts extracted deliberately into a per-user store, retrieved by relevance under a token budget.","Dumping transcripts into a vector store degrades over time: stale facts contradict new ones and context bloats. Facts need provenance, timestamps, conflict resolution and TTLs.","'Prefers metric units' stored as a durable fact; 'asked about invoice 4471 yesterday' expires.","Memory needs a deletion path and access control — it is a privacy surface, not just a feature.","What stops memory from degrading answers?","Recency weighting and conflict resolution are the details that show you have operated one."),
B("Agents","prod",1,"🔥 How do you make an agent safe to run in production?","Least-privilege tools per role, independent server-side authorisation, approval gates on destructive actions, budgets on steps/time/cost, sandboxed code execution, egress allow-lists and full tracing.","Assume prompt injection will succeed at some point and design so that success is harmless: no ambient authority, nothing irreversible without approval, no arbitrary network egress.","A retrieved document instructing the agent to email the conversation externally fails because no tool can send to unlisted domains.","Red-team with injected content as part of CI so safety is tested continuously, not reviewed once.","What is the single highest-value mitigation?","'Design so a successful injection is harmless' is the framing senior interviewers reward."),
B("Agents","adv",0,"Supervisor-worker or a single agent with many tools?","Single agent first. Split only when sub-tasks need different prompts, models or permission scopes.","Each additional agent adds latency, cost and failure surface. Different permission scopes are the strongest genuine reason to split — a read-only research agent and a write-capable action agent.","A SQL agent restricted to one schema separated from a general assistant.","Bound supervisor architectures with total and per-agent step budgets plus a dollar cap per run.","When is multi-agent clearly right?","Naming permission separation as the best reason to split is the differentiating point."),

/* ---------- MCP ---------- */
B("MCP","int",1,"What is MCP and what problem does it solve?","An open protocol for exposing tools, resources and prompts to AI applications over JSON-RPC, turning an N×M integration problem into N+M.","Before it, every AI app implemented bespoke plumbing per system and per framework, so integrations were not portable. MCP standardises discovery and invocation.","One Jira MCP server usable by any compliant client, like LSP for editors.","It matters most in enterprises with many internal systems and several AI surfaces.","How does it differ from function calling?","The LSP analogy lands the concept in one sentence."),
B("MCP","int",0,"What are MCP's three primitives?","Tools (model-invoked actions), resources (application-supplied data), and prompts (user-invoked templates).","The distinction is about who controls invocation, which matters for safety: the model chooses tools, the application chooses resources, the user chooses prompts.","get_order is a tool; a table schema is a resource; 'review this PR' is a prompt.","Model-invoked tools need per-call authorisation; resources need access control at selection time.","Which primitive carries the most risk?","The 'who controls invocation' framing is the point of the question."),
B("MCP","adv",1,"How do you secure a remote MCP server?","Treat it as a privileged API: authenticated callers with scoped tokens (OAuth), per-tool authorisation against the real user, input validation, rate limits, audit logs, timeouts and TLS.","Local stdio servers inherit the user's context; remote servers are public surface and need the full API security stack. The server should act as the user, not as a service account.","An internal MCP server used by 500 employees, each acting under their own permissions with per-call audit.","Also vet third-party servers: their tool descriptions enter your prompt and their responses are untrusted input.","What is tool-description injection?","'Acts as the user, not a service account' is the crucial design statement."),
B("MCP","adv",0,"What are the operational concerns with many MCP servers connected?","Every tool description consumes context on every request, latency and failure surface grow, and tool-name collisions confuse selection.","Ten servers with ten tools each means a hundred descriptions in the prompt, which costs tokens and degrades selection accuracy.","Route to a relevant subset of servers per request rather than exposing everything.","Version tool surfaces, monitor per-tool latency and error rate, and cap the number of concurrently exposed tools.","How do you choose the subset?","The context-cost observation is a practical point few candidates raise."),

/* ---------- AI Security ---------- */
B("AISecurity","int",1,"What is prompt injection and how is it different from jailbreaking?","Injection is untrusted content overriding your instructions; jailbreaking is manipulating the model past its safety policy. Injection is the bigger engineering risk because it arrives through your own data.","Indirect injection via retrieved documents, web pages or tool output is the dangerous variant in RAG and agent systems, because the user never sees the payload.","White text in an uploaded CV instructing the screener to recommend a strong hire.","Delimit and label untrusted content as data, keep authority in code, restrict tools and egress, and scan ingested content for instruction patterns.","Can you fully prevent it?","Distinguish the two clearly, then say indirect injection is the one that keeps you up at night."),
B("AISecurity","adv",1,"How do you prevent data leakage between tenants in a RAG system?","ACLs in chunk metadata set at ingestion, mandatory pre-filters derived from the authenticated token, tenant-scoped cache keys, separate collections for high-sensitivity data, and automated cross-tenant probe tests.","The three common leak paths are post-filtering instead of pre-filtering, client-supplied filters, and a shared semantic cache.","A cache keyed only on the query string serving one customer's answer to another.","Test isolation in CI with probes that must return zero results; treat any leak as a security incident with an audit trail from retrieved doc ids.","Which leak path is most often missed?","The shared-cache leak is the answer that impresses — almost nobody mentions it."),
B("AISecurity","adv",0,"How do you handle PII in an LLM pipeline?","Detect and redact before external calls using placeholder substitution, restore after generation, redact payloads in logs by default, and constrain provider choice by data residency and retention terms.","Blanket redaction breaks reasoning that needs the values, so scope it by field sensitivity. Keep the placeholder mapping out of logs.","Replacing customer names and card fragments with stable tokens so the answer still reads naturally.","Test redaction with known patterns in CI; verify provider retention terms contractually, not by assumption.","What breaks when you redact?","Field-level scoping rather than blanket redaction shows judgement."),
B("AISecurity","adv",0,"What is the OWASP-style top risk list for LLM applications and which matter most?","Prompt injection, insecure output handling, excessive agency, sensitive information disclosure, supply-chain risk in models and plugins, and inadequate monitoring.","Excessive agency and insecure output handling are the ones that turn a model mistake into a breach — treating model output as trusted input to a system that acts.","Passing model-generated SQL straight to a database, or model-generated shell commands to a runner.","Validate output before it reaches any executor, apply least privilege, and never let model output make an authorisation decision.","How do you handle model-generated SQL safely?","'Insecure output handling' plus 'excessive agency' is the pairing that matters most."),
B("AISecurity","prod",1,"How do you implement RBAC for an AI application?","Roles grant tool and data scopes; the token carries role and tenant claims; every retrieval filter and tool call is authorised server-side against those claims, with an audit record per decision.","AI-specific twist: authorisation must apply at retrieval time (which documents) and at action time (which tools), and cached results must be scoped by permission set.","A support agent role can read policies and issue refunds under £50; a read-only analyst role can do neither.","Log the authorisation decision, not just the action, so you can prove what was and was not permitted.","What about a user whose role changes mid-session?","Covering both retrieval-time and action-time authorisation is the complete answer."),
B("AISecurity","adv",0,"How do you sandbox agent code execution?","Ephemeral container with no network egress, no mounted credentials, a read-only base filesystem with a scratch volume, CPU/memory/time limits, and no access to the secrets manager.","If the sandbox has network access or credentials, a successful injection becomes data exfiltration. The sandbox's blast radius should be nothing.","A data-analysis agent running generated pandas code with the dataset mounted read-only and no internet.","Monitor sandbox escapes and resource-limit hits as security signals, not just reliability ones.","How does the agent get the data in and out then?","'The sandbox's blast radius should be nothing' is the guiding principle to state."),

/* ---------- AI Evaluation ---------- */
B("AIEval","int",1,"What is faithfulness and how do you measure it without reference answers?","Whether every claim in the answer is supported by the provided context. Measure by decomposing the answer into claims and checking each against the context with a judge model or NLI.","It needs no gold answer, only the retrieved context, which makes it the practical hallucination metric for production sampling.","An answer citing a 45-day refund window when the context says 30 days fails on that claim.","Calibrate the judge against human labels first, pin the judge model and prompt, and sample live traffic asynchronously.","What are LLM-judge weaknesses?","'No reference answer needed' is why this metric is the one you can run online."),
B("AIEval","int",0,"What is LLM-as-judge and when do you not trust it?","Using a model to score outputs against criteria. Do not trust it without calibration against human labels, and be wary of position, verbosity and self-preference biases.","Judges are useful for trend detection and relative comparison, weaker for absolute quality claims. Randomise order in pairwise comparisons and use a different family from the generator where possible.","A judge preferring longer answers regardless of accuracy, inflating scores after a verbosity-increasing prompt change.","Validate on a few hundred human-labelled examples, then track agreement over time as the judge model changes.","How do you detect judge drift?","Naming the specific biases is what separates a real answer from a definition."),
B("AIEval","adv",1,"How do you build an evaluation dataset for a new AI feature?","Start from real or realistic user questions, add reference answers and relevant chunk ids, include edge cases and known failures, and grow it from production traffic continuously.","100–300 well-curated cases outperform thousands of synthetic ones. Every user complaint should become a test case.","A golden set seeded with 50 support questions, expanded weekly from thumbs-down traces.","Version the dataset alongside the code; an eval score is only meaningful against a known dataset version.","Who owns the dataset?","'Every complaint becomes a test case' describes a flywheel, not a task."),
B("AIEval","prod",0,"How do you gate deployments on evaluation?","Run a golden subset on every PR with thresholds on key metrics and a cost-delta limit; run the full suite nightly; block merges on regression beyond tolerance.","Thresholds on aggregate metrics avoid flakiness that exact-match assertions would cause. Cost must be gated too, or quality improvements silently triple the bill.","--min-faithfulness 0.85 --min-context-recall 0.80 --max-cost-delta 0.15 in CI.","Canary after the gate with online sampled judging, because offline and online distributions differ.","How do you keep the gate fast?","Including a cost gate alongside quality gates is a distinguishing detail."),
B("AIEval","adv",0,"What online signals tell you quality has regressed?","Faithfulness on a sampled slice, thumbs-down and escalation rates, refusal rate, retrieval score distribution, output length and follow-up question rate.","Follow-up rate is an underused proxy: when answers get worse, users rephrase more. Refusal rate moving in either direction is informative.","A spike in re-asked questions after a chunking change, before any complaint arrived.","Join all of it to trace ids with prompt and model versions so you can bisect the cause.","Why not judge every request?","The follow-up-rate proxy is a memorable, genuinely useful signal."),

/* ---------- FastAPI ---------- */
B("FastAPI","beg",0,"Why FastAPI for AI services?","Native async for high-concurrency I/O-bound model calls, Pydantic validation at the boundary, automatic OpenAPI docs, and dependency injection that makes testing straightforward.","The async model is the decisive factor: one worker can hold hundreds of concurrent requests waiting on model responses.","A single worker serving 200 concurrent streaming RAG requests.","Combine with Uvicorn workers per core, bounded connection pools and lifespan-managed clients.","What would break that concurrency?","Lead with async concurrency — it is the reason, not the docs."),
B("FastAPI","int",1,"What happens if you call a blocking function in an async endpoint?","It blocks the event loop, so every other concurrent request on that worker stalls until it returns.","This is the single most common FastAPI performance bug: a synchronous SDK, a blocking database driver or CPU-bound parsing inside async def.","p50 300ms and p99 12s under load, traced to a synchronous HTTP client.","Use async clients, offload CPU work to a process pool via run_in_executor, and expose an event-loop lag metric.","How would you detect it?","The p50-versus-p99 signature is the recognisable fingerprint — describe it."),
B("FastAPI","int",0,"How do you stream LLM responses from FastAPI?","StreamingResponse over an async generator emitting SSE events, with no-cache and no-buffering headers, heartbeats and cancellation handling.","Because the status code is sent first, mid-stream errors must be typed events rather than HTTP errors. Client disconnects should cancel the upstream call.","event: meta with the trace id, data events per token, a terminal done or error event.","Cancel upstream generation on disconnect so you stop paying for unread tokens.","How do you report an error mid-stream?","The cancellation-saves-money point is practical and rarely mentioned."),
B("FastAPI","int",0,"How do you implement authentication in FastAPI?","A dependency that extracts and verifies the token (JWT via OIDC), returning a principal object; apply it per route or router, and check authorisation in the service layer.","Verify signature, issuer, audience and expiry against cached JWKS. Authentication in the dependency, authorisation next to the business rule.","principal = Depends(verify_jwt) with tenant and role claims resolved server-side.","Never trust client-supplied tenant or role values; derive everything from the verified token.","Where does authorisation belong?","Separating authn (dependency) from authz (service layer) is the structural point."),
B("FastAPI","prod",0,"How do you configure health checks correctly?","Liveness must not depend on downstreams; readiness must, so traffic drains during a dependency outage without pods being restarted.","Conflating them causes cascading restarts during a database blip, turning a degradation into an outage.","/healthz returns ok unconditionally; /readyz checks the database and passes only after model clients warm up.","Pass readiness only after warmup completes, so the first real request is not the slow one.","What does readiness check for an AI service?","The 'cascading restarts during a blip' failure mode is the reason to separate them."),
B("FastAPI","adv",0,"How do you handle long-running AI jobs in FastAPI?","Return a job id immediately, process on a queue with workers, and expose a status endpoint or SSE stream for progress.","BackgroundTasks runs in the same process and dies with it, so it is unsuitable for anything you must not lose. Gateway timeouts (often 30–60s) make synchronous long work impossible anyway.","A 400-page PDF ingestion returning 202 with a document id and a status endpoint.","Make jobs idempotent and resumable; expose progress so the UI shows movement.","Why not BackgroundTasks?","Name the gateway timeout as the forcing constraint — it makes the answer concrete."),

/* ---------- Docker ---------- */
B("Docker","beg",0,"Image vs container vs registry?","An image is an immutable layered filesystem plus metadata; a container is a running instance; a registry stores and distributes images.","Layers are cached and shared, which is why layer ordering determines build speed.","Building the same AI service after a code change should reuse the dependency layer.","Tag images with the commit SHA, never latest, so rollback is deterministic.","Why never use the latest tag?","The SHA-tagging point connects Docker to deployment safety."),
B("Docker","int",1,"What is a multi-stage build and why does it matter for AI images?","Build artefacts in one stage and copy only what is needed into a slim runtime stage, removing compilers and build caches.","AI images are large because of CUDA, torch and model weights. Multi-stage plus a slim base can cut image size dramatically, which speeds every pull and deploy.","A 9GB image reduced substantially by dropping build-essential and build caches.","Separate the GPU image from the API image so only inference pods carry CUDA.","Where do model weights belong?","Separating GPU and API images is the AI-specific insight here."),
B("Docker","int",0,"How do you reduce container startup time for an AI service?","Bake weights and dependencies into the image or a pre-warmed volume, avoid downloads at boot, warm up before readiness, and keep images small.","Cold starts on GPU pods can be minutes: image pull, weight load, CUDA context creation, kernel autotuning.","A warm-up inference in the startup hook so the first user request is not the slow one.","Keep a warm minimum replica count; autoscalers cannot react fast enough for GPU cold starts.","How does this interact with autoscaling?","Enumerate the four cold-start components — it shows you have measured it."),
B("Docker","prod",0,"How do you secure a container image?","Non-root user, minimal or distroless base, pinned digests, no secrets in layers or build args, dropped capabilities, read-only root filesystem, and CVE scanning in CI.","Secrets in build args persist in image history and are recoverable, which is a common leak.","Trivy failing a build on HIGH or CRITICAL findings before push.","Rebuild on a schedule to pick up base-image patches even with no code change.","How do secrets reach the container then?","The build-args-persist-in-history detail is the one that shows real care."),

/* ---------- Kubernetes ---------- */
B("Kubernetes","beg",0,"Deployment vs StatefulSet vs DaemonSet?","Deployment for interchangeable stateless replicas; StatefulSet for stable identity and persistent storage; DaemonSet for one pod per node.","StatefulSets give ordered, named pods with their own volumes, which stateful stores need. DaemonSets are for node-level agents.","API service as a Deployment, self-hosted Qdrant as a StatefulSet, the OTel collector as a DaemonSet.","Use the managed service instead of a StatefulSet unless you have a reason to operate the store yourself.","When would you self-host a vector DB on Kubernetes?","Give the three concrete AI examples rather than abstract definitions."),
B("Kubernetes","int",1,"Liveness vs readiness vs startup probes?","Liveness restarts a stuck container; readiness controls traffic; startup gives slow-starting containers time before liveness applies.","For AI workloads the startup probe is essential — model loading can exceed any sane liveness threshold, causing restart loops.","A model server with a 5-minute startup probe, then a 10-second liveness check.","Liveness must not depend on downstreams, or a dependency blip restarts your whole fleet.","What is a common misconfiguration?","The startup-probe-for-model-loading point is the AI-specific insight."),
B("Kubernetes","int",1,"How do you autoscale an AI workload?","On concurrency, queue depth or a custom metric (via KEDA or the custom metrics API), not CPU, with a warm minimum for GPU workloads.","CPU stays low on I/O-bound LLM services, so CPU-based HPA never fires while latency climbs. GPU pods cannot scale fast enough to absorb a spike from zero.","HPA on inflight_requests averaging 8 per pod; embedding workers scaled on Kafka consumer lag.","Set maxReplicas from downstream limits (provider rate limits, database connections), not just cost.","Why not scale on CPU?","Tie maxReplicas to downstream capacity — a constraint most candidates ignore."),
B("Kubernetes","adv",0,"How do you schedule GPU workloads?","Install the device plugin, request nvidia.com/gpu, taint GPU nodes and add tolerations, use node selectors by GPU type, and keep separate node pools.","GPUs are not shareable by default, so one pod holds a whole GPU unless you use time-slicing or MIG. Node pools per GPU type prevent scheduling a small job onto expensive hardware.","Batch embedding on preemptible T4 nodes with checkpointing; inference on reserved A10G nodes.","Use PodDisruptionBudgets so a node drain does not remove all inference capacity at once.","How do you cut GPU cost?","Mention MIG or time-slicing — it shows familiarity beyond the basics."),
B("Kubernetes","adv",0,"How do you deploy safely without dropping streaming requests?","Rolling updates with readiness gating, a long terminationGracePeriodSeconds, a preStop hook to deregister from the load balancer, and graceful shutdown that drains in-flight streams.","The default 30-second grace period kills long generations mid-stream. Streaming services need explicit draining.","terminationGracePeriodSeconds 120 with the app finishing active SSE streams before exit.","Test it: deploy under load and assert zero client-visible errors as a release criterion.","What if a stream lasts longer than the grace period?","The grace-period-versus-stream-duration conflict is a specific, credible detail."),
B("Kubernetes","int",0,"ConfigMap vs Secret, and how should secrets really be managed?","ConfigMaps for non-sensitive configuration, Secrets for credentials — but Kubernetes Secrets are only base64-encoded, so back them with a real secrets manager.","Use the Secrets Store CSI driver or External Secrets Operator to sync from AWS Secrets Manager, Key Vault or Secret Manager, with encryption at rest and RBAC restricting access.","Provider API keys synced from Secrets Manager, mounted as files, rotated without a rebuild.","Restrict who can read secrets in the namespace, and audit access; a cluster-admin can read every Secret by default.","How do you rotate a key with no downtime?","'Base64 is not encryption' is the point being tested."),

/* ---------- AWS ---------- */
B("AWS","int",1,"Which AWS service would you use to serve an LLM and why?","Bedrock for managed foundation models with IAM control and no capacity management; SageMaker endpoints when you need your own or fine-tuned weights; EKS with vLLM on GPU nodes when volume or control demands self-hosting.","The decision is data boundary, custom weights, volume economics and ops capacity — not preference.","Bedrock for generation, a SageMaker endpoint for a fine-tuned cross-encoder reranker.","Provisioned throughput on Bedrock for baseline load with on-demand for burst, plus backoff on throttling.","How do you handle Bedrock throttling?","Give the decision criteria, then the pick — that order reads as senior."),
B("AWS","int",1,"Design storage for a RAG system on AWS.","S3 for raw documents (versioned, KMS-encrypted, event-emitting), Aurora Postgres for metadata and ACLs, OpenSearch or a dedicated store for hybrid retrieval, ElastiCache for caching.","S3 is the source of truth and the index is a derived artefact, which is what makes embedding-model migration and chunking changes feasible.","S3 event → EventBridge → SQS → ECS ingestion workers → OpenSearch.","Lifecycle rules to Glacier for cold documents; the index never holds the only copy of anything.","How do you honour a deletion request?","'The index is derived and rebuildable' is the architectural principle to state."),
B("AWS","adv",0,"IAM roles vs access keys for an AI service?","Roles always: IRSA on EKS or task roles on ECS give short-lived automatically-rotated credentials. Long-lived access keys in applications are an incident waiting to happen.","Roles also give per-service least privilege, so the code-execution sandbox can have a role with no permissions at all.","The ingestion worker role can read one S3 prefix and write to OpenSearch, nothing else.","Audit with CloudTrail and IAM Access Analyzer; alert on any long-lived key creation.","How does the agent sandbox get its role?","The 'sandbox role with no permissions' example ties IAM to AI security."),
B("AWS","int",0,"SQS vs SNS vs EventBridge vs MSK — which for what?","SQS for reliable point-to-point work queues; SNS for pub/sub fan-out; EventBridge for event routing with filtering and AWS-service integration; MSK when you need replay and multiple consumer groups.","EventBridge is often the right front door for S3 events with routing rules; SQS holds the work; MSK is the choice only when replay matters.","S3 → EventBridge (filter on prefix and type) → SQS per pipeline stage → workers.","Always configure DLQs and alarm on depth; a silent DLQ is how documents go missing.","When do you actually need MSK?","The EventBridge-front-door-plus-SQS-work-queue pattern is the idiomatic answer."),
B("AWS","adv",1,"Your API Gateway cuts streaming responses at 29 seconds. What do you do?","Route streaming endpoints via an ALB directly, or use an HTTP API with appropriate integration, keeping non-streaming control APIs on API Gateway for authz and throttling.","It is a hard integration timeout on REST APIs. Recognising it immediately is a strong AWS signal because everyone hits it eventually.","Chat streaming on ALB → ECS; management APIs on API Gateway with usage plans.","Validate the same JWT in the service layer so authorisation is consistent across both paths.","How do you keep quotas consistent then?","Knowing this specific limit is a fast credibility win in AWS rounds."),
B("AWS","adv",0,"How do you optimise AWS cost for an AI platform?","Spot or Batch for embedding and evaluation jobs, Graviton for CPU services, S3 lifecycle policies, right-sized Aurora with read replicas only if needed, Bedrock provisioned throughput matched to baseline, and mandatory cost-allocation tags.","The biggest line item is usually model inference, then GPU compute, then the vector index's memory. Attack them in that order, not the EC2 bill.","Nightly re-embedding on Spot with checkpointing, saving most of the compute cost.","Budgets and anomaly detection with alerts, plus per-team tags so cost has an owner.","What is usually the biggest line item?","Ordering the levers by actual spend share shows you have read a real bill."),
B("AWS","int",0,"ECS Fargate vs EKS for an AI API?","Fargate when the team is small and the workload is stateless containers with no GPU needs; EKS when you need GPUs, fine-grained scheduling, or portable Kubernetes manifests.","Fargate removes node management entirely but has no GPU support and less scheduling control. EKS costs operational effort and buys flexibility.","API and ingestion workers on Fargate; a self-hosted model fleet on EKS GPU nodes.","Do not run Kubernetes because it is expected; run it when you need what it provides.","What would push you to EKS?","Being willing to recommend Fargate reads as pragmatic rather than resume-driven."),

/* ---------- Azure ---------- */
B("Azure","int",1,"Why do enterprises choose Azure OpenAI over the OpenAI API?","Models run within their Azure tenant with private networking, Entra ID authentication, regional data residency, content filtering and enterprise agreements already in place.","Compliance and procurement usually drive it more than capability. The trade-off is regional model availability and quota management.","A bank running GPT-class models via a private endpoint with no public internet egress.","Plan for per-region quotas: deploy across regions with a routing layer and use provisioned throughput for baseline.","How do you handle rate limits?","Lead with compliance and networking — that is genuinely why."),
B("Azure","int",1,"What is Azure AI Search and why is it central to Azure RAG?","A managed search service combining BM25, vector search, hybrid fusion and a semantic reranker, with security filters — it collapses several components into one service.","It removes the need to run a separate vector store plus lexical index plus reranker, which is a meaningful architectural simplification.","Documents indexed from Blob Storage with ACL groups as filterable fields from Entra ID.","Security filters derived from the user's Entra groups are how SharePoint-style permissions are honoured at query time.","How do you mirror SharePoint permissions?","'One service instead of three components' is the reason it dominates Azure designs."),
B("Azure","adv",0,"How do you handle Azure OpenAI capacity and quotas in production?","Deploy the model in multiple regions, route and fail over through APIM or your own gateway, buy provisioned throughput units for baseline load, use pay-as-you-go for burst, and back off on 429s.","Quotas are per-region and per-model, so a single deployment is a single point of failure for both capacity and availability.","Two regional deployments behind APIM with retry and load balancing policies.","Monitor token consumption against quota per deployment and alert before saturation, not after.","Why is APIM commonly used here?","Multi-region deployment plus PTUs is the expected production answer."),
B("Azure","int",0,"Cosmos DB or Azure SQL for an AI application?","Azure SQL for relational metadata, transactions and joins; Cosmos DB for globally distributed low-latency document access, session state and per-user memory at scale.","Cosmos also offers vector search, which can consolidate stores for smaller workloads. Its cost model (RU/s) needs careful partition-key design.","Conversation state in Cosmos partitioned by user id; documents and ACLs in Azure SQL or PostgreSQL.","A poor partition key causes hot partitions and throttling — it is the main Cosmos design risk.","How do you choose a partition key?","Naming RU/s and partition-key design shows actual Cosmos experience."),
B("Azure","adv",0,"Sketch an enterprise RAG architecture on Azure.","Blob Storage + Event Grid → Service Bus → Container Apps ingestion workers using Document Intelligence → Azure AI Search (hybrid + semantic ranker + security filters) → Azure OpenAI via APIM across regions → PostgreSQL for metadata → Redis for caching → Key Vault and Application Insights.","Entra ID is the backbone: user identity flows into search security filters so document permissions are enforced at query time.","A 200k-document internal knowledge assistant for 20k employees.","Private endpoints throughout so no traffic traverses the public internet — usually a hard requirement in these environments.","Where does identity enter the retrieval path?","Putting Entra ID at the centre of the answer is what Azure interviewers listen for."),

/* ---------- GCP ---------- */
B("GCP","int",1,"Why is Cloud Run a strong fit for AI APIs?","Request-based autoscaling with high per-instance concurrency suits async I/O-bound model calls, it scales to zero, and revision traffic splitting gives canaries for free.","Concurrency per instance means one instance serves many waiting requests, which matches LLM latency profiles. GPU support extends it to some inference cases.","An internal AI tool scaling to zero overnight and handling working-hour peaks automatically.","Set a minimum instance count for latency-sensitive services to avoid cold starts.","When would you move to GKE?","Per-instance concurrency is the specific reason — say it rather than 'it is serverless'."),
B("GCP","int",0,"What does Vertex AI give you?","One platform for model access (Gemini and Model Garden), embeddings, fine-tuning, pipelines, a feature store, Vector Search and Agent Builder.","Its appeal is consolidation: fewer services to integrate and one IAM model across training, serving and retrieval.","Vertex embeddings + Vertex Vector Search + Gemini generation in one project boundary.","Check per-region model availability early if data residency constrains you.","How would you pin regions?","Framing it as consolidation is the accurate advantage."),
B("GCP","adv",1,"Why use BigQuery in an AI platform?","Stream every request trace with tokens, cost and scores, then answer cost-attribution and quality-trend questions in SQL over billions of rows with no bespoke pipeline.","It removes the need to build an analytics store for LLM telemetry, which is otherwise a real engineering project.","Partitioned by day, clustered by tenant and feature, with Looker Studio dashboards on top.","Redact PII before publishing events, and keep any content in a separate dataset with tight access and short retention.","How do you keep PII out?","The trace-analytics use case is the strongest BigQuery answer in an AI context."),
B("GCP","int",0,"Pub/Sub versus Kafka on GCP?","Pub/Sub for managed global messaging with easy fan-out and no operations; Kafka (or Managed Service for Kafka) when you need log semantics, strict ordering and replay behaviour your consumers depend on.","Pub/Sub is at-least-once with ordering keys available; it has snapshots and seek for replay, though the log-consumer model differs from Kafka's.","Document-change events on Pub/Sub triggering Cloud Run ingestion workers.","Configure dead-letter topics and alert on unacked message age, the equivalent of DLQ depth.","How do you get replay with Pub/Sub?","Mentioning snapshot and seek shows you know Pub/Sub can replay, which many assume it cannot."),
B("GCP","adv",0,"Walk me through a production RAG deployment using GCP services end to end.","Cloud Storage → Pub/Sub → Cloud Run ingestion workers with Document AI → Vertex embeddings → Vertex Vector Search plus a lexical layer → Cloud SQL/AlloyDB for metadata and ACLs → Memorystore for caching → Cloud Run API calling Gemini → Secret Manager, Cloud Trace, and BigQuery for trace analytics, behind a load balancer with Cloud Armor.","The distinctive GCP choices are Cloud Run for both API and workers, and BigQuery as the telemetry store.","A 5M-document internal assistant with per-department access control.","Pin every service and model to one region if data residency applies, and verify model availability there first.","What is the biggest risk in this design?","Cloud Run everywhere plus BigQuery telemetry is the idiomatic GCP shape."),

/* ---------- System Design ---------- */
B("SystemDesign","int",1,"How do you structure the first five minutes of a system design interview?","Clarify users and use cases, establish functional requirements, pin down the non-functional numbers (QPS, latency, corpus size, budget, compliance), then state your assumptions explicitly before drawing anything.","Most failed rounds are lost here, by designing before defining. For AI systems, corpus size and update frequency drive nearly every later decision.","'10M documents, 5% change weekly, 20k users, p95 under 4s, must respect document permissions.'","Write the numbers down and refer back to them when justifying each component.","What if the interviewer refuses to give numbers?","State assumptions and move — hesitating looks worse than a wrong assumption."),
B("SystemDesign","adv",1,"How do you decide whether the LLM call belongs in the request path?","By the latency budget and the cost per request. Under ~200ms it cannot be there; above a second it usually can. If not, precompute or move it offline.","Search ranking, fraud scoring and recommendations keep the LLM offline (enrichment, labelling, summaries). Chat and Q&A put it in the path with streaming.","A search engine using LLM-generated synonyms and snippets built offline, with no per-query model call.","When the LLM must be in the path, streaming plus caching plus routing is how you make it affordable.","Where would you use an LLM offline?","This in-path-or-not decision is the highest-leverage AI design judgement."),
B("SystemDesign","adv",1,"How do you design for multi-tenancy in an AI platform?","Tenant id on every record and every chunk, mandatory server-derived filters, tenant-scoped caches and quotas, per-tenant cost attribution, and separate collections or databases for tenants requiring hard isolation.","The three failure modes are shared caches, post-filtering, and noisy neighbours consuming shared model capacity.","A per-tenant token quota in the gateway so one customer cannot exhaust provider capacity for everyone.","Automated cross-tenant probe tests in CI, because isolation must be tested rather than asserted.","When do you give a tenant its own database?","Naming noisy-neighbour model capacity alongside data isolation is the complete answer."),
B("SystemDesign","adv",1,"Design a system that answers questions over a 500-million-document corpus.","Shard the hybrid index by a natural partition (tenant, department, time), route or scatter-gather queries, merge with a heap, use quantised vectors to fit memory, over-fetch and rerank, and keep the index rebuildable from object storage.","At this scale ingestion and index memory dominate. Query routing to a subset of shards, when metadata allows, beats scatter-gather over everything.","500M chunks at 768 dims quantised across shards, with 4× over-fetch per shard before a global rerank.","Re-embedding is a scheduled batch job on spot capacity; plan the migration path before building the first index.","Why does per-shard recall differ from a single index?","Scatter-gather plus heap merge plus over-fetch is the mechanically correct answer."),
B("SystemDesign","adv",0,"How would you design an AI feature with a strict 99.95% availability target?","Multi-provider model access behind a gateway with circuit breakers, multi-region stateless services, replicated data stores, cached and degraded modes, and an explicit definition of what 'available' means when quality is degraded.","AI dependencies are less reliable than your own services, so availability comes from graceful degradation: a cheaper model, a cached answer, or an honest 'try again' beats an error page.","Provider outage served by a smaller self-hosted fallback with a quality notice.","Define and monitor a degraded-mode SLO separately, so you know how often users get the fallback.","Is a degraded answer 'available'?","Making degradation a first-class, measured state is the senior framing."),
B("SystemDesign","prod",1,"🔥 Design a system where one user must never see another user's data, across retrieval, cache and logs.","ACLs in chunk metadata at ingestion with change events; pre-filters derived server-side from the token on every query; cache keys including tenant and permission scope; log redaction and per-tenant log access; separate collections for sensitive classes; and CI probe tests asserting zero cross-tenant results.","Enumerate every place data comes to rest — index, cache, logs, traces, backups, eval datasets — because a leak in any of them is the same incident.","An eval dataset built from production traces is a commonly forgotten leak surface.","Audit retrieved doc ids per request so isolation can be proven after the fact, not just claimed.","Which surface is most often forgotten?","Listing every resting place, including eval datasets and backups, is what makes this answer complete."),
B("SystemDesign","adv",0,"How do you handle a sudden 20× traffic spike on an AI service?","Load shed early with 429 and Retry-After, absorb what you can with caching (hit rates rise during spikes), queue non-interactive work, scale stateless tiers, and protect downstream quotas with per-tenant limits.","You cannot scale a provider's rate limit, so the design must degrade rather than fail. Cache hit rate rising during a spike is a real advantage — everyone asks the same thing.","An incident driving identical support questions, served largely from the semantic cache.","Pre-agree the degradation ladder with the product owner so the choice is not made during the incident.","What degrades first?","Saying 'you cannot autoscale someone else's rate limit' shows you understand the real constraint."),
B("SystemDesign","adv",0,"When would you choose a long context window over retrieval?","When the relevant corpus per request is small and stable, when citations are unnecessary, and when the cost of the extra tokens is lower than the cost of building and operating retrieval.","Long context is simpler but pays per token on every request and degrades in the middle of very long inputs. Retrieval front-loads engineering cost to reduce per-request cost.","A 30-page contract analysed in full in-context beats chunking it for a low-volume workflow.","At high volume the per-token cost dominates and retrieval wins; at low volume simplicity wins.","Where does long context break?","Framing it as engineering cost versus per-request cost is the decisive argument."),
B("SystemDesign","adv",0,"How do you design the ingestion side of an AI system for correctness?","Object storage as the source of truth, event-driven stages with their own queues, idempotency keyed on content hash, document versioning, DLQs with alerting, and a per-document status surface.","Correctness problems here are invisible until retrieval degrades: duplicate chunks, stale versions, silently failed documents.","A re-delivered message upserting identical chunk ids rather than duplicating them.","Invariant checks (chunk count per document version) catch silent corruption early.","How do you detect duplicates?","The 'silently failed documents' problem is what the status surface exists to solve."),
