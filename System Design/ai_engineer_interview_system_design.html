<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Engineer — System Design &amp; Interview Prep</title>
<meta name="description" content="Interactive preparation console for AI / GenAI / ML engineer interviews: fundamentals to production architecture, RAG, agents, cloud, system design and a graded question bank.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#121924; --bg-2:#172130; --surface:#1B2634; --surface-2:#212E3E; --line:#2C3A4C;
  --line-soft:#232F3F; --fg:#E6ECF3; --fg-2:#A7B6C7; --fg-3:#76889B;
  --amber:#E0A33E; --amber-soft:rgba(224,163,62,.14);
  --teal:#3FA6A0; --teal-soft:rgba(63,166,160,.14);
  --green:#5FB37A; --yellow:#D8B24C; --red:#D97070; --violet:#8E8AD6;
  --fire:#E2794B; --fire-soft:rgba(226,121,75,.14);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:278px; --toc:232px; --r:6px; --r-lg:10px;
  --shadow:0 12px 30px -18px rgba(0,0,0,.75);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F7F8F9; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F3F6; --line:#DEE3EA;
  --line-soft:#E8ECF1; --fg:#131A24; --fg-2:#4C5A6B; --fg-3:#76889B;
  --amber:#A96F12; --amber-soft:rgba(169,111,18,.10);
  --teal:#1F7E79; --teal-soft:rgba(31,126,121,.10);
  --green:#2F7C4B; --yellow:#94721A; --red:#B24B4B; --violet:#5C57B8;
  --fire:#BE5526; --fire-soft:rgba(190,85,38,.10);
  --shadow:0 10px 24px -20px rgba(16,26,40,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.24}
h1{font-size:1.62rem}h2{font-size:1.3rem}h3{font-size:1.06rem}h4{font-size:.95rem}
p{margin:0 0 .8em}
code{font-family:var(--mono);font-size:.86em}
::selection{background:var(--amber-soft)}

/* ============ top bar ============ */
.topbar{
  position:fixed;left:0;right:0;top:0;z-index:60;height:60px;display:flex;align-items:center;gap:12px;
  padding:0 16px;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg-2) 92%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:30px;height:30px;flex:none;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);
  font-size:.72rem;font-weight:600;color:var(--amber)
}
.brand-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.72rem;color:var(--fg-3);font-family:var(--mono)}
.topbar-spacer{flex:1}
.searchwrap{position:relative;flex:1;max-width:420px}
.searchwrap input{
  width:100%;padding:8px 34px 8px 32px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);color:var(--fg);font-size:.88rem;font-family:var(--sans)
}
.searchwrap input::placeholder{color:var(--fg-3)}
.searchwrap .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-3);font-size:.8rem}
.searchwrap kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:.68rem;color:var(--fg-3);border:1px solid var(--line);border-radius:4px;padding:1px 4px
}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:7px 10px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap
}
.iconbtn:hover{border-color:var(--amber);color:var(--fg)}
.iconbtn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
#menuBtn{display:none}

/* search results dropdown */
.results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:66vh;overflow-y:auto;z-index:70;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px
}
.results[hidden]{display:none}
.res-group{font-family:var(--mono);font-size:.68rem;color:var(--fg-3);padding:8px 10px 4px}
.res{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--r);font-size:.88rem}
.res:hover,.res.sel{background:var(--surface-2)}
.res small{display:block;color:var(--fg-3);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res mark{background:var(--amber-soft);color:var(--amber);border-radius:2px}

/* ============ layout ============ */
.shell{display:flex;min-height:100vh;padding-top:60px}
.rail{
  position:fixed;top:60px;bottom:0;left:0;width:var(--rail);overflow-y:auto;z-index:50;
  background:var(--bg-2);border-right:1px solid var(--line);padding:14px 10px 40px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  scrollbar-width:thin
}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.main{flex:1;min-width:0;margin-left:var(--rail);padding:26px 30px 90px;max-width:1120px}
.toc{
  position:fixed;top:76px;right:0;width:var(--toc);max-height:calc(100vh - 100px);overflow-y:auto;
  padding:14px 16px 20px;border-left:1px solid var(--line-soft);font-size:.82rem
}
.toc h5{margin:0 0 8px;font-size:.7rem;font-family:var(--mono);color:var(--fg-3);font-weight:500}
.toc a{display:block;color:var(--fg-2);text-decoration:none;padding:3px 0;border-left:2px solid transparent;padding-left:9px}
.toc a:hover{color:var(--fg)}
.toc a.active{color:var(--amber);border-left-color:var(--amber)}
@media (min-width:1400px){.main{margin-right:var(--toc)}}
@media (max-width:1399px){.toc{display:none}}

.rail-section{font-family:var(--mono);font-size:.68rem;color:var(--fg-3);padding:14px 10px 6px;letter-spacing:.02em}
.navitem{
  display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  padding:6px 9px;border-radius:var(--r);color:var(--fg-2);font-size:.87rem;line-height:1.35
}
.navitem:hover{background:var(--surface-2);color:var(--fg)}
.navitem[aria-current="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 2px 0 0 var(--amber)}
.navitem .n{font-family:var(--mono);font-size:.7rem;color:var(--fg-3);flex:none;width:18px}
.navitem[aria-current="true"] .n{color:var(--amber)}
.navitem .pri{margin-left:auto;font-size:.62rem;flex:none;opacity:.85}
.rail-hr{height:1px;background:var(--line-soft);margin:10px 8px}

.scrim{position:fixed;inset:0;background:rgba(6,10,16,.6);z-index:45;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
@media (max-width:1000px){
  #menuBtn{display:inline-flex}
  .rail{transform:translateX(-100%);transition:transform .2s ease;width:min(84vw,300px)}
  .rail.open{transform:none;box-shadow:var(--shadow)}
  .main{margin-left:0;padding:18px 16px 80px}
  .brand-sub{display:none}
}
@media (max-width:640px){
  body{font-size:15px}
  .topbar{gap:8px;padding:0 10px}
  .brand-name{display:none}
  h1{font-size:1.35rem}
  .searchwrap kbd{display:none}
}

/* ============ primitives ============ */
.badge{
  display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.67rem;
  padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--fg-2);
  background:var(--surface-2);white-space:nowrap;line-height:1.5
}
.b-beg{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.b-int{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 40%,var(--line))}
.b-adv{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.b-prod{color:var(--fire);border-color:color-mix(in srgb,var(--fire) 45%,var(--line));background:var(--fire-soft)}
.b-int-v{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:var(--amber-soft)}
.b-sd{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 40%,var(--line))}
.b-code{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,var(--line))}
.b-ai{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,var(--line));background:var(--teal-soft)}
.b-cloud{color:var(--fg-2)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.muted{color:var(--fg-2)}
.tiny{font-size:.8rem}
.mono{font-family:var(--mono)}
.hr{height:1px;background:var(--line-soft);margin:22px 0}

.page-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:.72rem;color:var(--fg-3);margin-bottom:6px}
.lede{color:var(--fg-2);max-width:74ch;margin-top:8px}

/* accordion */
.acc{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.acc + .acc{margin-top:10px}
.acc > summary{
  list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:10px;align-items:flex-start;
  font-weight:500;background:var(--surface)
}
.acc > summary::-webkit-details-marker{display:none}
.acc > summary:hover{background:var(--surface-2)}
.acc > summary .chev{margin-left:auto;color:var(--fg-3);flex:none;transition:transform .16s;font-size:.8rem}
.acc[open] > summary .chev{transform:rotate(90deg)}
.acc[open] > summary{border-bottom:1px solid var(--line-soft)}
.acc-body{padding:16px}
.sumtitle{min-width:0}
.sumtitle .badges{margin:5px 0 0}

/* field blocks */
.field{margin:0 0 12px}
.field:last-child{margin-bottom:0}
.field > .k{
  font-family:var(--mono);font-size:.7rem;color:var(--fg-3);display:block;margin-bottom:3px
}
.field.hl{border-left:2px solid var(--fire);padding-left:12px}
.field.hl > .k{color:var(--fire)}
.field.q{border-left:2px solid var(--amber);padding-left:12px}
.field.q > .k{color:var(--amber)}
ul.tight,ol.tight{margin:.2em 0 .6em;padding-left:1.25em}
ul.tight li,ol.tight li{margin-bottom:.25em}
.pro-con{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pro-con > div{background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
.pro-con h4{font-size:.8rem;font-family:var(--mono);font-weight:500;margin-bottom:6px}
.pro h4{color:var(--green)}.con h4{color:var(--red)}

/* code */
pre{
  margin:8px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:.8rem;line-height:1.6;
  -webkit-overflow-scrolling:touch
}
:root[data-theme="light"] pre{background:var(--surface-2)}
pre code{white-space:pre}
.tok-k{color:var(--violet)}.tok-s{color:var(--green)}.tok-c{color:var(--fg-3);font-style:italic}
.tok-n{color:var(--amber)}.tok-f{color:var(--teal)}.tok-d{color:var(--fire)}
.codewrap{position:relative}
.codewrap .copy{position:absolute;top:8px;right:8px;font-size:.68rem;padding:3px 7px;opacity:.75}
.codewrap:hover .copy{opacity:1}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.85rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--fg-3);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}

/* tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{
  border:0;background:none;padding:8px 13px;font-size:.87rem;color:var(--fg-2);
  border-bottom:2px solid transparent;margin-bottom:-1px
}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:4px 11px;
  font-size:.78rem;color:var(--fg-2)
}
.chip:hover{color:var(--fg);border-color:var(--fg-3)}
.chip[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

/* progress */
.bar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.stat .v{font-family:var(--mono);font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.stat .l{font-size:.78rem;color:var(--fg-3)}
.prog-row{margin-bottom:14px}
.prog-row .top{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:5px;gap:10px}
.prog-row .top b{font-family:var(--mono);font-weight:500;color:var(--fg-2);font-size:.8rem}

/* ring */
.ring{--p:0;width:112px;height:112px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--amber) calc(var(--p)*1%),var(--surface-2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-family:var(--mono);font-size:1.25rem;font-weight:600}
.ring small{position:relative;display:block;font-size:.62rem;color:var(--fg-3);text-align:center}

/* diagram */
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:14px 0}
.node{
  border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:9px 13px;
  font-size:.85rem;display:flex;align-items:center;gap:9px;flex-wrap:wrap
}
.node .tag{font-family:var(--mono);font-size:.67rem;color:var(--fg-3)}
.node.acc-amber{border-color:color-mix(in srgb,var(--amber) 50%,var(--line));background:var(--amber-soft)}
.node.acc-teal{border-color:color-mix(in srgb,var(--teal) 50%,var(--line));background:var(--teal-soft)}
.node.acc-fire{border-color:color-mix(in srgb,var(--fire) 50%,var(--line));background:var(--fire-soft)}
.arrow{height:18px;display:grid;place-items:center;color:var(--fg-3);font-size:.8rem;line-height:1}
.lane{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.sidecar{
  display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
  border:1px dashed var(--line);border-radius:var(--r);padding:10px;margin-top:12px
}
.sidecar .node{background:var(--surface);font-size:.8rem}
.diagram{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}

/* question cards */
.qcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.qcard + .qcard{margin-top:10px}
.qhead{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;width:100%;text-align:left;background:none;border:0}
.qhead:hover{background:var(--surface-2)}
.qhead .qn{font-family:var(--mono);font-size:.7rem;color:var(--fg-3);flex:none;padding-top:3px;width:34px}
.qhead .qt{flex:1;min-width:0;font-weight:500}
.qbody{padding:0 16px 16px;border-top:1px solid var(--line-soft);padding-top:14px}
.qbody[hidden]{display:none}
.qactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.starred{color:var(--amber)}
.done .qhead .qt{color:var(--fg-2)}
.done .qhead .qn::after{content:" ✓";color:var(--green)}

/* interview mode */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;min-height:230px}
.stage .qtext{font-size:1.14rem;font-weight:500;line-height:1.45;margin:10px 0 4px;max-width:70ch}
.ctrlrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:8px 14px;font-size:.87rem}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#171208;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:26px;text-align:center;color:var(--fg-2)}

/* checklist / plan */
.day{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.day + .day{margin-top:8px}
.day input{margin-top:5px;width:16px;height:16px;accent-color:var(--amber);flex:none}
.day.checked{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.day.checked .dtitle{text-decoration:line-through;color:var(--fg-3)}
.dtitle{font-weight:500}
.dtag{font-family:var(--mono);font-size:.68rem;color:var(--amber)}

.roadmap{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.rm-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.rm-col h4{font-size:.82rem;font-family:var(--mono);font-weight:500;margin-bottom:10px}
.rm-step{font-size:.85rem;padding:6px 10px;border-radius:var(--r);background:var(--surface-2);margin-bottom:4px}
.rm-arrow{text-align:center;color:var(--fg-3);font-size:.72rem;margin:-2px 0 2px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.86rem}
.kv dt{font-family:var(--mono);font-size:.74rem;color:var(--fg-3);padding-top:2px}
.kv dd{margin:0}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);z-index:90;
  background:var(--surface);border:1px solid var(--amber);color:var(--fg);border-radius:100px;
  padding:8px 18px;font-size:.85rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s
}
.toast.on{opacity:1;transform:translateX(-50%)}
.count{font-family:var(--mono);font-size:.74rem;color:var(--fg-3)}
.notice{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--r);padding:12px 14px;background:var(--surface-2);font-size:.88rem}
.notice.warn{border-left-color:var(--fire)}
.sd-step{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:12px}
.sd-step:first-child{border-top:0;margin-top:0;padding-top:0}
.sd-step .sn{font-family:var(--mono);font-size:.7rem;color:var(--amber)}
</style>
</head>
<body>
<a class="iconbtn" href="#main" style="position:absolute;left:-9999px" onfocus="this.style.left='8px';this.style.top='8px';this.style.zIndex=99" onblur="this.style.left='-9999px'">Skip to content</a>

<header class="topbar">

prod:"For LLM inference, remember it is two phases: prefill (parallel over the prompt, compute-bound) and decode (one token at a time, memory-bandwidth-bound). That is why long prompts raise time-to-first-token while long outputs raise total latency.",

code:{lang:"python",src:`from abc import ABC, abstractmethod
from dataclasses import dataclass

@dataclass(frozen=True, slots=True)
class Completion:
    text: str
    prompt_tokens: int
    completion_tokens: int
    model: str

class LLMProvider(ABC):
    """Every provider implements this; callers never import an SDK."""
    @abstractmethod
    async def complete(self, prompt: str, *, max_tokens: int = 512) -> Completion: ...

class OpenAIProvider(LLMProvider):
    def __init__(self, client, model: str = "gpt-4o-mini"):
        self._client, self._model = client, model

    async def complete(self, prompt: str, *, max_tokens: int = 512) -> Completion:
        r = await self._client.chat.completions.create(
            model=self._model,
            messages=[{"role": "user", "content": prompt}],
            max_tokens=max_tokens,
        )
        return Completion(
            text=r.choices[0].message.content,
            prompt_tokens=r.usage.prompt_tokens,
            completion_tokens=r.usage.completion_tokens,
            model=self._model,
        )`},
qs:[{q:"Composition or inheritance for a RAG pipeline?",a:"Composition. The pipeline holds a retriever, a reranker and a provider, each behind an interface. Inheritance would couple the pipeline to one implementation and make testing require real services.",fu:"How do you test the pipeline with no network?",tip:"Say 'inject a fake implementing the same Protocol' — it answers the follow-up before it is asked."}]},

{t:"Decorators, generators, iterators and context managers", b:["int","code","prod"],
what:"Decorators wrap behaviour around a callable; generators yield lazily; context managers guarantee setup/teardown.",
why:"These three are how production Python does retries, token streaming and connection lifetimes.",
code:{lang:"python",src:`import asyncio, functools, time
from contextlib import asynccontextmanager

def retry(times=3, base=0.25, exc=(TimeoutError, ConnectionError)):
    """Exponential backoff with jitter — the standard LLM call wrapper."""
    def deco(fn):
        @functools.wraps(fn)
        async def wrapper(*a, **kw):
            for attempt in range(times):
                try:
                    return await fn(*a, **kw)
                except exc:
                    if attempt == times - 1:
                        raise
                    await asyncio.sleep(base * 2 ** attempt * (1 + 0.1 * attempt))
        return wrapper
    return deco

async def stream_tokens(resp):
    """Generator: yield as tokens arrive so time-to-first-token stays low."""
    async for chunk in resp:
        if delta := chunk.choices[0].delta.content:
            yield delta

@asynccontextmanager
async def timed(stage: str, metrics: dict):
    t0 = time.perf_counter()
    try:
        yield
    finally:
        metrics[stage] = round((time.perf_counter() - t0) * 1000, 1)`},
qs:[{q:"Why use a generator to stream LLM output instead of collecting it?",a:"Memory stays constant and the first token reaches the user in a few hundred milliseconds instead of after the full completion, which is the difference between a 400ms and a 9-second perceived response.",fu:"How do you propagate an error that happens mid-stream?",tip:"Mention that you must flush and send a terminal error event, because HTTP status was already sent as 200."},
{q:"What does functools.wraps do and why care?",a:"It copies __name__, __doc__ and annotations from the wrapped function to the wrapper. Without it, decorated endpoints lose their signature, which breaks FastAPI dependency resolution and OpenAPI docs.",fu:"What else breaks?",tip:"The FastAPI angle turns a trivia question into a production answer."}]},

{t:"AsyncIO vs threading vs multiprocessing", b:["int","adv","prod","iv"],
what:"Three concurrency models with three different bottlenecks.",
table:{head:["Model","Good for","Parallel CPU?","AI use case"],rows:[
["asyncio","Many concurrent I/O waits","No (single thread)","Hundreds of concurrent LLM/vector/DB calls"],
["threading","Blocking I/O in libraries without async support","No (GIL)","Legacy SDKs, file reads, run_in_executor"],
["multiprocessing","CPU-bound work","Yes","Local embedding, PDF parsing, tokenisation, chunking"]]},
why:"An AI service spends most of its wall time waiting on network calls to a model. asyncio serves hundreds of concurrent requests on one process; threads would burn memory and the GIL blocks real CPU parallelism.",
how:"Rule: await I/O, offload CPU. Any synchronous CPU work inside an async endpoint must go through run_in_executor or a process pool, or it blocks the whole event loop.",
code:{lang:"python",src:`import asyncio
from concurrent.futures import ProcessPoolExecutor

POOL = ProcessPoolExecutor(max_workers=4)

async def answer(queries: list[str], llm, store):
    # fan out I/O concurrently with bounded parallelism
    sem = asyncio.Semaphore(8)
    async def one(q):
        async with sem:
            docs = await store.search(q, k=20)
            return await llm.complete(build_prompt(q, docs))
    return await asyncio.gather(*(one(q) for q in queries))

async def parse_pdf(path: str):
    # CPU-bound: never run this inline in the event loop
    loop = asyncio.get_running_loop()
    return await loop.run_in_executor(POOL, heavy_pdf_parse, path)`},
mistakes:["Calling a synchronous SDK inside an async def endpoint — one slow call stalls every other request on the worker.","Unbounded asyncio.gather over user input, which instantly trips provider rate limits. Always wrap in a semaphore."],
qs:[{q:"Your FastAPI service has p50 of 300ms but p99 of 12s under load. First hypothesis?",a:"Event-loop blocking: a synchronous call (sync SDK, CPU-bound parsing, or a blocking DB driver) inside an async handler. Every other coroutine queues behind it. I would confirm with a loop-lag metric or asyncio debug mode, then move the work to an executor.",fu:"What if the loop is clean?",tip:"Naming loop-lag as the metric you would check is what senior candidates do here."},
{q:"Does asyncio make Python faster?",a:"No — it improves concurrency, not compute. It lets one thread interleave thousands of waits. CPU-bound code gets no benefit and will actually starve the loop.",fu:"So how do you scale CPU work?",tip:"Follow with 'processes for CPU, coroutines for I/O' as a one-liner."}]},

code:{lang:"python",src:`def merge_overlapping(spans: list[tuple[int, int]]) -> list[tuple[int, int]]:
    """Merge overlapping character spans — used to dedupe retrieved chunks."""
    out: list[list[int]] = []
    for s, e in sorted(spans):
        if out and s <= out[-1][1]:
            out[-1][1] = max(out[-1][1], e)
        else:
            out.append([s, e])
    return [(s, e) for s, e in out]   # O(n log n) time, O(n) space`},

def build_inverted_index(chunks: dict[str, str]) -> dict[str, set[str]]:
    """Term -> chunk ids. The lexical half of hybrid search in 5 lines."""

code:{lang:"python",src:`from collections import deque

class SlidingWindowMemory:
    """Keep the last N turns of conversation under a token budget."""
    def __init__(self, budget: int = 4000):
        self.turns, self.budget, self.used = deque(), budget, 0

    def add(self, text: str, tokens: int) -> None:
        self.turns.append((text, tokens)); self.used += tokens
        while self.used > self.budget and self.turns:
            _, t = self.turns.popleft(); self.used -= t`},

# The LRU cache = hash map + doubly linked list. Classic interview question,

class LRUCache:
    def __init__(self, cap: int):
        self.cap, self.map = cap, {}
        self.head = self.tail = None   # most / least recent`},
qs:[{q:"Design an LRU cache.",a:"Hash map from key to node for O(1) lookup, plus a doubly linked list ordering by recency for O(1) move-to-front and O(1) eviction from the tail.",fu:"How would you make it thread-safe?",tip:"Then add: in production you would use Redis with maxmemory-policy allkeys-lru instead."}]},

{t:"Trees, BST and tries", b:["int","code"],
what:"Hierarchical nodes. A BST keeps sorted order with O(log n) operations when balanced; a trie indexes strings by prefix.",
complexity:"Balanced BST search/insert O(log n), degenerate O(n) · trie lookup O(len(key))",
why:"Trees show up as parsed document hierarchies (the basis of parent-document retrieval) and as B-trees inside your database index.",
code:{lang:"python",src:`def flatten_headings(node, depth=0, path=()):
    """DFS a parsed document tree -> chunks that keep their heading path,
    the cheapest big win in RAG chunking."""
    path = path + (node.title,)
    if node.text:
        yield {"text": node.text, "breadcrumb": " > ".join(path), "depth": depth}
    for child in node.children:
        yield from flatten_headings(child, depth + 1, path)`},
qs:[{q:"Why is a database index a B+ tree and not a BST?",a:"B+ trees are shallow and wide, so a lookup touches few disk pages, and leaves are linked for range scans. A BST has one key per node, so depth and therefore I/O grows.",fu:"When is a hash index better?",tip:"Hash index: equality only, no ranges, no ordering."}]},

{t:"Heaps and top-k", b:["int","adv","code","ai"],
what:"A binary heap gives O(log n) push/pop and O(1) peek at the min or max.",
why:"Every retrieval system is a top-k problem. Heaps are how you keep the best k results while streaming millions of candidates without sorting them all.",
complexity:"push/pop O(log n) · heapify O(n) · top-k over n items O(n log k) time, O(k) space",
code:{lang:"python",src:`import heapq

def top_k_by_score(candidates, k=10):
    """O(n log k) and O(k) memory — merge shards or rerank streams this way."""
    heap = []
    for doc_id, score in candidates:
        if len(heap) < k:
            heapq.heappush(heap, (score, doc_id))
        elif score > heap[0][0]:
            heapq.heapreplace(heap, (score, doc_id))
    return sorted(heap, reverse=True)`},
qs:[{q:"You must return the 10 most similar vectors from 8 shards of 5M vectors each. How?",a:"Query shards in parallel, each returning its local top-10, then merge the 80 candidates through a size-10 heap. That is scatter-gather with a heap merge — O(n log k) per shard and trivial merge cost.",fu:"Why can this be less accurate than a single index?",tip:"Because ANN recall is per-shard; mention over-fetching per shard to compensate."}]},

{t:"Graphs, BFS and DFS", b:["int","adv","code","sd"],
what:"Nodes and edges; BFS explores level by level (shortest path in unweighted graphs), DFS goes deep (cycles, topological order).",
why:"Agent workflows are graphs. LangGraph is literally a state machine over a directed graph, and GraphRAG traverses an entity graph to gather context.",
complexity:"BFS/DFS O(V+E) time, O(V) space",
code:{lang:"python",src:`from collections import deque

def neighbourhood(graph: dict[str, list[str]], seeds: list[str], hops: int = 2) -> set[str]:
    """Expand an entity neighbourhood for GraphRAG context assembly."""
    seen, frontier = set(seeds), deque((s, 0) for s in seeds)
    while frontier:
        node, d = frontier.popleft()
        if d == hops:
            continue
        for nxt in graph.get(node, ()):
            if nxt not in seen:
                seen.add(nxt); frontier.append((nxt, d + 1))
    return seen`},
qs:[{q:"How do you detect an infinite loop in an agent workflow?",a:"Model the run as a directed graph of node transitions, track visited state signatures, and cap both total steps and repeated transitions. Cycle detection plus a step budget and a cost budget — that is DFS colouring applied to orchestration.",fu:"What do you do when the cap trips?",tip:"Say: emit a terminal state with a partial answer and a trace, never silently stop."}]},

{t:"Sliding window", b:["int","code"],
what:"Maintain a moving range over a sequence, adding on the right and removing on the left in amortised O(n).",
why:"Directly reused in AI: sentence-window chunking, token-budgeted conversation memory, and rate limiting.",
code:{lang:"python",src:`def chunk_with_overlap(tokens: list[str], size=512, overlap=64):
    """The sliding-window chunker every RAG pipeline starts with."""
    step = size - overlap
    return [tokens[i:i + size] for i in range(0, max(len(tokens) - overlap, 1), step)]`},
qs:[{q:"Implement a sliding-window rate limiter.",a:"Keep timestamps in a sorted structure per key, drop entries older than the window, and reject when the count exceeds the limit. In Redis it is a sorted set with ZREMRANGEBYSCORE plus ZCARD, executed in a Lua script for atomicity.",fu:"Fixed window vs sliding vs token bucket?",tip:"Token bucket for bursty LLM traffic; say that and explain why bursts are normal."}]},

{t:"Sorting, searching and binary search", b:["beg","int","code"],
what:"Timsort in CPython is O(n log n) and stable; binary search is O(log n) on sorted data.",
code:{lang:"python",src:`import bisect

def pick_model_by_tokens(thresholds: list[int], models: list[str], n_tokens: int) -> str:
    """Binary search a routing table: cheap model for small prompts."""
    return models[bisect.bisect_right(thresholds, n_tokens)]`},
qs:[{q:"Why is stability of a sort relevant in reranking?",a:"When two candidates tie on the rerank score, a stable sort preserves the retrieval order, so results are deterministic across runs. Unstable sorting makes A/B comparisons and cached answers noisy.",fu:"How else do you force determinism?",tip:"Break ties explicitly on a secondary key — do not rely on sort internals."}]},

{t:"Recursion and dynamic programming", b:["int","adv","code"],
what:"Recursion solves self-similar subproblems; DP caches overlapping subproblems via memoisation or tabulation.",
complexity:"Typically O(states × transitions); Levenshtein is O(nm) time, O(min(n,m)) space with rolling rows",
code:{lang:"python",src:`from functools import lru_cache

@lru_cache(maxsize=None)
def edit_distance(a: str, b: str) -> int:
    if not a or not b:
        return len(a) + len(b)
    if a[0] == b[0]:
        return edit_distance(a[1:], b[1:])
    return 1 + min(edit_distance(a[1:], b),
                   edit_distance(a, b[1:]),
                   edit_distance(a[1:], b[1:]))`},
qs:[{q:"Where does DP appear in LLM work?",a:"Beam search over decoding paths, Levenshtein for fuzzy matching and OCR cleanup, and Viterbi-style alignment in sequence labelling. Chunk-packing under a token budget is also a knapsack variant.",fu:"Is greedy packing good enough?",tip:"Usually yes — say so, and explain that the cost of optimality is not worth it at k=20."}]},

{t:"Complexity analysis", b:["beg","iv"],
what:"Big-O bounds growth of time and space as input grows, ignoring constants.",
table:{head:["Operation","Complexity","AI context"],rows:[
["Exact nearest neighbour (flat)","O(n·d)","FAISS IndexFlat: exact, no recall loss, slow at scale"],
["HNSW search","~O(log n·d)","Graph-based ANN, high recall, memory hungry"],
["IVF search","O((n/nlist)·d·nprobe)","Cluster-then-scan; tune nprobe for recall/latency"],
["Self-attention","O(n²·d)","Why context windows are expensive"],
["Top-k over n","O(n log k)","Heap merge across shards"]]},
qs:[{q:"Why is a long context window expensive?",a:"Self-attention cost grows quadratically with sequence length and the KV cache grows linearly in memory, so doubling the prompt roughly quadruples attention compute and doubles cache memory per request.",fu:"How do FlashAttention or sliding-window attention help?",tip:"The O(n²) answer is expected; adding the KV-cache memory point is what scores."}]}]});

MODULES.push({
id:"ml", n:"04", title:"Machine Learning", pri:2, tags:["ai"],
intro:"Classical ML still decides tabular problems, ranking and fraud. Expect to defend a model choice and explain why you did not use a neural network.",
topics:[
{t:"Supervised, unsupervised and self-supervised learning", b:["beg","iv"],
what:"Supervised learns from labelled pairs; unsupervised finds structure in unlabelled data; self-supervised creates labels from the data itself (next-token prediction, masked tokens) and is how foundation models are trained.",
ex:"Supervised: churn classification. Unsupervised: customer segmentation with K-Means. Self-supervised: GPT pretraining, or contrastive training of an embedding model.",
qs:[{q:"Which paradigm produced the embedding model in your RAG pipeline?",a:"Self-supervised contrastive training: positive pairs from naturally related text, negatives sampled in-batch, optimising a contrastive loss so semantically similar text lands nearby in vector space.",fu:"Why does that make cosine similarity meaningful?",tip:"Because the training objective optimised exactly that geometry — say it in those words."}]},

{t:"Feature engineering, preprocessing and leakage", b:["int","prod","iv"],
what:"Turning raw data into model inputs: missing-value handling, outliers, encoding, scaling, interactions, aggregations.",
how:"Missing: median/mode for MCAR, a missing-indicator when absence is informative, model-based imputation otherwise. Outliers: clip by percentile or use robust models. Encoding: one-hot for low cardinality, target/embedding encoding for high cardinality. Scaling: required for distance and gradient models, irrelevant for trees.",
mistakes:["Fitting the scaler or imputer on the full dataset before splitting — that leaks test statistics. Fit inside the pipeline on train folds only.","Using a feature computed after the label event (a classic in fraud and churn).","Target encoding without out-of-fold computation, which leaks the label directly."],
code:{lang:"python",src:`from sklearn.pipeline import Pipeline
from sklearn.compose import ColumnTransformer
from sklearn.impute import SimpleImputer
from sklearn.preprocessing import StandardScaler, OneHotEncoder

pre = ColumnTransformer([
    ("num", Pipeline([("i", SimpleImputer(strategy="median")),
                      ("s", StandardScaler())]), num_cols),
    ("cat", Pipeline([("i", SimpleImputer(strategy="most_frequent")),
                      ("o", OneHotEncoder(handle_unknown="ignore"))]), cat_cols),
])
# Everything inside one Pipeline => fitted per CV fold => no leakage.`},
qs:[{q:"Your offline AUC is 0.94 but production AUC is 0.71. What happened?",a:"Most likely leakage or train/serve skew: a feature available at training time is not available (or is computed differently) at inference. I would audit feature timestamps, verify the serving transform is the same code path, and check for distribution shift in the top features.",fu:"How would you prevent it structurally?",tip:"Answer 'a feature store or a single shared transform artefact' — the structural fix, not a manual review."}]},

{t:"Train/test split, cross validation and the bias-variance trade-off", b:["beg","int","iv"],
what:"Hold out data to estimate generalisation; k-fold rotates the holdout to reduce variance of the estimate. Bias is systematic error from too simple a model; variance is sensitivity to the training sample.",
how:"Stratify for imbalanced classification. Use time-based splits for temporal data — random splits leak the future. Group splits when rows share an entity.",
table:{head:["Symptom","Diagnosis","Fix"],rows:[
["High train error, high test error","Underfitting / high bias","More capacity, better features, less regularisation"],
["Low train error, high test error","Overfitting / high variance","More data, regularisation, simpler model, early stopping, bagging"],
["Test good, production bad","Leakage or drift","Audit features, retrain cadence, monitoring"]]},
qs:[{q:"Why is random k-fold wrong for time series?",a:"It trains on future data to predict the past, inflating the score. Use forward-chaining splits where each fold trains on everything before a cutoff and validates after it.",fu:"How do you tune hyperparameters without leaking?",tip:"Nested CV, or a fixed validation window plus a final untouched holdout."}]},

{t:"Regularisation and hyperparameter tuning", b:["int","adv"],
what:"L1 (lasso) drives coefficients to zero and selects features; L2 (ridge) shrinks them smoothly; elastic net mixes both. Trees regularise via depth, min samples and learning rate. Neural nets use dropout, weight decay and early stopping.",
how:"Tune with random search or Bayesian optimisation (Optuna) over a sensible range, always with cross-validation and a fixed seed. Grid search is wasteful beyond three hyperparameters.",
cost:"Tuning cost scales with folds × trials × fit time. Use a smaller subsample and early-stopping trials (Hyperband/ASHA) before the final full-data fit.",
qs:[{q:"L1 or L2 for a model with 5,000 sparse features?",a:"L1 or elastic net — it zeroes out uninformative coefficients, which gives a smaller, faster, more interpretable model. Pure L2 keeps every feature with a small weight.",fu:"What happens to correlated features under L1?",tip:"L1 picks one arbitrarily; elastic net spreads weight across the group — that nuance is the scoring point."}]},

{t:"Model selection: the algorithms that matter", b:["int","iv","prod"],
table:{head:["Model","Strength","Weakness","Use when"],rows:[
["Linear regression","Interpretable, fast, calibrated","Assumes linearity","Baseline, explainability required"],
["Logistic regression","Probabilities, stable, cheap","Linear boundary","Baseline classifier, regulated settings"],
["Decision tree","Human-readable rules","Overfits alone","Explaining a decision path"],
["Random forest","Robust, little tuning","Larger, less sharp","Strong default on tabular"],
["XGBoost / LightGBM","State of the art on tabular","Tuning, overfits if unchecked","Default for structured prediction"],
["SVM","Strong on small high-dimensional data","Scales poorly past ~100k rows","Small clean datasets"],
["KNN","No training, simple","Slow inference, curse of dimensionality","Small data, prototypes — and conceptually, vector search"],
["K-Means","Fast clustering","Needs k, assumes spherical clusters","Segmentation, embedding cluster analysis"]]},
prod:"On tabular data, gradient boosting beats deep learning in accuracy, training cost and latency in the large majority of cases. Saying so confidently — and explaining when embeddings change that — reads as experience.",
qs:[{q:"When would you choose an LLM over XGBoost?",a:"When the input is unstructured language or the task needs world knowledge and generalisation to unseen categories. For a numeric tabular target with ample labels, boosting is more accurate, ~1000× cheaper per prediction and milliseconds instead of seconds.",fu:"Could you combine them?",tip:"Yes: use LLM/embedding features as inputs to the boosted model. That hybrid answer is the senior one."}]},

{t:"Feature importance and explainability", b:["int","adv","prod"],
what:"Global: gain-based importance, permutation importance, SHAP summary. Local: SHAP values, LIME, counterfactuals.",
why:"Regulated domains require a reason for a decision, and debugging drift starts from which features moved.",
sec:"SHAP on raw inputs can expose sensitive attributes in explanations. Decide what is surfaced to end users versus kept for internal audit.",
qs:[{q:"Gain importance vs permutation importance vs SHAP?",a:"Gain is cheap but biased toward high-cardinality features. Permutation measures the true drop in a metric when a feature is shuffled but is misleading with correlated features. SHAP gives additive, locally accurate attributions at higher compute cost. I use SHAP for decisions that need defending, permutation for sanity-checking.",fu:"Which would you log in production?",tip:"Log top-3 SHAP contributors per prediction for the audit trail — concrete and operational."}]}]});

MODULES.push({
id:"ml-eval", n:"05", title:"ML Evaluation & Monitoring", pri:2, tags:["ai"],
intro:"The only question that matters here: which metric, and why that one for this business problem.",
topics:[
{t:"Classification metrics and how to choose", b:["beg","int","iv"],
what:"Accuracy, precision, recall, F1, ROC-AUC, PR-AUC, and the confusion matrix they all derive from.",
table:{head:["Metric","Reads as","Choose when"],rows:[
["Accuracy","Fraction correct","Balanced classes and symmetric costs only"],
["Precision","Of flagged items, how many were right","False positives are expensive (blocking a good transaction)"],
["Recall","Of real positives, how many we caught","False negatives are expensive (missed fraud, missed disease)"],
["F1","Harmonic mean of precision and recall","One number needed under imbalance"],
["ROC-AUC","Ranking quality across thresholds","Comparing models, roughly balanced classes"],
["PR-AUC","Ranking quality on the positive class","Severe imbalance — the honest choice at 1% positives"]]},
how:"Pick the metric from the cost of each error type, then pick the operating threshold from the business constraint (for example, maximise recall subject to precision ≥ 0.9).",
qs:[{q:"Fraud is 0.2% of transactions. Which metric?",a:"PR-AUC for model comparison plus recall at a fixed precision for the operating point. Accuracy is useless — predicting 'never fraud' scores 99.8%. ROC-AUC looks flatteringly high because true negatives dominate.",fu:"What threshold would you ship?",tip:"Tie the threshold to reviewer capacity: 'we can manually review 500 cases a day, so set the threshold there.'"},
{q:"Why can ROC-AUC mislead on imbalanced data?",a:"The false-positive rate has a huge denominator, so large absolute numbers of false positives barely move the curve. PR-AUC exposes that cost because precision divides by predicted positives.",fu:"Can a model have AUC 0.95 and be useless?",tip:"Yes — and give the triage-capacity example."}]},

{t:"Regression metrics", b:["beg","int"],
table:{head:["Metric","Property","Use when"],rows:[
["MAE","Same units, robust to outliers","Errors cost linearly; outliers are noise"],
["MSE","Penalises large errors quadratically","Big misses are disproportionately costly"],
["RMSE","Same units as target, outlier-sensitive","Reporting to stakeholders"],
["R²","Variance explained, unitless","Comparing across datasets — never alone"],
["MAPE","Relative error","Scale-free comparison; breaks near zero"]]},
qs:[{q:"MAE or RMSE for delivery-time prediction?",a:"MAE if a 10-minute error is twice as bad as 5 minutes. RMSE if a 60-minute miss is catastrophically worse than twelve 5-minute misses. The loss function should match the business cost curve.",fu:"Would you optimise the same metric you report?",tip:"Note quantile loss when over- and under-prediction cost differently — that is the senior answer."}]},

{t:"Drift: data, concept and model", b:["adv","prod","iv"],
what:"Data drift is input distribution change. Concept drift is a change in the relationship between inputs and target. Model drift (decay) is the resulting metric decline.",
how:"Detect data drift with PSI, KL divergence or Kolmogorov-Smirnov per feature on a rolling window against a training baseline. Detect concept drift by tracking the live metric once labels arrive. Alert on sustained change, not single-day noise.",
prod:"Labels usually arrive late, so run a two-tier monitor: immediate unsupervised drift signals plus delayed supervised metrics. Define a retraining trigger (metric drop or drift threshold) and automate it behind a canary.",
ex:"For a RAG system, drift shows up as new question topics with no covering documents — measure it as a rise in low-retrieval-score queries, and alert on that.",
qs:[{q:"How do you monitor a model when ground truth arrives 30 days later?",a:"Proxy signals now, truth later: input drift per feature, prediction-distribution shift, confidence distribution, and business proxies like override or complaint rates. Then reconcile with real metrics when labels land and backfill the dashboard.",fu:"What is your retraining trigger?",tip:"Give a number: 'PSI > 0.2 on a top-5 feature, or AUC down 3 points versus the baseline window.'"}]}]});

MODULES.push({
id:"dl", n:"06", title:"Deep Learning", pri:2, tags:["ai"],
intro:"Enough depth to explain what happens inside a forward and backward pass, and enough production sense to serve it.",
topics:[
{t:"Neural networks, perceptrons and activations", b:["beg","int"],
what:"A layer computes y = f(Wx + b). Stacking non-linear layers lets the network approximate complex functions.",
how:"ReLU is the default for hidden layers (cheap, no saturation for positives, but dead units). GELU/SiLU are standard in transformers for smoother gradients. Sigmoid for binary output, softmax for multiclass, tanh rarely except in gates.",
qs:[{q:"Why do we need a non-linear activation at all?",a:"Without it, stacked linear layers collapse into a single linear transform, so depth adds no expressive power. Non-linearity is what makes a deep network more than a matrix multiply.",fu:"Why did ReLU beat sigmoid historically?",tip:"Vanishing gradients: sigmoid saturates, ReLU keeps a constant gradient for positive inputs."}]},

{t:"Forward propagation, backpropagation and gradient descent", b:["int","adv","iv"],
what:"Forward computes predictions and loss; backprop applies the chain rule backwards to get gradients of the loss with respect to every parameter; gradient descent steps the parameters against the gradient.",
how:"Batch GD uses all data per step (stable, slow). SGD uses one sample (noisy, fast). Mini-batch is the practical middle. Learning rate is the highest-leverage hyperparameter; warmup plus cosine decay is the transformer default.",
ex:"Exploding gradients in an RNN are handled by gradient clipping at a global norm of ~1.0; vanishing gradients motivated LSTMs and residual connections.",
qs:[{q:"Explain backpropagation in two sentences.",a:"It computes the gradient of the loss with respect to each parameter by applying the chain rule from the output backwards through the network, reusing intermediate activations cached during the forward pass. The optimiser then uses those gradients to update weights.",fu:"Why does it need the forward activations stored?",tip:"That follow-up is really about memory: activation memory is why batch size is GPU-limited, and why gradient checkpointing exists."}]},

{t:"Optimisers and loss functions", b:["int","adv"],
table:{head:["Optimiser","Behaviour","Use"],rows:[
["SGD + momentum","Simple, generalises well, needs tuning","Vision, large-batch training"],
["Adam / AdamW","Adaptive per-parameter rates, fast convergence","Default for transformers (AdamW decouples weight decay)"],
["Adafactor / 8-bit Adam","Lower optimiser memory","Large models on limited GPU memory"]]},
how:"Loss follows the task: cross-entropy for classification and language modelling, MSE/MAE for regression, contrastive or InfoNCE for embeddings, triplet loss for metric learning, and DPO/PPO objectives for preference alignment.",
qs:[{q:"Why AdamW rather than Adam for transformers?",a:"AdamW applies weight decay directly to the weights instead of folding it into the adaptive gradient, so regularisation is not scaled away by per-parameter learning rates. It generalises better and is the standard in every modern LLM recipe.",fu:"What learning-rate schedule pairs with it?",tip:"Linear warmup then cosine decay — and say why warmup exists: early gradients are unreliable."}]},

{t:"Batch normalisation, layer normalisation and dropout", b:["int","adv","iv"],
what:"BatchNorm normalises across the batch dimension; LayerNorm normalises across features within one sample; dropout randomly zeroes activations during training as a regulariser.",
why:"Transformers use LayerNorm (and RMSNorm) because sequence lengths vary and batch statistics are unstable and unavailable at inference for a single sequence.",
mistakes:["Forgetting model.eval(), which leaves dropout active and BatchNorm updating running statistics — a classic silent production bug that makes inference non-deterministic."],
qs:[{q:"Why LayerNorm instead of BatchNorm in transformers?",a:"LayerNorm is independent of batch composition, so it behaves identically for batch size 1 at inference and for variable-length sequences. BatchNorm's statistics depend on the batch, which breaks autoregressive generation and small-batch serving.",fu:"What is pre-norm vs post-norm?",tip:"Pre-norm (norm before the sublayer) trains deep stacks more stably; that is what modern LLMs use."}]},

{t:"CNN, RNN, LSTM, GRU and attention", b:["int","iv"],
table:{head:["Architecture","Inductive bias","Limitation","Status"],rows:[
["CNN","Local spatial patterns, translation invariance","Fixed receptive field","Still strong for vision, OCR, audio front-ends"],
["RNN","Sequential recurrence","Vanishing gradients, no parallelism","Legacy"],
["LSTM / GRU","Gated long-range memory","Sequential training, limited range","Legacy but asked about"],
["Attention / Transformer","Every token attends to every token","O(n²) cost","Dominant for language"]]},
qs:[{q:"Why did transformers replace LSTMs?",a:"Attention gives direct access to any position, so long-range dependencies do not degrade through recurrence, and the whole sequence trains in parallel instead of step by step. That parallelism is what made scaling to billions of parameters economically possible.",fu:"What did we give up?",tip:"Quadratic cost in sequence length and no built-in notion of order — hence positional encoding."}]},

{t:"PyTorch, TensorFlow and production considerations", b:["int","prod"],
what:"PyTorch dominates research and increasingly production; TensorFlow/Keras persists in established enterprise pipelines with TF Serving and TFLite.",
prod:"Serving checklist: export to TorchScript/ONNX or compile with torch.compile; pin the model version; warm up the GPU on startup to avoid a cold first request; batch requests dynamically; use FP16/BF16 or INT8; set model.eval() and torch.inference_mode(); expose readiness only after weights load; and pre-bake weights into the image or a volume rather than downloading on boot.",
qs:[{q:"Your GPU inference pod takes 90 seconds to serve its first request. Why and what do you do?",a:"Cold start: image pull, weight download, CUDA context creation and kernel autotuning. Fix by baking weights into the image or a pre-warmed volume, running a synthetic warm-up inference in the startup hook, and only passing the readiness probe afterwards so Kubernetes does not route traffic early.",fu:"How does that interact with autoscaling?",tip:"Mention keeping a warm minimum replica count because HPA cannot scale fast enough for GPU cold starts."}]}]});

MODULES.push({
id:"nlp", n:"07", title:"NLP Foundations", pri:1, tags:["ai"],
intro:"Mostly background now, but tokenisation and lexical retrieval are live production concerns, and interviewers use this section to test depth.",
topics:[
{t:"Tokenisation", b:["beg","prod","iv"],
what:"Splitting text into model units. Modern LLMs use subword schemes: BPE (GPT), WordPiece (BERT), SentencePiece/Unigram (T5, LLaMA).",
why:"Tokens are the billing unit, the context-window unit and the truncation unit. Every cost and latency calculation you make is in tokens.",
how:"Subword vocabularies handle unseen words by composition, keep vocabulary size manageable, and trade sequence length against vocabulary size.",
prod:"Rules of thumb: ~4 characters per token in English; code and non-Latin scripts are far less efficient (a Hindi or Japanese prompt can cost 2–3× the tokens of the same English text). Always count tokens with the model's own tokenizer before assembling a prompt, never by character heuristics.",
qs:[{q:"Why does the same prompt cost more in Japanese than English?",a:"Tokenizers are trained mostly on English-heavy corpora, so non-Latin scripts fragment into more subword tokens per character. Same meaning, more tokens, higher cost and more context consumed.",fu:"How would you handle a multilingual product's budget?",tip:"Measure tokens per language empirically and set per-language context budgets — concrete and rarely said."}]},

{t:"Stemming, lemmatisation and stop words", b:["beg"],
what:"Stemming chops affixes crudely (running → run); lemmatisation maps to a dictionary form using part of speech; stop-word removal drops high-frequency function words.",
when:"Useful for lexical/BM25 pipelines. Harmful before feeding a transformer — the model's tokenizer and attention need the original text, and stop words carry syntax that embeddings use.",
qs:[{q:"Should you remove stop words before embedding a chunk?",a:"No. Transformer embeddings are trained on natural text; stripping function words changes the meaning distribution and degrades retrieval. Stop-word removal belongs only in the BM25/lexical branch.",fu:"Does it help the BM25 branch?",tip:"Marginally — modern BM25 handles term frequency well, so it mostly saves index space."}]},

{t:"Bag of Words, TF-IDF and BM25", b:["beg","int","prod","ai"],
what:"Sparse lexical representations. BoW counts terms; TF-IDF weights them by inverse document frequency; BM25 adds term-frequency saturation and document-length normalisation.",
why:"BM25 is not legacy — it is the lexical half of hybrid search and it beats dense retrieval on rare terms, identifiers, error codes, part numbers and exact names.",
prod:"Every serious RAG system runs BM25 (via Elasticsearch/OpenSearch or Qdrant sparse vectors) next to dense retrieval and fuses the results. Dropping it is the most common cause of 'the system cannot find the exact SKU I typed'.",
qs:[{q:"Why keep BM25 when you have embeddings?",a:"Dense retrieval generalises meaning but blurs exact tokens. A query for error code E-4021 or a specific invoice number needs lexical matching; the embedding of a rare identifier is close to noise. Hybrid retrieval plus fusion gets both behaviours.",fu:"How do you combine the two ranked lists?",tip:"Reciprocal Rank Fusion — scale-free, no score normalisation needed."}]},

{t:"Word2Vec, GloVe and static embeddings", b:["beg","int"],
what:"Word-level vectors learned from co-occurrence: Word2Vec (skip-gram/CBOW) predicts context, GloVe factorises a co-occurrence matrix.",
notwhen:"Do not use them for retrieval today. They give one vector per word regardless of context, so 'bank' has a single meaning. Contextual transformer embeddings replaced them.",
qs:[{q:"What is the key limitation of Word2Vec that transformers fixed?",a:"Static embeddings assign one vector per token independent of context, so polysemy collapses. Transformer embeddings are contextual: the same word gets different vectors depending on the surrounding sentence.",fu:"Are static embeddings ever still useful?",tip:"Yes — extremely cheap, CPU-friendly lookups for large-scale candidate generation or feature engineering."}]},

{t:"NER, text classification and seq2seq", b:["beg","int","prod"],
what:"NER tags spans as entities; classification assigns a label to text; seq2seq maps input sequence to output sequence (translation, summarisation).",
prod:"For NER on PII, a dedicated model (Presidio, spaCy, a fine-tuned encoder) is cheaper, faster and more auditable than asking an LLM. Use the LLM where generalisation matters, a small classifier where the label set is fixed.",
cost:"A fine-tuned DistilBERT classifier runs at single-digit milliseconds on CPU for a fraction of a cent per thousand calls. An LLM doing the same routing costs orders of magnitude more per call — relevant when routing every request.",
qs:[{q:"Would you use an LLM or a fine-tuned classifier for intent routing?",a:"A small fine-tuned encoder if the intent set is fixed and you have a few thousand labelled examples: milliseconds, cents, deterministic. An LLM for cold start, open-ended intents, or when the taxonomy changes weekly. Often both: LLM to bootstrap labels, then distil into the small model.",fu:"How do you handle a new intent appearing?",tip:"Fallback to the LLM on low-confidence classifier output, and log those for the next training round."}]}]});

MODULES.push({
id:"transformers", n:"08", title:"Transformers", pri:3, tags:["ai","iv"],
intro:"Expect to explain attention on a whiteboard. The goal is a clear mechanical account plus the practical consequences for serving.",
topics:[
{t:"Transformer architecture overview", b:["int","adv","iv","ai"],
what:"A stack of identical blocks. Each block does multi-head self-attention, then a position-wise feed-forward network, with residual connections and layer normalisation around both. Position information is injected separately because attention is order-agnostic.",
flow:[["Token ids","tokenizer output"],["Embedding + positional encoding","learned or RoPE","teal"],["Block × N: LayerNorm → Multi-head self-attention → residual","amber"],["Block × N: LayerNorm → Feed-forward (4× width) → residual","amber"],["Final LayerNorm"],["Output projection → logits over vocabulary"],["Sampling (temperature, top-k, top-p) → next token"]],
qs:[{q:"Describe the transformer block.",a:"Two sublayers with residual connections and normalisation: multi-head self-attention that mixes information across positions, then a position-wise feed-forward network that transforms each position independently. Attention moves information between tokens; the FFN does the per-token computation.",fu:"Where do most parameters live?",tip:"In the FFN — typically two thirds of block parameters at 4× hidden width. That detail signals real familiarity."}]},

{t:"Self-attention and Q/K/V", b:["adv","iv","ai"],
what:"Each token is projected into a query, a key and a value. Attention scores are the scaled dot products of queries against keys, softmaxed into weights, which then form a weighted sum of values.",
how:"Attention(Q,K,V) = softmax(QKᵀ / √d_k)·V. The √d_k division keeps the dot products from growing with dimension and pushing softmax into saturation, which would kill gradients.",
ex:"In 'the invoice was rejected because it was late', resolving 'it' requires the query from 'it' to score highly against the key from 'invoice'. Attention learns that routing.",
perf:"Cost is O(n²·d) in time and the score matrix is O(n²) in memory, which is why FlashAttention (tiling to avoid materialising the matrix) and sliding-window or grouped-query attention exist.",
qs:[{q:"Why divide by the square root of d_k?",a:"Dot products of high-dimensional random vectors have variance proportional to d_k, so unscaled scores grow large, softmax saturates into a near one-hot distribution and gradients vanish. Scaling keeps the score variance around 1.",fu:"What is the KV cache?",tip:"This is the highest-frequency transformer question. Have the one-line formula ready verbatim."},
{q:"What is the KV cache and why does it matter in production?",a:"During autoregressive decoding, the keys and values for previous tokens do not change, so they are cached and reused instead of recomputed each step. It turns generation from quadratic to linear recomputation, but the cache grows with batch size × sequence length × layers, and it is usually what limits how many concurrent requests a GPU can hold.",fu:"How does PagedAttention improve it?",tip:"Say: it pages the cache in fixed blocks like virtual memory, removing fragmentation and raising concurrency — that is vLLM's core trick."}]},

{t:"Multi-head attention, positional encoding, FFN and residuals", b:["adv","iv"],
what:"Multiple attention heads run in parallel on lower-dimensional projections and are concatenated, letting different heads specialise (syntax, coreference, position). Positional encoding supplies order: sinusoidal originally, learned in BERT, rotary (RoPE) in modern LLMs. Residual connections carry gradient paths through depth; LayerNorm stabilises scale.",
why:"RoPE matters practically: it encodes relative position by rotating Q and K, which allows context-length extension by interpolating or scaling the rotation base — the mechanism behind 8k → 128k context extensions.",
qs:[{q:"Why multiple heads instead of one big attention?",a:"Each head attends to a different subspace, so the model can simultaneously track several relations — one head on the previous token, one on the syntactic head, one on a distant entity. A single large head averages these into one distribution.",fu:"What happens if you prune heads?",tip:"Many heads are redundant and prunable — that is a real inference-cost lever, worth mentioning."},
{q:"How do models get from 4k to 128k context?",a:"Mostly RoPE scaling or interpolation (position interpolation, NTK-aware scaling, YaRN) plus continued training on long sequences, combined with attention efficiency work like FlashAttention and grouped-query attention to make the memory affordable.",fu:"Does a bigger window remove the need for RAG?",tip:"No — cost, latency and lost-in-the-middle degradation. Say it plainly."}]},

{t:"Encoder-only, decoder-only and encoder-decoder", b:["int","iv"],
table:{head:["Family","Attention","Best at","Examples"],rows:[
["Encoder-only","Bidirectional","Understanding: embeddings, classification, NER, reranking","BERT, RoBERTa, DeBERTa, E5, BGE"],
["Decoder-only","Causal (masked future)","Generation, chat, reasoning, code","GPT, LLaMA, Mistral, Claude"],
["Encoder-decoder","Bidirectional encode + causal decode","Transduction: translation, summarisation","T5, FLAN-T5, BART"]]},
prod:"In a RAG stack you use all three families: an encoder for embeddings, a cross-encoder for reranking, and a decoder-only LLM for the answer. Being able to say that mapping out loud is a strong signal.",
qs:[{q:"Why is BERT not used for generation?",a:"It is trained with bidirectional masked-language modelling, so it has no causal objective for producing the next token and no autoregressive decoding path. It is built to encode, not to continue text.",fu:"Which family would you pick for a reranker and why?",tip:"Encoder-only cross-encoder: query and document attend to each other jointly, which is exactly what scoring relevance needs."}]},

{t:"Model families: BERT, GPT, T5, LLaMA, Mistral", b:["int","prod"],
table:{head:["Model","Type","Why it matters now"],rows:[
["BERT / DeBERTa","Encoder","Ancestor of today's embedding and reranker models"],
["GPT family","Decoder","Established decoder-only scaling and instruction following"],
["T5 / FLAN-T5","Enc-dec","Text-to-text framing; still good for constrained transduction"],
["LLaMA family","Decoder","Default open-weight base for self-hosting and fine-tuning"],
["Mistral / Mixtral","Decoder / MoE","Strong quality per parameter; MoE activates a subset of experts per token"]]},
qs:[{q:"What is a mixture-of-experts model and what is the operational catch?",a:"MoE replaces the dense FFN with many expert FFNs and a router that activates only a few per token, so compute per token stays low while total parameters grow. The catch is memory: all experts must be resident, so VRAM requirements track total parameters, not active ones — and routing makes latency less uniform.",fu:"Does that change your serving cost model?",tip:"Yes: cheap FLOPs, expensive memory. Naming that trade-off directly is the win."}]}]});

MODULES.push({
id:"llm", n:"09", title:"LLM Fundamentals", pri:3, tags:["ai","prod"],
intro:"The control surface you actually tune in production: tokens, context, sampling, and the decision between prompting, RAG and fine-tuning.",
topics:[
{t:"Tokens, context window and parameters", b:["beg","int","prod","iv"],
what:"Tokens are the model's units of input and output. The context window is the maximum tokens for prompt plus completion. Parameters are the learned weights and determine memory footprint and capability.",
how:"Context budget in practice: system prompt + tools schema + conversation history + retrieved context + expected output ≤ window. Allocate it explicitly and truncate the lowest-value segment (usually old history) first.",
prod:"Memory rule of thumb for self-hosting: roughly 2 bytes per parameter at FP16, so a 7B model needs ~14GB for weights, plus KV cache. INT4 quantisation puts it near 4GB and fits consumer GPUs.",
cost:"Never let context grow unbounded with conversation length — cost and latency grow linearly per turn and the bill quietly quadruples. Summarise or window the history.",
qs:[{q:"A user's chat hits the context limit at turn 40. What do you do?",a:"Keep the system prompt and the last few turns verbatim, replace older turns with a rolling LLM-generated summary, and retrieve only the relevant history rather than all of it. Track token usage per turn and enforce a hard budget with the model's tokenizer.",fu:"What does the user lose?",tip:"Be honest: fine detail from early turns. Mitigate by persisting facts to a structured memory store, not just a summary."}]},

{t:"Temperature, top-k, top-p and log probabilities", b:["int","prod","iv"],
what:"Decoding controls. Temperature scales the logits before softmax (lower = sharper). Top-k keeps the k highest-probability tokens. Top-p (nucleus) keeps the smallest set whose cumulative probability exceeds p. Log probabilities expose the model's confidence per token.",
how:"Deterministic extraction, classification, SQL or JSON: temperature 0–0.2. Conversational: 0.5–0.7. Creative or diverse generation: 0.8–1.0. Adjust temperature or top-p, not both aggressively.",
prod:"Log probabilities are underused: average token logprob is a cheap confidence signal for routing to a human or a stronger model, and for detecting the model bluffing on a question the context does not answer.",
qs:[{q:"Temperature 0 gives different answers on the same prompt. Why?",a:"Temperature 0 is greedy, not deterministic end to end. Floating-point non-determinism from batching and GPU kernel scheduling, model version changes behind the API, and any non-pinned system state can all change the argmax. Treat determinism as best-effort and pin model versions explicitly.",fu:"How do you build reproducible evals then?",tip:"Pin the model version, fix seeds where supported, and score with tolerance-based metrics instead of exact string match."},
{q:"Temperature vs top-p — which would you expose to users?",a:"Neither, usually. Expose intent-level presets (precise / balanced / creative) mapped to tested settings. Raw knobs let users break output parsing, and support then debugs a malformed-JSON bug caused by temperature 1.4.",fu:"Which one would you tune first internally?",tip:"Temperature — top-p mainly trims the tail and has less effect on factuality."}]},

{t:"Hallucination", b:["int","adv","prod","iv"],
what:"Fluent output that is unsupported by the input or by fact. The model is optimised to produce likely text, not verified text.",
why:"It is not a bug to be prompted away; it is a property of the objective. You reduce and detect it, you do not eliminate it.",
how:"Layered mitigation: ground with retrieval, require citations to retrieved ids, instruct the model to answer only from context and to say when it cannot, validate structured output against a schema, check claim-level groundedness with a second model or NLI check, and surface confidence from logprobs or retrieval scores.",
prod:"Add a refusal path. A system that says 'I could not find this in the documentation, here are the three closest passages' earns more trust than one that guesses, and it is measurable: track refusal rate alongside faithfulness.",
qs:[{q:"How do you reduce hallucination in a RAG system?",a:"Fix retrieval first — most hallucination is a retrieval failure, not a generation failure. Then constrain generation: answer only from provided context, cite chunk ids, refuse when context is insufficient. Then verify: score groundedness per claim offline and sample online, and alert when faithfulness drops.",fu:"What if retrieval returns irrelevant documents?",tip:"Have the threshold answer ready: if the top rerank score is below a floor, do not generate an answer — return a refusal with the closest passages."}]},

{t:"Quantisation and distillation", b:["adv","prod"],
what:"Quantisation stores weights and activations at lower precision (FP16, INT8, FP8, INT4 via GPTQ/AWQ). Distillation trains a smaller student to imitate a larger teacher.",
table:{head:["Precision","Memory for 7B","Typical quality impact"],rows:[
["FP32","~28 GB","Baseline, never used for serving"],
["FP16 / BF16","~14 GB","Effectively lossless; production default"],
["INT8","~7 GB","Small degradation, good throughput gain"],
["INT4 (AWQ/GPTQ)","~4 GB","Noticeable on reasoning tasks; fine for many narrow tasks"]]},
prod:"Quantise, then re-run your eval suite. The failure mode is subtle: fluency stays high while instruction-following and arithmetic degrade, so a smoke test passes and quality quietly drops.",
qs:[{q:"When is INT4 acceptable?",a:"For narrow, well-evaluated tasks — classification, extraction, routing, simple summarisation — where you have measured the quality delta and it is within tolerance. Not for multi-step reasoning or code generation without strong evidence from your own evals.",fu:"Quantise or distil?",tip:"Distillation for a fixed repeated task at very high volume; quantisation as the cheap first lever."}]},

{t:"Fine-tuning, LoRA, QLoRA and PEFT", b:["adv","prod","iv"],
what:"Full fine-tuning updates all weights. PEFT methods freeze the base and train small additions: LoRA injects low-rank adapter matrices; QLoRA does LoRA on a 4-bit quantised base so a 7B model fine-tunes on a single consumer GPU.",
why:"Fine-tuning changes behaviour, format and style efficiently. It is a poor way to add knowledge — that is what retrieval is for.",
how:"Needs a curated dataset (typically 500–10,000 high-quality examples), a held-out eval set, and a serving story. LoRA adapters are small (megabytes), can be hot-swapped, and let one base model serve many tenants or tasks.",
cost:"QLoRA on 7B: a few dollars of GPU time. Full fine-tuning of a large model: orders of magnitude more, plus a dedicated serving deployment. Adapter serving keeps one base model in memory and swaps adapters per request.",
qs:[{q:"Fine-tune or RAG for company-specific knowledge?",a:"RAG. Knowledge changes and must be attributable, deletable and auditable; retrieval updates in seconds by re-indexing, gives citations, and honours access control per document. Fine-tuning bakes knowledge into weights, needs retraining to update, cannot cite, and cannot enforce per-user permissions.",fu:"When would you fine-tune then?",tip:"Format adherence, tone, a domain style, a proprietary output structure, or distilling a large model's behaviour into a cheap one for volume."},
{q:"Explain LoRA in one breath.",a:"Freeze the pretrained weights and learn a low-rank update — two small matrices whose product is added to the original weight matrix. You train a fraction of a percent of the parameters, get most of the benefit, and can swap adapters at serving time.",fu:"What do rank and alpha control?",tip:"Rank is adapter capacity, alpha scales its contribution; higher rank fits more but risks overfitting on small datasets."}]},

{t:"Decision framework: prompt, RAG, fine-tune or pretrain", b:["int","adv","iv","prod"],
what:"The most common LLM architecture question, and the one candidates answer worst.",
table:{head:["Approach","Solves","Cost","Update latency","Use when"],rows:[
["Prompt engineering","Behaviour and format","Near zero","Instant","Always the first attempt"],
["RAG","Missing or changing knowledge","Medium (infra)","Seconds (re-index)","Facts live in your documents and must be cited"],
["Fine-tuning (LoRA)","Style, format, narrow task skill","Low-medium","Hours-days (retrain)","Prompting cannot get consistency; high volume"],
["Continued pretraining","New domain language or modality","Very high","Weeks","Specialised vocabulary at scale (legal, genomics)"],
["Pretraining from scratch","Almost never for an application team","Extreme","Months","You are a model lab"]]},
how:"Escalate in that order and stop as soon as your eval target is met. Combining prompt + RAG + a small LoRA for formatting is a common production endpoint.",
qs:[{q:"Sales wants the bot to know the new pricing sheet that changes monthly. What do you build?",a:"RAG over the pricing documents with metadata for effective dates, plus a re-index step wired into the document publishing flow. Fine-tuning would need a retrain every month, could not cite the source, and would happily state last month's price with total confidence.",fu:"How do you stop it citing an expired price?",tip:"Metadata filter on effective date at query time, and include the date in the cited answer — precise, and shows you think about staleness."}]}]});
