MODULES.push({
id:"langchain", n:"15", title:"LangChain", pri:2, tags:["ai","code"],
intro:"A composition library. Useful for standard pieces, dangerous when its abstractions hide behaviour you need to control.",
topics:[
{t:"Core abstractions", b:["beg","int","code"],
what:"Models (chat and embeddings), prompt templates, output parsers, retrievers, tools, memory, callbacks, and composition via the Runnable interface with the pipe operator.",
how:"Everything implements Runnable, so chains compose with `|` and get invoke/batch/stream/astream plus retries and fallbacks for free.",
code:{lang:"python",src:`from langchain_core.prompts import ChatPromptTemplate
from langchain_core.runnables import RunnablePassthrough
from langchain_core.output_parsers import StrOutputParser

prompt = ChatPromptTemplate.from_messages([
    ("system", "Answer only from CONTEXT. Cite [doc_id]. If unsure, say so."),
    ("human", "CONTEXT:\\n{context}\\n\\nQuestion: {question}"),
])

def format_docs(docs):
    return "\\n\\n".join(f"[{d.metadata['doc_id']}] {d.page_content}" for d in docs)

chain = (
    {"context": retriever | format_docs, "question": RunnablePassthrough()}
    | prompt
    | llm.with_fallbacks([cheap_llm])        # provider failover
    | StrOutputParser()
)

async for token in chain.astream("How do refunds work?"):
    yield token`},
qs:[{q:"What does LangChain actually give you?",a:"Standard interfaces over providers and stores, composition with streaming, batching, retries and fallbacks, structured output helpers, and an ecosystem of loaders and retrievers. It saves integration code; it does not design your system.",fu:"What would you not use it for?",tip:"Hot paths where you need exact control of the HTTP call, tokens and errors — say you drop to the provider SDK there."}]},

{t:"Retrievers, tools and structured output", b:["int","prod","code"],
how:"with_structured_output binds a Pydantic schema to the model and returns validated objects. Tools are declared with @tool and bound to the model, which then returns tool-call requests your code executes.",
code:{lang:"python",src:`from langchain_core.tools import tool
from pydantic import BaseModel, Field

class Ticket(BaseModel):
    summary: str
    priority: int = Field(ge=1, le=4)

@tool
def lookup_order(order_id: str) -> dict:
    """Fetch an order by id. Use for questions about a specific order."""
    return orders.get(order_id)          # authorisation enforced inside

structured = llm.with_structured_output(Ticket)
agent_llm = llm.bind_tools([lookup_order])`},
prod:"Tool docstrings are prompt surface — the model chooses tools from them. Vague descriptions cause wrong tool selection far more often than model weakness does. And authorisation belongs inside the tool implementation, never in the description.",
qs:[{q:"Your agent keeps calling the wrong tool. What do you change first?",a:"The tool descriptions and schemas. Make each name and docstring explicitly state when to use it and when not to, tighten parameter types, and reduce the number of tools exposed per request — most misrouting comes from overlapping descriptions and too large a tool surface, not from the model.",fu:"How many tools is too many?",tip:"Beyond roughly ten, route to a subset first. Saying that shows you have hit the limit in practice."}]},

{t:"Memory, callbacks and production patterns", b:["int","adv","prod"],
what:"Conversation history management, plus callbacks/tracing hooks for observability.",
prod:"Patterns worth keeping: provider fallbacks, retries with backoff, token-budgeted history, streaming with astream_events, and callbacks wired to LangSmith or Langfuse. Patterns worth avoiding: deep opaque chains that make debugging archaeology, and memory abstractions that silently grow the context and the bill.",
mistakes:["Framework version churn breaking imports in production — pin exact versions and wrap the framework behind your own interfaces.","Letting an abstraction hide the actual prompt; always log the final rendered prompt."],
qs:[{q:"Would you use LangChain in production?",a:"Selectively. I use it for standard composition, loaders, retrievers and streaming, but I wrap it behind my own interfaces so a version change or a swap to raw SDKs does not ripple through the codebase, and I always log the rendered prompt and raw response so the abstraction cannot hide behaviour I am accountable for.",fu:"What would push you off it entirely?",tip:"Very tight latency budgets or a need for exotic provider features — concrete reasons, not taste."}]}]});

MODULES.push({
id:"langgraph", n:"16", title:"LangGraph", pri:2, tags:["ai","prod","code"],
intro:"Agents as explicit state machines. This is what interviewers want when they ask how you control an agent instead of hoping it behaves.",
topics:[
{t:"State, nodes, edges and StateGraph", b:["int","adv","code"],
what:"A directed graph where nodes are functions that read and update a typed shared state, edges define transitions, and conditional edges route based on the state.",
why:"A plain agent loop is an opaque while-loop. A graph makes control flow inspectable, testable, resumable and boundable — which is what production needs.",
code:{lang:"python",src:`from typing import Annotated, TypedDict
from operator import add
from langgraph.graph import StateGraph, START, END
from langgraph.checkpoint.postgres import PostgresSaver

class S(TypedDict):
    question: str
    docs: list
    answer: str
    grade: str
    attempts: Annotated[int, add]        # reducer merges updates

def retrieve(s: S) -> dict:
    return {"docs": hybrid_search(s["question"]), "attempts": 1}

def grade(s: S) -> dict:
    return {"grade": grader(s["question"], s["docs"])}     # ok | retry | refuse

def rewrite(s: S) -> dict:
    return {"question": rewriter(s["question"])}

def generate(s: S) -> dict:
    return {"answer": answer_with_citations(s["question"], s["docs"])}

def route(s: S) -> str:
    if s["grade"] == "ok":              return "generate"
    if s["attempts"] >= 3:              return "refuse"
    return "rewrite"

g = StateGraph(S)
for name, fn in [("retrieve", retrieve), ("grade", grade),
                 ("rewrite", rewrite), ("generate", generate), ("refuse", refuse)]:
    g.add_node(name, fn)
g.add_edge(START, "retrieve")
g.add_edge("retrieve", "grade")
g.add_conditional_edges("grade", route,
    {"generate": "generate", "rewrite": "rewrite", "refuse": "refuse"})
g.add_edge("rewrite", "retrieve")
g.add_edge("generate", END); g.add_edge("refuse", END)

app = g.compile(checkpointer=PostgresSaver(pool))   # durable, resumable`},
qs:[{q:"Why LangGraph instead of a while loop with an LLM?",a:"Explicit state and transitions give you checkpointing, resumption after a crash, human-in-the-loop interrupts, per-node retries, step budgets, and traces you can read. A while loop gives you none of that, and every production requirement eventually forces you to rebuild it badly.",fu:"What does the checkpointer store?",tip:"The full state per thread and step, in Postgres — which is what makes pause/resume and time travel possible."}]},

{t:"Checkpointing, persistence and human-in-the-loop", b:["adv","prod","iv"],
what:"A checkpointer persists state after each step keyed by a thread id, so runs survive restarts, can be resumed, inspected, rewound, and paused for human approval.",
how:"Use interrupt_before on sensitive nodes so execution stops and waits for an approval decision, then resumes with the human's input merged into state. Postgres for the checkpointer in production; memory saver only in tests.",
prod:"This is what makes long-running agents operable: a run that takes four minutes and calls eight tools must survive a pod eviction. Thread-scoped state also gives you per-conversation memory for free.",
qs:[{q:"Design an approval gate for an agent that can issue refunds.",a:"Make refund issuance its own node with interrupt_before, so the graph checkpoints and halts with the proposed action in state. Surface it to a reviewer with the reasoning and evidence, persist the decision with the reviewer identity for audit, and resume the graph on approval. The backend still re-validates permissions and refund limits independently of the model's proposal.",fu:"What if nobody approves for two days?",tip:"TTL on pending approvals plus an escalation path and an expiry state — that operational detail is what senior interviewers listen for."}]},

{t:"Multi-agent architectures", b:["adv","prod","iv","sd"],
table:{head:["Pattern","Shape","Use when","Risk"],rows:[
["Single agent + tools","One loop, many tools","Most tasks; always try first","Tool overload degrades selection"],
["Supervisor / worker","Router delegates to specialists","Clearly separable domains","Supervisor becomes a latency and cost bottleneck"],
["Hierarchical","Supervisors of supervisors","Large task decomposition","Debugging becomes very hard"],
["Network / peer","Agents hand off to each other","Fluid collaboration","Loops, unbounded cost, hardest to reason about"],
["Pipeline","Fixed sequence of specialised steps","Deterministic workflows","Not really an agent — and that is often correct"]]},
prod:"Multi-agent is not automatically better. Each agent adds latency, cost and failure surface. Start with one agent and good tools; split only when a specialist genuinely needs a different prompt, model or permission set.",
qs:[{q:"When do you actually need multiple agents?",a:"When sub-tasks need different system prompts, models, or permission scopes — for example a research agent with read-only web access and a writer agent with no tools at all, or a SQL agent restricted to one schema. If it is just a sequence of steps, a graph of plain functions is cheaper, faster and more reliable than several agents.",fu:"How do you bound a supervisor architecture?",tip:"Total step budget, per-agent step cap, dollar budget per run, and a hard timeout — give the four."}]}]});

MODULES.push({
id:"agents", n:"17", title:"AI Agents", pri:3, tags:["ai","prod","iv"],
intro:"An agent is a loop with tools, memory and a stopping condition. Most interview value is in how you bound it, secure it and observe it.",
topics:[
{t:"What is an AI agent and the agent loop", b:["int","iv","ai"],
what:"A system where the LLM decides which actions to take: observe state → reason → select a tool → execute → observe the result → repeat until the goal is met or a budget is exhausted.",
why:"Use an agent when the required steps are not knowable in advance. If you can draw the flowchart, write the flowchart — it will be faster, cheaper and more reliable.",
how:"Components: a goal, a tool registry with schemas, a controller loop, working memory (the trajectory), long-term memory, a termination condition, and budgets on steps, time and cost.",
flow:[["User goal"],["Plan / reason","what is needed next","amber"],["Select tool + arguments","schema-validated"],["Authorise + execute tool","backend enforces permissions","fire"],["Observe result → update state","teal"],["Done? goal met / budget exhausted"],["Final answer with trace"]],
notwhen:"Do not use an agent for a fixed three-step process, for anything with a hard sub-second latency budget, or where a wrong action is unrecoverable without approval.",
qs:[{q:"Workflow or agent?",a:"Workflow when the steps are known: it is deterministic, cheaper, faster and testable. Agent when the path depends on what is discovered mid-task — open-ended research, triage across unknown systems, debugging. Most production 'agents' are actually workflows with one or two decision points, and that is the correct design.",fu:"How do you decide the boundary in a real product?",tip:"Look at the variance in required steps across real user requests; if 90% take the same path, hard-code it and route the tail to an agent."}]},

{t:"Tool calling and function calling", b:["int","adv","prod","code","iv"],
what:"The model is given tool schemas and returns a structured request to call one with arguments. Your code validates, authorises, executes, and returns the result for the next step.",
how:"Write narrow, well-described tools with typed parameters. Validate arguments with Pydantic. Enforce authorisation inside the tool with the caller's identity. Return compact, structured results — dumping a 50KB JSON blob back into context destroys the budget. Make destructive tools idempotent with a client-supplied key.",
sec:"The model's tool request is a suggestion, not an authorisation. Re-check permissions server-side on every call, restrict the tool surface per user role, allow-list any outbound URL, and never expose a raw SQL or shell tool to model-generated input without a sandbox and a read-only role.",
code:{lang:"python",src:`class RefundArgs(BaseModel):
    order_id: str = Field(pattern=r"^ord_[a-z0-9]{12}$")
    amount_cents: int = Field(gt=0, le=50_000)
    reason: Literal["damaged", "late", "wrong_item", "other"]
    idempotency_key: str

async def issue_refund(args: RefundArgs, principal: Principal) -> dict:
    # 1. authorise independently of the model
    if not principal.can("refund:create"):
        raise Forbidden("refund:create")
    # 2. independent business rules the model cannot override
    order = await orders.get(args.order_id, tenant=principal.tenant_id)
    if args.amount_cents > order.refundable_cents:
        return {"status": "rejected", "reason": "exceeds_refundable"}
    # 3. idempotent side effect
    return await payments.refund(order, args.amount_cents, key=args.idempotency_key)`},
qs:[{q:"An agent decides to delete 400 records. How does your system prevent disaster?",a:"Several independent layers: the tool surface for that role does not include bulk delete; the delete tool caps the batch size and requires an explicit id list, not a filter; destructive actions route through an approval interrupt; every action is authorised server-side against the caller's real permissions; operations are idempotent and audit-logged; and there is a soft-delete plus restore path. The model never holds authority — the code does.",fu:"What do you log?",tip:"Full trace: proposed action, arguments, authorisation decision, approver, result — say 'audit log' explicitly."}]},

{t:"ReAct, planning, reflection and memory", b:["adv","iv"],
what:"ReAct interleaves reasoning traces with actions and observations. Plan-and-execute writes a plan upfront then executes steps. Reflection has the agent critique its own output and retry. Memory spans working (trajectory), episodic (past runs), semantic (facts in a vector store) and procedural (learned patterns).",
how:"ReAct is the default for unpredictable tasks. Plan-and-execute is cheaper and more auditable for longer tasks with knowable structure. Reflection helps on generation quality (code, writing) and wastes money on simple lookups — gate it on a quality score.",
prod:"Memory needs a policy, not just a store: what gets written, who can read it, when it expires, and how a user deletes it. An unbounded memory store becomes a privacy liability and a context-bloat problem simultaneously.",
qs:[{q:"How does an agent remember a user across sessions?",a:"Separate the stores. Short-term is the thread state in the checkpointer. Long-term facts are extracted deliberately (not by dumping transcripts) into a per-user namespace in Postgres or a vector store, retrieved by relevance at the start of a session and injected under a token budget. Every fact carries provenance, a timestamp and a TTL, and is deletable on request.",fu:"What stops memory from degrading answers over time?",tip:"Conflict resolution and recency weighting — say that stale facts must be superseded, not appended."}]},

{t:"Agent security and observability", b:["adv","prod","iv"],
what:"Agents expand the blast radius: they act, they read untrusted content, and they chain steps.",
list:["Least privilege per tool and per role; separate credentials per tool, never a shared admin key.","Treat all tool output and retrieved content as untrusted input — it is the main indirect prompt-injection vector.","Budgets: max steps, wall-clock timeout, max dollars per run, max tool calls per tool.","Human approval gates on destructive or high-value actions.","Sandboxing for code execution: no network, ephemeral filesystem, CPU and memory caps.","Full tracing: every step, prompt, tool call, argument, result, token count and cost, under one trace id.","Loop and repetition detection with a hard stop.","Egress allow-lists so an injected instruction cannot exfiltrate data to an arbitrary URL."],
sec:"The canonical attack: a retrieved document instructs the agent to call the email tool and send the conversation to an external address. Defences are separate credentials, an egress allow-list, approval on outbound communication, and never granting read-sensitive plus send-external in one tool surface.",
qs:[{q:"What is the most dangerous property of an agent system?",a:"That untrusted content enters the same channel as instructions while the agent holds credentials to act. Retrieved text, web pages and tool output can all carry injected instructions, so the fix is architectural: keep authority in code with independent authorisation, apply least privilege per tool, allow-list egress, require approval for irreversible actions, and trace everything for audit.",fu:"How would you test for it?",tip:"Red-team with injected documents in a staging corpus as part of CI — an adversarial eval suite, not a one-off review."}]}]});

MODULES.push({
id:"mcp", n:"18", title:"MCP — Model Context Protocol", pri:2, tags:["ai","prod"],
intro:"A standard protocol for connecting models to tools, data and prompts, so integrations are written once instead of per framework.",
topics:[
{t:"What is MCP and why it exists", b:["int","iv","ai"],
what:"An open protocol defining how an AI application (host/client) discovers and calls capabilities exposed by a server: tools (callable actions), resources (readable data) and prompts (reusable templates).",
why:"Without it, every integration is bespoke per framework and per application — an N×M problem. MCP makes it N+M: write one server for your system, and any compliant client can use it.",
how:"Client and server exchange JSON-RPC messages over a transport (stdio for local processes, HTTP with Server-Sent Events or streamable HTTP for remote). The client discovers capabilities at connect time, presents tools to the model, and executes calls the model requests.",
table:{head:["Primitive","Controlled by","Example"],rows:[
["Tools","The model chooses to call them","create_ticket, run_query, search_docs"],
["Resources","The application selects and supplies them","a file, a table schema, a wiki page"],
["Prompts","The user invokes them","a templated 'review this PR' workflow"]]},
qs:[{q:"What problem does MCP solve?",a:"Integration fragmentation. Previously each AI app implemented its own tool plumbing for every system, so a Jira integration written for one framework was useless in another. MCP standardises discovery and invocation so one server serves any compliant client, which is the same argument as LSP for editors.",fu:"How is it different from OpenAI function calling?",tip:"Function calling is a model-level capability for describing one call; MCP is a transport and discovery protocol between processes. They compose — MCP tools are surfaced to the model as callable functions."}]},

{t:"Architecture, client and server", b:["int","adv","code"],
flow:[["Host application","chat app, IDE, your service"],["MCP client","one connection per server","teal"],["Transport","stdio · HTTP+SSE · streamable HTTP"],["MCP server","exposes tools, resources, prompts","amber"],["Backing system","database, SaaS API, filesystem"]],
code:{lang:"python",src:`from mcp.server.fastmcp import FastMCP

mcp = FastMCP("orders")

@mcp.tool()
async def get_order(order_id: str) -> dict:
    """Fetch one order by id. Read-only."""
    return await db.fetch_order(order_id)

@mcp.resource("schema://orders")
async def orders_schema() -> str:
    """Table schema so the model can write correct queries."""
    return await db.describe("orders")

@mcp.prompt()
def investigate(order_id: str) -> str:
    return f"Investigate order {order_id}: status, payments, shipping, open tickets."

if __name__ == "__main__":
    mcp.run()          # stdio locally; ASGI transport when deployed`},
qs:[{q:"stdio or HTTP transport?",a:"stdio for a local server the host launches as a subprocess — simplest, no network surface, inherits the local user's context. HTTP with SSE or streamable HTTP for a shared remote server that multiple clients use, which then needs authentication, authorisation, rate limiting and TLS like any other service.",fu:"What changes security-wise when you go remote?",tip:"It becomes a public API: per-caller identity, scoped tokens, audit logs, quotas."}]},

{t:"MCP in production: security and operations", b:["adv","prod","iv"],
sec:"Treat an MCP server as a privileged API gateway to a backend system. Requirements: authenticated callers with scoped tokens (OAuth for remote servers), per-tool authorisation against the caller's real identity, input validation on every argument, rate limits and quotas per caller, audit logging of every invocation, and no ambient credentials shared across tenants. Also vet third-party servers before connecting — a malicious or compromised server can return instruction-laden content (tool-description injection) or exfiltrate whatever you pass it.",
prod:"Operational concerns: version the tool surface, keep descriptions stable because they are prompt input, expose health checks, set timeouts on every tool, return compact structured results, and monitor per-tool latency, error rate and call volume. Limit the number of servers connected at once — every tool description consumes context on every request.",
qs:[{q:"You expose an internal MCP server to an AI assistant used by 500 employees. What do you build?",a:"Remote transport behind the standard stack: OAuth with per-user tokens so the server acts as the employee, not as a service account; per-tool scope checks against the user's real permissions; input validation and argument allow-lists; per-user rate limits; audit logs of every call with arguments and result status; timeouts and circuit breakers to the backing systems; and a minimal read-mostly tool surface with writes gated by approval. Plus traces so you can answer who did what through the assistant.",fu:"How do you stop tool-description injection from a third-party server?",tip:"Pin and review server versions, sanitise descriptions, and never let a third-party server's text be treated as instructions — say you would keep it in a data region of the prompt."}]}]});

MODULES.push({
id:"guardrails", n:"19", title:"AI Guardrails & Security", pri:3, tags:["prod","ai"],
intro:"Everything that stands between a model and a security incident. This section is increasingly the differentiator in senior interviews.",
topics:[
{t:"Prompt injection and jailbreaks", b:["adv","prod","iv"],
what:"Direct injection is a user overriding instructions. Indirect injection arrives via retrieved documents, web content or tool output. Jailbreaks manipulate the model into ignoring its safety policy.",
how:"Layered defence: separate instruction and data regions with explicit delimiters and labels; keep privileged operations behind code-side authorisation; least-privilege tool surfaces; input classifiers for known attack patterns; output validation before any action; egress allow-lists; and adversarial test cases in CI.",
mistakes:["Believing a stronger system prompt solves it. Instructions are data to the model; there is no privilege boundary inside the context window — the boundary has to live in your code."],
qs:[{q:"Is prompt injection solvable?",a:"Not fully — it is closer to XSS than to a bug with a patch, because instructions and data share one channel. You reduce it with layered mitigations and, critically, you design so that a successful injection cannot cause damage: no ambient authority, independent authorisation, approval on destructive actions, and restricted egress.",fu:"What is the highest-value single mitigation?",tip:"Least privilege on tools. A compromised prompt with no dangerous capability is an annoyance, not an incident."}]},

{t:"PII, data leakage and redaction", b:["adv","prod","iv"],
what:"Preventing sensitive data from reaching a model, a log, a cache or another tenant.",
how:"Detect and redact on the way in (Presidio, a fine-tuned NER model, or regex for structured identifiers), tokenise-and-restore when the model needs referential consistency, exclude payload content from logs by default, scope every cache key by tenant and permission, and confirm the provider's data-retention and training terms contractually.",
sec:"Three leak paths teams miss: logs and traces capturing full prompts with customer data, a semantic cache shared across tenants, and retrieval without ACL pre-filtering. Audit all three explicitly.",
qs:[{q:"How do you keep customer PII out of a third-party LLM?",a:"Classify and redact before the call, replacing entities with stable placeholders and restoring them after generation so the answer still reads naturally. Keep the mapping in memory or in an encrypted store, never in logs. Choose providers with zero-retention terms or a private deployment (Bedrock, Azure OpenAI in-tenant), and prove it with tests that assert redaction on known patterns.",fu:"What breaks when you redact?",tip:"Some reasoning needs the real values — say you scope redaction by field sensitivity rather than blanket-redacting."}]},

{t:"Input and output validation", b:["int","adv","prod"],
what:"Input guardrails: length and token caps, language and topic checks, injection classifiers, rate limits. Output guardrails: schema validation, PII scan, toxicity and policy checks, groundedness check against retrieved context, and a refusal path.",
prod:"Run cheap deterministic checks synchronously (schema, regex, length) and expensive model-based checks either on a sample or in parallel with a short timeout, because a guardrail that adds 800ms to every request will be switched off by the first latency review.",
code:{lang:"python",src:`async def guarded_answer(req, principal):
    if count_tokens(req.text) > 4000:
        raise HTTPException(413, "input too long")
    if injection_classifier(req.text) > 0.9:
        audit.warn("injection_suspected", principal=principal.id)
        raise HTTPException(400, "request rejected")

    answer = await rag.answer(req.text, principal)

    validated = SupportAnswer.model_validate(answer)          # schema
    if pii_scan(validated.answer).found:
        validated.answer = redact(validated.answer)           # output-side
    if validated.confidence < 0.4 or not validated.citations:
        return REFUSAL                                        # explicit path
    return validated`},
qs:[{q:"Where do you put guardrails so they do not wreck latency?",a:"Deterministic checks inline because they cost microseconds. Model-based checks in parallel with generation where possible, with a timeout and a fail-safe default. Expensive judges asynchronously on a traffic sample for monitoring rather than blocking. And cache guardrail verdicts for repeated inputs.",fu:"Fail open or fail closed?",tip:"Fail closed for safety-critical checks, fail open for quality monitors — and say you decide per check, not globally."}]},

{t:"AuthN, AuthZ, secrets and audit", b:["int","adv","prod","iv"],
what:"Authentication proves identity; authorisation decides permitted actions; secrets management protects credentials; audit logs make actions reconstructable.",
how:"OIDC/JWT for user identity with short expiry and rotation; RBAC or ABAC checked server-side per operation; API keys per client with scopes and quotas; secrets in AWS Secrets Manager, Azure Key Vault or GCP Secret Manager with rotation, injected at runtime, never in images or environment files in the repo; audit logs append-only with actor, action, resource, decision and trace id.",
sec:"For AI systems specifically: document-level ACLs must flow into retrieval filters, per-tool permissions must be checked at execution, and provider API keys must never be reachable from a code-execution sandbox.",
qs:[{q:"Two users share one RAG deployment but must not see each other's documents. Design it.",a:"Identity from the JWT, tenant and group claims resolved server-side. Every chunk carries tenant_id and ACL groups set at ingestion. Retrieval applies those as mandatory pre-filters derived from the token, never from client input. Caches are keyed by tenant plus permission scope. Audit logs record retrieved doc ids per request so a leak is provable or disprovable. For strict isolation, separate collections or databases per tenant so no filter bug can cross the boundary.",fu:"How do you test the isolation?",tip:"An automated cross-tenant probe suite in CI that asserts zero results — concrete and rarely offered."}]},

{t:"Guardrail tooling", b:["int","prod"],
table:{head:["Tool","Role"],rows:[
["Guardrails AI","Declarative input/output validators with retry-on-fail"],
["NVIDIA NeMo Guardrails","Dialogue-level rails: allowed topics, flows, refusal policies"],
["Microsoft Presidio","PII detection, anonymisation and restoration"],
["Provider moderation APIs","Toxicity and policy classification at low cost"],
["Llama Guard / Prompt Guard","Open-weight safety and injection classifiers you can self-host"]]},
qs:[{q:"Build or buy guardrails?",a:"Buy or adopt open source for the commodity parts — PII detection, toxicity, injection classification — because they are well-trained and cheap. Build the parts specific to your domain: business-rule validation, groundedness against your own retrieved context, and your refusal policy. Then own the orchestration and the metrics either way.",fu:"How do you know a guardrail is working?",tip:"Measure it: precision and recall on a labelled adversarial set, tracked over time like any classifier."}]}]});

MODULES.push({
id:"observability", n:"20", title:"LLM Observability", pri:3, tags:["prod"],
intro:"You cannot operate a non-deterministic system without traces. This is the module that separates people who have run AI in production from people who have demoed it.",
topics:[
{t:"Tracing, logging and metrics for LLM systems", b:["int","adv","prod","iv"],
what:"Distributed tracing across the AI pipeline: one trace id spanning retrieval, rerank, prompt assembly, generation, guardrails and tool calls, with spans carrying token counts, model versions and costs.",
why:"A failure is semantic, not an exception. To debug 'this answer was wrong' you need the exact query, retrieved chunk ids and scores, the rendered prompt, the prompt version, the model version, and the raw response. Without those you are guessing.",
list:["Latency per stage and end to end, at p50/p95/p99 — plus time-to-first-token separately, since that is what users feel.","Tokens in/out per request, per model, per tenant, per feature.","Cost per request and per tenant, with a daily budget alert.","Error and timeout rate per provider, and fallback activation rate.","Retrieval quality: score distribution, empty-result rate, refusal rate.","Answer quality from sampled judges and user feedback.","Cache hit rate for exact and semantic caches.","Guardrail trigger rate by type."],
prod:"Standardise on OpenTelemetry semantics so LLM spans join your existing APM traces. Redact payloads by default and keep full-content capture behind an explicit, time-bounded, audited flag.",
qs:[{q:"What do you log on every LLM request?",a:"Trace id, tenant and user id (hashed if needed), feature, prompt version, model and model version, decoding parameters, retrieved doc ids with scores, token counts in and out, cost, latency per stage, guardrail verdicts, tool calls with outcomes, and a pointer to the response. Content itself is redacted or sampled depending on the data-handling policy.",fu:"How do you attribute cost to a customer?",tip:"Tenant id on every span plus token accounting in the gateway — say the gateway is where cost is authoritative."}]},

{t:"Cost and token monitoring", b:["adv","prod","iv"],
how:"Meter tokens in the LLM gateway, not in application code, so every path is counted. Attribute by tenant, feature and model. Enforce per-tenant and per-key quotas. Alert on daily spend anomalies and on unusual output-token growth, which usually signals a prompt regression or an agent loop.",
cost:"Levers in order of usual impact: semantic and prompt caching; model routing (cheap model for easy requests); output-token limits; prompt compression and context trimming; batch anything not user-facing; and only then negotiate provider pricing or self-host.",
qs:[{q:"Your LLM bill tripled last week with flat traffic. How do you find it?",a:"Break spend down by feature, model and tenant from gateway metering. Typical causes: a prompt change that grew context (often added few-shot examples or unbounded history), an agent loop retrying, a cache hit-rate collapse after a key change, a model routing change, or one tenant abusing the endpoint. The cost dashboard with those dimensions turns it into a five-minute query instead of a week.",fu:"What would have prevented it?",tip:"Per-tenant quotas, output token caps, and a cost regression check in the eval gate — prevention, not just detection."}]},

{t:"Tooling and quality monitoring", b:["int","prod"],
table:{head:["Tool","Strength"],rows:[
["LangSmith","Deep LangChain/LangGraph tracing, datasets, experiments, prompt versions"],
["Langfuse","Open source, self-hostable, tracing + prompt management + cost and score analytics"],
["Arize Phoenix","Evaluation and drift analysis, embedding visualisation"],
["OpenTelemetry + Grafana/Datadog","Vendor-neutral spans joined with the rest of your APM"],
["MLflow","Experiment and model-version tracking, increasingly LLM-aware"]]},
prod:"Wire user feedback (thumbs, corrections, escalations) back onto the trace id. That link is what turns complaints into eval cases automatically, and it is the cheapest quality flywheel available.",
qs:[{q:"How do you detect answer-quality regression in production?",a:"Three signals combined: an async LLM judge scoring faithfulness and relevancy on a sampled slice, user feedback and escalation rates joined by trace id, and proxy signals like refusal rate, retrieval score distribution and output length. Alert on sustained deviation from a baseline window, then reproduce against the offline eval set to confirm and bisect by prompt or model version.",fu:"Why not judge every request?",tip:"Cost and latency — sampling at 1–5% is statistically sufficient for trend detection. Say the number."}]}]});
