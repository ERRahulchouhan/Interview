B("SystemDesign","prod",1,"🔥 Design a cost-controlled AI platform for 50 internal teams.","A central LLM gateway with virtual keys, per-team quotas and spend caps, model aliases, caching and token metering; a shared retrieval service; a prompt registry; an eval service; plus per-team cost dashboards and chargeback.","Governance is the design: without a gateway, 50 teams each hold provider keys and nobody can attribute or cap spend.","A team's key hard-capped at a monthly budget with soft throttling and an alert at 80%.","Make cost visible to the team that causes it — attribution changes behaviour faster than any technical control.","How do you stop the gateway becoming the bottleneck?","'Make cost visible to the team that causes it' is the organisational insight that lands."),
B("SystemDesign","adv",0,"What trade-offs would you state unprompted in an AI design round?","Retrieval versus long context; managed model versus self-hosted; quantisation recall loss versus memory saving; refusal rate versus coverage; ingestion cost versus query cost; and multi-agent flexibility versus debuggability.","Interviewers score explicit trade-off reasoning. Stating what you gave up, and why, is stronger than presenting a design as optimal.","'I chose contextual retrieval: higher ingestion cost, lower query cost, correct because queries outnumber ingestions by a thousand to one.'","Every production system is a set of deliberate compromises; being able to name yours is the core senior skill.","Which trade-off would you revisit at 10× scale?","Volunteering trade-offs is the single highest-scoring behaviour in a design round.");

function catForModule(m) {

  if (m.id === "rag" || m.id === "rag-eval" || m.id === "vectordb" || m.id === "embeddings") return "RAG";
  if (t.indexOf("ai") >= 0) return "LLM";
  return "AI";
}

/* ---------- search index ---------- */
const INDEX = [];
MODULES.forEach(m => {
  INDEX.push({ g: "Modules", label: "MODULE " + m.n + " — " + m.title, sub: m.intro, route: "#/m/" + m.id, text: (m.title + " " + m.intro + " " + (m.topics || []).map(t => t.t).join(" ")).toLowerCase() });
  (m.topics || []).forEach(t => {
    const body = [t.what, t.why, t.how, t.when, t.notwhen, t.ex, t.prod, t.sec, t.cost, t.perf, (t.list || []).join(" "), (t.brief || []).map(x => x.join(" ")).join(" ")].filter(Boolean).join(" ");
    INDEX.push({ g: "Topics", label: t.t, sub: "Module " + m.n + " · " + m.title, route: "#/m/" + m.id + "|" + slug(t.t), text: (t.t + " " + body).toLowerCase() });
  });
});
DESIGNS.forEach(d => INDEX.push({ g: "System designs", label: d.name, sub: "Module 31 · case study", route: "#/designs|" + d.id, text: (d.name + " " + (d.req || "") + " " + (d.arch ? d.arch.map(a => a[0]).join(" ") : "") + " " + (d.brief ? d.brief.map(b => b.join(" ")).join(" ") : "")).toLowerCase() }));
ALLQ.forEach(q => INDEX.push({ g: "Interview questions", label: q.q, sub: q.topicLabel + " · " + DIFF_LABEL[q.diff], route: q.route + "|" + q.id, text: (q.q + " " + q.short + " " + (q.detail || "")).toLowerCase() }));
CHEATS.forEach(c => INDEX.push({ g: "Cheat sheets", label: c.title + " cheat sheet", sub: c.note, route: "#/cheats", text: (c.title + " " + c.steps.join(" ") + " " + c.note).toLowerCase() }));
INDEX.push({ g: "Cheat sheets", label: "Cloud service equivalents (AWS ↔ Azure ↔ GCP)", sub: "Side-by-side mapping", route: "#/cheats", text: "cloud equivalents aws azure gcp mapping comparison" });
PLAN.forEach((p, i) => INDEX.push({ g: "30-day plan", label: p.d + " — " + p.title, sub: p.detail.slice(0, 90), route: "#/plan", text: (p.d + " " + p.title + " " + p.detail).toLowerCase() }));

function searchIndex(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const out = [];
  for (const it of INDEX) {
    let sc = 0, ok = true;
    for (const t of terms) {
      const inLabel = it.label.toLowerCase().indexOf(t) >= 0;
      const inText = it.text.indexOf(t) >= 0;
      if (!inLabel && !inText) { ok = false; break; }
      sc += inLabel ? 10 : 1;
    }
    if (ok) out.push({ it: it, sc: sc + (it.g === "Modules" ? 5 : 0) });
  }
  out.sort((a, b) => b.sc - a.sc);
  return out.slice(0, 40).map(x => x.it);
}

function fieldsFor(t) {
  const F = [["what", "What is it?"], ["why", "Why do we need it?"], ["how", "How does it work?"],
  ["when", "When to use it"], ["notwhen", "When NOT to use it"], ["ex", "Real-world example"],
  ["complexity", "Complexity"], ["perf", "Performance considerations"], ["sec", "Security considerations"],
  ["cost", "Cost considerations"], ["mistakes", "Common mistakes"]];
  let h = "";
  F.forEach(([k, label]) => {
    if (!t[k]) return;
    if (k === "mistakes") { h += `<div class="field"><span class="k">${label}</span><ul class="tight">${t[k].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`; return; }
    h += `<div class="field"><span class="k">${label}</span>${esc(t[k])}</div>`;
  });
  if (t.flow) h += flowHTML(t.flow);
  if (t.side) h += sidecarHTML(t.side);
  if (t.table) h += tableHTML(t.table);
  if (t.list) h += `<div class="field"><span class="k">Key points</span><ul class="tight">${t.list.map(x => `<li>${markFire(x)}</li>`).join("")}</ul></div>`;
  if (t.brief) h += t.brief.map(b => `<div class="field"><span class="k">${esc(b[0])}</span>${esc(b[1])}</div>`).join("");
  if (t.prod) h += `<div class="field hl"><span class="k">🔥 Production usage</span>${esc(t.prod)}</div>`;
  if (t.adv || t.dis) {
    h += `<div class="pro-con">` +
      (t.adv ? `<div class="pro"><h4>Advantages</h4><ul class="tight">${t.adv.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "") +
      (t.dis ? `<div class="con"><h4>Disadvantages</h4><ul class="tight">${t.dis.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "") + `</div>`;
  }
  if (t.code) h += codeBlock(t.code);
  if (t.qs) h += t.qs.map(q => qCardHTML(QBYID[hash(q.q)] || { id: hash(q.q), q: q.q, short: q.a, fu: q.fu, tip: q.tip, diff: "int", topicLabel: "" })).join("");
  return h;
}
function markFire(s) {

        const hl2 = (k === "sec" || k === "fail" || k === "cost") ? " hl" : "";
        body += `<div class="sd-step"><div class="sn">Step ${i + 1}</div><h4>${label}</h4><div class="field${hl2}">${esc(d[k])}</div></div>`;
      });
    }
    if (d.qs) body += `<div class="sd-step"><div class="sn">Step 18</div><h4>Interview questions</h4>${d.qs.map(q => qCardHTML(QBYID[hash(q.q)] || { id: hash(q.q), q: q.q, short: q.a, fu: q.fu, tip: q.tip, diff: "prod", topicLabel: "System Design" })).join("")}</div>`;
    return `<details class="acc" id="${d.id}">
      <summary><span class="sumtitle"><span>${esc(d.name)}</span>${badges(d.b)}</span><span class="chev">›</span></summary>
      <div class="acc-body">${body}</div></details>`;
  }).join("");
  setMain(h, DESIGNS.map(d => [d.id, d.name]));
  if (anchor) { const el = document.getElementById(anchor); if (el) { el.open = true; setTimeout(() => el.scrollIntoView({ block: "start" }), 60); } }
}

/* ================= RENDER: QUESTION BANK ================= */
const FILTERS = { diff: "", cat: "", cloud: "", topic: "", prodOnly: false, starOnly: false, markOnly: false, q: "" };
function filteredQ() {
  return ALLQ.filter(q => {
    if (FILTERS.diff && q.diff !== FILTERS.diff) return false;
    if (FILTERS.cat && q.cat !== FILTERS.cat) return false;
    if (FILTERS.cloud && q.topic !== FILTERS.cloud) return false;
    if (FILTERS.topic && q.topic !== FILTERS.topic) return false;
    if (FILTERS.prodOnly && q.diff !== "prod") return false;
    if (FILTERS.starOnly && !q.star) return false;
    if (FILTERS.markOnly && !ST.marks[q.id]) return false;
    if (FILTERS.q) {
      const t = FILTERS.q.toLowerCase();
      if ((q.q + " " + q.short + " " + (q.detail || "")).toLowerCase().indexOf(t) < 0) return false;
    }
    return true;

}

/* ================= RENDER: MOCK ================= */
const MOCK = { role: "AI Engineer", level: "Mid-level", set: [], i: 0, shown: false, started: false };
function buildMock() {
  const topics = MOCK_ROLES[MOCK.role], diffs = MOCK_LEVELS[MOCK.level];
  let pool = ALLQ.filter(q => topics.indexOf(q.topic) >= 0 && diffs.indexOf(q.diff) >= 0);
  if (pool.length < 8) pool = ALLQ.filter(q => topics.indexOf(q.topic) >= 0);
  // one pass per topic in order, then shuffle within
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  const picked = [], perTopic = {};
  shuffled.forEach(q => {
    perTopic[q.topic] = perTopic[q.topic] || 0;
    if (perTopic[q.topic] < 3 && picked.length < 12) { picked.push(q); perTopic[q.topic]++; }
  });
  MOCK.set = picked; MOCK.i = 0; MOCK.shown = false; MOCK.started = true;
}
function renderMock() {
  let h = `<div class="page-head"><div class="eyebrow">Practice under pressure</div><h1>Mock interview</h1>

  </div>`;
  if (MOCK.started && MOCK.set.length) {
    const q = MOCK.set[MOCK.i];
    const pct = Math.round((MOCK.i) / MOCK.set.length * 100);
    h += `<div style="margin-top:14px"></div><div class="card"><div class="prog-row">
      <div class="top"><span>${esc(MOCK.role)} · ${esc(MOCK.level)}</span><b>Question ${MOCK.i + 1} of ${MOCK.set.length}</b></div>
      <div class="bar"><i data-w="${pct}"></i></div></div></div>`;
    h += `<div class="stage" style="margin-top:14px">
      <div class="badges">${badge(q.diff)}<span class="badge">${esc(q.topicLabel)}</span>${q.star ? '<span class="badge b-int-v">⭐ MUST KNOW</span>' : ""}</div>
      <div class="qtext">${esc(q.q)}</div>
      <p class="tiny muted">Think it through out loud. Structure: what → why → how → example → production → trade-off.</p>
      <div ${MOCK.shown ? "" : "hidden"}>
        <div class="hr" style="margin:14px 0"></div>
        <div class="field q"><span class="k">Short interview answer</span>${esc(q.short)}</div>
        ${q.detail ? `<div class="field"><span class="k">Detailed explanation</span>${esc(q.detail)}</div>` : ""}
        ${q.prod ? `<div class="field hl"><span class="k">🔥 Production usage</span>${esc(q.prod)}</div>` : ""}
        ${q.fu ? `<div class="field"><span class="k">Follow-up they will ask</span>“${esc(q.fu)}”</div>` : ""}
        ${q.tip ? `<div class="notice">🎯 <b>Interview tip:</b> ${esc(q.tip)}</div>` : ""}
      </div>
      <div class="ctrlrow">
        <button class="btn primary" data-mk="toggle">${MOCK.shown ? "Hide answer" : "Show answer"}</button>

/* ================= MAIN / TOC ================= */
function setMain(html, toc) {
  const m = $("#main"); m.innerHTML = html; m.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: "auto" });
  const t = $("#toc");
  if (!toc || !toc.length) { t.innerHTML = ""; return; }
  t.innerHTML = `<h5>On this page</h5>` + toc.map(([id, label]) => `<a href="#${id}" data-toc="${id}">${esc(label)}</a>`).join("");
}
$("#toc").addEventListener("click", e => {
  const a = e.target.closest("a[data-toc]"); if (!a) return;
  e.preventDefault();
  const el = document.getElementById(a.dataset.toc);
  if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({ block: "start" }); }
  $$("#toc a").forEach(x => x.classList.remove("active")); a.classList.add("active");
});

/* ================= ROUTER ================= */
function route() {
  const raw = (location.hash || "#/dashboard").slice(1);
  const [path, anchor] = raw.split("|");
  const parts = path.split("/").filter(Boolean);
  const page = parts[0] || "dashboard";
  markNav("#/" + parts.join("/"));
  if (page === "m") { markNav("#/m/" + parts[1]); return renderModule(parts[1], anchor); }
  switch (page) {
    case "designs": markNav("#/designs"); return renderDesigns(anchor);
    case "questions": markNav("#/questions"); renderQuestions(); return jump(anchor);
    case "top100": return renderTop100(), jump(anchor);
    case "interview": if (anchor && QBYID[anchor]) { IV.pool = ivPool(); const i = IV.pool.findIndex(x => x.id === anchor); if (i >= 0) IV.i = i; } return renderInterview();
    case "mock": return renderMock();
    case "roadmap": return renderRoadmap();
    case "plan": return renderPlan();
    case "cheats": return renderCheats();
    default: markNav("#/dashboard"); return renderDashboard();
  }
}
function jump(anchor) {
  if (!anchor) return;
  const el = document.getElementById(anchor);
  if (el) {
    const body = $(".qbody", el); if (body) { body.hidden = false; $(".qhead", el).setAttribute("aria-expanded", "true"); }
    setTimeout(() => el.scrollIntoView({ block: "center" }), 60);
  }
}
window.addEventListener("hashchange", route);

/* ================= DELEGATED EVENTS ================= */
document.addEventListener("click", e => {
  const t = e.target;

  // accordion / question toggles
  const th = t.closest("[data-toggle]");
  if (th) {
    const body = th.parentElement.querySelector(".qbody");
    const open = body.hidden;
    body.hidden = !open; th.setAttribute("aria-expanded", String(open));
    return;
  }
  // expand all / none
  const ex = t.closest("[data-expand]");
  if (ex) { $$("#main details.acc").forEach(d => { d.open = ex.dataset.expand === "all"; }); return; }

  // copy code
  const cp = t.closest("[data-copy]");
  if (cp) {
    const code = cp.parentElement.querySelector("code").innerText;
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast("Code copied")).catch(() => toast("Copy blocked by the browser"));
    else toast("Copy not available in this browser");
    return;
  }
  // done / bookmark on cards
  const dn = t.closest("[data-done]");
  if (dn) {
    const id = dn.dataset.done;
    if (ST.done[id]) delete ST.done[id]; else ST.done[id] = true;
    save(); dn.textContent = ST.done[id] ? "✓ Completed" : "Mark as completed";
    const card = document.getElementById(id); if (card) card.classList.toggle("done", !!ST.done[id]);
    toast(ST.done[id] ? "Marked complete" : "Marked not complete");
    return;
  }
  const mk = t.closest("[data-mark]");
  if (mk) {
    const id = mk.dataset.mark;
    if (ST.marks[id]) delete ST.marks[id]; else ST.marks[id] = true;
    save(); mk.textContent = ST.marks[id] ? "🔖 Remove bookmark" : "Bookmark";
    toast(ST.marks[id] ? "Bookmarked" : "Bookmark removed");
    return;
  }
  // question bank filters
  const f = t.closest("[data-f]");
  if (f) {
    const k = f.dataset.f;
    if (k === "reset") { FILTERS.diff = FILTERS.cat = FILTERS.cloud = FILTERS.topic = ""; FILTERS.prodOnly = FILTERS.starOnly = FILTERS.markOnly = false; }
    else if (k === "prodOnly" || k === "starOnly" || k === "markOnly") FILTERS[k] = !FILTERS[k];
    else FILTERS[k] = f.dataset.v;
    renderQuestions(); return;
  }
  // interview mode
  const iv = t.closest("[data-iv]");
  if (iv) {
    const k = iv.dataset.iv;
    if (k === "prodOnly") IV.prodOnly = !IV.prodOnly; else IV[k] = iv.dataset.v;
    IV.i = 0; IV.shown = false; renderInterview(); return;
  }
  const ia = t.closest("[data-ivact]");
  if (ia) { ivAction(ia.dataset.ivact); return; }
  // mock
  const mkq = t.closest("[data-mk]");
  if (mkq) {
    const k = mkq.dataset.mk;
    if (k === "role" || k === "level") { MOCK[k] = mkq.dataset.v; if (MOCK.started) buildMock(); }
    else if (k === "start") buildMock();
    else if (k === "toggle") MOCK.shown = !MOCK.shown;
    else if (k === "next") { if (MOCK.i < MOCK.set.length - 1) { MOCK.i++; MOCK.shown = false; } else toast("Set finished — generate a new one"); }
    else if (k === "prev") { if (MOCK.i > 0) { MOCK.i--; MOCK.shown = false; } }
    else if (k === "done") { const id = MOCK.set[MOCK.i].id; if (ST.done[id]) delete ST.done[id]; else ST.done[id] = true; save(); }
    renderMock(); return;
  }
  // plan checkbox handled on change
  // search result
  const res = t.closest(".res");
  if (res) { closeResults(); $("#search").value = ""; location.hash = res.dataset.route; return; }

  if (t.closest("#menuBtn")) { $("#rail").classList.contains("open") ? closeRail() : openRail(); return; }
  if (t.id === "scrim") { closeRail(); return; }
  if (t.closest("#themeBtn")) { setTheme(ST.theme === "dark" ? "light" : "dark"); return; }
  if (!t.closest(".searchwrap")) closeResults();
});

document.addEventListener("change", e => {
  const p = e.target.closest("[data-plan]");
  if (p) {
    const i = p.dataset.plan;
    if (p.checked) ST.plan[i] = true; else delete ST.plan[i];
    save(); renderPlan();
  }
});

function ivAction(a) {
  const q = IV.pool[IV.i];
  if (a === "toggle") IV.shown = !IV.shown;
  else if (a === "next") { IV.i = (IV.i + 1) % IV.pool.length; IV.shown = false; }
  else if (a === "prev") { IV.i = (IV.i - 1 + IV.pool.length) % IV.pool.length; IV.shown = false; }
  else if (a === "random") { IV.i = Math.floor(Math.random() * IV.pool.length); IV.shown = false; }
  else if (a === "done" && q) { if (ST.done[q.id]) delete ST.done[q.id]; else ST.done[q.id] = true; save(); }
  else if (a === "mark" && q) { if (ST.marks[q.id]) delete ST.marks[q.id]; else ST.marks[q.id] = true; save(); }
  renderInterview();
}

/* ================= SEARCH ================= */
const sInput = $("#search"), sBox = $("#results");
let sel = -1, current = [];
function closeResults() { sBox.hidden = true; sInput.setAttribute("aria-expanded", "false"); sel = -1; }
function highlight(text, q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  let out = esc(text);
  terms.forEach(t => {
    if (!t) return;
    out = out.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>");
  });
  return out;
}
function doSearch() {
  const v = sInput.value.trim();
  if (v.length < 2) { closeResults(); return; }
  current = searchIndex(v);
  if (!current.length) {
    sBox.innerHTML = `<div class="res-group">No matches</div><div class="res" style="cursor:default">Try a shorter term, like “RAG”, “HNSW”, “Kafka” or “latency”.</div>`;
    sBox.hidden = false; return;
  }
  const groups = {};
  current.forEach(it => { (groups[it.g] = groups[it.g] || []).push(it); });
  let h = "";
  ["Modules", "Topics", "System designs", "Interview questions", "Cheat sheets", "30-day plan"].forEach(g => {
    if (!groups[g]) return;
    h += `<div class="res-group">${g} · ${groups[g].length}</div>`;
    h += groups[g].slice(0, 8).map(it => `<button class="res" data-route="${it.route}">${highlight(it.label, v)}<small>${esc(it.sub || "")}</small></button>`).join("");
  });
  sBox.innerHTML = h; sBox.hidden = false; sInput.setAttribute("aria-expanded", "true"); sel = -1;
}
let sT;
sInput.addEventListener("input", () => { clearTimeout(sT); sT = setTimeout(doSearch, 110); });
sInput.addEventListener("keydown", e => {
  const items = $$(".res[data-route]", sBox);
  if (e.key === "Escape") { closeResults(); sInput.blur(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!items.length) return; e.preventDefault();
    sel = e.key === "ArrowDown" ? Math.min(sel + 1, items.length - 1) : Math.max(sel - 1, 0);
    items.forEach((x, i) => x.classList.toggle("sel", i === sel));
    items[sel].scrollIntoView({ block: "nearest" });
  }
  if (e.key === "Enter") {
    const target = sel >= 0 ? items[sel] : items[0];
    if (target) { location.hash = target.dataset.route; sInput.value = ""; closeResults(); sInput.blur(); }
  }
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); sInput.focus(); return; }
  if (typing) return;
  if (location.hash.indexOf("#/interview") === 0) {
    if (e.key === "ArrowRight") { e.preventDefault(); ivAction("next"); }
    if (e.key === "ArrowLeft") { e.preventDefault(); ivAction("prev"); }
    if (e.key === " ") { e.preventDefault(); ivAction("toggle"); }
    if (e.key === "r" || e.key === "R") ivAction("random");
  }
});

/* ================= THEME ================= */
function setTheme(t) {
  ST.theme = t; save();
  document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
  $("#themeBtn").textContent = t === "dark" ? "◐" : "◑";
}

/* ================= BOOT ================= */
setTheme(ST.theme);
buildRail();
if (!location.hash) location.hash = "#/dashboard";
route();
})();
</script>
