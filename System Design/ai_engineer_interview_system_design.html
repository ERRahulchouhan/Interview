id:"best-practices", n:"34", title:"Production Best Practices", pri:3, tags:["prod"],
intro:"Each item below is marked production-critical because each one has taken a real AI system down or blown its budget.",
topics:[
{t:"Reliability and resilience", b:["adv","prod"],
list:["Timeouts on every outbound call, with the sum below the client-facing limit. 🔥","Retries only for idempotent operations, with exponential backoff and jitter, and a capped attempt budget. 🔥","Circuit breakers per dependency so a dead provider stops consuming capacity. 🔥","Fallback chain: secondary provider → smaller model → cached answer → honest degraded message. 🔥","Bulkheads: separate connection pools and thread budgets per dependency. 🔥","Idempotency keys on every write and every billable action. 🔥","Graceful shutdown that drains in-flight streams before exit. 🔥","Load shedding with 429 and Retry-After before the system collapses. 🔥"],
qs:[{q:"What is your retry policy for an LLM call?",a:"Retry only on 429, 5xx and network timeouts — never on 400-class errors, which will fail identically. Exponential backoff with full jitter, maximum two or three attempts, honouring Retry-After when present, with a total request deadline that the retries must fit inside. Beyond that, the circuit breaker takes over and routes to the fallback.",fu:"Why jitter?",tip:"To avoid synchronised retry storms across all clients after a provider blip — say 'thundering herd'."}]},

{t:"Latency and scaling", b:["adv","prod"],
list:["Stream responses; optimise time-to-first-token separately from total latency. 🔥","Stateless services so horizontal scaling is trivial; all state in Redis/Postgres. 🔥","Autoscale on concurrency or queue depth, never CPU, for I/O-bound AI services. 🔥","Async everything the user is not waiting for: ingestion, evals, notifications, re-indexing. 🔥","Cap rerank depth and retrieval k; measure the quality gain per added candidate.","Connection pooling with PgBouncer; monitor pool wait time. 🔥","Parallelise independent stages (dense and lexical retrieval, guardrail checks) with asyncio.gather.","Warm minimum replicas for GPU workloads because cold starts take minutes. 🔥"],
qs:[{q:"p95 latency is 8 seconds and users are complaining. Where do you look, in order?",a:"Break latency down by stage from traces first — guessing is the mistake. Usual order of culprits: generation output length (cap max_tokens and stream), rerank depth, sequential calls that could be parallel, retrieval with post-filtering forcing huge over-fetch, cold starts, and event-loop blocking. Then fix the largest contributor and re-measure rather than optimising everything.",fu:"What if generation itself is the bottleneck?",tip:"Streaming plus a smaller model for the easy majority via routing — and mention that TTFT is what users actually perceive."}]},

{t:"Cost optimisation", b:["adv","prod"],
list:["Semantic + exact caching: usually the single largest saving available. 🔥","Model routing: cheap model by default, escalate on confidence or complexity. 🔥","Prompt caching: keep the stable prefix first to maximise provider cache hits. 🔥","Hard caps on max output tokens per endpoint. 🔥","Token budgeting for context: summarise history, cap retrieved chunks. 🔥","Batch offline work (embedding, evals, enrichment) on spot or preemptible capacity. 🔥","Per-tenant quotas and budget alarms so one user cannot drain the month. 🔥","Right-size embeddings: 768 dims and quantisation instead of 3,072 where recall allows.","Self-host high-volume small models (embedding, reranking) on CPU/GPU once volume justifies it."],
cost:"Order of magnitude matters: caching and routing typically cut 40–70% of spend; dimension reduction and quantisation cut storage several-fold; negotiating provider rates is the last and smallest lever.",
qs:[{q:"Cut our LLM spend by half without hurting quality. How?",a:"Measure first: spend by feature, tenant and model. Then, in order of impact — raise cache hit rate with a well-tuned semantic cache; route the easy majority of traffic to a cheaper model with escalation on low confidence; restructure prompts so the stable prefix is cacheable by the provider; cap output tokens; trim retrieved context to what reranking says is relevant; and move all non-interactive work to batch. Each change goes through the eval gate so quality is verified, not assumed.",fu:"How do you prove quality did not drop?",tip:"The offline eval suite plus an online sampled judge, compared against the pre-change baseline — cite the metrics."}]},

{t:"Security, quality and operations", b:["adv","prod"],
list:["Authentication on every endpoint; authorisation checked server-side per action. 🔥","Document-level ACLs enforced as mandatory retrieval pre-filters. 🔥","Tenant-scoped cache keys. 🔥","Secrets from a manager with rotation; never in images or repos. 🔥","PII redaction before external calls; payload redaction in logs by default. 🔥","Input and output guardrails with measured precision and recall. 🔥","Least-privilege tool surfaces for agents; approval gates on destructive actions. 🔥","Prompt and model versions pinned and logged on every request. 🔥","Offline eval suite as a CI gate; online judge on a traffic sample. 🔥","Full tracing with cost attribution; dashboards and alerts with runbooks. 🔥","Rebuildable indexes: raw documents in object storage as the source of truth. 🔥","Canary deploys and one-flip rollback for prompts, models and code. 🔥"],
qs:[{q:"If you could only implement three of these on day one, which?",a:"Per-request tracing with prompt and model versions, because nothing else is debuggable without it. Server-side authorisation including retrieval ACL filters, because a leak is unrecoverable reputationally. And a small offline eval set with a CI gate, because it is what lets you change anything afterwards with confidence. Caching and routing come next, but they are optimisations — these three are the foundation.",fu:"Why not guardrails in the first three?",tip:"Be honest: for an internal tool, tracing and authz matter more; for a public consumer product, guardrails move into the top three. Context-dependent answers score well."}]}]});

qs:[{q:"How do you keep time-to-first-token under 800ms?",a:"Do as little as possible before the first token: assemble context from Redis rather than querying Postgres, run input guardrails as cheap deterministic checks or in parallel, skip retrieval unless the turn needs it, stream from the provider immediately, and keep the gateway hop thin. Everything else — persistence, analytics, title generation, deep moderation — happens after the stream starts.",fu:"What if guardrails need a model call?",tip:"Run it in parallel with generation and interrupt the stream if it trips; say you would rather cut a stream than delay every response."}]},

{id:"enterprise-rag", name:"Enterprise RAG chatbot over 10M documents", pri:3, b:["adv","sd","prod","ai","iv"],
req:"Answer employee questions grounded in internal documents with citations, respecting per-document permissions from the identity provider. Support SharePoint, Confluence, Drive and PDFs. Non-functional: p95 under 4s, faithfulness above 0.85, zero cross-permission leakage, documents searchable within 15 minutes of publication.",
scale:"10M documents, average 50 chunks → 500M chunks. 20k employees, 5 queries/day ≈ 100k queries/day ≈ 1.2 QPS average, 20 QPS peak. 5% of the corpus changes weekly ≈ 500k documents/week ≈ 25M chunks re-embedded weekly. Vector storage at 768 dims float32 ≈ 1.5TB raw, reduced ~4× with scalar quantisation.",
arch:[["Connectors (SharePoint, Confluence, Drive)","incremental sync + ACL sync"],["Kafka doc.changed","teal"],["Parse workers","layout-aware, OCR, tables"],["Chunk + contextualise","heading path + doc summary prefix","amber"],["Embed workers","batched, spot GPUs"],["Vector DB (sharded) + BM25 index","ACL fields indexed","teal"],["— query path —"],["API + auth","Entra/Okta groups resolved server-side","fire"],["Semantic cache (scope-keyed)","teal"],["Query rewrite (history-aware)","amber"],["Hybrid retrieve, ACL pre-filtered, k=50","teal"],["RRF → cross-encoder rerank → top 5","amber"],["Relevance floor → refuse or generate","fire"],["LLM with citation contract","amber"],["Groundedness check + response"]],
api:"POST /v1/ask {question, conversation_id?} → streamed answer with citations [{doc_id, title, url, page, score}]. GET /v1/documents/{id}/status for indexing state. POST /v1/feedback {trace_id, verdict, comment}. Admin: POST /v1/reindex {source, since}. Every response carries trace_id.",
db:"Postgres: documents(id, source, external_id, version, title, url, effective_date, acl_groups[], content_hash, indexed_at), chunks(id, doc_id, ordinal, text, breadcrumb, page), feedback(trace_id, verdict, comment), sync_state(source, cursor). Chunk text lives in Postgres for parent expansion; vectors in the vector store keyed by chunk id.",
cache:"Three layers: exact-match answer cache keyed by hash(normalised query + model + prompt version + ACL scope); semantic cache over query embeddings within the same ACL scope at a high similarity threshold; and rerank result caching per (query, candidate set). Invalidation on document change via the doc.changed topic — any cached answer citing a changed doc is evicted.",
async:"Entire ingestion pipeline is event-driven and idempotent on content hash. Separate consumer groups for embedding, entity extraction and analytics so a backfill never starves live updates. ACL changes are their own event type and update chunk metadata without re-embedding.",
llm:"Single frontier model for generation with a cheaper model for query rewriting and grading. Strict prompt contract: answer only from context, cite doc ids, refuse when insufficient. Prompt versioned and logged. Output token cap. Fallback to a second provider on failure.",
rag:"Hybrid retrieval (dense + BM25) with RRF, contextual retrieval at ingestion (each chunk prefixed with a document-situating sentence), cross-encoder reranking, MMR for diversity, parent-chunk expansion for context, and a relevance floor that triggers refusal with the closest passages. Corrective loop: one rewrite-and-retry when the grader says the context is ambiguous.",
vdb:"Sharded by tenant or department with HNSW plus scalar quantisation; ACL groups and effective_date as indexed filterable payload fields with pre-filtering. Over-fetch 4× before reranking. Index rebuildable from object storage plus Postgres, which is what makes embedding-model upgrades feasible.",
sec:"ACL groups come from the identity provider token, never the client. Mandatory pre-filter on every query. Separate collections for the most sensitive classifications so a filter bug cannot cross that boundary. Cross-tenant probe tests in CI. Audit log of retrieved doc ids per request. PII handling per data classification, and provider selection constrained by data residency.",
mon:"Retrieval score distribution, empty-result and refusal rates, faithfulness on a sampled slice, context recall on the golden set nightly, ingestion lag per source, DLQ depth, cost per department, p95 by stage, and an alert on the rate of queries whose top rerank score falls below the floor (the coverage-gap signal).",
fail:"Retrieval failure → refuse rather than answer ungrounded. Reranker down → fall back to fused retrieval order with a raised relevance floor. Vector store shard down → degraded recall with a banner, since partial results beat an outage. Provider down → fallback chain. Ingestion failures → DLQ with alerting and replay after fix.",
scaling:"Query path scales horizontally and is cheap. The expensive scaling is ingestion: autoscale embedding workers on Kafka lag, use spot GPU or batch capacity, and shard the vector index by department with scatter-gather plus heap merge. Re-embedding 25M chunks weekly is a scheduled batch on preemptible capacity.",
cost:"Dominant costs are embedding at ingestion and generation at query time. Levers: contextual retrieval done once at ingestion rather than per query, 768-dim quantised vectors, semantic caching (typically 25–40% hit rate on internal help queries), reranking to shrink generated context, and batch re-embedding on spot instances.",
trade:"Contextual retrieval raises ingestion cost to lower query cost — right, because queries outnumber ingestions. Quantisation trades a small recall loss for a 4× memory saving, recovered by over-fetching and reranking. Refusal over guessing trades answer coverage for trust, which is correct in an enterprise setting. Eventual index consistency (15 min) trades immediacy for pipeline simplicity.",
cloud:{aws:"S3 documents + EventBridge → MSK → ECS/EKS parse and embed workers (spot) → OpenSearch (hybrid BM25 + kNN, ACL filters) → Aurora Postgres → ElastiCache → Bedrock for embeddings and generation → SageMaker endpoint for the cross-encoder. Secrets Manager, CloudWatch + OTel, Cognito/Entra federation.",
azure:"Blob Storage + Event Grid → Service Bus → Container Apps workers → Azure AI Search (hybrid + semantic ranker + security filters from Entra groups) → Azure Database for PostgreSQL → Azure Cache for Redis → Azure OpenAI (multi-region via APIM). Key Vault, Application Insights.",
gcp:"Cloud Storage + Pub/Sub → Cloud Run workers → Vertex AI Vector Search + a BM25 layer → Cloud SQL/AlloyDB → Memorystore → Vertex AI embeddings and Gemini. Secret Manager, Cloud Trace, BigQuery for trace analytics."},
qs:[{q:"How would you design a scalable enterprise RAG system for 10 million documents?",a:"Two decoupled pipelines. Ingestion: connectors emit change events to Kafka, idempotent workers parse layout-aware, chunk with heading context and a document-situating prefix, embed in batches on spot capacity, and upsert to a sharded vector index plus BM25 with ACL groups as filterable fields — the whole index rebuildable from object storage. Query: authenticate, resolve groups server-side, check a scope-keyed semantic cache, rewrite the query with history, retrieve hybrid with ACL pre-filters and over-fetch, fuse with RRF, rerank with a cross-encoder, apply a relevance floor that refuses rather than guesses, generate with a citation contract, and trace everything with prompt and model versions. Then evaluation as a CI gate plus online sampling, and cost controlled by caching, quantisation and batch re-embedding.",fu:"What breaks first as the corpus grows to 100M documents?",tip:"Index memory and re-embedding cost. Answer with sharding plus quantisation plus incremental-only re-embedding — and say the index must be rebuildable or you can never change the embedding model."},
{q:"How do you guarantee an employee never sees a document they lack permission for?",a:"Permissions are synced from the identity provider into chunk metadata at ingestion and refreshed on ACL change events. At query time the user's groups are derived from their token server-side and applied as a mandatory pre-filter inside the ANN search — never post-filtering, never client-supplied. Caches are keyed by ACL scope. Highly sensitive classifications live in separate collections. And CI runs cross-permission probe tests asserting zero results, so isolation is tested, not assumed.",fu:"What happens the moment someone's access is revoked?",tip:"Immediate at query time because groups resolve per request; but cached answers must be evicted by scope — name the cache, that is the detail most candidates miss."}]},

{id:"pdf-qa", name:"PDF question-answering system", pri:2, b:["int","adv","sd","ai"],
req:"Upload a PDF (up to 500 pages), ask questions, get cited answers with page references. Handle scanned documents, tables and multi-column layouts. Non-functional: ingestion feedback within seconds, searchable within 2 minutes for a 100-page file, p95 answer latency under 3s.",
scale:"50k uploads/day, average 30 pages ≈ 1.5M pages/day. 200k questions/day ≈ 2.5 QPS average. 30 pages ≈ 60 chunks, so 3M new chunks/day.",
arch:[["Upload → presigned URL → object storage"],["Job created, id returned immediately","teal"],["Queue → parse worker","layout-aware + OCR fallback"],["Chunk by section, keep page numbers","amber"],["Embed + index into per-document namespace","teal"],["Status endpoint → client polls / websocket"],["— ask —"],["Retrieve within document namespace","teal"],["Rerank → top 5 with page numbers","amber"],["LLM answer with page citations","amber"],["Highlight spans returned to viewer"]],
api:"POST /v1/documents → {upload_url, document_id}. GET /v1/documents/{id} → {status: parsing|indexing|ready|failed, pages, progress}. POST /v1/documents/{id}/ask {question} → streamed answer with citations [{page, span, quote_ref}]. Chunk ids encode page and offset so the UI can highlight the exact region.",
db:"Postgres: documents(id, owner_id, filename, pages, status, content_hash, created_at), chunks(id, doc_id, page, char_start, char_end, text), jobs(id, doc_id, stage, attempts, error). Content hash deduplicates repeated uploads of the same file — a meaningful cost saving in practice.",
cache:"Per-document question cache (same document plus same question is very common with shared links). Parsed-text cache keyed by content hash so re-uploads skip parsing and embedding entirely.",
async:"All ingestion is async with a visible job state machine. Page-level parallelism for parsing and OCR. Progress reported per page so the UI shows movement on a 500-page file.",
llm:"Cheap model for short factual questions, stronger model for summarisation across the document. Page-citation contract in the prompt. Whole-document questions ('summarise this') route to a hierarchical summarisation path rather than top-k retrieval.",
rag:"Per-document retrieval so there is no cross-document noise. Sentence-window retrieval for precise citation with neighbouring context. Tables extracted separately as markdown and retrieved as units. For summary-type questions, map-reduce over section summaries instead of top-k.",
vdb:"One collection with document_id as a mandatory filter (namespaces per document if the store supports it cheaply). Deleted documents purge by filter. Vectors expire with the document.",
sec:"Ownership check on every read; presigned URLs scoped and short-lived; documents encrypted at rest; per-user upload quotas; virus scanning on upload; automatic deletion honouring retention settings, including vectors and caches.",
mon:"Parse success rate by document type (scanned versus digital), OCR fallback rate, pages/second throughput, time to ready by page count, retrieval score distribution, answer latency, and cost per document.",
fail:"Parse failure → retry with an alternative parser, then OCR, then mark failed with an actionable message ('this PDF appears to be an image scan we could not read'). Partial indexing is exposed rather than hidden, so users can ask about the pages that succeeded.",
scaling:"Workers autoscale on queue depth; OCR is the expensive path, so route only scanned pages to it. Very large documents are split into page-range tasks processed in parallel.",
cost:"Content-hash deduplication, OCR only when needed, cheap embedding model at 384–768 dims (single-document retrieval is an easy task), and answer caching for shared documents.",
trade:"Per-document retrieval gives precision and simplicity but cannot answer across documents — a deliberate scope choice. Async ingestion adds a status surface but is unavoidable at 500 pages.",
cloud:{aws:"S3 presigned upload → EventBridge → SQS → ECS workers (Textract for OCR) → OpenSearch or pgvector → Bedrock. Aurora for metadata, ElastiCache for caches.",
azure:"Blob upload → Event Grid → Service Bus → Container Apps (Document Intelligence for OCR and tables) → Azure AI Search → Azure OpenAI.",
gcp:"Cloud Storage → Pub/Sub → Cloud Run (Document AI for OCR) → Vertex Vector Search or pgvector on AlloyDB → Gemini."},
qs:[{q:"A user asks 'summarise this 400-page report'. Why does top-k retrieval fail and what do you do?",a:"Because the question is about the whole document, and any top-5 chunks are an arbitrary sample. I route summary-intent questions to a hierarchical path: summarise each section, then summarise the summaries, caching section summaries so repeat requests are cheap. Retrieval answers local questions; map-reduce answers global ones, and a small classifier decides which.",fu:"How do you detect summary intent?",tip:"A cheap classifier or router on the query — tie it to Adaptive RAG."}]},

{id:"support", name:"AI customer-support system", pri:3, b:["adv","sd","prod","ai"],
req:"Deflect common tickets with grounded answers, escalate to humans with full context, act on account data via tools (order status, refunds within policy), support multiple channels, and never promise something outside policy. Non-functional: p95 under 3s, measurable deflection rate, complete audit trail of any action taken.",
scale:"5M customers, 50k conversations/day, average 4 turns ≈ 200k LLM turns/day ≈ 2.5 QPS average, 15 QPS peak (business hours and incident spikes).",
arch:[["Channels: web, app, email, WhatsApp"],["Channel adapter → normalised message"],["Auth + customer resolution","fire"],["Semantic cache","teal"],["Intent router (small model)","amber"],["RAG over help centre + policy docs","teal"],["Tool layer: order lookup, subscription, refund","authorised server-side","fire"],["Policy guardrails + approval gate","fire"],["Answer or escalate with context bundle","amber"],["Ticket system + CRM write-back"]],
api:"POST /v1/support/messages {channel, external_id, text} → streamed reply with actions[] and escalation flag. POST /v1/support/escalate {conversation_id} → creates a ticket with the transcript, retrieved sources, tool calls and a drafted summary. Webhooks for channel delivery. All actions carry an idempotency key.",
db:"Postgres: conversations, messages, actions(id, conversation_id, tool, args_redacted, authorised_by, result, created_at), escalations, deflection_events. Customer data stays in the CRM and is read through tools rather than copied.",
cache:"Semantic cache scoped by locale and customer segment (not per customer, since answers to policy questions are shared) with a strict threshold. Policy documents cached in memory in each worker with a short TTL.",
async:"CRM write-back, transcript persistence, quality scoring, deflection analytics and training-data collection all asynchronous. Only the reply is synchronous.",
llm:"Three tiers: a small classifier for intent and escalation prediction, a mid model for answering with retrieved policy, and a stronger model for complex or angry conversations detected by sentiment. Strict output schema including a confidence field and an escalate flag.",
rag:"Hybrid retrieval over help-centre articles, policy documents and past resolved tickets. Metadata filters on locale, product and effective date so no expired policy is ever cited. Relevance floor → escalate rather than guess, which is the correct failure mode for support.",
vdb:"Single collection with locale, product and effective_date filters; resolved-ticket embeddings in a separate collection so they can be weighted differently or disabled if quality drops.",
sec:"Customer identity verified before any account-specific tool call; refunds capped by policy in code, not in the prompt; high-value refunds require human approval; PII redacted in logs and before third-party model calls; complete audit of every tool call with authorising principal.",
mon:"Deflection rate, escalation rate and reasons, customer satisfaction after AI-handled conversations, tool-call success and rejection rates, faithfulness on sampled answers, citation of expired documents (should be zero), and cost per conversation compared with cost per human ticket.",
fail:"Retrieval below floor → escalate with context. Tool failure → tell the customer plainly and escalate, never invent a status. Model outage → fall back to a smaller model, then to a routing-only mode that collects details and creates a ticket. Degraded mode must still capture the request.",
scaling:"Stateless workers on an HPA; spike handling during incidents via a queue for non-real-time channels (email) while chat stays synchronous; cache hit rate rises sharply during incidents because everyone asks the same thing, which is exactly when you need it.",
cost:"Intent routing so simple questions never reach the expensive model, semantic caching (very high hit rate in support), capped output length, and reuse of resolved-ticket answers. Compare against human cost per ticket to justify the model tier.",
trade:"Conservative escalation lowers deflection but protects trust and avoids wrong policy statements. Shared caching across customers requires care but is where the savings are. Tool-based CRM reads add latency versus copying data, but avoid a synchronisation and privacy problem.",
cloud:{aws:"API Gateway → Lambda channel adapters → ECS support service → Bedrock → OpenSearch → Aurora → SQS for async → Connect/Zendesk integration. Secrets Manager, CloudWatch.",
azure:"APIM → Container Apps → Azure OpenAI → Azure AI Search → PostgreSQL → Service Bus → Dynamics/Zendesk. Key Vault, App Insights.",
gcp:"Cloud Run → Gemini via Vertex AI → Vertex Vector Search → Cloud SQL → Pub/Sub → CCAI integration. Secret Manager, BigQuery for deflection analytics."},
qs:[{q:"How do you stop the assistant from promising a refund the policy does not allow?",a:"Keep the authority in code. The model can propose a refund tool call, but the tool validates against policy independently — amount limits, eligibility window, order state — and rejects otherwise. Amounts above a threshold route to human approval. The policy lives in the tool implementation and in retrievable policy documents with effective dates, and the prompt requires citing the policy it relied on. Every action is audited with the authorising principal.",fu:"What if the model states a policy incorrectly without calling a tool?",tip:"Groundedness checking against retrieved policy plus an expired-document citation alarm — and sampled human review of policy-related answers."}]},

{id:"semantic-search", name:"Semantic search engine", pri:2, b:["int","adv","sd","ai"],
req:"Search across a large content corpus with semantic understanding, typo tolerance, filters and facets, personalised ranking, and sub-300ms p95. Zero-result rate below 2%.",
scale:"100M documents, 5k QPS peak, p95 under 300ms, index updated within a minute of publication.",
arch:[["Client"],["Edge cache (popular queries)","teal"],["Query service","parse, spell-correct, expand"],["Parallel: BM25 + ANN + filters","teal"],["RRF fusion → candidate set (200)"],["Lightweight reranker (ONNX cross-encoder)","amber"],["Business rules + personalisation"],["Facets + highlighting → response"]],
api:"GET /v1/search?q=&filters=&page=&sort= returning results with scores, highlights and facet counts. GET /v1/suggest?q= for typeahead from a prefix index. Latency budget stated per stage in the response headers during development.",
db:"Search engine (OpenSearch/Elasticsearch) holds documents with both BM25 fields and dense vectors; Postgres holds the authoritative content; Redis holds the query cache, popular-query list and personalisation features.",
cache:"Edge and Redis caching of full result pages for popular queries (a long-tail power law means a small cache covers a large share of traffic), plus a query-embedding cache so repeated queries skip the embedding call.",
async:"Indexing is event-driven from content changes. Click and engagement events stream to a warehouse for learning-to-rank training and for zero-result analysis.",
llm:"No LLM in the hot path — 300ms will not permit it. LLMs are used offline: generating query expansions and synonyms, writing document summaries for the snippet field, and labelling training pairs for the reranker.",
rag:"Not RAG, but the same retrieval machinery. Optionally an 'AI answer' panel built on top for a subset of queries, served asynchronously so it never blocks results.",
vdb:"Vectors inside the search engine (kNN field) to keep one index and one query, avoiding the join between two systems. 384-dim quantised vectors keep memory manageable at 100M documents.",
sec:"Public read path with rate limiting and bot detection; private documents filtered by ACL; query logs scrubbed of PII; injection-safe query parsing.",
mon:"p95 by stage, zero-result rate, click-through rate at position, mean reciprocal rank on a labelled set, cache hit rate, index lag, and the top zero-result queries as a content-gap report.",
fail:"ANN component failure → BM25-only results with a quality warning in telemetry. Reranker failure → fused order. Partial shard failure → serve partial results rather than an error, and flag it.",
scaling:"Shard by document id with replicas for QPS; scatter-gather with a top-k heap merge; separate read replicas for the heavy long-tail; cache the head of the distribution at the edge.",
cost:"Quantised low-dimension vectors, an ONNX reranker on CPU instead of a hosted API, and aggressive caching. No per-query LLM cost at all, which is the design's main economic advantage.",
trade:"No LLM in the path keeps latency and cost low but gives up generative answers — hence the optional async answer panel. Quantisation loses recall, recovered by over-fetching and reranking.",
cloud:{aws:"CloudFront → ALB → ECS query service → OpenSearch (BM25 + kNN) → ElastiCache → Aurora. SageMaker endpoint or in-process ONNX for reranking.",
azure:"Front Door → Container Apps → Azure AI Search (hybrid + semantic ranker) → Redis → Azure SQL.",
gcp:"Cloud CDN → Cloud Run → Vertex Vector Search + BM25 layer or Elasticsearch on GKE → Memorystore → Cloud SQL."},
qs:[{q:"How do you hit 300ms p95 with semantic search at 5k QPS?",a:"Keep the LLM out of the path entirely. Run dense and lexical retrieval in parallel, cap the candidate set, rerank with a small ONNX cross-encoder on CPU with batching, cache the head of the query distribution at the edge, use low-dimension quantised vectors so the ANN search is memory-resident, and shard with replicas so each shard's working set stays in RAM. Budget each stage explicitly: 20ms embed, 60ms retrieve, 80ms rerank, the rest for network and assembly.",fu:"What do you do about the 2% of queries that are slow?",tip:"Timeout and degrade — return BM25 results rather than blowing the budget. Say that partial results beat a slow page."}]},

{id:"coding-assistant", name:"AI coding assistant", pri:2, b:["adv","sd","ai","prod"],
req:"Inline completions with sub-200ms latency, chat over the repository with citations, multi-file edits, and no leakage of proprietary code to unapproved providers.",
scale:"20k developers, 200 completion requests/developer/day ≈ 4M/day ≈ 50 QPS average with sharp working-hour peaks; 50k chat requests/day.",
arch:[["IDE plugin","debounce, local context window"],["Completion service","small fast model, prefix cache","teal"],["Chat service","repo retrieval + reasoning model","amber"],["Repo index: AST-aware chunks + embeddings","teal"],["Symbol graph (definitions, references)","amber"],["LLM gateway: self-hosted completions, frontier for chat","fire"],["Telemetry: acceptance rate per model"]],
api:"POST /v1/complete {prefix, suffix, language, repo_id} → completion (streamed, cancellable). POST /v1/chat {messages, repo_id, open_files} → streamed answer with file and line citations. POST /v1/edit {instruction, files} → a structured patch proposal, never applied automatically.",
db:"Postgres for repositories, indexing state and telemetry. Object storage for repository snapshots. A symbol table (definitions, references, imports) built from AST parsing, which is what makes repo chat actually useful.",
cache:"Prefix caching for completions (developers type incrementally, so the same prefix recurs constantly), embedding cache per file version keyed by content hash, and negative caching for prefixes that produced rejected completions.",
async:"Repository indexing on push via webhook, incremental per changed file. Telemetry, acceptance analytics and eval sampling are asynchronous.",
llm:"Two very different models: a small self-hosted fill-in-the-middle model for completions where latency dominates, and a frontier reasoning model for chat and multi-file edits. Cancellation on keystroke is essential — most completion requests are abandoned.",
rag:"Retrieval over AST-aware chunks (function and class granularity, never mid-function), expanded via the symbol graph so a retrieved function brings its type definitions and callers. Open files and recent edits are weighted heavily — the most relevant context is what the developer is looking at.",
vdb:"Per-repository namespaces with file-path and language filters; deletes on file removal; re-embed only changed files.",
sec:"Code never leaves the approved boundary: self-hosted completion model, and for chat either a self-hosted frontier model or a provider with contractual zero-retention. Secret scanning on indexed content so credentials in code are never embedded or sent. Per-repository access control mirrored from the source-control provider.",
mon:"Completion acceptance rate (the real quality metric), p95 completion latency, cancellation rate, chat citation accuracy, index freshness after push, and cost per developer per month.",
fail:"Completion timeout at 200ms → return nothing rather than something late, because a stale completion is worse than none. Index stale → fall back to open-file context only. Provider failure → degrade chat to a smaller model with a notice.",
scaling:"Completions need GPU capacity sized for peak working hours with a warm floor and continuous batching; chat traffic is an order of magnitude lower. Indexing scales on webhook volume.",
cost:"Self-hosted small model for the 4M daily completions (a managed API at that volume would be the dominant cost), prefix caching, short output limits for completions, and cancellation to avoid paying for abandoned requests.",
trade:"Self-hosting adds ops burden but is required by both cost and confidentiality at this volume. AST-aware chunking is more work than text splitting but is the difference between useful and useless repo chat.",
cloud:{aws:"EKS with GPU node pools running vLLM for completions, ECS for API services, OpenSearch for code retrieval, S3 snapshots, Bedrock for chat. CloudWatch and OTel.",
azure:"AKS GPU pools, Azure OpenAI for chat, Azure AI Search for code, Blob snapshots, Key Vault.",
gcp:"GKE GPU pools with vLLM, Cloud Run APIs, Vertex AI for chat, Vertex Vector Search, Cloud Storage."},
qs:[{q:"Why self-host the completion model but not the chat model?",a:"Volume and latency. Completions are millions per day with a 200ms budget and short outputs — per-token API pricing and network latency make that both expensive and slow, while a small fill-in-the-middle model on local GPUs with continuous batching is fast and cheap. Chat is lower volume, needs the strongest reasoning available, and can tolerate a second of latency, so a managed frontier model is the better trade there, provided the data terms allow it.",fu:"How do you size the GPU fleet for peak?",tip:"From measured tokens/second per GPU under continuous batching, peak concurrent developers, and a warm floor — say you would over-provision modestly because cold starts are minutes."}]},

{id:"llm-gateway", name:"Multi-model LLM API platform / gateway", pri:3, b:["adv","sd","prod","iv"],
req:"One OpenAI-compatible API in front of many providers and self-hosted models, with per-team quotas, cost attribution, routing policies, fallbacks, caching, key management and full audit. Non-functional: adds under 20ms overhead, 99.95% availability, no single provider outage visible to callers.",
scale:"500 internal services, 20M requests/day ≈ 230 QPS average, 1,500 QPS peak. Must handle streaming for the majority of requests.",
arch:[["Client SDKs (OpenAI-compatible)"],["Gateway (stateless, multi-region)","teal"],["Auth: virtual keys with scopes","fire"],["Quota + rate limit (Redis)","fire"],["Cache: exact + semantic (opt-in)","teal"],["Router: policy engine","amber"],["Provider adapters","OpenAI, Bedrock, Azure, vLLM"],["Token accounting + usage events","amber"],["Fallback chain on failure","fire"]],
api:"POST /v1/chat/completions and /v1/embeddings, wire-compatible with the OpenAI API so existing SDKs work unchanged. Headers select policy: x-model-tier, x-cache-policy, x-team. Admin API for virtual keys, quotas, routing rules and usage reports. Streaming passthrough with usage emitted on the terminal event.",
db:"Postgres for keys, teams, quotas, routing rules and daily usage rollups. Redis for live counters and caches. Usage events to Kafka for the warehouse, since per-request rows at 20M/day belong in an analytical store, not the OLTP database.",
cache:"Exact-match cache keyed by hash(model, messages, parameters, team scope) with opt-in per request. Optional semantic cache for teams that enable it. Provider prompt caching exploited by keeping stable prefixes first.",
async:"Usage and audit events published asynchronously so metering never adds latency to the response path. Rollups computed by a scheduled job.",
llm:"The gateway is the LLM architecture: model aliases ('fast', 'balanced', 'frontier') map to concrete provider models per environment, so callers never hard-code a model and a provider swap is a configuration change. Model versions pinned explicitly.",
rag:"Not applicable, but the gateway is the component every RAG system calls, and centralising it is what makes cost attribution and provider migration possible.",
vdb:"Only for the optional semantic cache — a small index of request embeddings scoped by team.",
sec:"Virtual keys per service with scopes, rotation and instant revocation; real provider keys held only in the gateway from a secrets manager; per-key spend caps; audit log of every request with team, model, tokens and cost; PII redaction policy per team; and no request bodies in logs unless explicitly enabled.",
mon:"Overhead added by the gateway (must stay under 20ms), per-provider error and latency rates, fallback activation, cache hit rate, tokens and cost by team, model and feature, quota rejections, and anomaly alerts on spend.",
fail:"Per-provider circuit breakers with an ordered fallback chain; region failover for multi-region providers; if all providers fail, return a structured error fast rather than hanging, because callers have their own budgets. Redis unavailable → fail open on caching but fail closed on quotas for keys marked as hard-capped.",
scaling:"Stateless, so horizontal; keep it in the same region as callers; connection pooling to providers; avoid buffering streams to keep memory flat.",
cost:"The gateway is the cost-control plane: routing cheap models by default, caching, output caps and per-team quotas. Typically the highest-leverage single service in an AI platform's budget.",
trade:"An extra hop and a potential single point of failure in exchange for centralised policy, cost visibility and provider independence — worth it above a handful of services, over-engineering below that. OpenAI wire compatibility constrains the API surface but eliminates migration cost for callers.",
cloud:{aws:"ALB → ECS/EKS gateway → ElastiCache → Aurora → MSK → Bedrock plus external providers via NAT. Secrets Manager, CloudWatch.",
azure:"APIM or a custom gateway on Container Apps → Redis → PostgreSQL → Event Hubs → Azure OpenAI multi-region. Key Vault.",
gcp:"Cloud Load Balancing → Cloud Run → Memorystore → Cloud SQL → Pub/Sub → Vertex AI plus external providers. Secret Manager, BigQuery for usage analytics."},
qs:[{q:"Design an internal LLM gateway. What are the must-haves?",a:"Virtual keys with scopes and revocation so no service holds a provider key; per-team quotas and spend caps enforced in Redis; model aliases so callers never hard-code a provider; an ordered fallback chain with circuit breakers; exact and optional semantic caching; token accounting emitted asynchronously to a warehouse for cost attribution; an OpenAI-compatible surface so adoption costs nothing; streaming passthrough without buffering; and an audit log of every call. Stateless and multi-replica, with under 20ms overhead as a hard requirement.",fu:"How do you stop the gateway becoming the outage?",tip:"Stateless multi-region replicas, no synchronous dependency on Postgres in the hot path (config cached in memory with a refresh), and fail-open behaviour for non-critical features."}]},

{id:"agentic-platform", name:"Agentic AI platform / multi-agent workflows", pri:3, b:["adv","sd","prod","ai"],
req:"Let teams define and run agents that use tools, run for minutes, pause for human approval, resume after failures, and are fully audited. Non-functional: runs survive pod eviction, hard cost and step budgets per run, no agent can exceed its granted permissions.",
scale:"5k runs/day, average 12 steps, some runs up to 30 minutes. 60k LLM calls/day plus tool calls.",
arch:[["Run API","create, inspect, approve, cancel"],["Scheduler → worker pool","teal"],["Graph executor (LangGraph-style)","amber"],["Checkpointer (Postgres)","durable state per step","fire"],["Tool registry + authorisation","per-agent scopes","fire"],["Sandbox (code execution)","no network, ephemeral FS","fire"],["Budget enforcer","steps, time, dollars","fire"],["Approval queue → human UI","amber"],["Trace store + audit log"]],
api:"POST /v1/runs {agent_id, input, budget} → {run_id}. GET /v1/runs/{id} → state, current step, trace, pending approvals. POST /v1/runs/{id}/approve {step_id, decision, note}. POST /v1/runs/{id}/cancel. SSE /v1/runs/{id}/events for live progress. Agent definitions are versioned artefacts.",
db:"Postgres: agents(id, version, graph_def, tool_scopes), runs(id, agent_id, agent_version, status, budget, spent, started_at), checkpoints(run_id, step, state_json, created_at), approvals(run_id, step, approver, decision, at), tool_calls(run_id, step, tool, args_redacted, result_status, latency_ms, authorised).",
cache:"Tool result caching for idempotent read tools (the same lookup recurs across steps), and LLM response caching for repeated reasoning prompts within a run.",
async:"Runs are inherently asynchronous: the API returns a run id and workers execute steps, checkpointing after each. Approvals pause the run with state persisted, and a TTL escalates or expires pending approvals.",
llm:"A planner model per step plus optional specialist models per agent. Every LLM call is metered against the run budget. Structured tool-call output validated before execution. Loop detection on repeated state signatures.",
rag:"Agents retrieve as a tool rather than as a fixed pipeline stage, so retrieval is one capability among many and its results are traced like any other tool output — and treated as untrusted input.",
vdb:"Shared retrieval tool backed by the organisation's vector store with the run's principal applied as an ACL filter, so an agent cannot read beyond the user who started it.",
sec:"Per-agent tool scopes granted explicitly; the run executes as the initiating principal, never as a service account; every tool call authorised independently of the model's request; egress allow-lists so injected instructions cannot exfiltrate; code execution in a sandbox with no credentials and no network; approval gates on destructive or high-value actions; full audit of proposed versus executed actions.",
mon:"Steps per run, cost per run, budget-exhaustion rate, tool error rates, approval wait times, loop-detection triggers, success rate by agent version, and traces linking every step to its prompt and result.",
fail:"Worker eviction → another worker resumes from the last checkpoint. Tool failure → retry, then a compensating step or graceful termination with a partial result. Budget exhausted → terminate with a partial answer and a trace, never silently. Approval expiry → escalate or cancel per policy.",
scaling:"Worker pool autoscaled on pending-run queue depth; long runs do not block workers because execution is step-based and checkpointed; per-tenant concurrency caps prevent one team monopolising capacity.",
cost:"Hard per-run dollar budgets, step caps, cheaper models for routine steps with escalation only when needed, tool result caching, and a report of cost per agent version so expensive agents are visible to their owners.",
trade:"Checkpointing every step costs write throughput but buys durability and resumability, which is non-negotiable for long runs. Approval gates add human latency but are the only safe way to permit destructive actions. Multi-agent designs are allowed but discouraged by default because of cost and debuggability.",
cloud:{aws:"EKS worker pool, Aurora Postgres for checkpoints, SQS for run queue, Firecracker/Fargate sandbox for code execution, Bedrock for models, Step Functions optional for orchestration, CloudWatch and OTel for traces.",
azure:"AKS workers, PostgreSQL Flexible Server, Service Bus, Container Apps jobs for sandboxing, Azure OpenAI, App Insights.",
gcp:"GKE workers, Cloud SQL, Pub/Sub, Cloud Run jobs for sandboxed execution, Vertex AI, Cloud Trace."},
qs:[{q:"How do you make a 30-minute agent run survive infrastructure failure?",a:"Step-based execution with a durable checkpoint after every node: the full state is persisted in Postgres keyed by run and step, so any worker can resume from the last committed step. Tool side effects are idempotent with keys so a replayed step does not duplicate actions. Budgets and step counts live in the same state so a resumed run cannot exceed them. Pending approvals are persisted too, so a run can wait days across deployments.",fu:"What about a tool call that was in flight when the worker died?",tip:"Idempotency keys plus a status check before retrying — say you record intent before executing, then reconcile on resume."}]},

{id:"realtime-ml", name:"Real-time ML prediction & fraud detection", pri:2, b:["adv","sd","prod"],
req:"Score transactions in under 50ms p99 with features from historical behaviour, adapt to new fraud patterns, and support human review. High recall at a fixed precision, full explainability per decision.",
scale:"10k transactions/second peak, sub-50ms p99, 500 features per prediction, retraining weekly with daily threshold recalibration.",
arch:[["Transaction event"],["Feature service","online store lookup, <10ms","teal"],["Model server","gradient boosting, ONNX, in-process","amber"],["Rules engine","hard blocks, velocity limits","fire"],["Decision + SHAP top factors"],["Async: case creation for review, label collection"]],
api:"POST /v1/score {transaction} → {score, decision, top_factors[], model_version} with a hard 50ms timeout and a deterministic fail-safe. Internal: GET /v1/explain/{decision_id} for the audit trail.",
db:"Online feature store (Redis or DynamoDB) for low-latency reads; offline store (warehouse) for training with point-in-time correctness; Postgres for decisions, labels and review cases.",
cache:"Feature values cached with short TTLs; aggregate features (counts in windows) precomputed by a streaming job rather than computed per request, which is what makes 50ms achievable.",
async:"Streaming aggregation (Kafka + Flink or Kinesis Analytics) maintains rolling window features. Label collection from chargebacks arrives weeks later and feeds retraining. Model retraining and threshold recalibration run as scheduled pipelines.",
llm:"Deliberately not in the scoring path — 50ms forbids it. LLMs are used offline: summarising cases for reviewers, generating investigation narratives, and clustering emerging fraud patterns from free-text reports.",
rag:"Only in the review tool: retrieving similar past cases and policy guidance for the human investigator.",
vdb:"Embeddings of transaction sequences or device fingerprints for nearest-neighbour similarity to known fraud rings, queried offline or on a slower secondary path.",
sec:"PCI scope discipline, encryption, strict access control on features and decisions, immutable audit of every decision with model version and feature values, and fairness monitoring across protected attributes.",
mon:"Latency p99 per stage, feature freshness and null rates, score distribution drift, PSI per feature, precision and recall as labels arrive, reviewer override rate, and a canary comparison between model versions.",
fail:"Feature store miss → use defaults with an indicator feature marking the miss, and never fail the transaction on a model error; fall back to the rules engine and a conservative decision. Model server failure → rules-only mode with an alert.",
scaling:"Model runs in-process to avoid a network hop; horizontal scaling of scoring pods; feature store sharded with replicas; streaming aggregation partitioned by account id.",
cost:"Gradient boosting on CPU is cheap; the real costs are the feature store and streaming infrastructure. Precompute aggregates rather than querying raw history per request.",
trade:"Precomputed aggregates trade freshness (seconds) for latency, which is the right call. In-process model serving trades deploy coupling for a saved network hop. No LLM in the path trades semantic flexibility for latency and cost — correct here.",
cloud:{aws:"Kinesis/MSK → Flink for aggregation → DynamoDB/ElastiCache online features → ECS scoring service with in-process ONNX → Aurora decisions → SageMaker for training. CloudWatch.",
azure:"Event Hubs → Stream Analytics → Cosmos DB/Redis → Container Apps scoring → Azure SQL → Azure ML training.",
gcp:"Pub/Sub → Dataflow → Bigtable/Memorystore → Cloud Run scoring → Cloud SQL → Vertex AI training. BigQuery for offline features."},
qs:[{q:"Why would you not use an LLM for fraud detection?",a:"Latency, cost and accuracy all point the other way. The decision must land in under 50ms at 10k TPS, the features are numeric and tabular where gradient boosting is state of the art, and per-transaction LLM cost would be thousands of times higher. LLMs add value around the model — summarising cases for reviewers, clustering emerging patterns from free text, generating investigation narratives — not in the scoring path.",fu:"Where could an embedding help?",tip:"Sequence or device embeddings as features into the boosted model, or nearest-neighbour similarity to known fraud rings on a slower secondary path."}]},

{id:"doc-pipeline", name:"AI document processing pipeline (document intelligence)", pri:2, b:["adv","sd","prod"],
req:"Ingest high volumes of invoices, contracts and forms; extract structured fields with confidence; route low-confidence items to human review; guarantee auditability and no data loss.",
scale:"1M documents/day, average 5 pages, extraction of 20–50 fields per document, 95% straight-through processing target.",
arch:[["Intake: upload, email, SFTP, API"],["Object storage + manifest","teal"],["Queue per stage","fire"],["Classify document type","amber"],["OCR / layout parse"],["Extract fields (LLM + schema)","amber"],["Validate: schema, business rules, cross-field","fire"],["Confidence gate → auto-approve or human review","amber"],["Deliver to ERP/downstream + audit record"]],
api:"POST /v1/documents (async, returns job id). GET /v1/documents/{id} → status, extracted fields with per-field confidence and page coordinates. POST /v1/documents/{id}/corrections for reviewer edits, which become training and eval data. Webhook on completion.",
db:"Postgres: documents, extractions(doc_id, field, value, confidence, page, bbox, model_version), reviews(doc_id, reviewer, changes_json, at), delivery_attempts. Object storage holds originals and rendered page images, immutable.",
cache:"Content-hash deduplication (resubmissions are common), classifier result caching, and template caching for known vendors, which dramatically improves both accuracy and cost for repeat formats.",
async:"Every stage is a separate queue and worker set so each scales and retries independently, and a failure in extraction does not re-run OCR. Idempotency on document hash plus stage.",
llm:"Structured extraction with a JSON schema per document type, temperature 0, and per-field confidence derived from logprobs or a second-pass verification on low-confidence fields only. Vision models for layout-heavy documents; a cheaper model for known templates.",
rag:"Retrieval of similar past documents and vendor-specific extraction examples as dynamic few-shot, which measurably lifts accuracy on recurring formats.",
vdb:"Embeddings of document layouts and vendor templates for nearest-neighbour example selection.",
sec:"Documents often contain PII and financial data: encryption, strict access control, retention policies with hard deletion, redaction in logs, and provider selection constrained by data residency. Complete audit of every extraction and correction.",
mon:"Straight-through processing rate, per-field accuracy against reviewer corrections, confidence calibration curves, cost per document, stage latencies and queue depths, DLQ volume, and accuracy by vendor/template to catch format changes early.",
fail:"Stage retries with backoff then DLQ with the original payload retained; partial extraction is delivered with flags rather than discarded; delivery failures to downstream systems retry with idempotency keys and alert after a threshold.",
scaling:"Independent autoscaling per stage on queue depth; OCR and vision are the expensive stages, so route only what needs them; spot capacity for batch backlogs with checkpointing.",
cost:"Template-based extraction for known vendors (cheap and deterministic) with LLM fallback for unknown formats, page-level routing so only complex pages hit vision models, deduplication, and second-pass verification only on low-confidence fields.",
trade:"Confidence gating trades automation rate for accuracy, tuned by the cost of an error versus the cost of review. Per-stage queues add complexity but give independent retry and scaling, which at 1M documents/day is essential.",
cloud:{aws:"S3 → EventBridge → SQS per stage → ECS/Batch workers with Textract → Bedrock for extraction → Aurora → EventBridge delivery. Step Functions for the state machine, CloudWatch.",
azure:"Blob → Event Grid → Service Bus per stage → Container Apps with Document Intelligence → Azure OpenAI → PostgreSQL → Logic Apps for delivery.",
gcp:"Cloud Storage → Pub/Sub → Cloud Run per stage with Document AI → Gemini for extraction → Cloud SQL → Workflows for orchestration, BigQuery for accuracy analytics."},
qs:[{q:"How do you decide which documents go to human review?",a:"A calibrated confidence gate per field, not per document: any field below its threshold, any failed business rule (totals not summing, dates out of range), any unknown vendor template, and a random sample of high-confidence items to keep calibration honest. Thresholds are set from the cost of an error versus the cost of review, and recalibrated from reviewer corrections, which also become eval and training data.",fu:"How do you know your confidence scores mean anything?",tip:"Plot a calibration curve against reviewer outcomes — say you measure it rather than trusting model self-reported confidence."}]},

{id:"more-designs", name:"Nine more designs in brief", pri:2, b:["int","adv","sd"],
brief:[
["Document intelligence system","Classification, extraction and comparison across a contract corpus. Key moves: clause-level chunking, a clause taxonomy with a fine-tuned classifier, deviation detection against a playbook of standard clauses, and Graph RAG for cross-document obligation questions. Review UI with page-anchored citations is the product."],
["Recommendation system","Two-stage: candidate generation (collaborative filtering plus embedding ANN over item vectors) then ranking (gradient boosting on interaction features). LLMs used offline for cold-start item enrichment and explanation text, never in the sub-100ms path. Metrics: CTR, conversion, coverage, diversity."],
["Multilingual chatbot","Detect language, keep retrieval in the document's language with multilingual embeddings (or translate queries into the corpus language), generate in the user's language, and evaluate per language because quality varies sharply. Token budgets must be set per language since non-Latin scripts cost more tokens."],
["Voice AI assistant","Pipeline: VAD → streaming STT → intent/RAG → LLM → streaming TTS, with barge-in support. The hard constraint is end-to-end latency under ~800ms, so every stage streams and partial transcripts start retrieval early. Fall back to a scripted flow when confidence is low."],
["AI meeting summarizer","Async by design: recording to object storage, diarised transcription, chunked map-reduce summarisation with speaker attribution, action-item extraction into a schema, and delivery to the calendar or ticket system. Cost controlled by transcribing once and summarising from the transcript."],
["Resume screening system","High-stakes and regulated: structured extraction, requirement matching against an explicit rubric, no protected-attribute features, mandatory human decision, full audit, and bias testing per cohort as a release gate. The correct answer stresses fairness and that the model ranks and explains, never rejects autonomously."],
["AI meeting-ready document Q&A over mixed media","Unified ingestion of PDFs, slides, images and audio into one index with modality metadata; multimodal embeddings or captioned images; citations that point to the right modality and timestamp."],
["Multi-agent research workflow","Supervisor plus specialised workers (search, read, synthesise, verify) with shared scratchpad state, per-agent tool scopes, step and dollar budgets, and a verification agent that checks claims against sources before output. Traces per agent are essential to debug it at all."],
["Enterprise GenAI platform","Platform-of-platforms: LLM gateway, shared retrieval service, prompt registry, eval service, guardrail service, agent runtime, and a self-serve portal with per-team quotas and cost reporting. The interview answer is about governance and reuse, not about any single model."]],
qs:[{q:"You get an unfamiliar AI design question. How do you avoid freezing?",a:"Run the same framework regardless of domain: clarify requirements and scale, decide whether the AI call is in or out of the latency path, decide what knowledge the system needs and whether that is retrieval or training, then place the standard components — gateway, cache, queue, store, index, guardrails, observability — and finally talk about failure, scale and cost. The domain changes the details, not the structure.",fu:"What if you genuinely do not know the domain?",tip:"Say so, state your assumptions explicitly, and design against them — interviewers score reasoning, not domain trivia."}]}
];
</script>
<script>
/* ================= QUESTION BANK =================
   [topic, difficulty, star(0/1), question, shortAnswer, detail, example, production, followUp, tip]
   difficulty: beg | int | adv | prod
   =================================================== */
const QB = [];
const B = (...a) => QB.push(a);

/* ---------- Python ---------- */
B("Python","beg",0,"What is the GIL and when does it actually matter?","The Global Interpreter Lock lets only one thread execute Python bytecode at a time, so threads cannot run CPU-bound Python code in parallel.","It does not affect I/O-bound work, because the lock is released while waiting on sockets or files. It also does not affect native code that releases it, such as numpy operations. It matters for pure-Python CPU work, where you need processes instead of threads.","Embedding 10,000 chunks locally in threads gives almost no speedup; the same work in a process pool scales with cores.","AI services are I/O-bound on model calls, so asyncio is the right tool; CPU stages like PDF parsing and tokenisation go to a process pool.","How do you run CPU work from an async endpoint?","Say 'await I/O, offload CPU' — it answers the whole family of concurrency questions."),
B("Python","int",1,"list vs tuple vs set vs dict — when each?","List for ordered mutable sequences, tuple for fixed immutable records and dict keys, set for membership and deduplication, dict for key-value lookup.","Sets and dicts give average O(1) membership via hashing; lists are O(n). Tuples are hashable and slightly cheaper in memory, which matters when you hold millions of them.","Deduplicating retrieved chunk ids: a set turns an O(n²) scan into O(n).","Chunk metadata as frozen dataclasses rather than dicts saves real memory at scale.","What makes an object hashable?","Mention __slots__ or frozen dataclasses for millions of small objects — it shows scale thinking."),
B("Python","int",0,"Explain *args and **kwargs and one production risk.","They collect extra positional and keyword arguments. The risk is that they hide the real signature, so typos become silent no-ops.","Wrapper functions and decorators need them to pass arguments through, but public APIs should declare parameters explicitly so type checkers and FastAPI can introspect them.","A provider wrapper accepting **kwargs will silently swallow max_tokens=..., and you discover it from the bill.","Use explicit keyword-only parameters on provider interfaces; reserve **kwargs for genuine passthrough.","How do you make a parameter keyword-only?","The 'silently swallowed parameter' example lands well because everyone has hit it."),
B("Python","int",0,"Shallow vs deep copy?","Shallow copy duplicates the container but shares the nested objects; deep copy recursively duplicates everything.","Mutating a nested object after a shallow copy affects both copies. Deep copy is expensive and can be surprisingly slow on large nested structures.","Copying a prompt config dict and editing a nested list of few-shot examples mutates the original template for every subsequent request.","Use immutable configuration objects (frozen dataclasses, Pydantic models with model_copy) instead of copying mutable dicts.","How would you avoid needing copies at all?","Answer with immutability rather than deepcopy — it is the better engineering answer."),
B("Python","adv",1,"What is a context manager and why does it matter for AI services?","An object with __enter__/__exit__ (or async equivalents) guaranteeing cleanup even on exceptions.","Used for database sessions, HTTP clients, file handles, locks and timing spans. Without it, an exception mid-request leaks a connection, and enough leaks exhaust the pool.","An async context manager around a provider call records latency and tokens in the metrics dict whether or not the call raised.","Every span, session and lock in the request path should be a context manager, not manual acquire/release.","How do you write an async one?","Mention @asynccontextmanager — concrete and short."),
B("Python","adv",0,"How would you profile a slow Python AI service?","Measure before changing: per-stage timings from traces, then cProfile or py-spy on a worker, and event-loop lag for async issues.","py-spy attaches to a running process without restarting it, which matters in production. For async services, the usual finding is a blocking call rather than slow Python.","A 12s p99 traced to a synchronous HTTP client inside an async handler blocking the loop.","Expose a loop-lag metric and a per-stage latency histogram permanently, so profiling starts from data.","What would you look at first?","Naming py-spy specifically signals production experience."),
B("Python","prod",1,"How do you pin and reproduce a Python environment for an AI service?","Lock files (uv.lock or poetry.lock) committed, exact versions, installed with --frozen in the image, and the same lock used in CI.","AI libraries move fast and break interfaces between minor versions. Unpinned dependencies mean a rebuild can change model client behaviour with no code change.","A LangChain minor upgrade renaming an import breaks a deploy at 2am with no commit to blame.","Pin exact versions including transitive dependencies; rebuild deliberately on a schedule with the eval suite as the gate.","How do you keep dependencies current then?","Renovate/Dependabot plus the eval gate — updates are safe because they are tested, not avoided."),
B("Python","int",0,"What are __slots__ and when do you use them?","A class attribute that replaces the per-instance dict with a fixed set of slots, cutting memory and speeding attribute access.","Trade-off: no dynamic attributes and no default __dict__. Worth it only when you create very many instances.","A million chunk objects with __slots__ versus without is a meaningful memory difference on an ingestion worker.","Combine with frozen dataclasses for value objects in hot pipelines.","What do you lose?","Quantify the saving — 'roughly 40–50% per small object' — rather than saying 'it saves memory'."),
B("Python","int",0,"Explain Python's exception handling best practice in a service.","Catch narrow exception types, convert them to domain errors at the boundary, never swallow silently, and always log with context.","A bare `except:` hides KeyboardInterrupt and real bugs. Re-raising after logging preserves the traceback; `raise ... from e` keeps the cause chain.","Provider timeout → caught as TimeoutError → converted to a 504 with a trace id, not a 500 with a stack trace.","Map every external failure to an explicit HTTP status and a structured log event; unknown exceptions become 500 with an alert.","What HTTP status for a provider 429?","'Convert at the boundary' is the phrase that shows API maturity."),
B("Python","prod",0,"How do you handle configuration in a production AI service?","Pydantic Settings reading environment variables, validated at startup, with secrets injected from a secrets manager and no defaults for anything security-relevant.","Fail fast: if a required setting is missing or malformed, the process should not start. Silent defaults cause the worst incidents because the service appears healthy.","A missing OPENAI_API_KEY should crash at startup, not on the first user request at peak.","Validate at import/startup, log the non-secret configuration once, and expose a config hash in the health endpoint for drift detection.","Where do prompts live — config or code?","'Fail fast at startup' is the point; the config hash detail is a bonus."),

/* ---------- ML ---------- */
B("ML","beg",0,"Explain bias and variance with a concrete example.","Bias is systematic error from an over-simple model; variance is sensitivity to the particular training sample.","A linear model on a curved relationship underfits (high bias). A deep tree memorising noise overfits (high variance). Total error decomposes into bias, variance and irreducible noise.","Predicting churn with one feature underfits; a 40-deep tree on 500 rows overfits.","Diagnose from the train/test gap, then act: more capacity for bias, more data or regularisation for variance.","Which is worse in production?","Give the train/test gap as the diagnostic — it turns theory into practice."),
B("ML","int",1,"How do you handle severe class imbalance?","Choose the right metric first (PR-AUC, recall at fixed precision), then adjust: class weights, threshold tuning, and resampling only if needed.","Class weights in the loss are usually better than SMOTE, which can create implausible synthetic points in high dimensions. The threshold, not the model, is the main lever.","0.2% fraud: train with scale_pos_weight, then choose the threshold from reviewer capacity.","Never optimise accuracy; monitor precision and recall separately because the operating point drifts as base rates move.","Would you use SMOTE?","Say 'threshold tuning first' — it is the cheapest and most effective lever and many candidates skip it."),
B("ML","int",0,"What is cross-validation and when is a simple holdout enough?","k-fold rotates the validation set to reduce estimate variance; a single holdout is enough when data is plentiful and cheap to fit.","With little data, k-fold gives a far more stable estimate. With millions of rows and expensive training, a single large holdout is statistically fine and much cheaper.","Fine-tuning a model on 2,000 examples warrants 5-fold; a 10M-row boosting model does not.","Always keep a final untouched test set separate from any tuning loop, or you leak through hyperparameter selection.","How does this apply to time series?","Mention nested CV for tuning — a precise answer to the leakage follow-up."),
B("ML","adv",0,"Explain how gradient boosting works.","It fits trees sequentially, each on the residual errors of the ensemble so far, scaled by a learning rate.","Unlike bagging (random forest), which averages independent trees to cut variance, boosting reduces bias by additive correction. Regularise with learning rate, depth, subsampling and early stopping.","XGBoost with lr=0.05, depth 6, early stopping on a validation fold is a strong tabular default.","Monitor for overfitting via the validation curve; log feature importance drift as a data-quality signal.","Random forest or boosting by default?","Contrast bagging-for-variance with boosting-for-bias in one sentence — that framing is what is being tested."),
B("ML","adv",1,"What is data leakage and how do you detect it?","Information from the target or the future entering training features, producing inflated offline metrics that collapse in production.","Sources: fitting transforms before splitting, target encoding without out-of-fold, features computed after the label event, and duplicate rows across splits.","A 'days_since_last_login' feature computed at analysis time leaks the churn outcome.","Detect it with a suspiciously high metric, feature importance dominated by one feature, and a train/serve parity test that recomputes features at serving time.","How do you prevent it structurally?","A feature store or a single shared transform artefact — structural, not procedural."),
B("ML","int",0,"How do you choose between more data, better features and a better model?","Measure the learning curve. If validation error is still falling with data volume, get data; if train and validation are both high, improve features or capacity.","Feature quality usually beats model choice on tabular problems. Model swaps give a few points; a well-constructed feature can give many.","Adding transaction velocity features often beats swapping random forest for XGBoost.","Version features and datasets so you can attribute an improvement to the right change.","What do you do if you cannot get more data?","The learning curve makes this answer empirical instead of an opinion."),
B("ML","prod",1,"How do you deploy and monitor a classical ML model?","Serialise the whole pipeline (transforms plus model), version it, serve it behind an API or in-process, and monitor input distributions, prediction distribution and delayed metrics.","Serving the model without its preprocessing is the classic bug. Export the full pipeline, or better, ONNX for a portable, fast artefact.","A scikit-learn Pipeline pickled with its ColumnTransformer, served via FastAPI with ONNX Runtime for latency.","Log every prediction with feature values and model version; that log is your drift monitor and your audit trail.","What triggers retraining?","Give a numeric trigger (PSI > 0.2, AUC down 3 points) rather than 'when it degrades'."),
B("ML","int",0,"Explain regularisation intuitively.","It penalises complexity so the model prefers simpler explanations, trading a little training fit for better generalisation.","L2 shrinks all weights smoothly; L1 zeroes some out and selects features; dropout and early stopping regularise neural networks; tree models use depth and minimum-sample constraints.","Ridge on correlated marketing features keeps them all small; lasso picks one per correlated group.","Tune the regularisation strength with cross-validation, never by inspection.","What happens to correlated features under L1?","The correlated-group behaviour is the detail that distinguishes a real answer."),
B("ML","int",0,"What is K-Means and what are its failure modes?","It partitions data into k clusters by iteratively assigning points to the nearest centroid and recomputing centroids.","It assumes roughly spherical, similar-sized clusters, is sensitive to initialisation (use k-means++), requires choosing k, and is affected by feature scaling.","Clustering embedding vectors to discover query topics — useful, but elongated clusters get split badly.","Scale features, use k-means++, evaluate with silhouette score, and consider HDBSCAN when cluster shape varies.","How do you pick k?","Elbow plus silhouette, and say that for embeddings HDBSCAN is often better — it shows applied experience."),
B("ML","adv",0,"Precision-recall trade-off: how do you set the operating threshold?","From business cost: compute the expected cost of false positives and false negatives across thresholds and pick the minimum, subject to capacity constraints.","The model gives a ranking; the threshold turns it into a decision. Two products can share a model and need different thresholds.","Fraud review team handles 500 cases/day, so the threshold is set where daily flags ≈ 500 at maximum recall.","Recalibrate the threshold on a schedule as base rates drift; log the threshold with every decision.","What if costs are unknown?","Framing threshold selection as a capacity or cost problem — not a metric problem — is the senior answer."),

/* ---------- Deep Learning ---------- */
B("DL","beg",0,"What is an epoch, batch and iteration?","An epoch is one pass over the dataset; a batch is the samples per gradient update; an iteration is one update.","Batch size affects gradient noise, memory use and throughput. Larger batches need a proportionally larger learning rate and use more activation memory.","10,000 samples with batch size 32 gives ~313 iterations per epoch.","Batch size is usually GPU-memory bound; gradient accumulation simulates larger batches when memory is tight.","What limits batch size?","Mention gradient accumulation — it is the practical answer to memory limits."),
B("DL","int",1,"Why do gradients vanish or explode, and what fixes them?","Repeated multiplication of small or large Jacobians through depth shrinks or blows up gradients. Fixes: residual connections, normalisation, careful initialisation, gradient clipping and non-saturating activations.","Sigmoid saturates so its derivative approaches zero; ReLU keeps a constant gradient for positives. Residual connections give gradients a direct path through depth, which is why very deep transformers train at all.","Clipping global norm at 1.0 is standard in LLM training recipes.","Watch gradient norms during training; a sudden spike usually precedes divergence.","Why does a residual connection help?","'Gradients get a direct path' is the crisp mechanical answer."),
B("DL","int",0,"Dropout: what does it do at train and inference time?","It randomly zeroes activations during training as a regulariser and is disabled at inference, with activations scaled so expectations match.","Forgetting to switch to eval mode leaves dropout active, making inference non-deterministic and worse. It is one of the most common silent production bugs.","A served model giving different outputs for identical inputs, traced to a missing model.eval().","Assert eval mode in a startup smoke test; use torch.inference_mode() for serving.","What else does eval mode change?","Name BatchNorm running statistics as the other thing eval mode changes."),
B("DL","adv",0,"What is transfer learning and how does it apply to LLMs?","Reusing a model pretrained on a large corpus and adapting it to a task with far less data and compute.","For LLMs the adaptation ladder is prompting, then retrieval, then parameter-efficient fine-tuning, then full fine-tuning. Each step up costs more and buys narrower gains.","Fine-tuning a small encoder for intent classification on 3,000 labelled examples instead of training from scratch.","Keep the base model pinned; adapters are versioned artefacts with their own eval runs.","When is full fine-tuning justified?","Present it as a cost ladder — that framing is exactly what the question is probing."),
B("DL","adv",0,"Explain learning-rate warmup and decay.","Warmup ramps the learning rate up over the first steps because early gradients are unreliable; decay reduces it later so the model settles.","Without warmup, Adam's adaptive estimates are poor at the start and training can diverge. Cosine decay is the transformer default.","Linear warmup over 2,000 steps then cosine decay to near zero.","Log the schedule with the run; a mismatched schedule is a common cause of an unreproducible result.","Why does Adam specifically need warmup?","Tie warmup to Adam's second-moment estimates being unreliable early — the mechanistic reason."),
B("DL","int",0,"What is batch normalisation and why do transformers avoid it?","It normalises activations across the batch using batch statistics; transformers use LayerNorm because it is independent of batch composition.","BatchNorm's inference behaviour depends on running statistics collected in training, which is fragile for variable-length sequences and batch size 1.","Serving a single sequence through a BatchNorm model behaves differently from training.","For sequence models use LayerNorm or RMSNorm; pre-norm placement trains deep stacks more stably.","What is pre-norm vs post-norm?","'Independent of batch composition' is the phrase to use."),
B("DL","prod",1,"How do you serve a PyTorch model with low latency?","Export to TorchScript or ONNX, run in inference mode with FP16/BF16, batch requests dynamically, warm up at startup, and keep the model resident.","Latency comes from Python overhead, unfused kernels, cold caches and per-request setup. torch.compile, ONNX Runtime and TensorRT remove most of it.","An embedding model on ONNX Runtime CPU serving batches of 32 at a few milliseconds per item.","Warm up before passing readiness; set thread counts explicitly or CPU contention destroys latency under load.","What batching strategy?","Mention explicit thread-count configuration — a real production detail few candidates know."),
B("DL","int",0,"CNN vs transformer for images today?","CNNs remain efficient and strong for many vision tasks; vision transformers win with large data and pretraining, and hybrids are common.","CNNs have a strong locality prior so they are data-efficient; ViTs have weaker priors and need more data but scale better.","Document layout analysis still often uses CNN-based detectors for speed.","Choose on latency and data volume, not novelty; measure on your own labelled set.","What about multimodal models?","Framing it as an inductive-bias versus data-volume trade-off is the informed answer."),

/* ---------- NLP ---------- */
B("NLP","beg",0,"What is tokenisation and why should an AI engineer care?","Splitting text into model units. It determines cost, context consumption and truncation behaviour.","Subword schemes (BPE, WordPiece, SentencePiece) handle unseen words compositionally. Token counts differ by language and by content type, so character heuristics are unreliable.","A 1,000-word English document is ~1,300 tokens; the same content in Japanese can be 2–3× more.","Always count with the model's own tokenizer before assembling a prompt; enforce budgets in tokens, not characters.","Why is code token-inefficient?","Have the ~4 characters per token rule ready, then immediately qualify it by language."),
