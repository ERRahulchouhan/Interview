MODULES.push({
id:"fastapi", n:"21", title:"FastAPI & AI APIs", pri:3, tags:["prod","code"],
intro:"The serving layer for nearly every Python AI service. Interviewers probe async correctness, streaming and production hardening.",
topics:[
{t:"REST, async endpoints and dependency injection", b:["beg","int","prod","code"],
what:"An ASGI framework with Pydantic validation, automatic OpenAPI docs and a dependency-injection system.",
how:"Declare async def endpoints for I/O-bound work. Use Depends for auth, database sessions, clients and settings — it makes them overridable in tests. Use lifespan to create long-lived clients once at startup instead of per request.",
code:{lang:"python",src:`from contextlib import asynccontextmanager
from fastapi import FastAPI, Depends, HTTPException, Request

@asynccontextmanager
async def lifespan(app: FastAPI):
    app.state.llm = AsyncLLM(timeout=30, max_connections=100)
    app.state.pg = await create_pool(min_size=5, max_size=20)
    app.state.redis = await redis_pool()
    await warmup(app.state.llm)                 # avoid a cold first request
    yield
    await app.state.pg.close(); await app.state.redis.close()

app = FastAPI(title="AI Answers", version="1.4.0", lifespan=lifespan)

async def principal(request: Request) -> Principal:
    token = (request.headers.get("authorization") or "").removeprefix("Bearer ")
    try:
        return verify_jwt(token)
    except InvalidToken:
        raise HTTPException(401, "invalid token")

@app.post("/v1/answer", response_model=AnswerOut)
async def answer(body: AnswerIn, p: Principal = Depends(principal)):
    return await rag.answer(body.question, principal=p)

@app.get("/healthz")   async def live():  return {"ok": True}
@app.get("/readyz")
async def ready(request: Request):
    return {"ready": await request.app.state.pg.fetchval("select 1") == 1}`},
prod:"Separate liveness from readiness: liveness must not depend on downstreams (or Kubernetes will restart healthy pods during a database blip), readiness must, so traffic drains during a dependency outage.",
qs:[{q:"Why is dependency injection more than a style choice here?",a:"It makes the auth, database and provider clients replaceable at test time with dependency_overrides, so integration tests run with no network. It also guarantees one shared connection pool rather than a client per request, which is the usual cause of connection exhaustion.",fu:"What goes in lifespan versus a dependency?",tip:"Expensive singletons in lifespan; per-request scoped things in dependencies."}]},

{t:"Streaming: SSE and WebSockets", b:["int","adv","prod","iv"],
what:"Server-Sent Events stream tokens over one HTTP response (unidirectional, auto-reconnecting, proxy-friendly). WebSockets give full duplex for interactive sessions.",
when:"SSE for token streaming — it is simpler, works through most proxies, and matches the one-request-one-stream shape. WebSockets when the client also sends continuously (voice, collaborative editing, interrupts).",
how:"Yield chunks as they arrive, flush immediately, disable proxy buffering, send periodic heartbeats to survive idle timeouts, and handle client disconnect by cancelling the upstream call so you stop paying for tokens nobody will read.",
code:{lang:"python",src:`from fastapi.responses import StreamingResponse
import json, asyncio

@app.post("/v1/answer/stream")
async def stream(body: AnswerIn, p: Principal = Depends(principal)):
    async def gen():
        yield f"event: meta\\ndata: {json.dumps({'trace_id': trace_id()})}\\n\\n"
        try:
            async for tok in rag.stream(body.question, principal=p):
                yield f"data: {json.dumps({'t': tok})}\\n\\n"
        except asyncio.CancelledError:
            metrics.inc("stream.client_disconnect")   # stop billing tokens
            raise
        except ProviderError as e:
            yield f"event: error\\ndata: {json.dumps({'message': str(e)})}\\n\\n"
        yield "event: done\\ndata: {}\\n\\n"
    return StreamingResponse(gen(), media_type="text/event-stream",
        headers={"Cache-Control": "no-cache", "X-Accel-Buffering": "no"})`},
qs:[{q:"Why does streaming matter beyond looking nice?",a:"Time-to-first-token is the latency users actually perceive. A 9-second complete response feels broken; the same response streaming from 400ms feels fast. It also lets the client render progressively and lets you cancel generation on disconnect, which saves real money.",fu:"How do you return an error after the stream started?",tip:"You cannot change the status code — emit a typed error event and have the client handle it. That detail is the scoring point."}]},

{t:"Rate limiting, timeouts, retries and background tasks", b:["int","adv","prod"],
how:"Rate limit per API key and per user in Redis (token bucket for burst tolerance). Set an explicit timeout on every outbound call and keep the sum below the gateway timeout. Retry only idempotent operations with exponential backoff and jitter, and cap total attempts. Offload anything slow to a queue with a job id the client polls, not to BackgroundTasks, which dies with the process.",
code:{lang:"python",src:`LUA = """
local c = redis.call('INCR', KEYS[1])
if c == 1 then redis.call('EXPIRE', KEYS[1], ARGV[2]) end
return c <= tonumber(ARGV[1]) and 1 or 0
"""
async def allow(redis, key: str, limit: int, window: int = 60) -> bool:
    return bool(await redis.eval(LUA, 1, f"rl:{key}:{int(time.time()//window)}",
                                 limit, window))

@app.post("/v1/answer")
async def answer(body: AnswerIn, p: Principal = Depends(principal)):
    if not await allow(app.state.redis, p.api_key, limit=p.rpm):
        raise HTTPException(429, "rate limit exceeded",
                            headers={"Retry-After": "30"})
    try:
        return await asyncio.wait_for(rag.answer(body.question, p), timeout=25)
    except asyncio.TimeoutError:
        raise HTTPException(504, "upstream timeout")`},
prod:"Return 429 with Retry-After and a clear quota header rather than silently queueing — clients can then back off correctly instead of hammering you.",
qs:[{q:"Fixed window, sliding window or token bucket for an LLM API?",a:"Token bucket. LLM traffic is bursty by nature — a user sends several messages quickly then idles — so a bucket that permits a burst up to capacity while enforcing a sustained refill rate matches real usage. Fixed windows allow a double burst at the boundary; sliding windows are accurate but costlier to maintain.",fu:"Rate limit on requests or on tokens?",tip:"Both: requests protect the service, token quotas protect the budget. Saying both is the complete answer."}]},

{t:"Production FastAPI architecture", b:["adv","prod","sd"],
flow:[["Client"],["ALB / Ingress","TLS, routing"],["Uvicorn workers behind Gunicorn","N = f(cores), async per worker","teal"],["Middleware","trace id, auth, rate limit, timing","amber"],["Router → service layer"],["Repositories / clients","Postgres pool, Redis, vector DB, LLM gateway"]],
side:[["Celery / ARQ workers","ingestion, evals"],["Redis","cache, limits, queues"],["Postgres + PgBouncer","pooling"],["OTel collector","traces"],["Secrets manager","runtime injection"]],
prod:"Checklist: one worker process per core with async concurrency inside; graceful shutdown draining in-flight requests; structured logs with a trace id from the middleware; versioned routes (/v1); request size limits; CORS locked to known origins; OpenAPI docs disabled or authenticated in production; and connection pools sized against the database's real connection limit via PgBouncer.",
qs:[{q:"How many Uvicorn workers for an AI service?",a:"Start at roughly one per CPU core, since each worker runs its own event loop and async concurrency handles the waiting. The real constraint is usually downstream: total workers × per-worker connection pool must stay under the database and provider connection limits. I would load-test rather than guess, and watch event-loop lag as the signal.",fu:"Why not many more workers, given the work is I/O-bound?",tip:"Memory per worker (each loads model clients and tokenizers) and connection multiplication — name both."}]}]});

MODULES.push({
id:"databases", n:"22", title:"Databases & Caching", pri:3, tags:["prod"],
intro:"Postgres for truth, Redis for speed, and clear opinions about indexing, transactions and pooling.",
topics:[
{t:"PostgreSQL: indexing, transactions and ACID", b:["int","adv","prod","iv"],
what:"A relational database with MVCC, strong transactional guarantees and a rich index set (B-tree, GIN, GiST, BRIN, plus HNSW/IVFFlat via pgvector).",
how:"Index selection: B-tree for equality and ranges; GIN for JSONB, arrays and full-text; BRIN for huge append-only time-ordered tables; partial indexes for filtered hot queries; composite indexes ordered by selectivity with the equality columns first. Verify with EXPLAIN ANALYZE, never by intuition.",
table:{head:["ACID property","Meaning","Failure without it"],rows:[
["Atomicity","All or nothing","Half-applied refund"],
["Consistency","Constraints always hold","Orphaned rows, negative balances"],
["Isolation","Concurrent transactions do not interfere","Double-spend, lost updates"],
["Durability","Committed data survives a crash","Acknowledged writes disappear"]]},
perf:"Common AI-app database problems: N+1 queries when hydrating retrieved chunks (fix with a single ANY($1) query), no index on tenant_id, unbounded result sets, and JSONB columns queried without a GIN index.",
qs:[{q:"When would you not use Postgres?",a:"Extremely high write throughput with simple access patterns, petabyte analytics, or globally distributed low-latency writes. For almost every AI application — documents, metadata, users, audit, job status, even vectors up to a few million — Postgres is the right default and one fewer system to operate.",fu:"What about vectors at 100M scale?",tip:"Then a dedicated vector store; say the crossover point rather than a blanket rule."},
{q:"Explain isolation levels briefly.",a:"Read committed (Postgres default) sees only committed data but allows non-repeatable reads. Repeatable read gives a stable snapshot. Serializable behaves as if transactions ran one at a time, at the cost of serialisation failures you must retry. I pick serializable for money movement and read committed for everything else.",fu:"What anomaly does repeatable read still allow in some databases?",tip:"Phantom reads in the SQL standard — Postgres's implementation actually prevents them via snapshot isolation."}]},

{t:"Redis: caching, rate limits and data structures", b:["int","adv","prod","iv"],
what:"An in-memory data-structure store used for caching, rate limiting, session state, queues, locks and pub/sub.",
how:"Strings for cached responses, sorted sets for sliding windows and leaderboards, hashes for session objects, streams for lightweight event queues, and Lua scripts for atomic multi-step operations. Set maxmemory with an eviction policy (allkeys-lru for caches) so Redis never OOMs the node.",
table:{head:["Pattern","Detail"],rows:[
["Cache-aside","Read cache, on miss read the database and populate. The default; simple and safe."],
["Write-through","Write both on update. Keeps cache fresh, adds write latency."],
["TTL + jitter","Randomise expiry so thousands of keys do not expire together (stampede)"],
["Single-flight lock","One request computes, others wait — prevents a thundering herd on a cold key"],
["Cache stampede guard","Serve stale while revalidating in the background"]]},
prod:"In AI systems Redis carries the exact-match response cache, rate-limit counters, semantic-cache metadata, streaming session state and idempotency keys. Always key caches by tenant and permission scope.",
qs:[{q:"Redis is at 95% memory and evicting hot keys. What do you do?",a:"Immediately: confirm the eviction policy is allkeys-lru rather than noeviction, check for keys without TTLs, and look for a few huge keys skewing usage. Then reduce value size (compress, store ids not payloads), shorten TTLs for low-value entries, split caches by purpose so a bulk cache cannot evict rate-limit counters, and scale up or shard with Redis Cluster.",fu:"Why separate rate-limit counters from the response cache?",tip:"Because eviction of a counter silently disables your rate limiting — that is the real answer and it is a security point."},
{q:"How do you prevent a cache stampede when a popular key expires?",a:"A single-flight lock so only one request recomputes while others wait briefly or serve stale, plus TTL jitter so keys do not expire in lockstep, plus background refresh ahead of expiry for known-hot keys.",fu:"What does this look like for an LLM answer cache?",tip:"Serve the stale answer while regenerating asynchronously — users prefer a slightly old answer to a 9-second wait."}]},

{t:"MongoDB and when NoSQL fits", b:["int"],
what:"A document store with flexible schemas, good for heterogeneous nested documents and rapid schema evolution.",
when:"When documents are genuinely schema-variable and mostly read as whole objects. In AI systems it is often used for raw document metadata and parsed content.",
notwhen:"When you need multi-entity transactional integrity, complex joins or strong analytical querying. Postgres JSONB covers most 'I want flexible documents' cases without giving up relational features.",
qs:[{q:"Postgres JSONB or MongoDB?",a:"JSONB if I already run Postgres and need flexible fields alongside relational data — one system, transactions, joins, GIN indexes on the JSON. MongoDB when the workload is overwhelmingly document-shaped at large scale and the team already operates it. I would not introduce a second database for schema flexibility alone.",fu:"What does JSONB cost you?",tip:"Larger rows and slower writes than normalised columns; index the specific paths you query."}]},

{t:"CAP theorem, connection pooling and query optimisation", b:["adv","iv","prod"],
what:"CAP: during a network partition you choose consistency or availability. Pooling reuses connections because establishing one is expensive and databases cap them.",
how:"CAP in practice is a spectrum (PACELC adds latency-vs-consistency in normal operation). Postgres is CP-leaning; Cassandra and DynamoDB are tunable; most AI metadata workloads want consistency for writes and can tolerate eventual consistency for read replicas.",
prod:"Pooling rules: async drivers with a bounded pool per worker; PgBouncer in transaction mode when worker count is high; pool size ≈ (workers × per-worker size) ≤ database max_connections minus headroom. Exhaustion shows up as request timeouts that look like database slowness but are queueing.",
qs:[{q:"Your API returns 504s under load but the database CPU is 20%. Why?",a:"Connection-pool exhaustion or event-loop blocking, not database load. Requests queue waiting for a connection, so latency explodes while the database idles. Check pool wait time and active-connection metrics, add PgBouncer, right-size the pool, and make sure no synchronous call is blocking the loop.",fu:"How do you monitor for it?",tip:"Expose pool acquisition wait time as a metric — most teams never do, and saying it stands out."}]}]});

MODULES.push({
id:"queues", n:"23", title:"Message Queues & Streaming", pri:2, tags:["prod","sd"],
intro:"How AI systems do ingestion, batch work and decoupling. Kafka semantics come up constantly in system-design rounds.",
topics:[
{t:"Kafka core concepts", b:["int","adv","prod","iv"],
what:"A distributed append-only log. Producers write to topics split into partitions; consumers in a consumer group each own partitions and track offsets.",
how:"Ordering is guaranteed within a partition only, so the partition key determines ordering scope — key by document id or tenant to keep related events ordered. Parallelism is capped by partition count. Consumer groups let independent pipelines read the same topic at their own pace.",
table:{head:["Concept","Meaning","AI use"],rows:[
["Topic / partition","Named log, split for parallelism","doc.uploaded, doc.parsed, answer.feedback"],
["Offset","Consumer position in a partition","Replay ingestion after a bad chunking deploy"],
["Consumer group","Set of consumers sharing partitions","Embedding workers scaled horizontally"],
["Retention","How long messages persist","7 days lets you rebuild an index by replay"],
["Compaction","Keep only the latest per key","Current document state per doc id"]]},
prod:"Retention plus replay is the underrated feature: when you improve chunking, you replay the parsed-document topic through new workers and rebuild the index without re-downloading or re-parsing anything.",
qs:[{q:"Why Kafka rather than SQS for document ingestion?",a:"Replay and multiple independent consumers. Kafka retains the log, so I can rebuild an index by replaying, and several pipelines (embedding, entity extraction, analytics) can consume the same events independently. SQS is simpler and often enough when each message has exactly one consumer and no replay is needed.",fu:"When is SQS the better choice?",tip:"Small teams, simple fan-out via SNS, no replay requirement — and no cluster to operate. Say that plainly; over-engineering is penalised."}]},

{t:"Delivery semantics, retries, DLQ and idempotency", b:["adv","prod","iv"],
what:"At-most-once may lose messages, at-least-once may duplicate, exactly-once requires transactional coordination and is costly.",
how:"Assume at-least-once and make consumers idempotent — that is almost always the right engineering answer. Key writes by a deterministic id (content hash, document id plus chunk index) so reprocessing overwrites rather than duplicates. Retry with backoff, cap attempts, then route to a dead letter queue with the error and original payload, and alert on DLQ depth.",
code:{lang:"python",src:`async def handle(msg):
    key = f"{msg.doc_id}:{msg.version}"
    if await seen.setnx(key, ttl=86400) is False:      # idempotency guard
        return ack(msg)
    try:
        chunks = chunk_document(await parse(msg.uri))
        # deterministic ids => re-delivery upserts instead of duplicating
        await vectors.upsert([{**c, "id": f"{key}:{i}"} for i, c in enumerate(chunks)])
        await ack(msg)
    except PermanentError as e:
        await dlq.send(msg, error=str(e)); await ack(msg)
    except TransientError:
        await nack(msg, retry_in=backoff(msg.attempts))`},
qs:[{q:"Your embedding consumer crashed mid-batch. What happens?",a:"With at-least-once delivery the un-acked messages are redelivered, so the batch reruns. Because chunk ids are deterministic (doc id, version, chunk index), the upserts overwrite rather than duplicate, and an idempotency key guards repeated side effects like billing. Without deterministic ids you would silently double every chunk and pollute retrieval.",fu:"How would you detect duplicates if they did happen?",tip:"Count chunks per document against the expected count — a cheap invariant check worth naming."},
{q:"How do you preserve ordering for a document's events?",a:"Partition by document id so all events for one document land in one partition, which Kafka orders. Global ordering across documents is neither available nor needed, and asking for it is usually a design smell.",fu:"What if one document is a hot key?",tip:"It creates partition skew — mention composite keys or splitting the work to avoid a hot partition."}]},

{t:"RabbitMQ, SQS and Pub/Sub", b:["int","prod"],
table:{head:["System","Model","Best at","Limitation"],rows:[
["Kafka / MSK","Distributed log, pull","Replay, high throughput, multiple consumers","Operationally heavy"],
["RabbitMQ","Broker with exchanges and routing","Complex routing, per-message TTL, priorities","Not a log; no replay"],
["AWS SQS","Managed queue, pull","Zero ops, DLQ built in, cheap","No replay; FIFO queues have throughput limits"],
["GCP Pub/Sub","Managed pub/sub, push or pull","Global scale, easy fan-out","At-least-once, ordering needs keys"]]},
qs:[{q:"Pick a queue for an AI document pipeline on AWS and justify it.",a:"SQS plus SNS if the pipeline is a simple fan-out with no replay need — near-zero ops, built-in DLQ, cheap at moderate volume. MSK (managed Kafka) once I need replay to rebuild indexes, several independent consumer pipelines, or very high throughput. I would start with SQS and move only when replay becomes a real requirement.",fu:"What is the migration cost?",tip:"Say you would keep the consumer logic transport-agnostic behind an interface so the switch is contained."}]}]});

MODULES.push({
id:"microservices", n:"24", title:"Microservices & Resilience", pri:2, tags:["sd","prod"],
intro:"The patterns that keep an AI platform up when a model provider degrades — which it will.",
topics:[
{t:"Monolith vs microservices for AI systems", b:["int","iv","sd"],
what:"A monolith deploys as one unit; microservices split by bounded context with independent deployment and scaling.",
how:"AI systems have a natural seam: the API service is CPU-light and I/O-heavy, embedding and inference workers are GPU or CPU-heavy, and ingestion is batch. Splitting those three is justified because their scaling profiles and hardware differ. Splitting further usually is not.",
prod:"A pragmatic default: one API service, one worker service, one model-serving service, sharing Postgres and Redis. Resist a service per feature; distributed tracing debt grows faster than the team.",
qs:[{q:"Would you use microservices for a GenAI product?",a:"Partially. I would split by resource profile, not by domain noun: an async API service, ingestion and evaluation workers, and a separate model-serving or gateway service if self-hosting GPUs. That gets independent scaling where it matters without paying full distributed-systems tax on an early product.",fu:"What is the main cost you are avoiding?",tip:"Cross-service transactions and debugging latency across hops — say you would rather have a well-modularised monolith than eleven services and no tracing."}]},

{t:"API gateway, load balancing and service discovery", b:["int","prod","sd"],
what:"The gateway centralises authentication, rate limiting, routing, versioning and quotas. Load balancers distribute traffic; service discovery resolves instances.",
how:"Load balancing algorithms matter for LLM traffic: least-outstanding-requests beats round robin because request durations vary enormously (a 20-token answer and a 2,000-token answer are not equivalent work). For GPU inference, route by queue depth where possible.",
qs:[{q:"Why is round-robin load balancing bad for LLM inference?",a:"Request cost varies by orders of magnitude with output length, so round robin sends new work to a node already generating a long response while another idles. Least-outstanding-requests or queue-depth-aware routing keeps utilisation even and cuts tail latency substantially.",fu:"How do you handle long requests gracefully during a deploy?",tip:"Long connection draining plus a generous terminationGracePeriodSeconds — otherwise you kill in-flight generations."}]},

{t:"Circuit breaker, retry, timeout and bulkhead", b:["adv","prod","iv"],
table:{head:["Pattern","Prevents","AI application"],rows:[
["Timeout","Threads held by a hung dependency","Per-provider call timeout under the gateway limit"],
["Retry + backoff + jitter","Transient failures becoming user errors","Retry 429/503 from a model provider, never a 400"],
["Circuit breaker","Hammering a dead dependency","Trip after N failures, route to the fallback model"],
["Bulkhead","One dependency exhausting all capacity","Separate connection pools per provider so one outage cannot starve the rest"],
["Fallback","Total failure","Cheaper model, cached answer, or graceful refusal"],
["Load shedding","Total collapse under overload","Reject low-priority traffic early with 429"]]},
prod:"Retries must be budgeted. Naive retry-on-everything turns a provider slowdown into a self-inflicted DDoS — retry only idempotent calls, cap attempts, add jitter, and let the circuit breaker cut off retries entirely when the dependency is clearly down.",
qs:[{q:"Your primary LLM provider starts returning 503s. Walk me through what your system does.",a:"Per-call timeouts fire quickly rather than holding connections. Retries with jitter handle a brief blip; sustained failures trip the circuit breaker, which stops retrying and routes to the fallback provider or a smaller self-hosted model. Requests already streaming finish or emit a typed error event. The cache absorbs repeats. Metrics show fallback activation rate and an alert fires. Users get slightly degraded answers instead of errors, and the trace records which provider served each request.",fu:"What if the fallback is also down?",tip:"Serve stale cached answers where valid, then a clear degraded-mode message — never a stack trace. Say you would rather return an honest 'try again shortly' than a wrong answer."}]},

{t:"Event-driven architecture and distributed tracing", b:["int","adv","prod"],
what:"Services communicate through events rather than synchronous calls, decoupling producers from consumers. Tracing stitches a request across services via a propagated trace id.",
prod:"For AI systems the rule is: user-facing answers synchronous, everything else eventful. Ingestion, evaluation, index rebuilds, notifications and analytics all belong on events, which keeps the request path short and the system resilient.",
qs:[{q:"Where does event-driven design help an AI platform most?",a:"Ingestion and evaluation. Document uploaded, parsed, chunked, embedded, indexed as separate events gives retries per stage, independent scaling, replay after a pipeline fix, and observable per-stage status. It also means evaluation and analytics can subscribe without touching the serving path.",fu:"What is the downside?",tip:"Eventual consistency in the UI — a user may not see their document indexed instantly, so you must expose job status."}]}]});

MODULES.push({
id:"docker", n:"25", title:"Docker", pri:2, tags:["prod"],
intro:"Packaging AI services, where images get large and startup costs get expensive.",
topics:[
{t:"Images, containers and Dockerfiles", b:["beg","int","prod","code"],
what:"An image is an immutable layered filesystem plus metadata; a container is a running instance of it.",
how:"Order layers by change frequency: system packages, then dependencies, then application code, so a code change does not rebuild the dependency layer. Use multi-stage builds to keep compilers out of the runtime image, run as a non-root user, and pin versions.",
code:{lang:"dockerfile",src:`# ---------- build ----------
FROM python:3.12-slim AS build
ENV PIP_NO_CACHE_DIR=1 PYTHONDONTWRITEBYTECODE=1
RUN apt-get update && apt-get install -y --no-install-recommends build-essential \\
 && rm -rf /var/lib/apt/lists/*
WORKDIR /app
COPY requirements.txt .
RUN pip install --prefix=/install -r requirements.txt   # cached unless deps change

# ---------- runtime ----------
FROM python:3.12-slim
RUN useradd -m -u 10001 app
COPY --from=build /install /usr/local
WORKDIR /app
COPY --chown=app:app . .
USER app
ENV PYTHONUNBUFFERED=1 UVICORN_WORKERS=2
EXPOSE 8000
HEALTHCHECK --interval=30s --timeout=3s CMD python -c \\
  "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"
CMD ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--workers","2"]`},
prod:"AI-specific concerns: never download model weights at container start (bake them into the image or mount a pre-warmed volume), keep GPU base images separate from the API image, and watch image size — a 12GB CUDA image makes every pod start slow and every deploy expensive.",
qs:[{q:"Your AI image is 9GB and pods take three minutes to start. What do you do?",a:"Multi-stage build to drop build tooling; a slim or distroless runtime base; separate the GPU image from the API image so only inference pods carry CUDA; move model weights to a persistent volume or a pre-pulled cache with node-level image pre-pull; and keep a warm minimum replica count so scaling events do not expose cold starts to users.",fu:"How do you speed up CI builds?",tip:"Layer ordering plus a registry cache (BuildKit cache mounts) — concrete, not 'use caching'."}]},

{t:"Compose, volumes, networks and security", b:["int","prod"],
how:"Compose defines the local development stack — API, Postgres, Redis, Qdrant — so a new engineer runs one command. Volumes persist data across container restarts; user-defined networks give DNS between services.",
sec:"Container security: non-root user, read-only root filesystem where possible, no secrets in images or build args, drop Linux capabilities, scan images in CI (Trivy, Grype), pin base image digests, and rebuild regularly for CVE patches.",
code:{lang:"yaml",src:`services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      REDIS_URL: redis://cache:6379/0
      QDRANT_URL: http://vectors:6333
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app"]
      interval: 5s
  cache: {image: "redis:7-alpine", command: "redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru"}
  vectors: {image: "qdrant/qdrant:latest", volumes: ["qdrant:/qdrant/storage"]}
volumes: {pgdata: {}, qdrant: {}}`},
qs:[{q:"How do secrets reach a container in production?",a:"Injected at runtime from a secrets manager — Kubernetes secrets sourced from AWS Secrets Manager or Vault via CSI driver, or task-definition secret references in ECS. Never baked into the image, never in build args (they persist in layers), never committed. Rotation should not require a rebuild.",fu:"How do you detect a leaked secret in an image?",tip:"Secret scanning in CI on both the repo and the built image layers."}]}]});

MODULES.push({
id:"kubernetes", n:"26", title:"Kubernetes", pri:2, tags:["prod"],
intro:"The objects you must name, plus what changes when the workload needs GPUs.",
topics:[
{t:"Core objects", b:["int","prod","iv"],
table:{head:["Object","Purpose","AI note"],rows:[
["Pod","Smallest deployable unit","One model server per pod; GPUs requested per container"],
["Deployment","Stateless replicas with rolling updates","API service, embedding workers"],
["StatefulSet","Stable identity and storage","Self-hosted vector DB, Kafka"],
["Service","Stable virtual IP and DNS","Internal routing to inference pods"],
["Ingress","HTTP routing and TLS at the edge","Public API endpoint"],
["ConfigMap / Secret","Configuration and credentials","Prompt config; provider keys from a secrets manager"],
["Job / CronJob","Run to completion / scheduled","Batch embedding, nightly index rebuild, eval runs"],
["HPA","Autoscaling on metrics","Scale on queue depth or concurrency, not CPU, for LLM work"],
["DaemonSet","One pod per node","Log and metrics agents, GPU device plugin"],
["Namespace","Isolation and quotas","Per-environment or per-team boundaries"]]},
code:{lang:"yaml",src:`apiVersion: apps/v1
kind: Deployment
metadata: {name: rag-api}
spec:
  replicas: 3
  template:
    spec:
      terminationGracePeriodSeconds: 90        # let streams finish
      containers:
      - name: api
        image: registry/rag-api@sha256:...     # pinned digest
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits:   {cpu: "2",    memory: "2Gi"}
        readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 5}
        livenessProbe:  {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
        env:
        - name: OPENAI_API_KEY
          valueFrom: {secretKeyRef: {name: llm-keys, key: openai}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: rag-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: rag-api}
  minReplicas: 3
  maxReplicas: 40
  metrics:
  - type: Pods
    pods:
      metric: {name: inflight_requests}        # concurrency, not CPU
      target: {type: AverageValue, averageValue: "8"}`},
qs:[{q:"Why not autoscale an LLM-calling service on CPU?",a:"Because it is I/O-bound waiting on the provider — CPU stays low while every worker is saturated with in-flight requests, so CPU-based HPA never scales up and latency climbs. Scale on in-flight request count, queue depth or a custom concurrency metric via KEDA or the custom-metrics API.",fu:"What do you scale a GPU inference deployment on?",tip:"Queue depth or batch-utilisation from the inference server, with a warm minimum because GPU cold starts take minutes."}]},

{t:"Deployments, Helm and GPU workloads", b:["adv","prod"],
how:"Rolling updates with maxSurge/maxUnavailable for stateless services; blue-green or canary via a service mesh or two deployments behind weighted routing for risky model changes. Helm or Kustomise templates environments. For GPUs: install the device plugin, request nvidia.com/gpu, taint GPU nodes and tolerate on inference pods, and use node selectors by GPU type.",
prod:"GPU cost discipline: separate node pools per GPU type, cluster autoscaler with a floor above zero for latency-sensitive inference, spot or preemptible nodes for batch embedding jobs with checkpointing, and PodDisruptionBudgets so a node drain does not take out all inference capacity at once.",
qs:[{q:"Design the Kubernetes layout for a RAG platform.",a:"Three node pools: general CPU for the API and workers, memory-optimised for a self-hosted vector database as a StatefulSet with fast SSD volumes, and GPU nodes (tainted) for inference or local embedding. API as a Deployment behind an Ingress with an HPA on concurrency; ingestion workers as a Deployment scaled on queue depth with KEDA; nightly index maintenance as a CronJob; secrets from the cloud secrets manager via CSI; PDBs and anti-affinity to spread replicas across zones; and namespace-level resource quotas per environment.",fu:"How do you roll out a new embedding model safely?",tip:"Shadow index plus a read flag — tie it back to the embeddings migration answer."}]}]});

MODULES.push({
id:"cicd", n:"27", title:"CI/CD", pri:2, tags:["prod"],
intro:"For AI systems the pipeline has an extra gate that normal services do not: an evaluation suite.",
topics:[
{t:"Pipeline design and GitHub Actions", b:["int","prod","code"],
how:"Stages: lint and type-check → unit tests → build image → security scan → integration tests against ephemeral services → LLM evaluation gate → push to registry → deploy to staging → smoke test → canary to production → promote or roll back.",
code:{lang:"yaml",src:`name: ci
on: {pull_request: {}, push: {branches: [main]}}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: {image: "postgres:16", env: {POSTGRES_PASSWORD: test}, ports: ["5432:5432"]}
      redis:    {image: "redis:7", ports: ["6379:6379"]}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run mypy app
      - run: uv run pytest -q --cov=app --cov-fail-under=80

  evals:
    needs: test
    if: contains(github.event.pull_request.labels.*.name, 'prompt-change')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: uv run python -m evals.run --suite golden --min-faithfulness 0.85 \\
                 --min-context-recall 0.80 --max-cost-delta 0.15

  build:
    needs: [test, evals]
    permissions: {id-token: write, contents: read}   # OIDC, no static keys
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "\${{ secrets.DEPLOY_ROLE_ARN }}", aws-region: eu-west-1}
      - run: docker build -t $ECR/rag-api:\${{ github.sha }} . && docker push $ECR/rag-api:\${{ github.sha }}
      - run: trivy image --exit-code 1 --severity HIGH,CRITICAL $ECR/rag-api:\${{ github.sha }}`},
prod:"Use OIDC federation for cloud credentials instead of long-lived secrets in the CI provider. Tag images with the commit SHA, never 'latest', so rollback is a deterministic redeploy of a known digest.",
qs:[{q:"What does an AI service's pipeline have that a normal one does not?",a:"An evaluation gate. Prompt, chunking, retrieval and model changes cannot be validated by unit tests, so the pipeline runs a curated eval suite and blocks the merge if faithfulness, context recall or cost regress beyond tolerance. Prompts are versioned artefacts deployed with the same discipline as code.",fu:"How do you keep that gate fast?",tip:"A small golden subset on every PR, the full suite nightly — say the split."},
{q:"How do you roll back a bad prompt at 2am?",a:"Prompts are configuration with versions, served from a registry or config with a flag, so rollback is flipping the active version — no rebuild, no deploy. Every trace records the prompt version, so the bad one is identifiable in minutes. Model versions are pinned the same way.",fu:"What if the regression came from the provider's model update?",tip:"Pinned model versions plus a canary on new versions — the reason you pin in the first place."}]}]});

MODULES.push({
id:"aws", n:"28", title:"Cloud — AWS", pri:3, tags:["aws","prod"],
intro:"For each service: what it is, why you would reach for it, and the AI use case an interviewer is listening for.",
topics:[
{t:"Compute and containers: EC2, ECS, EKS, Lambda", b:["int","prod","aws","iv"],
table:{head:["Service","What","AI use","Watch out for"],rows:[
["EC2","Virtual machines","GPU instances (g5, p4d, p5) for self-hosted inference and fine-tuning","You own patching, scaling, capacity"],
["ECS Fargate","Serverless containers","API and worker services without cluster ops","No GPU on Fargate; cold starts"],
["EKS","Managed Kubernetes","GPU inference at scale, portable manifests","Cluster operations cost and complexity"],
["Lambda","Functions, event-driven","Lightweight orchestration, webhooks, ingestion triggers","15-minute cap, 10GB memory, cold starts, no GPU"],
["Batch","Managed batch compute","Bulk embedding on spot GPUs","Not for interactive work"]]},
how:"Default: ECS Fargate for the API if the team is small, EKS when you need GPUs in-cluster or already run Kubernetes, Lambda for glue and event triggers, Batch for large offline embedding jobs on spot capacity.",
qs:[{q:"Would you run an LLM on Lambda?",a:"Not the model itself — no GPU, cold starts and the memory ceiling make it wrong for inference. Lambda is excellent for the glue: reacting to an S3 upload to enqueue ingestion, handling webhooks, running small scheduled jobs. Inference goes to Bedrock, SageMaker endpoints, or GPU containers on EKS/EC2.",fu:"What about a small embedding model on Lambda?",tip:"Viable for low volume with a container image and provisioned concurrency — nuance beats a flat 'no'."}]},

{t:"Storage, databases and cache: S3, RDS, DynamoDB, ElastiCache", b:["int","prod","aws"],
table:{head:["Service","What","AI use"],rows:[
["S3","Object storage","Raw documents, model artefacts, eval datasets, index snapshots"],
["RDS / Aurora Postgres","Managed relational","App metadata, ACLs, job status, pgvector for modest vector workloads"],
["DynamoDB","Managed key-value / document","Session state, idempotency keys, per-user memory at scale"],
["ElastiCache (Redis)","Managed Redis","Semantic cache, rate limits, streaming session state"],
["OpenSearch","Search + kNN","Hybrid retrieval — BM25 and vectors in one engine"]]},
prod:"S3 is the source of truth for documents; the vector index is a derived artefact you must be able to rebuild from S3 plus your ingestion code. Designing for rebuildability is what makes embedding-model migrations and chunking changes survivable.",
qs:[{q:"Where do you store documents for a RAG system on AWS and why?",a:"S3 with versioning and lifecycle rules: cheap, durable, event-emitting for ingestion triggers, and encrypted with KMS. Metadata and ACLs in Aurora Postgres, vectors in OpenSearch or a dedicated store, and the index treated as rebuildable from S3. That separation means a bad chunking deploy is a replay, not a data-loss incident.",fu:"How do you handle a customer deletion request?",tip:"Delete in S3, tombstone plus delete-by-filter in the index, purge caches, and log the action for audit — cover all four stores."}]},

{t:"Messaging and networking: SQS, SNS, MSK, API Gateway, ALB, CloudFront", b:["int","prod","aws"],
table:{head:["Service","Role in an AI platform"],rows:[
["SQS","Ingestion and job queues with DLQs; simplest reliable decoupling"],
["SNS","Fan-out one event to several pipelines"],
["MSK","Managed Kafka when replay and multiple consumer groups matter"],
["API Gateway","Public API with authz, throttling, usage plans and API keys"],
["ALB","Layer-7 load balancing to containers; supports long-lived streaming connections"],
["CloudFront","CDN for static assets and global edge termination"],
["WAF","Managed rules against injection, bots and abuse at the edge"]]},
prod:"Watch timeouts for streaming: API Gateway's integration timeout (29s for REST APIs) will cut long generations, which is why streaming AI endpoints usually sit behind an ALB or use HTTP APIs with appropriate configuration. Naming this constraint is a strong signal in AWS rounds.",
qs:[{q:"Your streaming endpoint drops after 29 seconds. What is wrong?",a:"The API Gateway REST integration timeout. Options: put the streaming endpoint behind an ALB directly, use an HTTP API or a Lambda response stream where applicable, or restructure to an async job with SSE from a container service. I would keep the non-streaming control-plane APIs on API Gateway for its authz and throttling and route the stream around it.",fu:"How do you keep authz consistent across both paths?",tip:"Validate the same JWT in the service layer, not only at the gateway."}]},

{t:"AI services: Bedrock and SageMaker", b:["int","prod","aws","iv"],
table:{head:["Service","What","When"],rows:[
["Bedrock","Managed access to multiple foundation models, plus Knowledge Bases, Guardrails and Agents","Default for LLM access on AWS; no infrastructure, data stays in your account boundary"],
["SageMaker","Full ML platform: training, tuning, endpoints, pipelines","Custom models, fine-tuning, classical ML, real-time endpoints on your own weights"],
["SageMaker JumpStart","Prebuilt model deployment","Quickly serving an open-weight LLM on your own GPU endpoint"],
["Bedrock Knowledge Bases","Managed RAG: ingestion, chunking, vectors, retrieval","Fast internal RAG; less control over chunking and reranking"]]},
how:"Bedrock for model access with multiple providers behind one API and IAM-based control. SageMaker when you need your own weights, a training pipeline, or a dedicated inference endpoint with specific hardware.",
qs:[{q:"Bedrock or SageMaker for a RAG product?",a:"Bedrock for generation and embeddings — no capacity management, several model families behind one IAM-controlled API, and provisioned throughput available if I need guaranteed capacity. SageMaker if I fine-tune or self-host specific weights, or need a custom reranker endpoint. Often both: Bedrock for the LLM, a SageMaker endpoint for a fine-tuned cross-encoder.",fu:"How do you handle Bedrock throttling?",tip:"Exponential backoff plus cross-region model access and provisioned throughput for baseline load — specific, not generic."}]},

{t:"Security and operations: IAM, Secrets Manager, KMS, CloudWatch", b:["int","adv","prod","aws"],
how:"IAM roles for service identity with least privilege — no long-lived access keys in applications; IRSA on EKS or task roles on ECS. Secrets Manager for provider API keys with rotation. KMS for encryption at rest with customer-managed keys where required. CloudWatch for logs, metrics and alarms; X-Ray or OTel for traces.",
sec:"AI-specific IAM discipline: the code-execution sandbox for an agent must run under a role with no access to Secrets Manager, S3 buckets or the database. A compromised sandbox should be able to do nothing.",
qs:[{q:"How does your FastAPI service on EKS get its OpenAI key?",a:"IRSA gives the pod an IAM role; the application reads the key from Secrets Manager at startup and caches it in memory with periodic refresh for rotation. No key in the image, the manifest, or environment variables committed anywhere. Kubernetes secrets, if used, are synced from Secrets Manager by the CSI driver rather than managed by hand.",fu:"How do you audit key usage?",tip:"CloudTrail on the secret plus per-key usage metering in your LLM gateway."}]}]});

MODULES.push({
id:"azure", n:"28b", title:"Cloud — Azure", pri:2, tags:["azure","prod"],
intro:"Common in enterprises with Microsoft agreements, and the usual home of enterprise GenAI because of Azure OpenAI and Entra ID integration.",
topics:[
{t:"Compute, containers and storage", b:["int","prod","azure"],
table:{head:["Service","What","AI use"],rows:[
["Azure VM (NC/ND series)","Virtual machines with GPUs","Self-hosted inference, fine-tuning"],
["AKS","Managed Kubernetes","Production AI workloads, GPU node pools"],
["Container Apps","Serverless containers with KEDA built in","API and workers without cluster ops; scales on queue length"],
["Azure Functions","Event-driven functions","Ingestion triggers, webhooks, glue"],
["Blob Storage","Object storage","Documents, artefacts, eval datasets"],
["Azure Files","Managed file shares","Shared model weights across pods"]]},
qs:[{q:"AKS or Container Apps for an AI API?",a:"Container Apps when the team wants minimal operations and the workload is stateless HTTP plus queue workers — KEDA scaling on queue depth is built in, which suits ingestion well. AKS when I need GPU node pools, fine-grained scheduling, a service mesh, or portable Kubernetes manifests across clouds.",fu:"Which would you pick for GPU inference?",tip:"AKS with a GPU node pool — Container Apps is not the right home for GPU serving."}]},

{t:"Data, cache and messaging", b:["int","prod","azure"],
table:{head:["Service","What","AI use"],rows:[
["Azure SQL","Managed relational","App metadata and audit in Microsoft-standardised estates"],
["Azure Database for PostgreSQL","Managed Postgres","Metadata plus pgvector for modest vector workloads"],
["Cosmos DB","Globally distributed multi-model, with vector search","Session state, per-user memory, low-latency global reads"],
["Azure Cache for Redis","Managed Redis","Semantic cache, rate limits"],
["Service Bus","Enterprise messaging with sessions and DLQ","Ordered ingestion pipelines, reliable job dispatch"],
["Event Hubs","Kafka-compatible streaming","High-volume event ingestion and replay"],
["AI Search","Search service with vector + hybrid + semantic ranker","The default managed retrieval layer for Azure RAG"]]},
prod:"Azure AI Search is the usual RAG retrieval choice on Azure: it does BM25, vectors, hybrid fusion and a semantic reranker in one managed service, which removes two components from your architecture diagram.",
qs:[{q:"Design retrieval for an enterprise RAG system on Azure.",a:"Azure AI Search as the retrieval layer with hybrid search and the semantic reranker, indexed from Blob Storage via an indexer or a custom pipeline in Container Apps. Security filters on the index derived from Entra ID group claims so document permissions are enforced at query time, Azure OpenAI for embeddings and generation with a private endpoint, and Cosmos DB or Postgres for conversation state.",fu:"How do you mirror SharePoint permissions into search?",tip:"Index ACL groups as filterable fields and apply them as a mandatory filter from the user's Entra token — this is the classic enterprise question."}]},

{t:"Azure OpenAI, Azure ML and operations", b:["int","prod","azure","iv"],
how:"Azure OpenAI gives OpenAI models inside your tenant with private networking, Entra ID auth, content filtering, and either pay-as-you-go or provisioned throughput units for guaranteed capacity. Azure ML covers training, registries, pipelines and managed endpoints. API Management fronts APIs with policies and quotas. Key Vault holds secrets. Application Insights and Azure Monitor provide traces and metrics.",
prod:"Capacity is the recurring Azure OpenAI issue: quotas are per-region and per-model, so production designs use multiple deployments across regions with a routing layer, and provisioned throughput for the baseline. This is exactly the kind of operational detail Azure interviewers probe.",
qs:[{q:"How do you handle Azure OpenAI rate limits in production?",a:"Deploy the model in several regions, put an LLM gateway (or API Management) in front to load-balance and fail over between deployments, use provisioned throughput units for predictable baseline load and pay-as-you-go for burst, implement backoff with jitter on 429s, and cache aggressively. Monitor per-deployment token consumption against quota and alert before saturation.",fu:"Why is API Management often used here?",tip:"Policy-based routing, retries, token counting and per-consumer quotas without changing application code."}]}]});

MODULES.push({
id:"gcp", n:"28c", title:"Cloud — GCP", pri:2, tags:["gcp","prod"],
intro:"Strong on serverless containers, data analytics and Vertex AI as a single AI platform.",
topics:[
{t:"Compute and containers", b:["int","prod","gcp"],
table:{head:["Service","What","AI use"],rows:[
["Compute Engine","VMs with GPUs and TPUs","Self-hosted inference, training"],
["GKE (Autopilot or Standard)","Managed Kubernetes","GPU inference, full platform control"],
["Cloud Run","Serverless containers, scale to zero, GPU support available","Excellent default for AI APIs and workers"],
["Cloud Functions","Event-driven functions","Storage triggers, glue"]]},
how:"Cloud Run is the standout: request-based autoscaling, scale to zero for spiky internal tools, concurrency per instance that suits async I/O-bound AI services, and simple revision-based traffic splitting for canaries.",
qs:[{q:"Why is Cloud Run a good fit for an AI API?",a:"Concurrency per instance maps well to async I/O-bound LLM calls, so one instance serves many waiting requests; scaling is request-driven rather than CPU-driven, which is the right signal for this workload; and revision traffic splitting gives canary deploys with no extra infrastructure. The caveats are request timeout limits and cold starts, which you manage with a minimum instance count.",fu:"When would you move to GKE?",tip:"Heavy GPU scheduling, service mesh needs, or multi-cloud portability of manifests."}]},

{t:"Data, messaging and cache", b:["int","prod","gcp"],
table:{head:["Service","What","AI use"],rows:[
["Cloud Storage","Object storage","Documents, artefacts, datasets"],
["Cloud SQL","Managed Postgres/MySQL","Metadata, ACLs, pgvector"],
["AlloyDB","Postgres-compatible, high performance, with vector support","Larger pgvector workloads"],
["BigQuery","Serverless analytics warehouse, with vector search","Trace and cost analytics, offline eval aggregation, embeddings at analytical scale"],
["Pub/Sub","Global messaging","Ingestion events, fan-out, replay via snapshots"],
["Memorystore","Managed Redis","Cache, rate limits"],
["Vertex AI Vector Search","Managed ANN (ScaNN-based)","Large-scale vector retrieval"]]},
prod:"BigQuery is the differentiator for AI observability on GCP: stream every request trace with tokens and cost, then answer cost-attribution and quality-trend questions in SQL over billions of rows without building a pipeline.",
qs:[{q:"Where would you analyse LLM cost and quality trends on GCP?",a:"Stream structured trace events to BigQuery via Pub/Sub, partitioned by day and clustered by tenant and feature. Then cost per tenant, token growth per prompt version, and judge-score trends are all SQL queries, with Looker Studio or Grafana on top. It avoids building a bespoke analytics store.",fu:"How do you keep PII out of BigQuery?",tip:"Redact before publishing the event and keep content behind a separate access-controlled dataset with short retention."}]},

{t:"Vertex AI and operations", b:["int","prod","gcp"],
how:"Vertex AI covers model access (Gemini and third-party models via Model Garden), embeddings, fine-tuning, pipelines, a feature store, Vector Search, and Agent Builder for managed RAG and agents. Secret Manager for credentials, Cloud Monitoring and Cloud Trace for telemetry, IAM with workload identity for service authentication.",
qs:[{q:"Sketch a production RAG deployment on GCP.",a:"Cloud Storage for documents with a bucket notification to Pub/Sub; Cloud Run ingestion workers parsing, chunking and embedding with Vertex AI embeddings; vectors in Vertex AI Vector Search with metadata filters; Cloud SQL for metadata and ACLs; Memorystore for the semantic cache and rate limits; a Cloud Run API service calling Gemini via Vertex AI; Secret Manager for credentials; traces and request events streamed to BigQuery for cost and quality analytics; Cloud Armor and a load balancer at the edge.",fu:"How do you keep it in one region for data residency?",tip:"Pin every service's region including the model endpoint, and verify the embedding and generation models are available there."}]}]});

MODULES.push({
id:"terraform", n:"29", title:"Terraform & IaC", pri:2, tags:["prod"],
intro:"Infrastructure as versioned code. Interviewers want to hear about state, modules and blast radius.",
topics:[
{t:"Core concepts: providers, resources, variables, modules, state", b:["int","prod","code"],
what:"Declarative infrastructure: providers talk to cloud APIs, resources describe desired state, variables parameterise, outputs expose values, modules package reusable groups, and state maps configuration to real resources.",
how:"State must live in a remote backend (S3 with DynamoDB locking, or Terraform Cloud) so a team cannot corrupt it with concurrent applies. Separate state per environment via workspaces or separate directories. Plan in CI on every PR, apply on merge with manual approval for production.",
code:{lang:"hcl",src:`terraform {
  required_version = "~> 1.9"
  backend "s3" {
    bucket         = "acme-tfstate"
    key            = "ai-platform/prod/terraform.tfstate"
    dynamodb_table = "tf-locks"          # prevents concurrent apply
    encrypt        = true
  }
}

module "rag_platform" {
  source = "../../modules/rag-platform"

  env                 = "prod"
  vpc_cidr            = "10.40.0.0/16"
  api_min_capacity    = 3
  api_max_capacity    = 40
  db_instance_class   = "db.r6g.xlarge"
  redis_node_type     = "cache.r7g.large"
  opensearch_capacity = { data_nodes = 3, instance = "r6g.xlarge.search" }
  bedrock_models      = ["anthropic.claude-3-5-sonnet", "amazon.titan-embed-text-v2"]
  tags                = { owner = "ai-platform", cost_center = "rd-204" }
}

output "api_endpoint" { value = module.rag_platform.alb_dns_name }`},
qs:[{q:"Why is remote state with locking non-negotiable?",a:"State is the source of truth mapping code to real resources. Local state cannot be shared, is lost with the laptop, and concurrent applies without a lock produce divergent state and duplicated or orphaned infrastructure. S3 plus DynamoDB locking, or Terraform Cloud, with encryption because state contains sensitive values.",fu:"What do you do when state drifts from reality?",tip:"terraform plan to see the drift, import for resources created out of band, and treat manual console changes as an incident, not a shortcut."}]},

{t:"Production patterns and an AI platform example", b:["adv","prod"],
how:"Structure: reusable modules for networking, data stores, the API service and observability; thin per-environment root configurations; variables validated with type constraints; no secrets in tfvars (read from Secrets Manager or inject at apply time); mandatory tags for cost attribution; and a plan-review gate in CI with policy checks (OPA/Sentinel) for guardrails like 'no public S3 buckets'.",
list:["VPC with private subnets; only the load balancer is public.","ECS Fargate or EKS for the API and workers, with autoscaling policies.","Aurora Postgres with automated backups and a read replica.","ElastiCache Redis with an eviction policy and encryption in transit.","OpenSearch or a managed vector store, sized by expected vector count.","MSK or SQS for ingestion, with DLQs and alarms on depth.","S3 buckets with versioning, lifecycle rules and KMS encryption.","IAM roles per service, least privilege, no shared credentials.","Secrets Manager entries with rotation for provider keys.","CloudWatch dashboards and alarms, plus log groups with retention set.","WAF rules on the public endpoint.","Budget alarms so a runaway LLM bill pages someone."],
qs:[{q:"How do you avoid a Terraform change taking down production?",a:"Small modules with narrow blast radius, separate state per environment, plan output reviewed in the PR, policy checks on dangerous changes, apply gated behind approval, and lifecycle prevent_destroy on stateful resources like databases and buckets. I also read the plan for replacements — a forced replacement of a database is the classic 3am incident.",fu:"What do you do about resources changed by hand in the console?",tip:"Import them and then lock down console write access — say the process fix, not just the command."}]}]});
</script>

MODULES.push({
id:"sysdesign", n:"30", title:"AI System Design Fundamentals", pri:3, tags:["sd","prod","iv"],
intro:"The framework to run in every design round, plus the component vocabulary. Structure is what gets scored — candidates who jump to a diagram without requirements lose the round in the first two minutes.",
topics:[
{t:"The interview framework", b:["int","adv","sd","iv"],
what:"A repeatable 45-minute structure for any AI system design question.",
list:["Clarify (3–5 min): who uses it, what must it do, what scale, what latency, what budget, what data, what compliance. Ask about the corpus size and update frequency — it drives every retrieval decision.","State functional and non-functional requirements explicitly, and write them down.","Estimate scale: QPS, peak multiplier, document count, tokens per request, storage, cost per month. Round numbers, stated out loud.","Draw the high-level architecture: request path first, then the data/ingestion path, then the cross-cutting planes.","Define the API contract for the two or three endpoints that matter.","Design the data model, including the vector store schema and metadata.","Add caching, async processing and the AI-specific layers (retrieval, reranking, gateway, guardrails).","Cover security, multi-tenancy and access control.","Cover observability, evaluation and failure handling.","Discuss scaling, bottlenecks and cost optimisation.","State trade-offs you deliberately made, and what you would do differently at 10× scale."],
prod:"Spend real time on requirements and scale. The single most common failure is designing a beautiful architecture for a problem nobody defined.",
qs:[{q:"You are given 'design an enterprise RAG chatbot' and 45 minutes. What are your first three questions?",a:"How many documents and how often do they change — that decides ingestion and index architecture. Who can see which documents — that decides whether ACL filtering is a core constraint or an afterthought. And what latency and accuracy expectation exists, because a 10-second research assistant and a 2-second support bot are different systems.",fu:"What if the interviewer says 'you decide'?",tip:"State explicit assumptions and move: '10M documents, 5% change weekly, 2,000 users, p95 under 4 seconds' — then design against them."}]},

{t:"Functional and non-functional requirements", b:["beg","int","sd","iv"],
what:"Functional requirements say what the system does. Non-functional requirements say how well, and they are what actually shape the architecture.",
table:{head:["NFR","Question to ask","Typical AI answer"],rows:[
["Scalability","Peak QPS and growth?","Stateless API, queue-based ingestion, horizontal workers"],
["Availability","What uptime, what degradation is acceptable?","99.9% with fallback models and cached answers"],
["Latency","p95 target, and time-to-first-token?","Stream; cache; cap rerank depth; small model for routing"],
["Consistency","Must a new document be searchable immediately?","Usually eventual — expose an indexing status"],
["Durability","Can we lose a document or a conversation?","S3 as the source of truth; index is rebuildable"],
["Security","Who sees what, what data leaves the boundary?","Per-document ACLs in retrieval filters; PII redaction"],
["Cost","Budget per user per month?","Semantic cache, model routing, token budgets"],
["Quality","What is the acceptance bar?","Faithfulness and context recall thresholds with an eval gate"]]},
qs:[{q:"Which NFR most changes an AI architecture?",a:"Latency and cost together, because they force the interesting decisions: whether you can afford a reranker, how many retrieval passes, whether an agent loop is acceptable, which model tier serves which traffic, and how aggressively you cache. Security ranks alongside them in enterprise settings because per-document access control has to be designed in, not added later.",fu:"How do you trade quality against latency?",tip:"Adaptive routing: cheap single-pass for easy queries, expensive multi-step for hard ones, classified up front."}]},

{t:"Back-of-envelope estimation for AI systems", b:["int","adv","sd","iv"],
what:"The numbers you should be able to produce in your head during an interview.",
list:["QPS: daily active users × requests per user / 86,400, then × 3–5 for peak. 100k DAU × 10 requests = 1M/day ≈ 12 QPS average, ~50 QPS peak.","Tokens: a RAG request is roughly 2,000–4,000 input tokens (system + 5 chunks + history) and 200–500 output tokens.","Cost: 1M requests/day × 3,000 input tokens = 3B input tokens/day. At $0.50 per million input tokens that is ~$1,500/day — which is why caching and routing exist.","Storage: 10M chunks × 1,536 dims × 4 bytes ≈ 61GB of vectors, plus ~1KB text per chunk ≈ 10GB, plus HNSW overhead of 30–100%.","Chunks per document: a 20-page PDF ≈ 40–80 chunks at 500 tokens. 1M documents ≈ 50M chunks.","Embedding cost for ingestion: 50M chunks × 500 tokens = 25B tokens; at $0.02 per million ≈ $500 one-off.","GPU throughput: a 7B model on one A100 with continuous batching serves roughly 1,500–3,000 output tokens/second aggregate — divide by tokens per response for concurrent capacity."],
prod:"Always convert to a monthly bill and say it out loud. 'This design costs about $45k a month at that volume, and here are the three levers that cut it in half' is the answer that gets remembered.",
qs:[{q:"Estimate infrastructure for 10M documents and 50 QPS.",a:"10M documents at ~50 chunks each is 500M chunks — too many for one HNSW index in RAM, so shard or use IVF-PQ with quantisation. Vectors at 768 dims float32 would be 1.5TB, so I would use 768-dim with scalar quantisation to cut it ~4× and shard across nodes. At 50 QPS with a 300ms retrieval budget, that is a handful of replicas per shard. Generation at 50 QPS × 3,000 input tokens is 150k tokens/second inbound, which needs provisioned throughput or a self-hosted fleet — and makes a semantic cache the first thing I build.",fu:"Where does that design break?",tip:"Index build time and re-embedding cost; name the migration plan as the real risk."}]},

qs:[{q:"What would you cut first from this architecture to hit a tight budget?",a:"Nothing from the safety or observability planes — those are how you keep the product. I would cut the reranker to an open-weight self-hosted model instead of a paid API, route most traffic to a smaller generation model with escalation on low confidence, raise the semantic cache hit rate, and reduce retrieval depth. Those four cut cost substantially without removing a capability.",fu:"What would you never cut?",tip:"Per-request tracing and the eval gate — because without them you cannot tell that a cut broke quality."}]}]});

MODULES.push({
id:"lld", n:"32", title:"Low-Level Design", pri:2, tags:["code","sd"],
intro:"SOLID and patterns applied to the abstractions an AI codebase actually needs: providers, retrievers, routers and caches.",
topics:[
{t:"SOLID applied to AI code", b:["int","adv","code","iv"],
table:{head:["Principle","In an AI codebase"],rows:[
["Single responsibility","A chunker chunks; it does not also embed or call the store"],
["Open/closed","Adding a new provider means a new class, not edits to the pipeline"],
["Liskov substitution","Any LLMProvider can replace another without the caller changing behaviour"],
["Interface segregation","Separate Embedder, Reranker and Generator — a reranker should not implement chat"],
["Dependency inversion","The RAG pipeline depends on interfaces; concrete SDKs are injected at the edge"]]},
qs:[{q:"Which SOLID principle saves you the most in an AI codebase and why?",a:"Dependency inversion. Providers, embedding models and vector stores all change — for cost, capability or compliance reasons — and if the pipeline imports SDKs directly, every change is a refactor plus a testing problem. Depending on interfaces makes provider swaps a configuration change and makes the pipeline unit-testable with fakes.",fu:"How do you keep the interface from leaking provider details?",tip:"Return your own value objects (a Completion dataclass), never the SDK's response type."}]},

{t:"Patterns that recur: strategy, factory, adapter, repository, observer", b:["int","adv","code"],
table:{head:["Pattern","AI use case"],rows:[
["Strategy","Swappable chunking strategies, retrieval strategies, routing policies"],
["Factory","Build a provider from config: provider name → concrete client"],
["Adapter","Wrap each vendor SDK behind your own interface"],
["Repository","Hide the vector store and Postgres behind a document/chunk repository"],
["Observer / callbacks","Emit trace, cost and quality events without coupling the pipeline to a vendor"],
["Decorator","Layer retries, caching, rate limiting and metering around a provider"],
["Singleton (careful)","One shared client pool per process, created in lifespan"],
["Chain of responsibility","Guardrail pipeline where each validator can pass, modify or reject"]]},
code:{lang:"python",src:`# Decorator stack: each concern is one class, composed at startup.
class Metered(LLMProvider):
    def __init__(self, inner: LLMProvider, meter): self.inner, self.meter = inner, meter
    async def complete(self, prompt, **kw):
        out = await self.inner.complete(prompt, **kw)
        self.meter.record(out.model, out.prompt_tokens, out.completion_tokens)
        return out

class Cached(LLMProvider):
    def __init__(self, inner, redis, ttl=3600): ...
    async def complete(self, prompt, **kw):
        key = sha256(f"{self.scope}:{prompt}:{kw}".encode()).hexdigest()
        if hit := await self.redis.get(key): return Completion(**json.loads(hit))
        out = await self.inner.complete(prompt, **kw)
        await self.redis.set(key, out.to_json(), ex=self.ttl)
        return out

llm = Metered(Cached(Retrying(OpenAIProvider(client)), redis), meter)`},
qs:[{q:"Design a model router.",a:"A Router holds an ordered list of rules, each a predicate over the request (token count, task type, tenant tier, required capability) mapping to a provider and model. It resolves a candidate list, and a fallback chain tries them in order on failure. Each provider is wrapped in retry, cache and metering decorators. Rules live in configuration so routing changes without a deploy, and every decision is logged with the rule that matched so routing is debuggable.",fu:"How do you test it?",tip:"Table-driven tests over request fixtures asserting the selected model — deterministic and cheap."}]},

{t:"AI-specific LLD: the abstractions worth writing", b:["adv","prod","code"],
list:["LLMProvider: complete, stream, with typed usage. One implementation per vendor.","Embedder: embed_documents, embed_query (they differ — asymmetric models need prefixes).","VectorStore: upsert, search with filters, delete_by_filter, and a compatibility test suite every implementation must pass.","Reranker: score(query, documents) → ordered results.","Retriever: a strategy interface so hybrid, multi-query and parent-document variants are interchangeable.","PromptManager: render(name, version, variables) with the version returned for logging.","CacheManager: exact and semantic layers behind one get/set keyed by tenant and scope.","GuardrailPipeline: ordered validators, each returning pass, modify or reject.","AgentTool: schema, authorise(principal), execute — authorisation is part of the interface, not an afterthought."],
code:{lang:"python",src:`class VectorStore(Protocol):
    async def upsert(self, chunks: list[Chunk]) -> None: ...
    async def search(self, vector: list[float], k: int,
                     flt: Filter | None = None) -> list[ScoredChunk]: ...
    async def delete_by_filter(self, flt: Filter) -> int: ...

class RAGPipeline:
    """Depends only on interfaces — every dependency is injected."""
    def __init__(self, embedder: Embedder, store: VectorStore,
                 lexical: LexicalIndex, reranker: Reranker,
                 llm: LLMProvider, prompts: PromptManager,
                 guards: GuardrailPipeline, cache: CacheManager):
        ...

    async def answer(self, q: str, principal: Principal) -> Answer:
        if hit := await self.cache.get(q, principal.scope): return hit
        flt = Filter.from_principal(principal)                 # ACL, server-side
        dense, sparse = await asyncio.gather(
            self.store.search(await self.embedder.embed_query(q), 50, flt),
            self.lexical.search(q, 50, flt))
        top = (await self.reranker.score(q, rrf(dense, sparse)))[:5]
        if not top or top[0].score < RELEVANCE_FLOOR:
            return Answer.refusal(closest=top[:3])
        prompt, version = self.prompts.render("rag_answer", q=q, docs=top)
        out = await self.llm.complete(prompt)
        ans = self.guards.check(Answer.parse(out, top, prompt_version=version))
        await self.cache.set(q, principal.scope, ans)
        return ans`},
qs:[{q:"Why put a compatibility test suite behind the VectorStore interface?",a:"Because stores differ in filter semantics, ID handling and consistency guarantees, and those differences surface as production bugs after a migration. A shared suite every implementation must pass — upsert then search returns it, filters are applied pre-search, deletes are visible — turns 'swap the vector store' from a risky rewrite into a config change with evidence.",fu:"What else would you put in the suite?",tip:"Tenant-isolation assertions — a cross-tenant leak test that must return zero results."}]}]});

intro:"One diagram to memorise and defend. Every component below exists because something went wrong without it.",

{t:"The reference request path", b:["adv","prod","sd","iv"],
flow:[["User","web, mobile, API client"],["CDN","static assets, edge termination"],["WAF","injection and bot filtering, IP reputation","fire"],["API Gateway","authn, quotas, versioning, usage plans"],["Load balancer","least-outstanding-requests, connection draining"],["FastAPI service","validation, sessions, SSE streaming","teal"],["Auth + authorisation","JWT verify, tenant and role resolution","fire"],["AI orchestrator","prompt assembly, graph control flow, budgets","amber"],["Redis cache","exact + semantic answer cache","teal"],["Retriever","hybrid: dense + BM25","teal"],["Fusion (RRF) → Reranker","cross-encoder, top-5","amber"],["Vector DB + lexical index","ACL pre-filtered","teal"],["LLM gateway","routing, fallback, token accounting, prompt cache","amber"],["LLM provider","managed API or self-hosted vLLM"],["Guardrails + citations","output validation, PII scan, groundedness","fire"],["Streamed response + trace"]],
side:[["PostgreSQL","documents, ACLs, users, feedback, audit"],["Kafka / SQS","ingestion, evals, analytics events"],["Object storage","raw files, index snapshots"],["Workers","parse, chunk, embed, index"],["Observability","OTel traces, metrics, cost"],["Evaluation","offline suite + online sampling"],["Guardrail models","injection, PII, toxicity"],["CI/CD","tests, eval gate, canary"],["Kubernetes","workload scheduling, HPA"],["Secrets manager","keys with rotation"]],
prod:"Read it as three planes. The request plane must be fast and stateless. The data plane (ingestion, indexing) must be async, idempotent and replayable. The control plane (observability, evaluation, CI/CD, secrets) is what makes the other two operable.",
qs:[{q:"Explain why each of the WAF, gateway and load balancer exists — is that not redundant?",a:"They solve different problems. The WAF filters malicious traffic on content patterns before it costs you anything. The gateway is the identity and quota boundary: it authenticates, enforces per-key limits and versions the API. The load balancer distributes to healthy instances with connection draining. Collapsing them is possible at small scale, but you lose either abuse protection or quota enforcement, and for an AI product where one request can cost real money, quota enforcement is a financial control.",fu:"Which would you drop first for a startup MVP?",tip:"The CDN and possibly the WAF; keep the gateway because per-key quotas protect the bill from day one."},
{q:"Where does an LLM gateway earn its place?",a:"It centralises everything you would otherwise duplicate: provider routing and fallback, retry policy, token and cost accounting per tenant, prompt caching, rate limiting per key, model version pinning, and a single place to add a new provider. Without it, cost attribution and failover logic get scattered across every feature.",fu:"Build or buy?",tip:"A thin internal service is usually 300 lines; say you would build unless you need multi-team policy management, then LiteLLM or a commercial gateway."}]},

qs:[{q:"A user reports a wrong answer from three days ago. What do you need to have built to investigate?",a:"A trace id surfaced to the user or logged against their session, spans covering retrieval with chunk ids and scores, the rendered prompt or its hash plus prompt version, the model and version, decoding parameters, guardrail verdicts, and the raw response — with a retention window long enough to cover support cycles. With those, the investigation is a query; without them, it is unanswerable.",fu:"What if content is redacted in logs?",tip:"Keep doc ids and scores (not content) always, and content behind short-retention gated storage — that balance is the right answer."}]}]});
