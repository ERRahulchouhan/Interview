<header><h1>AI / ML / GenAI Interview Q&amp;A</h1><p>Each answer is written the way you would say it in an interview, followed by tools, and when/why to use them. Click a question to open it.</p>
<input id="s" type="search" placeholder="Search questions…" aria-label="Search"></header>
<main id="m"></main>
<script>
const D=[
["RAG, LLMs and Agents",[
["How does the chatbot use MCP (Model Context Protocol)?","MCP is an open standard that lets the LLM talk to external tools and data through a uniform client-server interface. In our chatbot the app is the MCP client; MCP servers expose tools (search docs, query DB, create ticket) with JSON schemas. The LLM sees the tool list, decides which to call, the client executes it, and the result goes back into the context for the final answer.","MCP SDK (Python/TS), FastAPI, Claude/OpenAI. Why: one integration works for many tools instead of custom glue. When: many tools/data sources, need swap-able models."],
["Why might companies not immediately adopt a newer or highly rated AI model?","Benchmarks are not production. Companies worry about security/compliance review, data residency, cost and latency at scale, regression on their own prompts, vendor lock-in, SLAs, and the effort to re-test and re-tune prompts. A model change can silently break downstream behaviour.","Tools: internal eval set, LangSmith/Ragas, shadow deployment, A/B test. When: migrate only after your own evals and cost checks pass."],
["Why might companies prefer Claude over newer or open-source models?","Strong instruction following, long context, low hallucination and safety behaviour, good coding and enterprise terms (no training on customer data, SOC2, available via AWS Bedrock / Google Vertex). Open-source gives control and privacy but needs GPU ops, tuning and guardrails that cost team time.","Tools: Claude API, Bedrock, Vertex AI vs Llama/Mistral with vLLM. Choose hosted when speed-to-market and reliability matter; open-source when data cannot leave your network or at very high volume."],
["Does using Cursor create a risk of data leakage?","Yes, it can: code and prompts are sent to a cloud model. Risks are secrets in files (.env, keys), proprietary code being sent, and third-party retention. Mitigate with Privacy Mode (no retention/training), .cursorignore, secret scanning, enterprise policy, and keeping credentials out of the repo.","Tools: Cursor Privacy Mode, .cursorignore, gitleaks, Vault/AWS Secrets Manager. When: always for company code; use self-hosted models for highly regulated code."],
["What is tokenization and why is it used in LLMs?","Tokenization splits text into sub-word units (tokens) and maps them to integer IDs, since models only handle numbers. Sub-word schemes (BPE, WordPiece, SentencePiece) keep vocabulary small, handle rare/unknown words, and control cost and context limits.","Tools: tiktoken, Hugging Face tokenizers. When: counting cost/context, chunking by token size, training."],
["What do top-p, top-k, overlap, temperature mean? (Also: what is Top-k sampling?)","Temperature scales randomness: low (0-0.3) = deterministic, high = creative. Top-k sampling keeps only the k most probable next tokens and samples among them. Top-p (nucleus) keeps the smallest set of tokens whose cumulative probability ≥ p. Overlap is the number of tokens/characters repeated between neighbouring chunks so context is not lost at boundaries.","Tools: API params (temperature, top_p, top_k), LangChain splitters (chunk_overlap). Use low temperature for RAG/factual answers, higher for brainstorming; overlap ~10-20% of chunk size."],
["What is the difference between splitting and chunking?","Splitting is the mechanical act of cutting text (by characters, sentences, separators). Chunking is the broader design of producing retrieval-ready pieces: size, overlap, semantic/structural boundaries, metadata. So splitting is a step; chunking is the strategy.","Tools: RecursiveCharacterTextSplitter, semantic chunker, Unstructured, LlamaIndex. When: use structure-aware chunking for PDFs with headings and tables."],
["Explain the Transformer architecture. How does self-attention work and how did it replace RNNs?","A transformer has an encoder/decoder stack of self-attention + feed-forward layers with residuals, layer norm and positional encoding. In self-attention every token makes Query, Key, Value vectors; attention = softmax(QKᵀ/√d)·V, so each token weighs every other token. Multi-head attention learns different relations. Unlike RNNs, it processes all tokens in parallel (fast training on GPUs) and handles long-range dependency without vanishing gradients.","Tools: PyTorch, Hugging Face Transformers. When: any NLP/LLM/vision task; RNNs only for tiny streaming problems."],
["What is the advantage of reasoning in LLMs?","Reasoning (chain-of-thought or reasoning models) lets the model break a problem into steps, improving accuracy on math, code, planning and multi-hop questions, and making answers checkable. Trade-off is more tokens, latency and cost.","Tools: CoT prompting, Claude extended thinking, o-series, ReAct. When: complex multi-step tasks, not for simple lookups."],
["What is an AI agent and how does it work?","An agent is an LLM in a loop that can plan, call tools, observe results and continue until the goal is done. Loop: think → choose tool → execute → observe → repeat, with memory and guardrails.","Tools: LangGraph, CrewAI, OpenAI Agents SDK, Claude tool use. When: tasks needing dynamic decisions and external actions; use a fixed workflow when steps are known."],
["How did you implement tool calling, and did you use any standard?","I defined tools with name, description and JSON-schema parameters, sent them with the prompt, the model returned a structured tool call, my code validated args and executed it, then returned the result as a tool message. For standardisation I used MCP and the provider function-calling format, with Pydantic validation.","Tools: OpenAI function calling, Claude tool use, MCP, Pydantic. Why: structured, safe, auditable actions."],
["Which API integration methods and providers/LLM platforms have you worked with?","REST (requests/httpx), streaming (SSE), webhooks, async calls, and SDKs, with auth via API keys/OAuth, retries with backoff and rate-limit handling. Providers: OpenAI, Anthropic Claude, Google Gemini, Azure OpenAI, AWS Bedrock, Hugging Face.","Tools: httpx, tenacity, FastAPI. When: SSE for chat streaming, webhooks for event-driven, batch APIs for cheap offline jobs."]
]],
["RAG Systems",[
["How do you design a RAG pipeline from scratch? (chunking, embedding, retrieval)","1) Ingest and clean documents, extract text/tables. 2) Chunk (300-800 tokens, 10-20% overlap, respect headings) and attach metadata. 3) Embed chunks and store in a vector DB. 4) At query time embed the query, retrieve top-k (hybrid BM25 + vector), optionally rerank. 5) Build a prompt with retrieved context and citations, generate, then evaluate with RAGAS.","Tools: Unstructured/PyMuPDF, OpenAI/BGE embeddings, FAISS/Qdrant/pgvector, Cohere rerank, LangChain/LlamaIndex. Why: grounds the LLM in private, fresh data without retraining."],
["Is it mandatory to vectorize the query in RAG?","For semantic/dense retrieval yes, the query must be embedded with the same model as the documents to live in the same vector space. Not mandatory for keyword retrieval (BM25) or SQL/metadata filters, and hybrid search uses both.","Tools: same embedding model, Elasticsearch/BM25. When: use keyword for exact IDs/codes, vector for meaning."],
["How do you calculate relevance in RAG?","Retrieval relevance: cosine similarity / dot product between query and chunk embeddings, BM25 score for keywords, and a cross-encoder reranker score for precision. Evaluation relevance: RAGAS context precision/recall, answer relevancy, plus recall@k, MRR, nDCG.","Tools: FAISS, sentence-transformers cross-encoder, Cohere Rerank, RAGAS. Set a similarity threshold to drop weak chunks."],
["How did you mitigate hallucinations in the RAG system?","Grounded prompts (“answer only from context, else say I don't know”), good chunking, hybrid search + reranking, low temperature, forcing citations, a faithfulness check (LLM-as-judge or RAGAS faithfulness), similarity thresholds for refusal, and human feedback loops.","Tools: RAGAS, Guardrails, NeMo Guardrails, LangSmith. When: always in regulated/enterprise use."],
["What is RAGAS and how did you use it? How is it different from BLEU?","RAGAS is an evaluation framework for RAG with metrics: faithfulness, answer relevancy, context precision, context recall. I ran it on a golden question set after every change to chunking/retriever/prompt. BLEU only measures n-gram overlap with a reference text, which ignores meaning and cannot judge retrieval or grounding.","Tools: ragas, LangSmith, TruLens. Use RAGAS for RAG quality; BLEU only for translation-like tasks."],
["Why did you choose FAISS over another vector database?","FAISS is fast, free, runs in-process, supports flat/IVF/HNSW indexes and suits prototypes and mid-size datasets. The trade-off is no built-in metadata filtering, persistence and multi-user management, so for production scale and filtering you'd move to Qdrant, Pinecone, Weaviate or pgvector.","Tools: FAISS, Qdrant, pgvector. When: FAISS for speed/low cost; managed DB when you need filters, updates and HA."],
["Where was document metadata stored, and where was the original document stored for citations?","Metadata (doc_id, version, source, page, hash, timestamp, chunk_id) sits alongside vectors in the vector store payload and also in a relational DB (PostgreSQL) as source of truth. Original files live in object storage (S3/Azure Blob) with versioning; chunks carry the file URI and page number so answers can cite and link back.","Tools: S3, PostgreSQL, Qdrant payload. Why: traceability, audit, re-indexing."],
["Version 2 of a document is uploaded. How do you avoid duplicate/conflicting data in the vector DB and identify it as an updated version?","Give each document a stable document_id (filename/path/business key) and compute a content hash (SHA-256). On upload: same id + different hash = new version; same hash = skip (true duplicate). If the id is unknown, fall back to near-duplicate detection using embedding similarity/MinHash on the doc. Then upsert the new chunks, and delete or mark is_active=false for old-version chunks, filtering only active versions at query time.","Tools: hashlib, PostgreSQL registry table, vector DB delete-by-filter, MinHash/datasketch. When: every ingestion run, in a transaction so queries never see a half-updated state."],
["If both documents have the same hash, how do you find the delta? How do you find what is outdated vs new?","Identical hash means identical content, so there is no delta: skip. When hashes differ, do chunk-level diffing: chunk both versions deterministically, hash each chunk. Unchanged chunk hashes are kept untouched; chunks only in old are deleted; chunks only in new are embedded and inserted. For rewritten sections (same place, changed text) match old/new chunks by position/heading plus embedding similarity (e.g. >0.9) and replace them. Text-level diff can use difflib.","Tools: hashlib, difflib, rapidfuzz, embeddings. Why: re-embed only ~30% changed content, saving cost and avoiding duplicates. When: frequently-updated policy/manuals."]
]],
["Deep Learning and NLP",[
["What changed from one-hot/TF-IDF to Word2Vec and modern embeddings, and why did embeddings become popular?","One-hot and TF-IDF are sparse, high-dimensional and capture no meaning (“car” and “automobile” are unrelated). Word2Vec gave dense low-dimensional vectors where similar words are close, but each word has one static vector (“bank” is the same in river bank and money bank). Modern embeddings (BERT, sentence-transformers, OpenAI) are contextual, use transformers, handle sentences/documents and power semantic search and RAG.","Tools: scikit-learn TF-IDF, gensim Word2Vec, sentence-transformers, OpenAI embeddings. Use TF-IDF for cheap keyword baselines, modern embeddings for semantic tasks."],
["What is the role of an activation function? Why is ReLU preferred, and how does it help vanishing gradients?","Activation functions add non-linearity so a network can learn complex patterns; without them many layers collapse into one linear map. ReLU = max(0,x): cheap, sparse, and its gradient is 1 for positive inputs so gradients do not shrink like sigmoid/tanh, which eases vanishing gradients in hidden layers. Downside: dying ReLU (fix: Leaky ReLU).","Tools: PyTorch/TensorFlow. Use ReLU in hidden layers, sigmoid for binary output, softmax for multi-class."],
["What is the difference between ReLU and GELU?","ReLU hard-cuts negatives to zero. GELU is smooth: x·Φ(x), allowing small negative values and smoother gradients; it is used in BERT/GPT transformers and often gives slightly better results at a bit more compute.","Use ReLU for CNNs/simple nets, GELU for transformers."],
["How are weights updated in neural-network training? Difference between gradient descent and loss function?","The loss function measures error between prediction and target (e.g. cross-entropy, MSE). Backpropagation computes gradients of loss w.r.t. weights via the chain rule, and gradient descent updates them: w = w − lr·∂L/∂w. So the loss says how wrong we are; gradient descent is how we reduce it.","Tools: PyTorch autograd, Adam/SGD optimizers, learning-rate schedulers."],
["Difference between batch size and epochs?","Batch size = samples processed before one weight update. Epoch = one full pass over the whole training set. With 1000 samples and batch 100, one epoch = 10 updates.","Larger batch = stable but more memory; more epochs = risk of overfitting, so use early stopping."],
["Why do we use padding in CNN? What is stride? What is pooling and how many types?","Padding adds border pixels so edges are not lost and output size is preserved (“same” padding). Stride is how many pixels the filter moves each step; larger stride shrinks the output. Pooling downsamples feature maps to reduce size and add translation invariance. Types: max pooling, average pooling, global average pooling (and min/sum rarely).","Tools: PyTorch Conv2d/MaxPool2d. Use max pooling for strong features, global average pooling before the classifier."],
["What is data augmentation and why is it used?","Creating modified copies of training data (flip, rotate, crop, noise; for text: synonym swap, back-translation) to increase variety and reduce overfitting, especially on small datasets.","Tools: Albumentations, torchvision transforms, nlpaug. Apply only to training data, never to test data."],
["How do you design a neural network to classify support tickets and prevent overfitting on a small dataset?","Start with a pretrained model (fine-tune DistilBERT or use embeddings + logistic regression) rather than training from scratch. Add dropout, weight decay, early stopping, data augmentation, cross-validation, and keep the model small. Monitor train vs validation loss.","Tools: Hugging Face, scikit-learn, Weights &amp; Biases. When: small data = transfer learning first."],
["Your task is to extract entities from unstructured doctor prescriptions. How do you approach it with NLP?","Digitise (OCR if handwritten/scanned), clean text, annotate a sample (drug, dose, frequency, duration), then use NER: fine-tune a biomedical model (BioBERT / ClinicalBERT) or use an LLM with structured output, then normalise to drug codes (RxNorm) and validate with rules. Evaluate with precision/recall/F1 per entity.","Tools: Tesseract/Textract, spaCy, Hugging Face, Label Studio. Protect PHI (de-identify, compliance)."]
]],
["Python and FastAPI",[
["Why is Python an interpreted language?","Python source is compiled to bytecode which the interpreter (CPython's virtual machine) executes line by line at runtime, without producing a standalone machine-code binary first. That gives portability and dynamic typing, at the cost of speed.","Faster options: PyPy, Numba, Cython."],
["What are sync and async in FastAPI? What is the difference?","Sync (def) endpoints run in a thread pool; a slow call blocks that thread. Async (async def) endpoints run on the event loop and use await so while waiting for I/O (DB, HTTP, LLM call) the server handles other requests. Use async for I/O-bound work; CPU-heavy work should go to a worker/process pool.","Tools: FastAPI, httpx.AsyncClient, asyncpg, Celery. Do not call blocking code inside async def."],
["What is a decorator and why use it in Python?","A decorator is a function that wraps another function to add behaviour without changing its code (logging, auth, caching, timing, retries). Syntax: @decorator above the function; FastAPI's @app.get is one.","Tools: functools.wraps, lru_cache, tenacity."],
["Why use pandas vectorization instead of for loops? When use NumPy or Polars?","Vectorized operations run in optimised C on whole columns, far faster than Python loops. Use NumPy for pure numeric arrays and matrix math; use Polars when data is large (multi-threaded, lazy evaluation, lower memory) or pandas gets slow.","Tools: pandas, NumPy, Polars, DuckDB."],
["How do you structure a Python ML project for reproducibility, testability and CI/CD?","Layout: src/ package, configs/, data/, notebooks/, tests/, pipelines. Pin dependencies (poetry/uv lock), fix random seeds, version data and models (DVC, MLflow), use config files (Hydra/YAML), pytest unit tests, pre-commit (ruff, black), Docker, and GitHub Actions to lint, test, build and deploy.","Tools: DVC, MLflow, pytest, Docker, GitHub Actions. Why: anyone can rerun and get the same result."],
["Coding: filter with a lambda for list [12,33,10,20,25] and given value 21; SQL: rank orders per customer by order date and keep the first two.","Python: keep values greater than 21. SQL: ROW_NUMBER() partitioned by customer, ordered by order_date, then filter rn &lt;= 2. (If the original asked for values smaller than 21, flip the operator.)<pre>list_value = [12, 33, 10, 20, 25]\ngiven_value = 21\nresult = list(filter(lambda x: x &gt; given_value, list_value))  # [33, 25]\n\nSELECT * FROM (\n  SELECT o.*, ROW_NUMBER() OVER (\n    PARTITION BY customer_id ORDER BY order_date) AS rn\n  FROM orders o) t\nWHERE rn &lt;= 2;</pre>","Use ROW_NUMBER for exact top-N, RANK/DENSE_RANK when ties should be kept."]
]],
["Data, Cloud and ML Engineering",[
["How do you optimize a SQL join of a 10M-row table and a 500K-row table in a cloud warehouse?","Filter and select only needed columns before joining, join on indexed/clustered keys of the same data type, broadcast the small (500K) table, partition/cluster on the join or date key, avoid SELECT *, pre-aggregate, and check the query plan for skew and shuffles. Use materialized views for repeated joins.","Tools: Snowflake/BigQuery/Redshift query profile, EXPLAIN. When: always read the plan before tuning."],
["How would you set up a serverless AWS pipeline to ingest daily transaction logs, process with Python and store for ML?","Logs land in S3 (raw) → S3 event or EventBridge schedule triggers Lambda (small) or Glue job (large) for Python/PySpark cleaning → write Parquet to S3 curated zone, catalogued in Glue Catalog and queried via Athena → features go to SageMaker Feature Store/training. Orchestrate with Step Functions, monitor with CloudWatch, alert on failures, add a dead-letter queue.","Tools: S3, Lambda, Glue, Step Functions, Athena, SageMaker. Why: pay per use, no servers to manage."],
["Class imbalance in fraud detection (99% legitimate, 1% fraud)?","Never use accuracy. Use precision, recall, F1, PR-AUC. Handle imbalance with class weights, SMOTE/undersampling (on training data only), threshold tuning, and tree models like XGBoost (scale_pos_weight). Use stratified splits and anomaly detection as a complement.","Tools: imbalanced-learn, XGBoost, scikit-learn. Cost-sensitive thinking: a missed fraud costs more than a false alert."],
["How do you find the optimal number of clusters in K-means for customer segmentation?","Use the elbow method (inertia vs k), silhouette score (higher is better), gap statistic, and most importantly check business interpretability of segments. Scale features first.","Tools: scikit-learn KMeans, silhouette_score, yellowbrick."],
["How do you detect and handle data drift in a cloud production model?","Monitor input feature distributions and predictions vs training baseline using PSI, KS-test or KL divergence; also track performance when labels arrive (concept drift). Alert on thresholds, then investigate, retrain on fresh data, and redeploy via the CI/CD pipeline with canary rollout.","Tools: Evidently AI, SageMaker Model Monitor, Arize, Prometheus/Grafana. When: continuous monitoring for every production model."],
["What is A/B testing and how did you use it?","A/B testing compares a control (A) and a variant (B) on randomly split users to see if a change really improves a metric. Define hypothesis and metric, compute sample size, run for a fixed time, check statistical significance (p-value, confidence interval) and then decide. I used it to compare two prompts/retrievers/models on user satisfaction and answer accuracy.","Tools: scipy/statsmodels, Optimizely, LaunchDarkly, Statsig. Use it before full rollout of any change."],
["What is ABC classification in inventory management?","It ranks items by value contribution (Pareto): A = top ~20% items giving ~70-80% of value (tight control), B = middle (moderate control), C = low-value majority (simple control). Helps prioritise stock, forecasting and ordering effort.","Tools: Excel, pandas (cumulative % of annual consumption value), ERP/SAP. Often combined with XYZ (demand variability)."],
["What is Graph RAG, why do we need it, and how is it different from LangGraph?","Graph RAG builds a knowledge graph (entities and relations) from documents and retrieves by traversing it, so it answers multi-hop and global questions (“how are A and C connected?”) that plain chunk similarity misses. LangGraph is unrelated to that: it is an agent/workflow orchestration framework for building stateful multi-step LLM flows as graphs of nodes. One is a retrieval technique, the other an orchestration tool.","Tools: Neo4j, Microsoft GraphRAG, LlamaIndex KG, LangGraph. Use Graph RAG for relationship-heavy data; LangGraph for agent control flow."]
]]
];
const m=document.getElementById('m');let n=0;
D.forEach(([h,qs])=>{const s=document.createElement('section');s.innerHTML='<h2>'+h+'</h2>';
qs.forEach(([q,a,t])=>{n++;const d=document.createElement('details');
const i=t.search(/\. (Why|When|Use|Choose|Set|Apply|Often|Faster|Do not|Protect|Monitor|Cost|Larger|Use)/);
d.innerHTML='<summary>'+n+'. '+q+'</summary><div class="body"><p><span class="k">Interview answer</span><br>'+a+'</p><div class="tools"><span class="k">Tools, why and when</span><br>'+t+'</div></div>';s.appendChild(d)});m.appendChild(s)});
document.getElementById('s').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('details').forEach(d=>d.style.display=d.textContent.toLowerCase().includes(v)?'':'none')};
</script></body></html>
