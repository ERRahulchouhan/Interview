const D=[];
D.push({c:"Category 1 - RAG Fundamentals (Q1-20)",items:[
["What is RAG and what problems does it actually solve?",
"Socho exam open-book hai. Tumhe sab yaad nahi, par book se dekh ke sahi answer likh sakte ho. RAG matlab AI ko answer dene se pehle 'book' (tumhara data) me se related page dikha dena.",
"RAG = Retrieval-Augmented Generation. Query ke time external knowledge base se relevant text nikalte hain aur LLM ko prompt me dete hain. 3 problems solve hoti hain: (1) knowledge cutoff - LLM ko naya/private data nahi pata, (2) hallucination - bina data ke galat facts bana deta hai, (3) verifiability - source nahi bata sakta. Bina retraining ke generic LLM domain-expert ban jata hai.",
"Company ka HR chatbot: employee puchta hai 'Meri leave policy kya hai?'. ChatGPT ko company policy nahi pata. RAG policy PDF se sahi paragraph nikalta hai aur LLM us paragraph se answer banata hai, saath me 'Source: HR Policy page 4' bhi.",
"Main kahunga: 'RAG LLM ko open-book exam jaisa banata hai. Retrieval se relevant context laate hain, generation se answer banate hain. Isse knowledge cutoff, hallucination aur citation ki problem solve hoti hai, bina model retrain kiye.'"],
["Walk me through the components of a RAG pipeline end-to-end.",
"Do kaam hote hain: pehle library banao (documents ko tod ke store karo), phir jab sawal aaye to library se sahi page dhoondo aur answer likho.",
"Phase 1 Ingestion (offline): load documents -> chunk -> embed -> vector DB me metadata ke saath store. Phase 2 Inference (online): query embed -> top-k similar chunks -> (rerank) -> prompt me context daalo -> LLM answer. Production me query rewriting, hybrid search, reranking, citation, evaluation bhi add hote hain.",
"Library example: Pehle har kitaab ke chhote chhote notes banate ho aur label lagate ho (ingestion). Phir student sawal puchta hai, tum sabse matching 5 notes nikalte ho aur unse jawab likhte ho (inference).",
"Interview me board pe 2 boxes banao: 'Offline: load-chunk-embed-store' aur 'Online: embed query-retrieve-rerank-prompt-generate'. Phir bolo ki production me upar se rewrite, hybrid, rerank, eval lagate hain."],
["When would you choose RAG over fine-tuning?",
"RAG = naya data book me rakh do. Fine-tuning = student ko style sikhana. Facts badalte rehte hain to book update karna aasan hai, student ko dobara padhana mehnga hai.",
"RAG choose karo jab data frequently badalta ho, sources chahiye, data leak ka risk ho, ya corpus bahut bada ho. Fine-tuning choose karo jab tone/format/behaviour sikhana ho ya chhota specialised model chahiye (latency/cost). Practice me dono saath: RAG = kya bolna (facts), fine-tuning = kaise bolna (style).",
"Bank chatbot: interest rates roz badalte hain -> RAG. Chatbot hamesha polite formal Hindi me jawab de -> fine-tuning.",
"'Facts ke liye RAG, style ke liye fine-tuning. Ye alternatives nahi, complements hain.' Ye ek line interviewer ko bahut pasand aati hai."],
["RAG vs longer context windows - when does which win?",
"Agar poori kitaab chhoti hai to seedha saari kitaab AI ko pakda do. Agar library hi bahut badi hai to pehle kaam ke pages chuno.",
"Long context: chhota fixed corpus (ek 200-page contract). RAG: bada corpus (millions docs), data badalta ho, cost-sensitive. Irrelevant text se tokens waste aur 'lost-in-the-middle' se quality girti hai. Best: hybrid - RAG se top 20 chunks, phir long-context model un par reason kare.",
"Ek contract ka sawal -> poora contract context me daalo. Company ke 10 lakh documents me se sawal -> RAG.",
"'Corpus size aur change frequency decide karti hai. Chhota aur static = long context. Bada ya dynamic = RAG. Aksar dono ka hybrid best hota hai.'"],
["What are the failure modes of a basic RAG system?",
"RAG ke 6 jagah galti ho sakti hai, jaise relay race me kahin bhi baton gir sakta hai.",
"(1) Retrieval miss - sahi chunk top-k me nahi aaya. (2) Chunk bahut chhota/bada. (3) LLM context ignore karke apni yaadash se bol deta hai. (4) Galat context ki wajah se grounded-lekin-galat answer. (5) Vocabulary mismatch - user ke words aur doc ke words alag. (6) Outdated index - source badla par embeddings nahi. Har ek ki telemetry honi chahiye.",
"User puchta hai 'refund kab milega?', document me likha hai 'reimbursement timeline'. Words alag hain to retrieval miss ho sakta hai.",
"Interview me 6 failures count karke bolo, aur ek line add karo: 'Main har stage pe log aur metrics lagata hu taaki pata chale galti kahan hui.'"],
["Explain the difference between extractive and generative QA.",
"Extractive = book se line copy-paste kar dena. Generative = book padh ke apne words me samjha dena.",
"Extractive QA document ka exact span nikalta hai: precise, hallucination nahi, par rigid. Generative QA LLM se natural language answer banwata hai: flexible, multi-doc reasoning, par hallucinate kar sakta hai. Modern RAG = generative + constraints (cite karo, context kam ho to refuse karo).",
"Sawal: 'Capital of France?' Extractive: doc se 'Paris' utha leta hai. Generative: 'France ki rajdhani Paris hai, jo Seine nadi ke kinare hai.'",
"'Modern RAG generative hai par extractive jaisi safety ke saath: citations aur refusal rules lagate hain.'"],
["When is RAG the wrong tool for the job?",
"Har kaam ke liye hathoda nahi chalta. Kabhi calculator ya seedha SQL better hota hai.",
"RAG galat hai jab: (1) external knowledge chahiye hi nahi (translate karo), (2) data structured hai - SQL better, (3) exact calculation/aggregation - tools/agents, (4) corpus chhota hai - context me daal do, (5) latency sub-100ms, (6) poore corpus par reasoning chahiye, sirf kuch docs par nahi.",
"'Is mahine ki total sales kitni?' -> SQL SUM query chahiye, vector search nahi.",
"'Main RAG tabhi use karta hu jab unstructured knowledge chahiye. Trendy hai isliye nahi.' Ye maturity dikhata hai."],
["What is the role of embeddings in RAG?",
"Embedding matlab har sentence ko ek 'GPS location' dena. Same matlab wale sentences paas paas hote hain.",
"Embeddings text ke dense vectors hain jo meaning capture karte hain. Docs aur query same space me embed hote hain, aur retrieval = query vector ke sabse paas ke vectors dhundna (cosine similarity). Embedding model ki quality retrieval ka sabse bada factor hai; kharab embedding ko achha LLM nahi bacha sakta.",
"'Car' aur 'automobile' ke vectors paas honge, 'banana' door. Isliye 'gaadi kharidna' search karne par 'vehicle purchase' wala doc bhi mil jata hai.",
"'Embedding meaning ko numbers me badalta hai. Retrieval ki quality embedding pe depend karti hai, isliye main 2-3 models apne data pe benchmark karta hu.'"],
["What is the difference between RAG and search?",
"Search tumhe books ki list deta hai, padhna tumhe padta hai. RAG khud padh ke short answer bata deta hai.",
"Search relevant documents return karta hai aur human padhta hai. RAG chunks retrieve karke LLM se grounded natural answer banwata hai. Search relevance ranking optimize karta hai; RAG ko faithfulness, citation aur synthesis bhi chahiye.",
"Google 10 blue links deta hai (search). ChatGPT with browsing summary deta hai (RAG jaisa).",
"'Search wahan khatam hota hai jahan RAG shuru hota hai.'"],
["What's the difference between a retriever and a reranker?",
"Retriever = jaldi se 50 possible log chun lena. Reranker = unka interview leke best 5 chunna.",
"Retriever (vector similarity) fast first-pass karta hai, top-k (50) deta hai, recall optimize karta hai. Reranker (cross-encoder) query+chunk ko saath padh ke precise score deta hai aur top-N (5) return karta hai, precision optimize karta hai.",
"Naukri: resume screening se 50 candidates shortlist (retriever), phir interview se 5 final (reranker).",
"'Retriever wide net, reranker tight filter. Recall pehle, precision baad me.'"],
["Can RAG work without an LLM?",
"Bina 'likhne wale' ke sirf 'dhundne wala' bacha. Wo search hai, poora RAG nahi.",
"Retrieval + extractive QA (BERT reader) possible hai par us ko RAG nahi kehte, kyunki RAG me G = Generation hai jo LLM synthesis karta hai. Bina LLM ke search ya extractive QA mile ga.",
"Sirf FAQ me se matching line dikhana = search. Us line se friendly answer banana = RAG.",
"'Technically retrieval alag ho sakta hai, par Generation ke bina use RAG nahi kehte.'"],
["What does \"grounding\" mean in RAG?",
"Grounding matlab AI ke jawab ko 'saboot' se jodna. Jaise answer ke saath page number likhna.",
"Response ko specific retrieved chunks se tie karna taaki trace ho sake (document X, paragraph 3). Ungrounded answer model ki parametric memory se aata hai. Strong grounding = relevant context dena + prompt/validation se enforce karna ki model usi ko use kare.",
"Answer: 'Notice period 60 din hai [Source: HR_Policy.pdf, p.4]'. Ye grounded hai.",
"'Grounded answer ka source traceable hota hai. Main prompt me citations mandatory karta hu aur output validate karta hu.'"],
["What is \"context stuffing\" and why is it a problem?",
"Exam me poori kitaab ek saath pakda dena aur bolna 'dhoondh lo'. Time, paisa dono waste.",
"Zyada se zyada retrieved text prompt me thoos dena. Problems: cost tokens ke saath badhta hai, latency badhti hai, lost-in-the-middle, aur irrelevant context model ko confuse karta hai. Better: zyada retrieve karo, tight rerank karo, sirf top 3-5 do.",
"50 chunks (20,000 tokens) ke bajay 4 best chunks (1,500 tokens): sasta, tez aur zyada accurate.",
"'Retrieve wide, rerank tight, pass only top 3-5.'"],
["What's the \"lost in the middle\" problem?",
"Lambi list sunte waqt shuru aur ant yaad rehta hai, beech ka bhool jaate hain. LLM bhi aisa karta hai.",
"Liu et al. 2023: LLM context ke start aur end par zyada dhyan deta hai, beech ki info par accuracy gir jati hai. RAG me ordering matter karti hai: best chunk pehle ya aakhir me rakho. Kuch systems rank1 pehle, rank2 last, baaki beech me rakhte hain.",
"10 chunks me sahi jawab chunk #5 me hai to model miss kar sakta hai. Use #1 pe rakhne se sahi answer milta hai.",
"'Isliye main chunks ko relevance se reorder karta hu aur context chhota rakhta hu.'"],
["What is a \"chunk\" in RAG?",
"Chunk = badi kitaab ka ek chhota tukda (jaise ek paragraph) jisko alag se search kiya ja sake.",
"Chunk typically 200-1000 tokens ka text unit hai jo independently embed aur index hota hai. Poora document embed karna meaningless hai, isliye split karte hain. Retriever top-k chunks return karta hai, documents nahi. Chunk boundaries ka retrieval quality par bada asar hai.",
"100-page PDF -> ~300 chunks. Sawal ka jawab chunk #142 me hai to wahi retrieve hoga.",
"'Chunk retrieval ki atomic unit hai, isliye chunking strategy sabse zyada impact wali choices me se ek hai.'"],
["What metadata should you store with each chunk?",
"Har chunk par ek label/sticker lagana: kis kitaab se hai, kaun sa page, kab add hua, kaun padh sakta hai.",
"Minimum: doc ID, source URL/path, chunk index, offsets, ingestion timestamp, access-control tags (user_id, team_id, role). Extra: title, section, author, date, language, doc type, domain tags (product, region, customer tier) jisse query time pe filter kar sako.",
"Chunk: 'Refund 7 din me' + metadata {doc:'policy.pdf', page:4, team:'support', date:'2026-01'}. Filter: sirf 2026 ke support docs.",
"'Metadata se filtering, citations aur access control teeno possible hote hain. Security ke liye tenant/role tag zaroori hai.'"],
["What's the difference between sync and async RAG?",
"Sync = pura jawab ban ke ek saath milta hai. Streaming = jawab ek ek shabd karke aata rehta hai, jaise ChatGPT.",
"Sync: query -> retrieve -> generate -> return, sab user ko block karta hai. Async/streaming: retrieval block karta hai par generation tokens stream hote hain. Speculative retrieval me user ke type karte hi retrieval shuru ho jata hai. Production me generation streaming almost always hoti hai.",
"Streaming se user ko 5 sec ke bajay 0.8 sec me pehla shabd dikhta hai, perceived latency kam.",
"'Total time same ho sakta hai, par streaming se time-to-first-token kam hota hai, aur user experience behtar.'"],
["What's a \"context window budget\" and how do you manage it?",
"Bag ki limited jagah: kitab, tiffin, bottle sab isi me. Prompt ki bhi limit hoti hai, sabko hissa dena padta hai.",
"Total tokens per request ko system prompt, history, retrieved context aur output me baantna. Example: 500 system, 2000 history, 4000 chunks, 2000 output. Budget tight ho to history chhoti, kam chunks, chhote chunks ya output truncate.",
"8K window: 500 + 2000 + 4000 + 1500 = 8000. Naye chunk ke liye purani history summarize karni padegi.",
"'Main budget pehle design karta hu aur drop priority define karta hu: pehle purani history, phir low-rank chunks.'"],
["What is the difference between recall and precision in RAG retrieval?",
"Recall = jitne sahi answers the, kitne mile? Precision = jo mile, unme kitne sahi the?",
"Recall = relevant chunks me se kitne retrieve hue (miss = recall failure). Precision = retrieved me se kitne relevant (kachra = precision failure). k badhane se recall badhta hai par precision girta hai. Fix: wide retrieve (recall) + rerank (precision).",
"5 sahi chunks hain. Tumne 10 laye, 4 sahi: recall 4/5 = 80%, precision 4/10 = 40%.",
"'Recall retrieval ka kaam, precision reranker ka kaam. Dono ke liye two-stage pipeline.'"],
["What's a \"naive RAG\" and how does it differ from production RAG?",
"Naive RAG = pencil box ka basic version. Production RAG = poora tool kit with safety, speed, monitoring.",
"Naive: chunk -> embed -> store -> top-k -> prompt -> generate. Production add karta hai: query rewriting/decomposition, hybrid retrieval, reranking, metadata filters, multi-step retrieval, citation enforcement, evals, caching, fallbacks, observability, prompt versioning.",
"Naive chatbot demo me chalta hai. Production me 'refund policy for premium plan in India' jaise queries ke liye filters, rerank aur eval chahiye.",
"'Naive se production ka gap hi asli engineering hai: evals, observability, hybrid search aur reranking.'"]
]});
D.push({c:"Category 2 - Chunking & Embeddings (Q21-40)",items:[
["How do you pick the right chunk size for your use case?",
"Kapde ka size andaaze se nahi, naap ke lete hain. Chunk size bhi test karke chunte hain.",
"Default 500 tokens + 50 overlap. Adjust karo: doc structure (Q&A -> chhota, legal -> bada), embedding model ki limit, queries specific hain ya broad, aur LLM ka context budget. Golden set pe retrieval quality measure karke tune karo.",
"FAQ doc: har Q&A alag chunk (~150 tokens). Legal contract: ~1000 tokens kyunki clauses lambe hain.",
"'Main 500/50 se shuru karta hu, golden set pe evaluate karta hu, phir tune karta hu. Andaaze se nahi, data se.'"],
["What chunking strategies do you know? When to use which?",
"Kitaab ko kaatne ke 5 tareeke: barabar tukde, paragraph ke hisaab se, topic badalne par, heading ke hisaab se, aur chhota-bada combo.",
"(1) Fixed-size: simple, mid-sentence kat sakta hai, baseline. (2) Recursive: paragraph->sentence->word, achha default. (3) Semantic: adjacent sentences ki similarity gire to split, best quality, costly. (4) Document-aware: markdown headers/HTML/code boundaries. (5) Parent-child: chhote chunks retrieval ke liye, bade parent generation ke liye.",
"Markdown docs -> header-based. Messy transcript -> semantic. Normal articles -> recursive.",
"'Default recursive, structured docs ke liye document-aware, high-precision cases me semantic, aur parent-child jab context chahiye.'"],
["What is semantic chunking and when is it worth the cost?",
"Jahan topic badalta hai wahin kainchi chalao, chahe lines kitni bhi hon.",
"Har sentence ka embedding nikalo; adjacent sentences ki cosine similarity threshold se neeche gire to naya chunk. Worth it: loose structure, very specific queries, medical/legal precision. Not worth it: well-structured docs jahan headings se hi topics alag hain.",
"Ek meeting transcript: pehle budget par baat, phir hiring par. Semantic chunking inhe automatically alag kar deta hai.",
"'Extra embedding cost tab justify hota hai jab structure weak ho aur precision critical ho.'"],
["What is chunk overlap and why do you need it?",
"Do pages ke beech ek line repeat karna taaki kahani beech se na kate.",
"Chunk i ke last N tokens chunk i+1 ke first N tokens bante hain. Boundary pe aayi info dono chunks miss na kare. Typical 10-20%. Trade-off: zyada storage aur duplicates. 500 token chunk pe 50-100 overlap sweet spot.",
"Sentence 'Refund 7 din me hoga, agar item unused ho' chunk boundary pe kat gaya to meaning gayab. Overlap se ek chunk me poora sentence aa jata hai.",
"'10-20% overlap, aur retrieval ke baad duplicates deduplicate karta hu.'"],
["How do you handle tables in chunking?",
"Table ko beech se phadna = row ka matlab gayab. Header ke saath hi rakhna padta hai.",
"Mid-row split mat karo. Options: (1) poori table ek chunk, (2) markdown/CSV/sentence-per-row me convert, (3) har row alag chunk with header repeat, (4) table ko metadata me rakho aur aas-paas ke text se retrieve karo.",
"Row: 'Plan: Pro | Price: 999'. Sentence me: 'Pro plan ki price 999 hai.' Ye embed karna easy aur accurate.",
"'Table ka treatment is par depend karta hai ki queries table ke values pe hain ya uske around ke narrative pe.'"],
["How do you handle code in chunking?",
"Code ko function ke beech se nahi kaatte, warna samajh nahi aayega.",
"Language-aware splitters (LangChain Recursive splitter with language separators, tree-sitter AST). Function/class boundary preserve, imports saath rakho. Signatures aur docstrings alag se embed karo kyunki users unhi ko search karte hain.",
"Function 'calculate_tax(income)' pura ek chunk, saath me uski docstring 'Tax calculate karta hai' alag index.",
"'Code ke liye AST-based split, aur docstring/signature ka separate index.'"],
["How do you handle images and figures in chunking?",
"Photo ko text me describe kar do (caption), phir us text se search karo.",
"3 options: (1) multimodal embedding (CLIP) se image directly embed, (2) image captioning (GPT-4V) aur caption ko chunk banao, (3) image ignore, sirf caption/aas-paas ka text. Production me aksar (2): rich caption index + original image reference display ke liye.",
"Architecture diagram ka caption: 'User -> API -> DB flow chart'. Sawal 'API flow kya hai?' is caption se match ho jata hai.",
"'Mostly captioning approach, kyunki text retrieval stack reuse hota hai.'"],
["How do you pick an embedding model for production?",
"Jute ki tarah: size, price aur kaam ke hisaab se. Pehle trial karte hain.",
"Evaluate: (1) MTEB retrieval score, (2) domain match (general vs BioBERT/FinBERT), (3) dimensions (quality vs storage), (4) cost/latency (hosted vs self-hosted), (5) multilingual. 2-3 candidates apne eval set pe benchmark karo.",
"OpenAI text-embedding-3 vs BGE vs e5: apne 200 queries pe recall@10 compare karke decide.",
"'Leaderboard se shortlist, apne data pe benchmark se final.'"],
["When would you train or fine-tune your own embeddings?",
"Jab general dictionary tumhare field ke words samajh hi nahi paye, tab apni dictionary banate hain.",
"Jab off-the-shelf embeddings domain semantics miss karein (medical 'MI' = myocardial infarction). Conditions: kuch hazaar labeled query-doc pairs, baaki sab tuning ke baad bhi eval kharab, aur gain cost justify kare. Aksar hybrid search + reranking 80% gain bina training ke de deta hai.",
"Finance me 'short' ek position hai, general model ise 'chhota' samajh sakta hai. Fine-tuning se fix.",
"'Pehle hybrid + rerank try, phir last option fine-tuning.'"],
["What's the difference between bi-encoders and cross-encoders?",
"Bi-encoder: dono ko alag alag number dena aur compare. Cross-encoder: dono ko saath padh ke seedha score dena. Doosra accurate, par dheema.",
"Bi-encoder query aur doc independently embed karta hai, docs pehle se pre-compute, fast, retrieval ke liye. Cross-encoder query+doc ek saath input leta hai, relevance score deta hai, accurate par pre-compute nahi ho sakta, slow, reranking ke liye. Standard: bi-encoder 50 laaye, cross-encoder 5 chune.",
"Bi-encoder = photo se pehchaan. Cross-encoder = dono ko saamne bithake interview.",
"'Speed ke liye bi-encoder, accuracy ke liye cross-encoder, dono ko pipeline me jodte hain.'"],
["What is the \"parent-document retrieval\" pattern?",
"Chhote tukde se dhoondo, par jawab ke liye poora paragraph do.",
"Chhote chunks index, retrieve hone par unka bada parent (section/paragraph) LLM ko do. Small chunk ki precision + large chunk ka context. Implementation: small chunks me parent_id, query time par join.",
"Chhota chunk 'Refund 7 din me' match hua; LLM ko poora 'Refund Policy' section milta hai jisme exceptions bhi hain.",
"'Retrieval ke liye chhota, generation ke liye bada. Best of both worlds.'"],
["What are sparse embeddings (BM25, SPLADE)?",
"Keyword wali search: exact shabd match. Jaise Ctrl+F lekin smart.",
"Sparse vector me zyada tar values zero hoti hain, sirf text ke terms non-zero. BM25 = TF-IDF jaisa keyword matching. SPLADE = neural sparse, terms expand aur weight karta hai. Rare terms aur named entities par strong jahan dense blur kar deta hai.",
"'ERR-4017' search karna ho to BM25 exact match deta hai, dense model shayad nahi.",
"'Sparse exact keywords ke liye, dense meaning ke liye. Isliye hybrid.'"],
["What does dimensionality mean for embeddings?",
"Kisi cheez ko describe karne ke liye kitne number use kiye. Zyada numbers = zyada detail, par zyada jagah.",
"Vector ki length (384, 768, 1536, 3072). Zyada dimension = zyada nuance par storage linear aur compute zyada. Guidance: 384-768 most apps ke liye kaafi, 1536 overkill, 3072 jab har percent recall matter kare.",
"1M vectors x 1536 dims x 4 bytes = ~6 GB. 384 dims me ~1.5 GB.",
"'Quality aur cost ka trade-off; pehle chhoti dimension se start karke eval karta hu.'"],
["What is Matryoshka Representation Learning (MRL)?",
"Russian matryoshka gudiya: badi ke andar chhoti. Vector ke shuru ke hisse bhi kaam ke hote hain.",
"MRL me training aisi hoti hai ki vector ke prefixes (jaise 3072 me se pehle 768) khud valid embeddings hon. Truncate karne par thoda accuracy loss. Use: truncated se fast first-pass, top candidates ko full embedding se re-score. OpenAI text-embedding-3 MRL use karta hai.",
"3072-dim ko 512 tak kaato, search fast; fir top 100 ko full 3072 se re-rank.",
"'MRL se ek hi model se flexible dimension milti hai, storage aur speed dono save.'"],
["What's the difference between sentence embeddings and word embeddings?",
"Word embedding me 'bank' ka matlab hamesha ek. Sentence embedding context dekhta hai: paisa wala bank ya nadi ka bank.",
"Word2Vec/GloVe: ek vector per word, context ignore. Sentence-BERT/modern models: poore sentence/chunk ka context-aware vector. RAG sirf sentence-level use karta hai kyunki word-level coarse hai.",
"'River bank' aur 'bank loan' me 'bank' ke embeddings alag.",
"'Context-aware hone ki wajah se RAG me sentence embeddings use hote hain.'"],
["How do you handle multilingual RAG?",
"Hindi me sawal, English doc me jawab: model ko dono bhasha ek hi 'map' pe samajhni chahiye.",
"3 approaches: (1) multilingual embedding model (multilingual-e5, BGE-M3), shared space - modern default. (2) pivot language (English) me translate - simple par nuance loss. (3) per-language index + language detection. Apne language mix pe evaluate karo.",
"English query 'refund policy' se Hindi doc 'वापसी नीति' bhi retrieve hota hai multilingual model se.",
"'Default multilingual embeddings, aur har language pe alag eval kyunki quality vary karti hai.'"],
["What is \"instruction-tuned\" embedding?",
"Same line ko alag kaam ke liye alag tareeke se samjhana, jaise 'ye sawal hai' ya 'ye jawab hai'.",
"Kuch models (Instructor, BGE) instruction prefix lete hain: 'Represent this sentence for retrieval:'. Task ke hisaab se alag embedding. RAG me query ke liye ek instruction ('Find passages that answer this question:') aur docs ke liye doosra.",
"Query pe 'query:' aur doc pe 'passage:' prefix lagana (e5 models me).",
"'Query aur doc ka prefix model ke guidelines ke hisaab se lagana zaroori hai, warna retrieval quality girti hai.'"],
["How do you embed long documents?",
"Poori kitaab ko ek number me nahi bata sakte. Pehle chapters, phir har chapter.",
"Embed nahi karte; chunk karke har chunk embed karte hain (models ki limit 256-8192 tokens). Doc-level representation chahiye (routing/filter) to title + pehle 500 tokens embed karo ya chunk embeddings ka average lo.",
"50-page report -> 100 chunks -> 100 embeddings. Alag se 'title + summary' embedding routing ke liye.",
"'Long doc kabhi single embedding nahi; chunk first, embed later.'"],
["What's a typical embedding latency budget?",
"Sawal ko number banane me kitna time lagna chahiye, jaise ek SMS bhejne jitna.",
"Hosted API (OpenAI/Cohere): 50-200ms per query. Batch endpoints se hazaron docs/sec. Self-hosted GPU: <50ms per query. Rule: embedding bottleneck nahi hona chahiye; agar hai to batching karo ya self-host.",
"1 lakh docs ingest: ek ek karke API call = ghanton; 500 ke batches me = minutes.",
"'Query embedding ko bottleneck nahi banne deta; batch aur caching use karta hu.'"],
["What is embedding drift and how do you detect it?",
"Naap ka tape dheere dheere khinch gaya to naap badal jata hai. Embeddings bhi time ke saath badal sakte hain.",
"Drift: embedding distribution shift, kyunki vendor ne model update kiya ya naye type ke docs aaye. Detect: avg pairwise similarity of new docs, fixed eval set pe retrieval quality, query-time similarity distribution. Fix: corpus re-embed ya model version pin.",
"Vendor ne model badla, naye vectors purane se mismatch, search results achanak kharab.",
"'Model version pin karta hu aur ek fixed golden set pe weekly retrieval quality check karta hu.'"]
]});
D.push({c:"Category 3 - Vector DBs & Retrieval (Q41-60)",items:[
["Compare pgvector, Pinecone, Weaviate, Qdrant. When does which win?",
"4 dukaane: ghar ki dukaan (pgvector), mall (Pinecone), hybrid shop (Weaviate), speed wali (Qdrant).",
"pgvector: Postgres extension, free, ~10M vectors tak, transactional. Pinecone: managed, fast, hands-off, par scale pe mehenga. Weaviate: open-source, strong hybrid search aur filtering. Qdrant: Rust, self-hosted me best performance per dollar. Decision: shuru me pgvector, managed chahiye to Pinecone, hybrid open-source to Weaviate, self-host speed to Qdrant.",
"Startup ke 2 lakh docs aur Postgres already hai -> pgvector. 50M vectors self-hosted -> Qdrant.",
"'Mujhe pgvector se start karna pasand hai; scale ya feature ki zaroorat par migrate.'"],
["What is HNSW and why is it the default index for vector DBs?",
"Mumbai se gali tak jaane ka tareeka: pehle highway, phir sadak, phir gali. Upar sparse layers jaldi door pahuncha deti hain.",
"Hierarchical Navigable Small World: multi-layer graph ANN index. Query upar layer se shuru, greedily query ki taraf, neeche utarte hue refine. Default kyunki 95%+ recall, millions pe <10ms, M aur ef se tunable, naye vectors bina retraining ke add.",
"1 crore vectors me nearest 10 dhoondhne me ~5ms.",
"'HNSW graph-based hai, speed aur recall ka best balance, bas memory zyada leta hai.'"],
["What's the difference between exact and approximate nearest neighbor search?",
"Exact = class ke har bacche se puchna. Approximate = sirf sahi mohalle ke bacchon se puchna, thoda galti ka chance par bahut tez.",
"Exact (brute force) O(N) per query, ~100K vectors tak theek. ANN (HNSW, IVF, ScaNN) thodi accuracy ke badle huge speed. Production me ANN default; exact search sirf evaluation me (ANN ka recall naapne ke liye).",
"10 crore vectors pe brute force = seconds; ANN = milliseconds.",
"'Production ANN, aur exact search ground-truth recall measure karne ke liye.'"],
["Dense vs sparse retrieval - when do you need both?",
"Dense = matlab samajhta hai. Sparse = exact shabd pakadta hai. Kabhi dono chahiye.",
"Dense: semantic, paraphrase. 'high blood pressure causes' = 'hypertension etiology'. Sparse (BM25): exact match, rare terms, product codes, error codes ('ERR-4017'). Dono tab jab queries me concepts aur identifiers mix hon. Pure dense rare terms pe, pure sparse rephrased queries pe fail.",
"User: 'ERR-4017 kyu aata hai?' - code ke liye BM25, 'kyu aata hai' ke liye dense.",
"'Mixed query traffic me hybrid default hai.'"],
["What is hybrid search and how would you implement it?",
"Do alag search karke dono ke results ko mila dena.",
"Dense + sparse retrieval merge. Options: (1) RRF - robust, normalization nahi chahiye. (2) Weighted score - scales alag hote hain to normalization zaroori. (3) Native hybrid DBs (Weaviate, Qdrant, Elasticsearch). RRF production me most common.",
"Dense ne [A,B,C], BM25 ne [C,A,D]. RRF se A aur C upar aate hain.",
"'Main RRF se start karta hu kyunki parameter-free hai.'"],
["What is Reciprocal Rank Fusion (RRF)?",
"Do judges ki ranking mila ke final ranking. Jise dono ne upar rakha wo winner.",
"Har list me se result ka score = 1/(k+rank), k typically 60, sab lists me sum. Sirf rank matter karta hai, raw scores nahi, isliye scale difference ka issue nahi.",
"Doc A: dense rank1, sparse rank3. Score = 1/61 + 1/63 = 0.0163+0.0159 = 0.0322.",
"'RRF rank-based hai, isliye BM25 aur cosine ke alag scales ki tension nahi.'"],
["How does reranking work and when is it worth the latency?",
"Pehle round me 50 log chune, doosre round me dhyan se padh ke top 5.",
"Cross-encoder (Cohere Rerank, BGE-reranker) query+candidate ko saath score karta hai, reorder karke top-N deta hai. 50-200ms latency. Worth it jab precision important ho, relevant-par-not-best chunks upar aa rahe hon, ya corpus bada ho. Production me almost always.",
"Retrieval ne sahi chunk 7th rank pe diya; reranker use #1 pe laa deta hai.",
"'Rerank 100-200ms add karta hai par quality gain aksar latency se zyada hota hai.'"],
["How do you implement metadata filtering at scale?",
"Library me pehle 'science section' chuno, phir kitaab dhoondo, ya pehle kitaab dhoondo phir section dekho.",
"Pre-filter: pehle filter phir vector search (unselective filters pe costly). Post-filter: pehle search phir filter (kam results mil sakte hain). Filter-aware ANN: Pinecone, Qdrant, Weaviate me filter index ke andar integrated, best. Apni filter selectivity pe benchmark karo.",
"'Sirf 2026 ke docs' filter: post-filter me top 10 me se 1 bacha to answer kharab; filter-aware ANN me 10 hi 2026 ke.",
"'Filter-aware ANN prefer karta hu, aur selectivity ke hisaab se benchmark.'"],
["How do you handle multi-tenant data isolation in a vector DB?",
"Ek building me kai families: har ek ka alag flat ya ek hall me alag lock wale locker.",
"(1) Per-tenant namespace/collection: strong isolation, hazaaron tenants pe costly. (2) Shared index + tenant_id metadata filter: sasta par risky (ek bug = leak). (3) Tier: bade customers alag namespace, chhote shared. Shared+filter most common, with rigorous tests.",
"Company A ka user galti se Company B ka data na dekhe. Har query me tenant_id filter mandatory (server side).",
"'Isolation server-side enforce karta hu, aur leak ke liye automated tests.'"],
["What's the difference between cosine similarity, dot product, and Euclidean distance?",
"Cosine: do tiron ki direction kitni milti hai. Dot product: direction + lambai. Euclidean: seedhi doori.",
"Cosine = normalized vectors ka dot product, angle naapta hai. Dot product = cosine x magnitude, fast. Euclidean (L2) = straight-line distance. Normalized embeddings par cosine aur dot product same ranking dete hain. DB jisko optimize kare wahi lo.",
"Do vectors same direction me, ek chhota ek bada: cosine = 1, Euclidean doori kaafi.",
"'Normalized embeddings me cosine = dot product, to dot product use karta hu kyunki fast hai.'"],
["How do you handle large-scale ingestion (millions of documents)?",
"1 crore kitaabon ko ek ek karke shelf pe nahi, trolley me bharke laate hain.",
"(1) Batch embedding (hundreds per request). (2) Workers parallel (Celery, Ray). (3) Bulk-insert APIs (10-100x faster). (4) Staging: pehle S3/Parquet me embeddings, phir bulk load - retry easy. (5) Pre-compute offline, deploy ke time nahi.",
"10M chunks: 500 ke batches, 20 workers parallel, S3 me save, phir bulk load.",
"'Batch, parallelize, stage, bulk-load. Retry-ability design me hoti hai.'"],
["What is \"vector quantization\" and when do you use it?",
"Photo ko compress karna: thodi quality kam par size bahut chhota.",
"float32 (4 bytes) ko float16 (2x), int8 (4x), binary (32x) me compress. Thoda recall loss, bada storage/speed gain. Use: 10M+ vectors, memory bottleneck, sub-ms. Families: Product Quantization aur Scalar Quantization.",
"100M x 1024 dims float32 = 400 GB. int8 se ~100 GB.",
"'Memory bottleneck par int8/binary quantization, aur recall impact eval se verify.'"],
["What's the difference between IVF, HNSW, and ScaNN indexes?",
"IVF: shehar ko mohallon me baant ke sirf paas ke mohalle dekho. HNSW: graph pe chalna. ScaNN: Google ka smart compression.",
"IVF: N clusters, query pe closest M partitions search, simple par recall cluster quality pe depend. HNSW: graph, very high recall, thodi zyada memory, default. ScaNN: anisotropic quantization, high-dim me excellent, Google scale.",
"Chhote-medium scale -> HNSW. Memory tight aur bahut bada -> IVF+PQ.",
"'Default HNSW, memory constraint par IVF-PQ.'"],
["How do you handle real-time updates to a vector index?",
"Library me roz nayi kitaab aati hai, pura catalog dobara nahi banate.",
"Pinecone/Qdrant/Weaviate live upsert/delete (eventual consistency). pgvector me ivfflat insert ke saath degrade, hnsw theek. Pattern: hot index (naya, chhota) aur cold index (bulk), dono query karo, merge. High-write me har kuch second batch insert.",
"Support ticket aate hi 5 sec me searchable: hot index me upsert, raat ko cold me merge.",
"'Hot/cold split aur micro-batching se freshness aur stability dono.'"],
["What's a \"namespace\" or \"collection\" in a vector DB?",
"Alag alag almaari, ek hi kamre me.",
"Logical container jo vectors ko separate karta hai: multi-tenancy, versioning (docs_v1/v2), ya topic separation. Query default me ek namespace tak scoped. Database schema jaisa.",
"Namespace 'hr' aur 'finance' alag, HR chatbot sirf 'hr' me search karta hai.",
"'Namespaces isolation, versioning aur A/B rollouts me kaam aate hain.'"],
["How do you do \"search-as-you-type\" with vector search?",
"Har akshar pe dukaan ko naya sawal bhejoge to dukandaar thak jayega. Ruko, phir pucho.",
"Har character embedding change karta hai. Solutions: (1) debounce ~300ms, (2) autocomplete traditional prefix search, vector search sirf pause par, (3) common partial queries cache, (4) speculative prefetch. Production me aksar autocomplete traditional rehta hai.",
"User 'refu' type kare -> autocomplete suggestions; Enter dabaye -> tab vector search.",
"'Typing time par prefix search, final query pe vector search.'"],
["What is \"cold-start\" in vector search and how do you handle it?",
"Subah gaadi start hote hi engine garam hone me time lagta hai.",
"Index fully built/warm hone se pehle queries. HNSW me index RAM me load hona, nayi process ki pehli queries 10x slow. Fix: deploy pe preload, startup pe synthetic queries, shared memory, serverless me provisioned concurrency.",
"Deploy ke baad pehle user ko 3 sec lage, baaki ko 200ms - warm-up queries se fix.",
"'Warm-up queries aur preload deploy pipeline me.'"],
["How does GPU help with vector search?",
"Bahut saare kaam ek saath karne me GPU CPU se tez hai, jaise 1000 teacher ek saath copy check karein.",
"GPU brute-force similarity aur ANN construction ko batched matrix multiply se tez karta hai (FAISS-GPU). Use: >100M vectors, high QPS, regular index rebuild. Cost high; 100M tak CPU+HNSW theek.",
"Roz raat 500M vectors ka index rebuild GPU se 1 ghante me.",
"'GPU tab jab CPU bottleneck ho; warna CPU HNSW sasta aur kaafi.'"],
["What is \"query expansion\" in retrieval?",
"Sawal me aur related shabd jodna taaki kuch miss na ho.",
"Original query ko related terms se enrich karna recall ke liye. (1) Synonyms: brittle. (2) LLM-based rephrase - modern. (3) Pseudo-relevance feedback: initial retrieval ke top results se terms nikaal ke re-query. Trade-off: noise aur latency. Short/vague queries me useful.",
"'laptop slow' -> 'laptop slow, performance issue, high CPU, lag'.",
"'LLM se expansion karta hu par noise check karne ke liye eval chalata hu.'"],
["What is \"query decomposition\" in retrieval?",
"Bada sawal ko chhote chhote sawalon me todna.",
"Complex query ko sub-questions me split, har ek ke liye retrieve, combine. LLM karta hai. Multi-hop me useful. Latency badhti hai par quality bahut. RAPTOR, ReAct-style retrievers.",
"'Apple aur Microsoft ka Q3 revenue compare karo' -> ['Apple Q3 revenue', 'Microsoft Q3 revenue'].",
"'Multi-part ya comparison queries pe decomposition use karta hu.'"]
]});
D.push({c:"Category 4 - Evaluation (Q61-80)",items:[
["How do you evaluate a RAG system end-to-end?",
"Do cheezein check karo: kya sahi page mila? aur kya jawab sahi likha?",
"Do layers. Retrieval eval: precision@k, recall@k, MRR, NDCG labeled set pe. Generation eval: faithfulness, answer relevance, answer correctness. Production me user satisfaction, citation clicks, escalation rate. RAGAS aur TruLens automate karte hain.",
"Retrieval theek par answer galat -> generation/prompt problem. Retrieval galat -> chunking/embedding problem.",
"'Retrieval aur generation ko alag alag measure karta hu taaki bug ka source pata chale.'"],
["What metrics measure retrieval quality?",
"Retrieval ke marks: kitne sahi mile, kitne upar mile.",
"Precision@k, Recall@k, MRR (1/rank of first relevant), NDCG (log discount, graded relevance). Production me recall@10 aur MRR commonly tracked.",
"Sahi chunk rank 2 pe mila: reciprocal rank = 0.5. Rank 1 pe 1.0.",
"'Recall@10 aur MRR mere main metrics hain; graded labels ho to NDCG.'"],
["What metrics measure generation quality?",
"Answer ke marks: sachha hai? sawal ka jawab hai? sahi hai?",
"Faithfulness (claims context se supported?), answer relevance, answer correctness (ground truth se), context precision, context recall. Faithfulness sabse important - unfaithful = hallucination.",
"Answer me 5 claims, 4 context me hain -> faithfulness 0.8.",
"'Faithfulness first, kyunki wahi hallucination measure karta hai.'"],
["How do you build a golden dataset for RAG?",
"Ek question paper banana jisme sahi answers pehle se pata hon.",
"(1) Real queries (logs, user research, synthetic). (2) Har query ke relevant chunks annotators/experts se. (3) Ideal answers. (4) Failure modes tag. 100-300 quality examples se shuru. Synthetic bootstrap ke liye theek par human-validate.",
"HR bot: 150 real employee questions, har ek ke liye sahi policy section aur ideal answer.",
"'Quality over quantity; synthetic se start, human validation ke saath.'"],
["What is LLM-as-judge for RAG and what are its limits?",
"Ek bada AI teacher jo doosre AI ke answers check kare. Teacher se bhi galti ho sakti hai.",
"Powerful LLM outputs ko criteria pe score karta hai. Limits: self-family bias, inconsistency, cost, subtle factual errors, position bias. Mitigation: model rotate, chain-of-thought, order randomize, human scores se calibrate.",
"Do answers A aur B: judge pehle wale ko prefer karta hai; order swap karke dono baar check.",
"'LLM judge useful hai par human calibration aur order randomization ke saath.'"],
["How do you detect retrieval drift in production?",
"Roz thermometer: bukhaar badhe to alarm.",
"Track: similarity score distribution, query-document overlap, no-result rate, citation click-through, fixed golden set pe periodic eval. >2 std dev shift par alert.",
"Average top similarity 0.82 se 0.65 ho gayi: ya queries badal gayi ya index decay.",
"'Dashboards + golden set cron + alerting.'"],
["How do you regression-test RAG in CI/CD?",
"Code badalne ke baad purane test cases dobara chalana.",
"(1) Repo me 100+ golden pairs. (2) Har PR pe eval run. (3) main branch se compare, X% regression pe build fail. (4) Golden set embeddings cache. (5) Per-question diffs log.",
"Prompt badla; PR me dikha 'faithfulness 0.91 -> 0.84', merge blocked.",
"'Ye sabse high-leverage reliability practice hai jo aksar teams skip karti hain.'"],
["What is \"context precision\" and how does it differ from precision@k?",
"Precision@k: laye gaye pages me kitne sahi. Context precision: kitne pages jawab me kaam aaye.",
"Precision@k retrieval-only hai (eval labels). Context precision (RAGAS) generation-aware: retrieved me se kitne answer ke liye needed (LLM judge). Low context precision + high precision@k = model hallucinate kar raha despite good retrieval.",
"5 chunks relevant, par answer me sirf 2 use hue: context precision 40%.",
"'Dono ko saath dekhta hu taaki retrieval vs generation ka issue alag ho.'"],
["What is \"context recall\" and why does it matter?",
"Kya jawab likhne ke liye zaroori saari info retrieved pages me thi?",
"Ground-truth answer ke har claim ko check karo ki retrieved chunks me supported hai ya nahi (LLM judge). Low context recall = retrieval problem, LLM chahe kitna achha ho.",
"Ground truth me 4 facts, retrieved me 2 -> context recall 50%.",
"'Low context recall dikhe to retriever/chunking fix karta hu, prompt nahi.'"],
["How do you measure faithfulness?",
"Answer ki har line ko context se milao: line context me hai ya banai hui.",
"Answer ko atomic claims me todo (LLM step), judge se har claim context se supported hai? Faithfulness = supported/total. RAGAS automatic. 0.85 se neeche red flag.",
"10 claims, 9 supported: 0.9 faithful.",
"'Claim extraction + verification, aur 0.85 se neeche alert.'"],
["What's the difference between online and offline evaluation?",
"Offline = practice test. Online = asli exam jisme real students.",
"Offline: fixed golden set, CI, fast, deterministic par limited. Online: real traffic, feedback, A/B tests, long-tail aur drift pakadta hai par noisy. Dono chahiye.",
"Offline me 95%, par real users 'cancel kaise karein' jaisi unseen queries puchte hain.",
"'Offline gate ke liye, online reality check ke liye.'"],
["How do you A/B test RAG changes safely?",
"Nayi dawa pehle chhote group pe, phir sab pe.",
"Shadow traffic (users ko nahi dikhate), canary (1% traffic, ramp up), interleaving (side-by-side preference). Version metadata log karo, automated rollback triggers.",
"New reranker 1% traffic pe; satisfaction girta hai to auto rollback.",
"'Shadow -> canary -> full rollout, har step pe rollback ready.'"],
["How do you evaluate \"I don't know\" responses?",
"Achha student jaanta hai kab 'mujhe nahi pata' bolna hai.",
"Golden data me abstain set banao (jo sawal refuse hone chahiye). Refusal accuracy aur answered quality dono score. Zyada refusal (overcautious) aur kam refusal (hallucination risk) dono penalize.",
"'Mera salary kitna hai?' (data me nahi) -> refuse. 'Leave policy?' -> answer.",
"'Abstain set explicit rakhta hu aur refusal precision/recall dono track karta hu.'"],
["What is \"groundedness\" and how do you measure it?",
"Answer kitna 'saboot' pe khada hai.",
"Faithfulness ke barabar. Judge har statement ko label kare: supported, contradicted ya not-in-context (model ne bahar se jod diya). Groundedness = supported fraction. Contradicted aur not-in-context alag flag, kyunki failure modes alag.",
"'Delhi head office hai' context me nahi par model ne jod diya -> not-in-context.",
"'Contradicted aur unsupported ko alag track karta hu.'"],
["How do you handle subjective or open-ended questions in eval?",
"Nibandh ka koi ek sahi jawab nahi, to rubric se marks dete hain.",
"Rubric-based LLM judge: 3-5 criteria (completeness, accuracy, clarity, structure) 1-5 score. Pairwise preference absolute scoring se reliable. Human sample calibration ke liye.",
"'Microservices ke trade-offs batao': completeness 4, accuracy 5, clarity 3.",
"'Pairwise comparison aur rubric, plus human spot-checks.'"],
["What tools do you know for RAG evaluation?",
"Marks dene wale tools ki list.",
"RAGAS (metrics, LangChain), TruLens (feedback functions), DeepEval (pytest-style CI), Arize Phoenix (observability+evals), LangSmith (tracing, datasets), Langfuse (open-source observability). Aksar ek observability tool + custom eval scripts.",
"CI me DeepEval, production me Langfuse traces.",
"'Ek observability tool aur ek eval framework, plus custom scripts.'"],
["How do you evaluate citations?",
"Har dawa ke saath proof diya hai ya nahi, aur proof sahi hai ya nahi.",
"Citation precision (citations claim support karte hain?), citation recall (citable claims me se kitno ke citations), citation correctness (sahi chunk?). LLM judge answer+citations+sources check karta hai. Legal/medical me citation eval ke bina ship mat karo.",
"Claim 'Refund 7 din' ke saath [Source 3] hai par Source 3 shipping ke baare me hai -> citation incorrect.",
"'Citation precision aur recall dono measure karta hu.'"],
["How do you set up human-in-the-loop evaluation?",
"AI ke kuch answers insaan se check karwana.",
"(1) Sampling: low confidence, refused, thumbs-down, high stakes. (2) Review UI: query, chunks, answer, expected side-by-side. (3) Calibration: 10% double-rated, inter-rater agreement. (4) Loop close: failures golden set me jaate hain. Cadence: ~100 cases/week.",
"Reviewer ko dikha: query + 5 chunks + answer; label 'missing context'.",
"'Interesting cases sample, calibrate, aur failures ko golden set me feed.'"],
["What's a \"smoke test\" for RAG and what should be in it?",
"Gaadi chalane se pehle 1 minute ka quick check: tel, brake, light.",
"10-20 queries har deploy pe: har major topic ka ek, ek out-of-scope (IDK), ek prompt injection, ek citation wala, ek multi-hop. 60 sec se kam. Full eval nahi, fast canary.",
"Deploy ke baad 15 queries chali, 'IDK' wale ne hallucinate kiya -> deploy rollback.",
"'Smoke test fast gate hai, full eval alag.'"],
["How do you measure \"user satisfaction\" in RAG without explicit ratings?",
"Koi bole nahi to bhi uske behaviour se pata chal jata hai khush hai ya nahi.",
"Implicit signals: engagement (citation click, scroll), follow-up/rephrase rate, abandonment, copy events, escalation to human. Combine karke proxy score, explicit ratings ke sample se validate.",
"User ne turant wahi sawal rephrase kiya = answer helpful nahi tha.",
"'Implicit signals ka composite score, explicit ratings se calibrated.'"]
]});
D.push({c:"Category 5 - Production & Advanced RAG (Q81-100)",items:[
["How do you reduce hallucinations in a RAG system?",
"Jhooth rokne ke kai taale: strict rule, saboot maango, aur check karo.",
"Defense in depth: (1) system prompt 'sirf context se', (2) citations force, (3) refusal examples few-shot, (4) output validation, (5) faithfulness eval CI me, (6) low temperature 0-0.3, (7) better retrieval - aksar hallucination retrieval failure hota hai.",
"Prompt: 'Agar context me jawab nahi to bolo: mujhe information nahi mili.'",
"'Prompt, citations, validation, eval aur sabse zyada retrieval quality.'"],
["How do you force the LLM to cite sources reliably?",
"Har chunk ko ID do aur bolo har line ke saath ID likho.",
"(1) Chunks ko stable IDs [SOURCE_1], (2) system prompt me inline citations, (3) few-shot examples, (4) structured output {answer, citations}, (5) post-process verify, (6) verification LLM call. Combine se >95% reliability.",
"Answer: 'Refund 7 din me [SOURCE_2].' Code check karta hai ki SOURCE_2 exist karta hai.",
"'Structured output + post-validation se citations reliable.'"],
["What is HyDE (Hypothetical Document Embeddings)?",
"Pehle ek 'nakli jawab' likho, phir us jaise asli jawab dhoondo.",
"LLM se hypothetical answer likhwao, uska embedding search me use karo. Answers ki vocabulary docs jaisi hoti hai, questions se better match. Trade-off: extra LLM call, galat hypothesis se retrieval kharab. Short/vague queries me useful.",
"Query 'sir dard kyu' -> hypothetical 'Headache tension, dehydration se hota hai...' -> embed -> docs match.",
"'HyDE vocabulary gap bridge karta hai par extra latency/cost.'"],
["What is query rewriting and when do you need it?",
"Adhoori ya ulti sawal ko saaf sawal bana dena.",
"LLM se query ko retrieval-friendly banao: acronyms expand, history se context, pronouns resolve, decompose, alternative phrasings. Conversational follow-ups, vague queries ya domain language mismatch me zaroori.",
"'Aur uska price?' -> 'iPhone 15 ka price kya hai?'",
"'Chat-based RAG me rewriting almost mandatory.'"],
["What is multi-query retrieval?",
"Ek sawal ko 3-4 tareeke se puchna taaki koi jawab na chhute.",
"LLM query ke multiple variants banata hai, har ek ke liye retrieve, results merge (RRF). Single embedding intent miss kar sakti hai. Cost badhti hai. Ambiguous queries pe useful.",
"'Remote work policy' -> ['WFH rules', 'work from home eligibility', 'hybrid work guidelines'].",
"'Recall badhane ke liye, cost trade-off ke saath.'"],
["How do you handle multi-hop / multi-document questions?",
