["1. Authentication, Authorization & API Security",[
[`Explain Access Token vs Refresh Token. What is the purpose of each, where should each token be stored, and when should each expire?`,`The access token is short-lived (5-15 min) and proves identity on each API call; the refresh token is long-lived (days) and only exchanges for new access tokens. I keep the access token in memory and the refresh token in an HttpOnly, Secure, SameSite cookie. Example: on a 401 the client silently calls /refresh.`],
[`A refresh token is stolen. What is your production mitigation strategy? Explain rotation, revocation, reuse detection, and session invalidation.`,`I rotate the refresh token on every use and store hashed token families server-side. If an old token is replayed, that is reuse detection: I revoke the whole family, invalidate the session and force re-login, then alert the user.`],
[`How would you design OAuth2/JWT authentication for a FastAPI-based GenAI application?`,`An OIDC provider issues RS256 JWTs. FastAPI verifies signature via JWKS plus iss/aud/exp in a dependency, and reads scopes and tenant_id from claims to authorize each route.`],
[`What is the difference between authentication and authorization? Give a production example in an AI agent system.`,`AuthN is who you are, AuthZ is what you may do. Example: a user logs in (authN); the agent may call the refund tool only if their role is support_lead (authZ).`],
[`How would you securely manage API keys and secrets across local development, staging, and production?`,`Never in Git. Local uses a gitignored .env; staging/prod use a secret manager injected at runtime, separate keys per environment, least-privilege IAM, rotation, and secret scanning in CI.`],
[`How do you prevent an LLM agent from calling tools that the authenticated user is not authorized to use?`,`I enforce authZ in the tool layer, not the prompt: filter the tool list by the user's scopes and re-check at execution using the user's token, not a shared service account.`]],

["2. LLM Security & Jailbreak Protection",[
[`A user successfully jailbreaks your LLM in production. What real-time detection and mitigation strategy would you implement?`,`Input and output classifiers block and log the attempt, return a safe refusal, rate-limit the user, and add the prompt to a regression suite. Then I patch guard rules and review within hours.`],
[`How would you detect prompt injection in an LLM application? What signals would you monitor?`,`Signals: 'ignore previous instructions' patterns, encoded text, role-play framing, tool calls unrelated to user intent, system-prompt leakage (canary tokens). I combine heuristics with a classifier.`],
[`How do you defend an agentic AI system against indirect prompt injection coming from retrieved documents or web pages?`,`I treat retrieved content as untrusted data: delimit it, scan chunks, give tools least privilege, and require human approval for side-effect actions triggered after reading external content.`],
[`Where should guardrails be placed: before the LLM, after the LLM, around tools, or at multiple layers? Explain why.`,`Multiple layers: input (PII, injection), retrieval (ACL), tools (validation, authZ), output (policy, grounding). Any one layer can be bypassed, so defense in depth.`],
[`How would you handle unsafe or policy-violating model output without breaking the user experience?`,`Redact or block, then return a helpful safe fallback or regenerate with a stricter prompt, instead of a raw error. Everything is logged for review.`],
[`How would you test an LLM application against jailbreaks before production deployment?`,`A red-team suite in CI: known jailbreak corpora plus generated attacks, tracked as attack success rate per release with a pass threshold, plus manual red-teaming.`]],
[["Llama Guard","open, customisable","needs GPU/hosting"],["NeMo Guardrails","flow rules","learning curve"],["Guardrails AI","output validators","latency added"],["Lakera Guard","strong injection detection","paid SaaS"],["Prompt Guard (Meta)","small, fast","limited scope"],["LLM Guard","many scanners","maintenance burden"],["Rebuff","canary tokens","less active"],["Azure Content Safety","managed","Azure lock-in"],["OpenAI Moderation","free, easy","generic categories"],["Garak / PyRIT","attack testing","testing only, not runtime"]]],
["3. Redis, Caching & Reliability",[
[`Your Redis cache crashes at 2 AM and the entire application goes down. Redis was only a cache—why did everything die?`,`Redis sat on the critical path with no timeout or fallback, so calls hung or raised. Fix: short timeouts, catch errors, bypass the cache to hit the source, plus a circuit breaker.`],
[`How would you design an application so that a Redis outage does not cause a complete production outage?`,`Fail open: cache reads are optional, features degrade (local rate limiter), Redis runs HA (Sentinel/Cluster), and I chaos-test by killing it.`],
[`Explain cache-aside, write-through, and write-behind caching. When would you use each?`,`Cache-aside: app reads cache then DB and fills on miss (my RAG default). Write-through: write both synchronously for consistency. Write-behind: write cache and flush async for speed, accepting loss risk (counters).`],
[`How would you prevent a cache stampede when thousands of requests miss the cache at the same time?`,`Single-flight locking per key (SET NX), TTL jitter, stale-while-revalidate, and pre-warming hot keys.`],
[`How do TTL, eviction policy, cache invalidation, and stale data affect an LLM/RAG application?`,`Stale cache means wrong answers after a policy change. I use short TTLs or event-based invalidation and put index/document version in the key; LRU/LFU eviction keeps memory bounded.`],
[`How would you implement Redis health checks, timeouts, circuit breakers, retries, and graceful fallback?`,`PING health checks, ~100ms socket timeouts, limited retries with backoff and jitter, a breaker that opens after N failures, then fallback to origin with metrics on hit rate and errors.`]],

["4. Logging, Monitoring & Distributed Tracing",[
[`How do you implement production logging and tracing for an LLM application?`,`Structured JSON logs carrying a trace_id, OpenTelemetry spans per stage, and LLM tracing for prompts, tokens, latency and cost, sampled and redacted.`],
[`What information should be captured in an LLM trace without exposing sensitive user data or secrets?`,`Model and version, prompt template ID, token counts, latency, doc IDs and scores. PII and secrets are masked before export; raw prompts only with consent and short retention.`],
[`How would you trace one user request across API → retriever → vector database → LLM → tool call → response?`,`Root span at the API, propagate W3C traceparent so retriever, vector DB, LLM and tool calls are child spans, and reuse the trace_id in all logs.`],
[`What are logs, metrics, and traces? Give a production example for each in a RAG system.`,`Logs: discrete events (vector DB timeout error). Metrics: aggregates (p95 latency, cache hit rate). Traces: one request's path and stage timings.`],
[`Which LLM-specific metrics would you monitor: latency, token usage, cost, retrieval quality, hallucination rate, or something else?`,`All of them: TTFT and total latency, tokens, cost per request, retrieval recall, faithfulness, refusal rate, tool error rate, and user feedback.`],
[`How would you debug a sudden increase in LLM latency using distributed traces?`,`Compare slow vs normal traces, find the widest span (vector DB, reranker or LLM queue), and check recent changes such as model version, prompt length, top-k or provider status.`]],

["5. CI/CD & Production Deployment",[
[`Your CI/CD pipeline is completely green, but five minutes after deployment production starts returning 500 errors. What did the pipeline fail to test?`,`Production-like conditions: missing env vars/secrets, config drift, DB migrations, real dependency connectivity, load. I would add post-deploy smoke tests on prod-parity staging.`],
[`What tests should be included in a production GenAI CI/CD pipeline?`,`Unit, integration (API+DB+vector store), tool contract tests, prompt regression, LLM eval thresholds, jailbreak/security tests, load tests and dependency scans.`],
[`How would you design smoke tests, integration tests, regression tests, and LLM evaluation tests for deployment?`,`Smoke: /health plus one real query. Integration: full RAG on a test index. Regression: golden Q&A must not degrade. LLM eval: metric thresholds like faithfulness above 0.85.`],
[`Explain blue-green deployment and canary deployment. How would you use them for an LLM service?`,`Blue-green swaps traffic between two full environments for instant rollback. Canary sends ~5% of traffic to the new version. For LLMs I canary to compare quality, cost and latency on real traffic.`],
[`How would you automatically roll back a deployment when error rate or latency crosses a threshold?`,`Define SLOs; the rollout controller queries Prometheus during the canary and auto-aborts or reverts when they are breached.`],
[`How would you test production configuration, secrets, model versions, prompts, and external API dependencies before release?`,`Fail-fast startup validation of config, pre-release checks that secrets resolve, model snapshot pinned and reachable, prompt version present, and dependency health probes.`]],

["6. RAG Debugging & Retrieval",[
[`Your RAG retrieves the correct policy, but the LLM gives the opposite answer. What failed?`,`Generation failure: truncated or mis-ordered context, conflicting chunks, or a lost negation. I fix with a clearer prompt, 'quote the context', low temperature, reranking and a faithfulness check.`],
[`How would you debug a RAG pipeline step by step when the final answer is wrong?`,`Inspect query rewrite, retrieved chunks, ranking, final prompt and LLM output. The first stage where the truth disappears is the culprit.`],
[`What is the difference between retrieval failure, context construction failure, and generation failure?`,`Retrieval: right chunk never fetched. Context construction: fetched but dropped, truncated or split. Generation: the chunk was present but the model ignored or misread it.`],
[`How do chunk size, chunk overlap, metadata, embedding model, top-k, and similarity threshold affect RAG quality?`,`Small chunks are precise but lose context; large are noisy. Overlap protects boundaries; metadata enables filters; embedding model caps semantics; top-k trades recall vs noise; threshold cuts junk. I tune all on an eval set.`],
[`When would you use hybrid search instead of pure vector search?`,`When exact terms matter: IDs, error codes, names, acronyms. BM25 plus vectors with RRF fusion.`],
[`Why would you add a cross-encoder reranker after initial vector retrieval?`,`Bi-encoders are fast but coarse; a cross-encoder scores query and chunk together for precision. Retrieve 50, rerank to 5.`],
[`How would you handle conflicting documents or outdated policies in a RAG system?`,`Metadata (version, effective_date, status), filter to active/latest, prefer newest, show source and date, and flag remaining conflicts in the answer.`],
[`How do you prevent the LLM from answering from its own knowledge when the required answer is not supported by retrieved context?`,`Strict 'answer only from context, else say I don't know' prompt, similarity threshold to abstain, required citations and a groundedness checker.`]],

["7. Vector Databases & Large-Scale Retrieval",[
[`Your vector database contains 10 million documents. If a user sends a query, how can the system find the top similar documents without comparing the query vector with all 10 million vectors?`,`With an ANN index (HNSW graph or IVF clusters) that inspects only a small fraction of vectors.`],
[`Explain approximate nearest-neighbor (ANN) search and why it is used at scale.`,`It trades a small recall loss (say 95-99%) for orders-of-magnitude lower latency than exact O(N) search.`],
[`Compare HNSW, IVF, and quantization at a high level. What trade-offs do they introduce?`,`HNSW: high recall and speed, high memory. IVF: cluster then search nearest lists, less memory, needs training. Quantization: compresses vectors, cuts cost, loses some accuracy. Often combined as IVF-PQ.`],
[`How would metadata filtering improve retrieval performance and relevance in a large vector database?`,`Pre-filtering by tenant, date or type shrinks the candidate set, boosting relevance and speed; I index metadata fields and watch recall under very selective filters.`],
[`How would you design a multi-tenant vector search system where each customer must only retrieve its own documents?`,`Take tenant_id from the verified JWT server-side, never the client. Use per-tenant namespaces for strong isolation or a shared index with a mandatory filter, and test for cross-tenant leaks.`],
[`How would you reduce vector-search latency when the database grows from 1 million to 100 million vectors?`,`Shard and replicate, tune HNSW (ef, M), quantize, use SSD-friendly indexes, pre-filter, cache hot queries.`],
[`How do you choose top-k for retrieval, and why can an unnecessarily large k hurt the final answer?`,`I choose via eval (recall@k vs answer quality): retrieve ~20-50, rerank to 3-8. Large k adds noise, cost, and 'lost in the middle' distraction.`]],

["8. Agentic AI & Tool Calling",[
[`Two agents use the same LLM and tools, but one performs significantly better. There is no obvious prompt difference. What hidden choices could explain the gap?`,`Tool descriptions and schemas, tool ordering, temperature, model snapshot, context trimming, memory, retry policy and routing. I diff full configs and traces.`],
[`What hidden variables can affect agent performance: system prompt, tool descriptions, tool ordering, temperature, model version, context, memory, retries, or routing?`,`All can; tool descriptions and context management usually dominate. I ablate one variable at a time on a fixed eval set.`],
[`How would you design an agent so it does not enter an infinite tool-calling loop?`,`Max steps, per-tool call limits, token and time budgets, repeat-call detection, and a forced final answer on hitting limits.`],
[`How do you validate tool inputs and outputs before allowing an agent to continue?`,`Pydantic/JSON-schema on arguments, allowlists, output size and shape checks, outputs treated as untrusted, and validation errors fed back for retry.`],
[`When should an agent ask for human approval instead of executing a tool automatically?`,`For irreversible, financial, external-facing or low-confidence actions such as refunds, emails and deletes; execution pauses until approval.`],
[`How would you evaluate an agent's tool selection and multi-step reasoning without relying only on the final answer?`,`Trajectory evals: compare tool sequence and arguments to a golden path, count steps, and use LLM-as-judge on intermediate steps.`],
[`How would you make an agent deterministic and reproducible enough for production debugging?`,`Temperature 0, pinned model snapshot, versioned prompts and tools, and record-and-replay of inputs and tool outputs.`]],

["9. RAG Evaluation & Observability",[
[`Your RAG is live. How do you actually know it is working?`,`Offline golden set plus online monitoring: retrieval metrics, faithfulness, relevance, user feedback, latency and cost, with drift alerts.`],
[`What offline evaluation dataset would you create before launching a RAG application?`,`100-500 real questions with reference answers and gold source chunks, covering easy, multi-hop and unanswerable cases, synthetic plus human-reviewed.`],
[`Explain retrieval metrics such as Recall@K, Precision@K, MRR, and NDCG in simple terms.`,`Recall@K: was the right doc in top K. Precision@K: how much of top K is relevant. MRR: how high the first relevant hit ranks. NDCG: rewards relevant docs placed earlier.`],
[`How would you evaluate answer faithfulness, answer relevance, and context relevance?`,`Faithfulness: are claims supported by context. Answer relevance: does it address the question. Context relevance: were retrieved chunks useful. Scored with LLM-as-judge and spot-checked by humans.`],
[`How would you use Ragas or a similar evaluation framework in CI/CD?`,`Run the golden set on each PR, compute metrics, fail the build below thresholds or on regression vs main, and publish the report.`],
[`How do you detect RAG quality degradation after changing the embedding model, chunking strategy, prompt, or LLM?`,`A/B both configs on the same eval set and compare metrics; then shadow or canary on live traffic.`],
[`What production feedback signals would you collect to continuously improve a RAG system?`,`Thumbs up/down, regenerations, rephrased follow-ups, escalations, citation clicks and abandonment; bad cases feed back into the eval set.`]],

["10. Document Ingestion & PDF Processing",[
[`You upload a 500-page PDF to an AI chatbot. How would you process, chunk, embed, index, and retrieve the content efficiently?`,`An async queue pipeline: parse, structure-aware chunk (300-800 tokens, ~10-15% overlap), batch embed, upsert with metadata, then hybrid retrieval plus rerank. Workers are idempotent.`],
[`A PDF contains tables, images, scanned pages, and text. How would you build a robust ingestion pipeline?`,`Detect page type: native text extraction, OCR for scans, table extraction to markdown, VLM captions for images, with per-element metadata.`],
[`When should you use OCR, and how would you validate OCR quality?`,`For scanned pages with no text layer. Validate via confidence scores, valid-word ratio, manual sampling and CER/WER on labelled pages.`],
[`How would you preserve page numbers, document IDs, headings, tables, and other metadata during chunking?`,`Chunk by headings and attach doc_id, page range and heading path to every chunk; keep tables whole with header rows repeated.`],
[`How would you update or delete documents from a vector database without rebuilding the entire index?`,`Deterministic chunk IDs and content hashes: delete by doc_id filter and upsert only changed chunks.`],
[`How would you handle duplicate documents and multiple versions of the same document?`,`Content hash for exact dupes, MinHash or embedding similarity for near-dupes, and a version field with is_latest so retrieval defaults to the newest.`]],

["11. Caching, Cost & Performance",[
[`How would you cache repeated LLM requests safely? What should be part of the cache key?`,`Key = hash of model version, prompt template version, normalized prompt, parameters, tenant scope and retrieved doc versions. Never share across tenants; skip personalised queries.`],
[`What is semantic caching, and when is it safer or more useful than exact-response caching?`,`Matching by embedding similarity (above ~0.95) so paraphrases hit the cache. It suits stable, non-personal FAQ traffic; exact caching is safer where precision matters.`],
[`How would you reduce LLM cost while maintaining answer quality?`,`Route easy queries to smaller models, shrink context via reranking, prompt caching, caching, output caps and batching, verifying quality with evals at each step.`],
[`How would you reduce end-to-end RAG latency when retrieval and generation are both expensive?`,`Stream tokens, run retrieval steps in parallel, cache, tune ANN, use a lighter reranker and shorter context.`],
[`How would you decide whether to cache embeddings, retrieval results, LLM responses, or all three?`,`By hit rate, cost saved and staleness risk: embeddings (long TTL, easy win), retrieval (keyed by index version), LLM responses (selective).`],
[`How would you prevent stale cached answers when the underlying knowledge base changes?`,`Include KB version in the key, do event-driven invalidation by doc_id tags, and use short TTL for volatile data.`]],

["12. Production System Design Scenarios",[
[`Design a production-grade RAG API using FastAPI, Redis, a vector database, an LLM provider, and PostgreSQL.`,`Gateway (auth, rate limit), FastAPI, Redis cache, hybrid retriever plus reranker on the vector DB, streaming LLM, Postgres for users, history and audit, ingestion workers, OTel tracing, containerised on K8s.`],
[`Design a highly available GenAI application where the LLM provider can become unavailable.`,`Multi-provider failover behind a gateway, retries with backoff, circuit breaker, fallback smaller or self-hosted model, cached answers and queued non-urgent work.`],
[`Design a multi-tenant enterprise RAG system with authentication, authorization, document isolation, observability, and audit logs.`,`SSO/OIDC, RBAC/ABAC, tenant_id enforced in retrieval, document-level ACLs in metadata, per-tenant namespaces and encryption, audit logs of who retrieved what, per-tenant quotas.`],
[`Design an agentic customer-support system that can retrieve policies, query order data, and create support tickets with human approval.`,`Agent tools: policy RAG (read), order lookup (read, scoped to customer), create_ticket (write, approval-gated), with schema validation, step limits, audit logs and evals.`],
[`How would you design rate limiting for an LLM API when model calls are expensive and have provider-specific limits?`,`Token-bucket per user/tenant on requests and tokens, a global limiter matched to provider RPM/TPM, priority queues, and 429 with Retry-After.`],
[`How would you handle model-provider failover when the primary LLM API becomes unavailable?`,`Health checks with a circuit breaker, an ordered fallback list behind a normalized gateway, prompt compatibility tests per model, and logging the serving provider.`],
[`How would you version prompts, models, embeddings, retrieval configuration, and evaluation datasets?`,`Prompt registry with semver, models pinned to snapshots, embedding version stored with the index, retrieval config in Git, versioned eval sets, all tied to a release tag.`]],
