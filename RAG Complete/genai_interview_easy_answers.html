<h1>GenAI / LLM Production Interview: 78 Easy Answers + How to Fix</h1>
<p class="t">Easy words. Read "Say it" to explain in the interview. Read "How to fix" for the steps you will do in real project.</p>
<input id="s" placeholder="Search..."><div id="o"></div>
<script>
const S=[
["1. Authentication, Authorization & API Security",[
["Access token vs refresh token: purpose, storage, expiry?","Access token is like a day pass. It is short (5-15 min) and you show it on every API call to prove who you are. Refresh token is like a membership card. It lasts days, and its only job is to get a new day pass. Keep the access token in memory. Keep the refresh token in an HttpOnly + Secure + SameSite cookie, so JavaScript cannot read it. Why short access token? If it leaks, it dies soon. Example: API gives 401, app calls /refresh quietly, gets a new token, user sees nothing.","Set access expiry 10 min, refresh expiry 7 days|Put refresh token in HttpOnly Secure SameSite cookie|Add client interceptor: on 401 call /refresh once and retry|If refresh fails, send user to login"],
["Refresh token stolen: rotation, revocation, reuse detection, session invalidation?","Rotation: every time refresh token is used, I give a new one and kill the old one. Server keeps only a hash of each token, grouped in a family. Reuse detection: if someone uses an old token again, it means a thief has it. Then I revoke the whole family (revocation), end the session (invalidation), force login, and tell the user. Simple idea: one token = one use.","Turn on refresh rotation in Keycloak/Auth0|Store token hash + family id in DB or Redis|On replay: delete whole family, kill session|Send security alert email to user|Log the event and watch for spikes"],
["Design OAuth2/JWT auth for a FastAPI GenAI app?","Use an identity provider (OIDC) like Keycloak or Auth0. User logs in there and gets a signed JWT (RS256). My FastAPI checks the token in a dependency: signature using the provider's public keys (JWKS), issuer, audience, and expiry. Then I read scopes and tenant_id from the token to decide what the user can do on each route. FastAPI itself never stores passwords.","Add provider JWKS URL in settings|Write verify_jwt() dependency using authlib or python-jose|Check iss, aud, exp, scopes|Use Depends(verify_jwt) on every protected route|Cache JWKS keys to avoid a network call per request"],
["Authentication vs authorization, with AI agent example?","Authentication = who are you? Authorization = what are you allowed to do? Example: Rahul logs in with password (authentication). The agent has a refund tool. It runs only if Rahul's role is support_lead (authorization). Login alone is not permission.","Define roles and permissions in a policy tool (OPA/OpenFGA)|Check policy before every tool call|Deny by default|Log every allow/deny"],
["Manage API keys and secrets across local, staging, production?","Rule one: never put secrets in Git. Local: a .env file that is in .gitignore. Staging and production: a secret manager (Vault, AWS Secrets Manager) that injects secrets when the app starts. Use different keys for each environment, give each key only the permission it needs, rotate keys regularly, and scan code in CI for leaked secrets.","Move keys out of code into secret manager|Inject as env vars at deploy time|Create separate keys for dev, staging, prod|Add gitleaks in CI|If a key leaked: revoke it, make a new one, check logs"],
["Stop an agent from calling tools the user is not allowed to use?","I do not trust the prompt for security, because the model can be tricked. I put the check in code. First, I show the agent only the tools the user may use. Second, when a tool runs, I check again using the user's own token, not a shared admin account. So even if the model is tricked, the code says no.","Build tool list from user scopes per request|Add permission check inside every tool function|Pass user token to downstream APIs|Test with a low-role user trying admin tools"]]],
["2. LLM Security & Jailbreak Protection",[
["Jailbreak succeeded in production: detection and mitigation?","I need to catch it, stop it, and learn from it. Input and output checkers (classifiers) block unsafe text and log it. The user gets a safe polite refusal. I rate-limit the user who keeps trying. I save the bad prompt into a test set so it never works again. Then I update the rules and review within hours.","Run Llama Guard/Prompt Guard on input and output|Block, tag the trace, return safe message|Rate-limit repeat offenders|Add the prompt to regression suite|Patch rules and redeploy"],
["Detect prompt injection: which signals?","Prompt injection means someone hides instructions like 'ignore previous rules'. Signals I watch: those phrases, base64 or odd encoded text, role-play tricks, tool calls that do not match what user asked, and the system prompt leaking out. For leak detection I hide a secret canary word in the system prompt. If it appears in output, I know. I use simple rules plus a classifier together.","Scan every prompt with a classifier|Put canary string in system prompt and alert if seen|Alert on tool calls unrelated to the request|Review flagged traces weekly"],
["Defend agent against indirect prompt injection from documents or web pages?","Indirect means the attack hides inside a document or web page the agent reads. So I treat all retrieved text as untrusted data, never as instructions. I wrap it in clear delimiters, scan it, give the agent minimum tool power, and ask a human to approve any action with side effects (send email, delete, pay) after reading outside content.","Scan chunks before putting them in prompt|Wrap in delimiters and tell model 'this is data only'|Gate write tools with human approval|Use least-privilege tool permissions"],
["Where to put guardrails: before LLM, after, around tools, or multiple?","Multiple layers. Input layer: block PII and injection. Retrieval layer: only fetch docs the user may see. Tool layer: validate arguments and check permission. Output layer: check policy and facts. Why? Any one layer can fail or be bypassed. Like a building: door lock, guard, and camera, not only one.","Define input, retrieval, tool, output rails in NeMo Guardrails config|Enforce tool checks in code|Test each layer separately"],
["Handle unsafe output without breaking user experience?","Do not show a raw error. If output is unsafe, I redact the bad part or block it, and then show a helpful safe answer, or regenerate with a stricter prompt. User still gets help. I log everything so the team can review.","Add output validators (Guardrails AI/Presidio)|Write friendly fallback message|Retry once with stricter prompt|Log blocked outputs"],
["Test LLM app against jailbreaks before production?","I do red-teaming. I keep a test set of known jailbreak prompts plus generated attacks, run it in CI on every release, and measure attack success rate. If the rate is above my limit, the build fails. I also do manual red-team sessions because tools miss creative attacks.","Add promptfoo/Garak/PyRIT job in CI|Set threshold, e.g. success rate under 2 percent|Fail build when above|Add new real attacks to the suite"]]],
["3. Redis, Caching & Reliability",[
["Redis cache crashes at 2 AM and whole app dies. Why?","Redis was only a cache but my code treated it as required. Calls had no timeout and no fallback, so requests hung or crashed. A cache should be optional: if it fails, go to the real source (database) slower but working.","Set socket_timeout around 100ms|Wrap Redis calls in try/except and fall to DB|Add circuit breaker|Alert on Redis errors|Test by stopping Redis in staging"],
["Design so a Redis outage is not a full outage?","Fail open: if cache is down, skip it. Reduce features gracefully (e.g. use local in-memory rate limiter). Run Redis in high availability (Sentinel or Cluster) so another node takes over. Then do chaos testing: kill Redis on purpose and see the app survive.","Enable multi-AZ failover/Sentinel|Make all cache reads optional|Add local fallback for rate limit|Chaos test in staging regularly"],
["Cache-aside, write-through, write-behind: when to use?","Cache-aside: app checks cache, if miss reads DB and saves to cache. Most common, my default for RAG. Write-through: every write goes to cache and DB together, so data is consistent but writes are slower. Write-behind: write to cache first, save to DB later in background. Very fast but you can lose data if cache dies. Good for counters.","Use GET, then DB, then SET for cache-aside|Use pipeline for write-through|Use write-behind only for non-critical data like counters"],
["Prevent cache stampede?","Stampede = a popular key expires and thousands of requests all hit the database at once. Fixes: let only one request rebuild the key (lock with SET NX), add random time to TTL so keys do not expire together, serve old value while refreshing (stale-while-revalidate), and pre-warm hot keys.","Lock key: SET lock:k NX EX 10|Add random TTL jitter|Serve stale while refreshing|Pre-warm top keys after deploy"],
["How TTL, eviction, invalidation, stale data affect RAG?","If documents change but cache has the old answer, user gets a wrong answer with full confidence. So I use short TTL or clear cache when document changes, and I put the index/document version inside the cache key. Eviction (LRU/LFU) removes old items when memory is full.","Set maxmemory-policy allkeys-lru|Add index_version in key|Delete keys on document update event|Use short TTL for changing data"],
["Redis health checks, timeouts, circuit breaker, retries, fallback?","Health check: PING regularly. Timeout: short (about 100ms). Retry: only few times with growing wait and random jitter. Circuit breaker: after N failures, stop calling Redis for a while. Fallback: go to origin. Track hit rate and error rate in metrics.","Add PING probe|Use tenacity for retry with backoff|Use pybreaker fail_max=5|Export hit/error metrics to Prometheus"]]],
["4. Logging, Monitoring & Distributed Tracing",[
["Production logging and tracing for LLM app?","Logs in JSON format, each with a trace_id. OpenTelemetry spans for each step (API, retrieval, LLM). An LLM tool like Langfuse to see prompts, tokens, latency, cost. I sample traces to save cost and mask private data.","Instrument FastAPI with OTel SDK|Wrap LLM calls with Langfuse|Add trace_id to every log line|Sample and mask data"],
["What to capture in trace without exposing secrets?","Capture: model name and version, prompt template id, token counts, latency, document ids and scores. Do not capture: passwords, API keys, personal data. Mask PII before sending out. Raw prompts only if user agreed and keep for short time.","Mask with Presidio before export|Log ids, counts, versions only|Set short retention for raw text"],
["Trace one request across API, retriever, vector DB, LLM, tool?","Create a root span at the API. Pass the W3C traceparent header to every next step, so each step becomes a child span of the same trace. Use same trace_id in logs. Then one click shows the whole journey.","Auto-instrument HTTP clients|Pass traceparent to vector DB and LLM calls|View in Jaeger/Tempo"],
["Logs vs metrics vs traces, RAG example?","Logs = single events ('vector DB timeout error'). Metrics = numbers over time (p95 latency, cache hit rate). Traces = the path of one request with time per step. Use metrics to get alert, traces to find where, logs to see why.","Errors to Loki, numbers to Prometheus, traces to Jaeger|Alert on metrics, investigate with traces"],
["Which LLM-specific metrics to monitor?","All of these: time to first token and total latency, token usage, cost per request, retrieval recall, faithfulness (hallucination), refusal rate, tool error rate, user feedback. LLMs fail silently: no error but a bad answer, so quality metrics matter.","Record tokens, cost, latency per span|Sample live traces into Ragas nightly|Alert on thresholds"],
["Debug sudden LLM latency increase with traces?","Open a slow trace and a normal trace side by side. Find the widest (longest) span: vector DB, reranker, or LLM queue. Then check what changed: model version, longer prompt, bigger top-k, or provider problem.","Filter slow traces, sort spans by duration|Fix widest stage|Check recent deploy and provider status"]]],
["5. CI/CD & Production Deployment",[
["Pipeline green but prod gives 500 after 5 minutes. What did pipeline miss?","The pipeline tested code but not the real environment. Usual causes: missing env variable or secret, config difference, database migration, real service not reachable, real load. Fix is to test in an environment like production and run smoke tests after deploy.","Run smoke test (/health plus one real query) after deploy|Use staging identical to prod|Use Testcontainers for real DB/Redis in CI|Auto-rollback on failure"],
["Tests in a GenAI CI/CD pipeline?","Unit tests, integration tests (API + DB + vector store), tool contract tests, prompt regression tests, LLM evaluation with thresholds, jailbreak/security tests, load tests, and dependency scans. LLM behaviour can break silently, so evals are must.","Add stages: unit, integration, eval, security, scan|Use pytest, Ragas, Trivy|Fail build under thresholds"],
["Design smoke, integration, regression, LLM eval tests?","Smoke: quick check that app is alive and answers one real question. Integration: full RAG flow on a small test index. Regression: golden question-answers must not get worse. LLM eval: scores like faithfulness must stay above a limit (example 0.85).","Write golden Q&A in pytest with DeepEval|Set metric thresholds|Run /health after each deploy"],
["Blue-green vs canary for an LLM service?","Blue-green: two full copies. Switch traffic from old to new at once; rollback is instant. Canary: send a small part (like 5 percent) to the new version first. For LLMs I use canary to compare quality, cost and latency on real users before full rollout.","Define canary steps 5, 25, 100 percent in Argo Rollouts|Compare error rate, latency, cost at each step"],
["Auto rollback when error rate or latency crosses limit?","First define limits (SLOs). During rollout the controller asks Prometheus for error rate and latency. If it crosses the limit, it stops and goes back to old version automatically. Humans are too slow at 3 AM.","Create AnalysisTemplate querying error rate|Set auto-abort on breach|Alert the team"],
["Test config, secrets, model versions, prompts, external APIs before release?","Fail fast at startup: if any config or secret is missing, app refuses to start. Before release, a check job confirms secrets can be read, model version is pinned and reachable, prompt version exists, and each external API answers a health call.","Validate settings with pydantic-settings|Add pre-release job pinging every dependency|Pin model snapshot"]]],
["6. RAG Debugging & Retrieval",[
["RAG retrieves right policy but LLM says opposite. What failed?","Generation failed, not retrieval. Reasons: context was cut, order was confusing, two chunks contradict, or the model missed a word like 'not'. Fix: clearer prompt, ask model to quote the context, low temperature, rerank so best chunk is first, and add a faithfulness check.","Print final prompt and chunks in trace|Add 'quote the context' rule|Set temperature low|Rerank and add faithfulness check"],
["Debug a wrong RAG answer step by step?","Check in order: query rewrite, retrieved chunks, ranking, final prompt, LLM output. The first step where the correct information disappears is the problem.","Open trace in Langfuse/Phoenix|Check each stage output|Fix the first wrong stage"],
["Retrieval vs context construction vs generation failure?","Retrieval failure: right chunk was never fetched. Context construction failure: it was fetched but dropped, cut, or split badly when building the prompt. Generation failure: it was in the prompt but model ignored or misread it. Each has a different fix.","Score context recall and faithfulness separately with Ragas|Use result to pick: retrieval, chunking, or prompt fix"],
["Effect of chunk size, overlap, metadata, embedding model, top-k, threshold?","Small chunks: precise but lose context. Big chunks: noisy. Overlap: keeps sentences at borders. Metadata: lets me filter. Embedding model: sets how well meaning is understood. Top-k: more recall but more noise. Threshold: removes weak matches. I tune all with an eval set, not by guess.","Grid-search chunk size and top-k on golden set|Keep the best combination"],
["When hybrid search instead of pure vector?","When exact words matter: IDs, error codes, names, acronyms. Vectors catch meaning but can miss exact tokens. Hybrid = keyword search (BM25) + vector search, merged by RRF.","Enable sparse + dense in Qdrant/Elasticsearch|Use RRF fusion"],
["Why add a cross-encoder reranker?","Vector search is fast but rough. A cross-encoder reads the query and chunk together, so it judges better but is slower. So I fetch 50 quickly, then rerank to best 5.","Retrieve 50|Rerank with Cohere/bge-reranker|Send top 5 to LLM"],
["Conflicting or outdated documents?","Store version, effective date, and status as metadata. At query time filter to active and latest. Prefer newest. Show source and date in the answer. If conflict remains, tell the user.","Store status and effective_date|Filter status=active|Show citation with date"],
["Stop LLM answering from its own knowledge?","Prompt: 'Answer only from context. If not found say I don't know.' Add a similarity threshold, so if nothing is close enough, the bot abstains. Require citations and check groundedness after.","Add abstain rule and min similarity|Require citations|Add faithfulness check"]]],
["7. Vector Databases & Large-Scale Retrieval",[
["10 million docs: find top similar without comparing all?","Use an ANN index like HNSW (graph) or IVF (clusters). It jumps to the likely area and checks only a small part of the vectors, not all 10 million.","Build HNSW index instead of flat search|Use FAISS or Qdrant"],
["What is ANN search and why use at scale?","ANN means approximate nearest neighbour. It gives almost-best results (95-99 percent correct) but is hundreds of times faster than exact search. Small accuracy loss, big speed win.","Tune ef_search until recall target is met at good latency"],
["Compare HNSW, IVF, quantization?","HNSW: fast and accurate but uses lots of memory. IVF: groups vectors in clusters, searches nearest clusters, uses less memory, needs training. Quantization: shrinks vectors to save memory and cost but loses a bit of accuracy. IVF-PQ combines them.","Start with HNSW|If memory is too high, try IVF-PQ|Compare recall"],
["Metadata filtering benefit?","Filtering by tenant, date or type reduces candidates, so search is faster and more relevant. I index the metadata fields. Watch out: very strict filters can hurt recall, so I test that.","Create payload indexes on tenant and date|Pass filters in query"],
["Multi-tenant vector search with isolation?","tenant_id comes from the verified JWT on the server, never from the client. Either one namespace per tenant (strong isolation) or one shared index with a mandatory filter. I write tests to prove no cross-tenant leak.","Use namespace per tenant|Inject tenant_id from JWT|Add leak tests in CI"],
["Reduce latency from 1M to 100M vectors?","Shard (split data) and replicate, tune HNSW (ef, M), use quantization, use disk-friendly indexes, pre-filter, and cache hot queries.","Add shards and replicas|Enable quantization|Cache frequent queries"],
["Choosing top-k and why big k hurts?","I choose k by testing: plot recall vs k and pick where quality stops improving. Typical: fetch 20-50, rerank to 3-8. Too large k adds noise, cost, and the model gets lost in the middle of long context.","Plot recall vs k with Ragas|Pick plateau point|Rerank to 5"]]],
["8. Agentic AI & Tool Calling",[
["Same LLM and tools, one agent better. Hidden reasons?","Small hidden choices: tool descriptions and schemas, tool order, temperature, model snapshot, context trimming, memory, retry rules, routing. I compare full configs and traces.","Export configs and traces of both agents|Diff tool descriptions and model"],
["Which hidden variables affect agent performance?","All can. Usually tool descriptions and context management matter most. I test by changing one variable at a time (ablation) on the same test set.","Change one variable per run|Use promptfoo/LangSmith"],
["Avoid infinite tool loops?","Set limits: max steps, max calls per tool, token and time budget. Detect repeated identical calls. When a limit hits, force a final answer.","Set recursion_limit in LangGraph|Add per-tool counters|Force finish on limit"],
["Validate tool inputs and outputs?","Check arguments with Pydantic/JSON schema, use allowlists, check output size and shape, treat tool output as untrusted. If validation fails, send the error to the model so it can retry.","Define arg models|On ValidationError return message to LLM"],
["When ask human approval?","For things that cannot be undone, cost money, go outside, or when confidence is low: refunds, emails, deletes. Agent pauses until a human approves.","Add interrupt() before write tools|Resume on approval"],
["Evaluate tool selection and multi-step reasoning?","Do not judge only the final answer. Compare the tool sequence and arguments with a golden path, count steps, and use LLM-as-judge on middle steps. Right answer by wrong path is fragile.","Log tool sequence|Assert against golden trajectory"],
["Make agent deterministic and reproducible?","Temperature 0, pinned model snapshot, versioned prompts and tools, and record-and-replay: save inputs and tool outputs, so I can run the same case again for debugging.","Pin model|Record tool responses with VCR.py|Version prompts"]]],
["9. RAG Evaluation & Observability",[
["RAG is live. How do you know it works?","Two parts. Offline: a golden test set before launch. Online: monitor retrieval quality, faithfulness, relevance, user feedback, latency, cost, and alert on drift.","Sample live traces into Ragas nightly|Alert on score drops"],
["Offline eval dataset before launch?","100-500 real questions with correct answers and the source chunk. Include easy, multi-step, and unanswerable questions. Create with synthetic generation, then human review.","Generate questions with Ragas testset|Review in Argilla"],
["Recall@K, Precision@K, MRR, NDCG in simple words?","Recall@K: is the right doc inside top K? Precision@K: how many of top K are useful? MRR: how high is the first right result? NDCG: gives more points when right docs come earlier.","Compute with ranx/Ragas on labelled set"],
["Evaluate faithfulness, answer relevance, context relevance?","Faithfulness: is every claim supported by the context? Answer relevance: does it answer the question asked? Context relevance: were the fetched chunks useful? Score with LLM-as-judge and check some by humans.","Run faithfulness, answer_relevancy, context_precision metrics"],
["Use Ragas in CI/CD?","Run the golden set on every pull request, compute metrics, fail the build if below limit or worse than main branch, and publish report.","Add eval job in GitHub Actions|Exit non-zero below threshold"],
["Detect quality drop after changing embedding, chunking, prompt, LLM?","A/B test: run old and new configs on the same eval set and compare scores. Then shadow or canary on live traffic. Changes often improve one metric and hurt another.","Run both configs on same dataset|Compare in Langfuse experiments"],
["Production feedback signals?","Thumbs up/down, regenerate clicks, rephrased questions, escalation to human, citation clicks, abandonment. Bad cases go back into the eval set.","Capture events in Langfuse/PostHog|Export failures to eval dataset"]]],
["10. Document Ingestion & PDF Processing",[
["500-page PDF: process, chunk, embed, index, retrieve?","Use an async queue so upload is not blocked. Steps: parse, chunk by structure (300-800 tokens, 10-15 percent overlap), embed in batches, upsert with metadata. Retrieval: hybrid search then rerank. Workers should be idempotent (safe to rerun).","Queue parse task with Celery|Batch embed 100 at a time|Upsert to Qdrant with metadata"],
["PDF with tables, images, scans, text?","Check each page type. Text page: normal extract. Scan: OCR. Table: extract as markdown. Image: caption with a vision model. Save metadata per element.","Route page types with Docling/Textract"],
["When OCR and validate quality?","OCR only for scanned pages with no text layer. Validate by confidence score, ratio of real words, manual sample check, and CER/WER on labelled pages.","OCR with Tesseract/Textract|Check confidence|Sample review"],
["Preserve page numbers, IDs, headings, tables?","Chunk by headings. Attach doc_id, page range, heading path to every chunk. Keep a table whole and repeat its header row.","Chunk by heading|Attach doc_id, page, section metadata"],
["Update or delete docs without rebuilding index?","Give chunks deterministic IDs and content hash. To update: delete by doc_id and upsert only changed chunks.","Delete by doc_id filter|Upsert changed chunks"],
["Duplicates and multiple versions?","Exact copies: content hash. Near copies: MinHash or embedding similarity. Versions: version field plus is_latest flag, retrieval uses latest by default.","MinHash with datasketch|Set is_latest in Postgres"]]],
["11. Caching, Cost & Performance",[
["Cache repeated LLM requests safely: cache key?","Key = hash of model version, prompt template version, normalized prompt, parameters, tenant, and retrieved doc versions. Never share across tenants. Do not cache personal queries.","Build composite key in Redis|Skip personalised queries"],
["What is semantic caching?","It matches by meaning (embedding similarity above about 0.95), so paraphrases also hit the cache. Good for stable non-personal FAQs. Exact caching is safer when precision matters.","Use RedisVL/GPTCache with threshold 0.95|Restrict to FAQ traffic"],
["Reduce LLM cost, keep quality?","Send easy questions to a small model, cut context with reranking, use prompt caching, cache answers, cap output length, batch work. Check quality with evals after each change.","Route with LiteLLM/RouteLLM|Enable provider prompt caching|Run evals"],
["Reduce RAG latency?","Stream tokens, run retrieval steps in parallel, cache, tune ANN, use lighter reranker, shorter context.","Stream output|Run retrieval and embedding concurrently"],
["Cache embeddings, retrieval, responses, or all?","Decide by hit rate, money saved, and stale risk. Embeddings: long TTL, easy win. Retrieval: key with index version. LLM responses: selective.","Measure hit rate per layer|Cache embeddings first"],
["Prevent stale cached answers?","Put knowledge base version in key, delete cache by doc_id when docs change, short TTL for changing data.","Publish doc-updated events|Delete keys by doc_id tag"]]],
["12. Production System Design Scenarios",[
["Production RAG API: FastAPI, Redis, vector DB, LLM, PostgreSQL?","Flow: gateway (auth, rate limit), FastAPI, Redis cache, hybrid retriever plus reranker on vector DB, streaming LLM. Postgres stores users, chat history, audit. Ingestion workers add docs. OTel tracing. Run on Kubernetes.","Wire gateway, cache, retriever, LLM, audit tables|Deploy on K8s with health checks"],
["HA app when LLM provider can go down?","Use multiple providers behind a gateway, retries with backoff, circuit breaker, fallback to smaller or self-hosted model, cached answers, and queue non-urgent work.","Configure fallbacks in LiteLLM router|Add breaker and retries"],
["Multi-tenant enterprise RAG: auth, isolation, observability, audit?","SSO/OIDC login, RBAC/ABAC roles, tenant_id enforced in retrieval, document-level ACL in metadata, per-tenant namespaces and encryption, audit log of who retrieved what, per-tenant quotas.","Add tenant claims and ACL filters|Create audit tables|Trace each request"],
["Agentic support system with human approval?","Tools: policy RAG (read), order lookup (read, only that customer), create_ticket (write, needs approval). Add schema validation, step limits, audit logs, evals.","Build tools in LangGraph|Add interrupt before create_ticket|Log audit in Postgres"],
["Rate limiting for expensive LLM API?","Token bucket per user/tenant for requests and tokens, a global limiter that matches provider limits (RPM/TPM), priority queues, and return 429 with Retry-After.","Implement limits in Redis|Return 429 with Retry-After"],
["Model-provider failover?","Health checks with circuit breaker, ordered fallback list behind one gateway API, test prompts on each fallback model, log which provider served.","Configure ordered fallbacks in LiteLLM/Portkey|Log provider"],
["Version prompts, models, embeddings, retrieval config, eval datasets?","Prompt registry with semantic versions, models pinned to snapshots, embedding version stored with the index, retrieval config in Git, versioned eval sets, all tied to one release tag.","Tag all versions in one release manifest|Use Git, Langfuse prompts, MLflow/DVC"]]]
];
let n=0,h="";for(const[t,qs]of S){h+=`<h2>${t}</h2>`;for(const[q,a,f]of qs){n++;h+=`<details><summary>${n}. ${q}</summary><div class="a"><b>Say it:</b> ${a}</div><div class="f"><b>How to fix:</b><ol>${f.split("|").map(x=>`<li>${x}</li>`).join("")}</ol></div></details>`}}
o.innerHTML=h;document.querySelector("h1").textContent+=" ("+n+")";
s.oninput=()=>{const v=s.value.toLowerCase();document.querySelectorAll("details").forEach(d=>d.style.display=d.textContent.toLowerCase().includes(v)?"":"none")};
</script></body></html>
