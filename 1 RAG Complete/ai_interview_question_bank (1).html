<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#16202e;--mute:#5b6878;--line:#d9e1ea;--acc:#2447b8;--accbg:#e6ecfb}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--card:#18202b;--ink:#e8edf4;--mute:#9aa7b8;--line:#2a3544;--acc:#8fa9ff;--accbg:#1f2a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.95rem}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;font-family:system-ui,sans-serif}
input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1rem}
button{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font-size:.95rem}
button:hover{background:var(--accbg)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:10px 0}
summary{cursor:pointer;padding:14px 16px;font-weight:bold;list-style:none;display:flex;gap:12px}
summary::-webkit-details-marker{display:none}
summary .n{color:var(--acc);min-width:2.4em}
details[open] summary{border-bottom:1px solid var(--line)}
.a{padding:12px 16px 16px 16px}
.a p{margin:0 0 8px}
.a ul{margin:6px 0 0;padding-left:22px}
.a li{margin:3px 0}
.none{color:var(--mute);display:none;font-family:system-ui,sans-serif}
h2{font-size:1.25rem;margin:30px 0 4px;font-family:system-ui,sans-serif}.todo{color:var(--mute);font-style:italic}.ok{color:var(--acc);min-width:1.2em}</style>
</head>

", "Run independent steps in parallel"], "455": "A single agent is one worker with many tools. It is simple and cheap. Multi-agent means several specialist workers, like a team. I use multi-agent only when the task is complex, because it adds cost and complexity.", "456": "A supervisor is like a manager. It reads the request, picks the right agent, checks the result, and keeps control in one place.", "457": ["Check the format with a schema (like Pydantic)", "Apply business rules (a refund cannot be more than the order amount)", "Compare with source data", "Send risky cases to a human"], "458": "First I try to parse it. If it fails, I retry and tell the model what was wrong, 2 or 3 times at most. If it still fails, I use a fallback or send it to a human, and I log the failure.", "459": "After every step I save the current state (step number, inputs, results) in a database like Postgres or Redis with a unique run ID. In LangGraph, a checkpointer does this.", "460": "I save a checkpoint after each step. To resume, I load the saved state using the run ID and continue from the last finished step, not from the start.", "461": ["Use exponential backoff (wait longer each time)", "Set a maximum retry count", "Use an idempotency key so the same action never runs twice", "Check whether a step is already done before repeating it"], "462": "I give the model a JSON schema, use the API's structured output or function-calling feature, validate with Pydantic, and retry if it fails.", "463": "A supervisor routes to specialist agents: order lookup, policy check and refund. They use tools like the order API and policy search. State is saved at each step, the refund uses an idempotency key so no one is paid twice, odd cases go to a human, and every decision is logged for audit.", "464": "I trace every step and tool call with tools like LangSmith or Langfuse. I track errors, latency, token use, cost and answer quality, and set alerts.", "465": "I test a few models on my own data and compare quality, speed, cost, privacy needs and context size. Often I use a strong model for hard tasks and a cheaper one for easy tasks.", "466": "LangChain gives ready-made building blocks (models, tools, retrievers). LangGraph adds workflows as a graph, with saved state, loops, checkpoints and human-in-the-loop. That makes it good for agents.", "467": "Wrap it in FastAPI, package it with Docker, run it on Kubernetes or a cloud service, set up CI/CD for automatic testing and release, store secrets safely, and add monitoring and autoscaling.", "468": ["Login (authentication) and role-based permissions", "Filter retrieval so users only see their own documents", "Encrypt data and hide personal information", "Defend against prompt injection", "Rate limit requests"], "469": "Same idea as Q453: stateless servers, background queues, caching, a scalable vector DB and autoscaling."};

Object.assign(A,{
"2":"Artificial Intelligence means making machines do tasks that normally need human intelligence, like understanding language, recognizing images, making decisions or solving problems. I explain it as an umbrella term. Inside it there are rule-based systems, where a developer writes the logic by hand, and machine learning, where the system learns the logic from data. Everyday examples are a spam filter, route suggestions in Google Maps, Netflix recommendations and ChatGPT. In my own work I mostly deal with the modern end of AI: LLMs and agents that understand a request, pick tools and complete a task. So AI is the goal, intelligent behaviour, and ML, deep learning and GenAI are the ways we reach it.",
"3":"Machine Learning is a way of building software where, instead of writing rules, we give the system data and it learns the patterns itself. There are three main types. Supervised learning uses labeled data, like emails marked spam or not spam. Unsupervised learning finds structure without labels, like customer clustering. Reinforcement learning learns by reward and penalty, like a game-playing agent. The usual flow is collect data, prepare features, train a model, evaluate on unseen data, deploy and monitor. The key risk is overfitting, where the model memorizes training data and fails on new data, so I always keep a separate test set and watch for data drift in production.",
"4":"Deep Learning is a subset of machine learning that uses neural networks with many layers. Each layer learns something a little more abstract: in an image, early layers see edges, later layers see shapes, and the last layers see a face or a car. The big advantage over classical ML is that it learns features automatically, so we do not need manual feature engineering. That is why it works so well on unstructured data like images, audio and text. The trade-off is that it needs a lot of data, GPUs and training time, and it is harder to explain. CNNs, RNNs and Transformers are all deep learning, and Transformers power today's LLMs.",
"5":"Generative AI is AI that creates new content, such as text, code, images, audio or video, instead of only classifying or predicting a number. The model learns the patterns of its training data and then produces new samples that follow those patterns. LLMs do this for text by predicting the next token again and again, and diffusion models do it for images. Business uses are chatbots, code assistants, document summarization, content drafts and RAG-based question answering over company data. The limitations I always mention are hallucination, cost, latency, and the need for guardrails and evaluation before putting it in production.",
"6":"I explain it as nested circles. AI is the biggest circle, any technique that makes machines act intelligently. Inside it is Machine Learning, which learns from data instead of fixed rules. Inside that is Deep Learning, which uses multi-layer neural networks. Inside that is Generative AI, deep learning models that create new content, like LLMs and image generators. A simple example with email: a hand-written rule that blocks the word 'lottery' is AI without ML; a trained spam classifier is ML; a deep neural network reading the full email is deep learning; and a model that writes a reply for you is Generative AI.",
"7":"Traditional ML models are usually built for one task. We collect labeled data, train a model for that task, and the output is a label or a number, like fraud or not fraud, or a price. Generative AI uses a large foundation model that is already pre-trained on huge data, is general purpose, and we steer it with prompts, RAG or light fine-tuning. Its output is open-ended content. That makes GenAI flexible and fast to start with, but harder to evaluate, more expensive per request and able to hallucinate. I still pick traditional ML for tabular prediction like churn or fraud scoring, because it is cheaper, faster and more predictable. I pick GenAI for language, documents and reasoning tasks.",
"8":"An LLM, or Large Language Model, is a very large neural network, built on the Transformer architecture, trained on huge amounts of text to predict the next token. 'Large' refers to billions of parameters and the scale of training data. After this pre-training, models are usually instruction-tuned and aligned with human feedback so they follow instructions and behave safely. Important point for an interview: an LLM learns language patterns, it is not a database of verified facts. That is why it can be fluent and still wrong, and why it has a knowledge cutoff. We fix those gaps by adding RAG for fresh private data and tools for actions and calculations.",
"9":"At a high level the flow is this. The input text is split into tokens, and each token becomes an integer ID. Each ID is converted into an embedding vector and position information is added. These vectors pass through many Transformer layers, where self-attention lets every token look at the others to understand context. The final layer gives a probability for every token in the vocabulary as the next token. We pick one using a sampling setting like temperature, append it to the text, and repeat. This is called autoregressive generation. Training has stages: pre-training on raw text, then supervised fine-tuning on instructions, then preference tuning like RLHF. At inference, a KV cache avoids recomputing past tokens, which keeps generation fast.",
"10":"A token is the basic unit of text an LLM reads and writes. It can be a whole word, part of a word, a punctuation mark or even a space. In English, one token is roughly four characters or about three quarters of a word. The model never sees raw text, it sees integer token IDs. Tokens matter in practice for three reasons: pricing is per token, the context window is measured in tokens, and latency grows with token count. Code, numbers and languages like Hindi usually take more tokens than plain English. So I count tokens with a tokenizer library before sending big prompts, to control cost and avoid limit errors.",
"11":"Tokenization converts text into tokens using a fixed vocabulary learned before training. Most modern LLMs use subword methods like Byte Pair Encoding, WordPiece or SentencePiece. For BPE, we start from single characters or bytes and repeatedly merge the most frequent pair, until we reach a vocabulary of, say, 50k to 200k pieces. At runtime, the text is split into the longest known pieces, and each piece maps to an ID. The benefit is that common words stay as one token while rare words break into smaller parts, so the model never hits an unknown word. Different models have different tokenizers, so token counts for the same text can differ between models.",
"12":"The context window is the maximum number of tokens the model can handle in one request, counting the input and the output together. Think of it as the model's working memory for that single call. Sizes range from a few thousand tokens to over a million in newer models. LLMs are stateless, so for a chat we resend the history every time, and that history uses the window. Bigger windows cost more and can be slower, and models can also miss details buried in the middle of a very long prompt. So I do not just stuff everything in. I retrieve only what is relevant and keep the prompt tight.",
"13":"Depending on the API, we either get an error or the input gets truncated, and in both cases we can lose important information. So I plan for it in advance. First I count tokens before calling the model. Then I use strategies like RAG to send only the relevant chunks, summarizing older conversation turns, a sliding window that keeps only recent messages, and map-reduce summarization for very long documents, where I summarize parts and then combine the summaries. I also use prompt caching for repeated content. I choose a long-context model only when the task truly needs the whole document, because it is more expensive and slower.",
"14":"Temperature controls how random the model's next-token choice is. Technically, it scales the model's scores before they become probabilities. A low temperature, around 0 to 0.3, makes the model pick the most likely tokens, so output is focused and repeatable. A high temperature, around 0.8 to 1 or more, flattens the probabilities, so output is more varied and creative but also more error-prone. My rule: low for extraction, classification, SQL generation, structured JSON and agent tool calls; higher for brainstorming and creative writing. One caution: even temperature 0 is not guaranteed to be perfectly identical every time, because of how the hardware does the math.",
"15":"Both control randomness, but in different ways. Temperature reshapes the whole probability distribution, making it sharper or flatter. Top-p, also called nucleus sampling, cuts the candidate list: we sort tokens by probability and keep only the smallest group whose combined probability reaches p, say 0.9, then sample from that group. So a low top-p removes the unlikely tail of tokens. Top-k is similar but keeps a fixed number of top tokens. In practice I change one of them and leave the other at default, because tuning both together makes behaviour hard to predict. For production tasks that need consistency, I keep temperature low.",
"16":"Hallucination is when an LLM produces output that sounds confident and fluent but is false, made up or not supported by the source. Examples are a fake citation, an invented function in a library, a wrong number, or an answer that contradicts the document it was given. There are two kinds. Factual hallucination means the answer is wrong about the world. Faithfulness hallucination means the answer is not supported by the context we provided, which is the main concern in RAG. It is dangerous because the tone sounds trustworthy, so users may not notice. That is why production systems need grounding, validation and evaluation, not just a good prompt.",
"17":"The root cause is that an LLM is trained to predict a plausible next token, not to verify truth. It has no built-in fact-check step and no live database. Other causes: gaps or errors in the training data, a knowledge cutoff so recent facts are missing, ambiguous or underspecified prompts, a tendency to answer instead of saying 'I don't know', long or noisy context that distracts it, and sampling randomness at higher temperature. Even when the right fact exists in its weights, the model may fail to recall it exactly. Understanding this tells us the fix: give the model verified context and make it show its sources.",
"18":"I use several layers. First, ground the model with RAG so answers come from trusted documents. Second, write the prompt clearly: answer only from the given context, and say 'I don't know' if the answer is not there. Third, ask for citations or quoted evidence for each claim. Fourth, use low temperature for factual tasks. Fifth, force structured output and validate it with a schema and business rules. Sixth, use tools for things models are weak at, like calculations and live lookups. Seventh, add a verification step, such as an LLM-as-judge faithfulness check. Finally, send high-risk cases to a human and monitor hallucination rate in production with an evaluation set."
});

const list=document.getElementById('list');
S.forEach(([t,qs])=>{
  const w=document.createElement('section');
  const h=document.createElement('h2');h.textContent=t+' ('+qs.length+')';w.appendChild(h);
  qs.forEach(([n,q])=>{
    const d=document.createElement('details');
    const s=document.createElement('summary');
    const a=A[n];
    s.innerHTML='<span class="n">'+n+'.</span><span class="q"></span><span class="ok">'+(a?'✓':'')+'</span>';
    s.querySelector('.q').textContent=q;s.querySelector('.q').style.flex='1';
    const b=document.createElement('div');b.className='a';
    if(Array.isArray(a)){const u=document.createElement('ul');a.forEach(x=>{const l=document.createElement('li');l.textContent=x;u.appendChild(l)});b.appendChild(u)}
    else{const p=document.createElement('p');if(!a)p.className='todo';p.textContent=a||'Answer coming in the next batch.';b.appendChild(p)}
    d.append(s,b);w.appendChild(d);
  });
  list.appendChild(w);
});
const ds=()=>[...list.querySelectorAll('details')];
document.getElementById('open').onclick=()=>ds().forEach(d=>d.open=true);
document.getElementById('close').onclick=()=>ds().forEach(d=>d.open=false);
document.getElementById('q').oninput=e=>{
  const t=e.target.value.toLowerCase();let c=0;
  [...list.children].forEach(w=>{let v=0;w.querySelectorAll('details').forEach(d=>{const m=d.textContent.toLowerCase().includes(t);d.style.display=m?'':'none';if(m)v++});w.style.display=v?'':'none';c+=v});
  document.getElementById('none').style.display=c?'none':'block';
};
</script>
