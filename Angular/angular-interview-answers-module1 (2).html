<main><p class="n">Each answer is written the way you speak it in an interview: about 2 minutes, simple words. Open a topic, read it aloud once, then say it in your own words. Next modules: TypeScript, Components, Routing, Forms, RxJS and the rest.</p><div id="app"></div></main>
<script type="text/plain" id="d2">
Q1. [Tricky] What is the difference between constructor and ngOnInit?
The constructor is a plain TypeScript feature. It runs first, when the class is created. In Angular I use it only for dependency injection, so Angular can give me services.¶ngOnInit is an Angular hook. It runs once after Angular has set the input values. So inside ngOnInit I can safely use inputs, call APIs and set up the component.¶Why does this matter? In the constructor, inputs are still undefined. If I read an input there, I get a wrong value. That is the common mistake.¶My rule: constructor for injection, ngOnInit for logic. In modern code we use inject() for services, so the constructor often stays empty.
Q2. [Tricky] A parent changes a property inside an object it passes to a child. Why does ngOnChanges not fire?
ngOnChanges checks the reference of the input, not what is inside it. If the parent changes one property of the same object, the reference is the same, so Angular sees no change.¶Example: user.name = 'Ravi' keeps the same object. ngOnChanges stays silent.¶The fix is to be immutable. The parent creates a new object: user = { ...user, name: 'Ravi' }. Now the reference changes and ngOnChanges fires.¶This is even more important with OnPush, because OnPush also depends on reference change. Another option is to use signals, where the child reads the signal and updates by itself. My habit: never mutate inputs, always create a new copy.
Q3. [Scenario] A page shows 10,000 rows and the browser becomes slow. What will you do?
First I find the cause with Chrome DevTools or Angular DevTools. Usually the problem is too many DOM nodes and too many change detection checks.¶Fixes, in order. One: do not render all rows. Use pagination or server side paging. Two: if the list must be long, use virtual scrolling from the CDK, so only visible rows are in the DOM. Three: use track in @for so Angular reuses DOM nodes. Four: use OnPush so fewer checks run. Five: avoid method calls and heavy pipes in the row template.¶For search and filter, I do it on the server or debounce it.¶I would say: reduce the data shown, reuse the DOM, reduce the checks. Then I measure again to prove the improvement.
Q4. [Tricky] What is ExpressionChangedAfterItHasBeenChecked and how do you fix it?
It is a development mode error. Angular checks the bindings, and then in dev mode it checks a second time to make sure nothing changed. If a value changed between the two checks, it throws this error.¶Typical case: a child changes a value in ngAfterViewInit that the parent already used in its template. The parent view was already checked with the old value.¶The real fix is to fix the data flow. Do not change parent state from the child's after-view hook. Move the logic earlier, like ngOnInit, or compute the value in the parent.¶Quick workarounds are detectChanges() or setTimeout, but they hide a design problem, so I use them only if I have no other way. Signals help here because updates are tracked clearly.
Q5. [Scenario] In production, the app becomes slower the longer a user stays. How do you find a memory leak?
The usual cause is subscriptions that never end, event listeners, timers or intervals not cleared.¶To find it, I open Chrome DevTools Memory tab, take heap snapshots after navigating between pages many times, and see which objects keep growing, like detached DOM nodes or component instances.¶In the code, I check every subscribe call. For HTTP calls it is fine because they complete. For long streams like interval, valueChanges, router events or Subjects, I must stop them.¶Fixes: use the async pipe, use takeUntilDestroyed with DestroyRef, or unsubscribe in ngOnDestroy. Also remove addEventListener and clearInterval. For prevention, I add a lint rule and review every manual subscribe.
Q6. [Tricky] You push an item into an array, but a custom filter pipe does not update. Why?
A custom pipe is pure by default. A pure pipe runs only when its input reference changes. If I push into the same array, the reference is the same, so Angular does not run the pipe again.¶Options. The best one is to create a new array: items = [...items, newItem]. Then the pipe runs.¶The second option is to mark the pipe impure with pure: false. It then runs on every change detection, which can be slow on big lists.¶The third and cleanest option is not to filter in a pipe at all. Use a computed signal that filters the list, so it updates only when the source or the search term changes. I prefer that for performance.
Q7. [Scenario] A search box calls the API on every key press. How will you improve it?
This causes many useless requests, and old responses can arrive late and show the wrong result.¶I connect the input to a FormControl and use valueChanges with a pipe. First debounceTime of 300 ms, so we wait until the user stops typing. Then distinctUntilChanged, so the same text does not call again. Then filter for a minimum length if needed. Finally switchMap to the API call.¶switchMap is the key. It cancels the previous request when a new text comes, so only the latest result is shown. I also add catchError inside the switchMap, so one failed call does not kill the whole stream.¶Result: fewer calls, correct results, no race condition.
Q8. [Tricky] Explain switchMap, mergeMap, concatMap and exhaustMap with use cases.
All four take a value, start an inner observable, and merge the results. The difference is how they handle a new value while the old inner one is still running.¶switchMap cancels the old one and switches to the new one. Use it for search and typeahead. mergeMap runs all in parallel with no cancel. Use it when order does not matter, like loading details for many ids. concatMap queues them and runs one by one in order. Use it for saving data where order matters. exhaustMap ignores new values while one is running. Use it for a login or submit button, to stop double clicks.¶Easy memory: switch is latest wins, merge is all together, concat is in line, exhaust is ignore new.
Q9. [Scenario] A user double clicks the Pay button and money is deducted twice. How do you prevent it?
I prevent it in the front end and the back end, because the front end alone is not enough.¶In Angular, I use exhaustMap on the click stream, so a second click is ignored while the first request is running. I also disable the button and show a loading state with a signal like isPaying.¶But a user can still refresh or retry, or the network can repeat a request. So the back end must be idempotent. I send an idempotency key in the header, generated once per payment attempt. The server stores it and returns the same result if it sees the key again.¶So the answer is: exhaustMap and a disabled button for the UI, an idempotency key for real safety.
Q10. [Tricky] A component uses OnPush and the view does not update after data changes. Why?
With OnPush, Angular checks the component only in a few cases: an input reference changed, an event happened inside the component, an async pipe emitted, a signal it reads changed, or we call markForCheck.¶If I change data inside a setTimeout, a subscribe callback or a service, and the data is not coming through those paths, the view is not checked.¶Common reason: I mutated an object instead of creating a new one, so the input reference is same.¶Fixes: use immutable updates, use the async pipe, use signals, or call markForCheck in the subscribe. In my team we keep OnPush as the default and use signals, because then this problem mostly disappears.
Q11. [Scenario] The JWT token expires while the user is working. How do you handle it?
I handle it in a functional HTTP interceptor. One interceptor adds the access token to each request. A second step watches for a 401 error.¶When a 401 comes, I call the refresh token endpoint using the refresh token, get a new access token, and retry the original request. In RxJS this is catchError, then switchMap to refresh, then retry the request.¶Important detail: if many requests fail at the same time, I must refresh only once. I keep a BehaviorSubject or a shared observable as a lock, so other requests wait for the new token.¶If the refresh also fails, I clear the session and redirect to login. For safety, the refresh token should be in an httpOnly cookie.
Q12. [Tricky] Subject vs BehaviorSubject vs ReplaySubject, and how are signals different?
A Subject has no memory. A new subscriber gets only the future values. A BehaviorSubject always holds one current value and gives it to every new subscriber immediately. It needs an initial value. A ReplaySubject remembers the last N values and replays them to new subscribers.¶Use cases: Subject for events like a click bus. BehaviorSubject for state like current user. ReplaySubject when late subscribers need history.¶A signal is different. It is not a stream. It always has a value, we read it synchronously by calling it, and Angular knows exactly who uses it, so updates are precise. Signals are great for UI state. RxJS is still better for async streams over time, like search or websockets. I use both together.
Q13. [Scenario] Two sibling components need to share data. How will you do it?
Siblings cannot pass data directly, so I use a common owner.¶Option one: lift the state up to the parent. The parent passes data down with inputs and receives changes with outputs. This is good when the components are close.¶Option two: a shared service provided in root. It holds a signal or a BehaviorSubject. One component updates it, the other reads it. This is the most common answer.¶Option three: for a large app with a lot of shared state, use NgRx or the Signal Store.¶I choose by distance. Near components, parent. Different parts of the app, service. Complex app, store. And I keep the service state private and expose it as read-only.
Q14. [Tricky] What is the difference between ngIf, the hidden attribute and CSS display none?
ngIf, or @if, adds or removes the element from the DOM. When false, the element and its child components are destroyed. When true again, they are created again, and their state is lost.¶The hidden attribute or display none only hides the element visually. The element stays in the DOM, and the component keeps running and keeps its state.¶So choose by need. If it is heavy or rarely shown, use @if to save memory and checks. If it toggles often and I want to keep the state, like a tab with a typed form, use hidden or CSS.¶Also, with @if the component's ngOnInit and ngOnDestroy run again each time, which may call APIs again.
Q15. [Scenario] The first page load of the app is slow because the bundle is big. What will you do?
First I measure. I run ng build with stats and use a bundle analyzer to see which packages are heavy. Then I act.¶One: lazy load routes with loadComponent or loadChildren, so users download only the page they open. Two: use @defer for heavy parts like charts, below the fold. Three: replace big libraries with lighter ones, or import only what I need so tree shaking works. Four: use production build with compression, and the optimized image directive. Five: use SSR with hydration for faster first paint, and cache static files with a CDN.¶Finally, I track Web Vitals like LCP to prove the improvement. So: measure, split, defer, trim, cache.
Q16. [Tricky] What is the difference between a Promise and an Observable?
A Promise gives one value, and it starts immediately when created. It cannot be cancelled. An Observable can give many values over time, it is lazy, so nothing happens until someone subscribes, and we can cancel it with unsubscribe.¶Observables also have operators like map, filter, retry, debounceTime and switchMap. A Promise has only then and catch.¶Because Angular HttpClient returns observables, we get cancel and retry easily. If I need a promise, I use firstValueFrom to convert. For one time async work, async await with promises is fine. For streams like typing, sockets and events, observables are better.
Q17. [Scenario] A user fills a long form and clicks another menu. How do you stop them losing data?
I use a CanDeactivate guard on that route. Before leaving, the router asks the guard if it is allowed.¶The component exposes something like canLeave, which returns false if the form is dirty. In the guard, if dirty, I show a confirm dialog, and return true or false from the user's answer. A functional guard can return a boolean, a promise or an observable, so a dialog result works well.¶The guard protects only Angular navigation. If the user closes the tab or refreshes, I add a beforeunload event listener.¶As an extra, I can save a draft automatically to the server or session storage, so even a crash does not lose the data.
Q18. [Tricky] Why is a ViewChild undefined inside ngOnInit?
Because the view is not ready yet. ngOnInit runs before Angular has rendered the component's template. So the element does not exist.¶ViewChild results are filled before ngAfterViewInit. So I should use it there, for example to focus an input.¶There is one more case. If the element is inside @if or ngIf, it exists only when the condition is true, so even in ngAfterViewInit it can be undefined. For this, we use the static false setting, or the signal based viewChild, which updates when the element appears.¶Rule: ngOnInit for data, ngAfterViewInit for DOM.
Q19. [Scenario] A page needs data from three APIs before it shows. How do you load them?
If the three calls do not depend on each other, I run them in parallel with forkJoin. It waits until all calls complete, and gives one combined result. This is faster than calling one after another.¶Example: forkJoin of users, roles and settings. I handle errors with catchError on each call, so one failed API does not break all, if the page can work with partial data.¶If one call needs the result of another, like user id then orders, I use switchMap to chain them.¶If I want the data before the page opens, I can use a route resolver. And while loading, I show a skeleton or loader. So: forkJoin for parallel, switchMap for dependent.
Q20. [Tricky] Why is calling a method in the template a bad idea?
Angular runs change detection many times, after every click, timer or API response. Any method in the template is called again each time, even if its input did not change.¶If the method does heavy work, like filtering a big list, the app becomes slow. Also, if it returns a new array or object each time, it can cause extra re-rendering and even the ExpressionChanged error.¶Better options: calculate once in the class or in a service, use a computed signal that recalculates only when its dependencies change, or use a pure pipe, which is cached for the same input.¶Simple getters that return a field are fine. The problem is heavy logic. My rule: the template should only display, not calculate.
Q21. [Scenario] Admin pages must open only for admin users. How do you protect them?
I use a functional route guard with canActivate. The guard reads the user role from an auth service, which gets it from the token or the profile API.¶If the role is allowed, return true. If not, return a UrlTree to redirect to login or to an access denied page. I can pass the needed role in route data and read it in the guard, so one guard works for many routes.¶For child routes I use canActivateChild, and for lazy modules canMatch, so the code is not even downloaded.¶Important point: front end guards are only for user experience. A user can bypass them. The real security is the back end checking the role on every API call.
Q22. [Tricky] What is the difference between providedIn root and providing a service in a component?
With providedIn root, there is one shared instance for the whole app. It is a singleton, and Angular can remove it if nobody uses it, which is tree shaking.¶If I put the service in a component's providers, each component instance gets its own new copy, and it is destroyed with the component. Child components share that copy.¶Use root for shared things like auth, API and global state. Use component level for state that should be separate per instance, like each table's own filter state.¶The tricky bug: if you provide in both places, the component gets its own copy and does not see the global one, so data looks missing.
Q23. [Tricky] When do you use signals and when do you use RxJS?
Signals are for state that always has a current value, mainly UI state, like a counter, a selected item or a form flag. They are simple, synchronous, and Angular updates only what depends on them.¶RxJS is for streams of events over time, where I need operators: debounce, retry, cancel, combine, websockets, or HTTP flows.¶They work together. I get data with RxJS, then convert with toSignal for the template. Or use toObservable when a signal must trigger a stream.¶Short answer: signals for state, RxJS for async flow. I do not replace RxJS fully, because signals have no built-in time operators.
Q24. [Scenario] The form fields come from a JSON config sent by the server. How will you build it?
This is a dynamic form. I loop over the config and create a FormControl for each field, with validators from the config, like required or min length. I put them into a FormGroup using FormBuilder.¶In the template I use @for over the fields and a switch on the field type to render input, select, checkbox or date. I can make small reusable field components for each type.¶Validation messages also come from the config. For repeating sections I use FormArray with add and remove.¶Benefits: no new code for a new field. I would also validate on the server, because the config can be changed by users.
Q25. [Tricky] Template-driven vs reactive forms. Which do you choose?
Template-driven forms keep logic in the HTML with ngModel. They are quick for small forms, but harder to test and to control.¶Reactive forms define the form model in the class with FormGroup and FormControl. They are explicit, testable, and support dynamic fields, custom and async validators, and valueChanges streams.¶For real projects I choose reactive forms. They scale better, and the logic is in TypeScript where I can write unit tests.¶I use template-driven only for a tiny form like a search box. Also note modern typed reactive forms give type safety for values.
Q26. [Scenario] Check if a username already exists while the user types. How?
I use an async validator. It is a function that returns an observable or promise of an error object, or null.¶Inside, I take the control value, wait a bit with timer or debounce, then call the API using switchMap. If the name exists, I return { taken: true }, otherwise null.¶Angular runs async validators only after sync validators pass, and the control status becomes PENDING while waiting, so I can show a spinner.¶To avoid too many calls I set updateOn blur, or add the debounce. The server must still check at submit time, because the name may be taken in between.
Q27. [Tricky] You set up lazy loading, but the feature code is still in the main bundle. Why?
Usually because the feature is also imported somewhere in an eager way. If any eager file imports the component or module with a normal import, the bundler puts it in the main bundle, even if the route uses dynamic import.¶Check the main routes and the shared files. Also the feature module may be imported in AppModule or the app config by mistake. A shared barrel file can pull it in too.¶The route must use loadComponent or loadChildren with import(). Then I verify with the bundle analyzer or the network tab, and look for separate chunk files.¶Rule: no static import of a lazy feature anywhere else.
Q28. [Scenario] Show a global loader for all HTTP calls. How?
I use an HTTP interceptor and a loader service. The service holds a counter signal of active requests.¶In the interceptor, I increase the counter when a request starts, and decrease it in finalize, which runs on success, error or cancel. The loader shows when the counter is above zero.¶The counter is important. If I use a simple true and false, the loader hides when the first of two parallel calls finishes.¶I can skip the loader for some calls using a custom header or HttpContext, like background polling. Then the app component shows the spinner.
Q29. [Tricky] takeUntilDestroyed vs async pipe. Which one is better?
Both avoid leaks. The async pipe subscribes in the template and unsubscribes when the component is destroyed. It also works well with OnPush. I prefer it when I only need the value in the view.¶takeUntilDestroyed is for when I must subscribe in the class, for example to run a side effect, call a method or update several fields. I add it to the pipe, and it completes the stream when the component is destroyed.¶Outside the constructor I must pass DestroyRef.¶Best: async pipe or toSignal first, takeUntilDestroyed for side effects, and manual unsubscribe only as the last choice.
Q30. [Scenario] How do you handle errors globally in an Angular app?
I use layers. For HTTP errors, an interceptor with catchError. It maps status codes: 401 goes to refresh or login, 403 to an access page, 500 to a friendly message. It shows a toast and logs the error.¶For code errors, I replace the ErrorHandler class with my own. It catches uncaught exceptions and sends them to a tool like Sentry.¶In components I handle only the errors that need a special action, like a form field message.¶I never show raw server messages to users. I show clean text, and attach a correlation id for support. This gives one place to change behaviour.
Q31. [Tricky] What is zone.js and what changes with zoneless Angular?
Zone.js patches browser async APIs like click, setTimeout and promises. After any of them finishes, it tells Angular, and Angular runs change detection. That is why the UI updates automatically.¶The cost: it checks a lot, even when nothing changed, and it adds bundle size and makes debugging harder.¶In zoneless Angular, we remove zone.js. Change detection runs only when something clearly notifies Angular: a signal changes, an event handler in a template runs, an async pipe emits, or markForCheck is called.¶This is faster and more precise, and it fits signals well. Code that depends on mutating plain fields in timeouts needs to move to signals.
Q32. [Scenario] When do you use NgRx and when a simple service?
I start simple. For small and medium apps a service with signals or a BehaviorSubject is enough.¶I choose NgRx when the state is large and shared by many parts, many developers work together, I need strict flow, time travel debugging, caching rules, or complex side effects. Actions, reducers, selectors and effects give a clear and traceable pattern.¶The price is more code and boilerplate.¶The newer Signal Store is a middle path, with less code and good structure. My answer: do not add NgRx just because it is popular. Add it when the complexity of state is a real problem.
Q33. [Tricky] Why do we call APIs in NgRx effects and not in reducers?
A reducer must be a pure function. Same state and action must always give the same new state. It must not do side effects like HTTP, timers or random values.¶An effect listens to actions, does the side effect, and then dispatches a new action with the result, like loadSuccess or loadFailure. The reducer then updates the state from that action.¶So the flow is: component dispatches load, effect calls the API, effect dispatches success, reducer saves data, selector gives it to the component.¶This separation keeps reducers easy to test and the app predictable.
Q34. [Scenario] Marketing says the pages are not visible on Google and first paint is slow. What do you do?
A normal Angular app sends an almost empty HTML and builds the page in the browser. Some crawlers and slow phones suffer.¶I add server side rendering with ng add @angular/ssr. The server sends full HTML, so crawlers and users see content fast. Then hydration attaches the Angular logic without rebuilding the DOM.¶For pages that do not change, I use prerendering at build time, which is even faster.¶I also set title and meta tags per route, use lazy loaded images, and check Core Web Vitals. Care point: do not use window or document directly in code, because it breaks on the server. Use platform checks.
Q35. [Tricky] What is a hydration mismatch and how do you fix it?
After SSR, the browser gets server HTML, and Angular hydration reuses that DOM. If the HTML the client expects is different from what the server sent, we get a mismatch error.¶Common causes: using random values or current time in the template, using window or localStorage to decide the view, invalid HTML nesting like a div inside a p, or direct DOM changes with innerHTML.¶Fixes: make the first render the same on server and client. Move browser-only logic to afterNextRender or an isPlatformBrowser check. Fix the HTML structure. Avoid manual DOM edits.¶For a special block I can use ngSkipHydration, but it is a last option.
Q36. [Scenario] How do you unit test a component that calls an API?
I never call the real API in a unit test. I use TestBed with the component and provide a mock service, or use provideHttpClientTesting with HttpTestingController.¶Steps: arrange the test bed, create the component, call detectChanges so ngOnInit runs. With the controller I expect one request to the URL, check the method, and flush fake data. Then I assert that the DOM shows the data.¶I also test the error case by flushing an error, and call verify at the end to be sure no extra request is left.¶Tests should be fast, isolated and test behaviour the user sees, not private methods.
Q37. [Tricky] fakeAsync vs waitForAsync in tests. What is the difference?
Both help test async code. waitForAsync waits for all pending async work to finish in real time, then the test ends. Then I use whenStable.¶fakeAsync runs the test in a fake zone where I control time. I call tick to move time forward, and flush to run all pending timers. So a debounce of 300 ms can be tested in an instant, without waiting.¶I prefer fakeAsync because it is faster and more predictable for timers, debounce and promises.¶Limit: fakeAsync does not like real HTTP, so I mock the calls. A leftover timer at the end of a fakeAsync test throws an error, which is useful.
Q38. [Scenario] A rich text editor saves HTML and you show it with innerHTML. Is it safe?
Not by default. Angular sanitizes values bound to innerHTML, and removes dangerous parts like script tags and event handlers. That gives basic protection.¶But the sanitizer also removes things we may want, like styles. Then developers use bypassSecurityTrustHtml, and that is where XSS risk starts, because we trust the input fully.¶My approach: sanitize on the server too, with a library like DOMPurify or a server side allow-list. Keep a strict allowed tag list. Never bypass for user content. Add a Content Security Policy as one more layer.¶Rule: never trust HTML from users, check it on both sides.
Q39. [Tricky] Where do you store the JWT: localStorage or cookie?
localStorage is easy, but any JavaScript on the page can read it. So if there is an XSS bug, the token is stolen.¶An httpOnly, Secure, SameSite cookie cannot be read by JavaScript, so XSS cannot steal it directly. But cookies bring CSRF risk, so I add SameSite and a CSRF token. Angular supports XSRF token headers.¶My preferred design: a short-lived access token in memory, and a refresh token in an httpOnly cookie. On page reload, I call the refresh endpoint to get a new access token.¶No option is perfect. I choose by the security needs, and I also protect against XSS with CSP and sanitization.
Q40. [Scenario] The route changes from user/1 to user/2 but the page does not reload. Why?
Angular reuses the same component instance when only the parameter changes. So ngOnInit does not run again, and the old data stays.¶The fix is to react to the parameter as a stream. I subscribe to route.paramMap, or use paramMap with switchMap to load the user. Then each id change triggers a new API call, and switchMap cancels the old one.¶A modern way is to enable withComponentInputBinding, so the id comes as a signal input, and I use it in a computed or an effect.¶Do not read route.snapshot only once in ngOnInit for such pages.
Q41. [Tricky] What is the difference between ng-content, ng-template and ng-container?
ng-content is for content projection. It marks the place in a component where the parent's content is shown, like a card with a header and body slots.¶ng-template defines a block of HTML that is not rendered by default. It is rendered only when something uses it, like an else block, a structural directive, or a custom outlet. It is like a stored blueprint.¶ng-container is a grouping element that does not create any DOM element. I use it to hold a structural directive without adding an extra div, or to host a template outlet.¶Short: content slot, stored template, invisible wrapper.
Q42. [Scenario] A large company wants separate teams to deploy parts of the app independently. What do you suggest?
This is the case for micro-frontends. Each team owns a feature app, builds and deploys it alone, and a host shell loads them at runtime.¶In Angular I use Module Federation, with the Native Federation or Webpack plugin. The shell loads remote apps with loadRemoteModule in the router.¶Needs to plan: shared libraries and versions, so Angular is not loaded twice, a shared design system, a common auth session, and communication by events or a small shared service.¶Trade-offs: more complexity and harder debugging. I recommend it only for large organizations. For a small team, a well structured monorepo with lazy loaded features is simpler.
Q43. [Tricky] forkJoin never emits a value. What could be wrong?
forkJoin emits only when all source observables complete, and then it gives the last value of each. So if one source never completes, forkJoin waits forever.¶Typical causes: using a Subject, a BehaviorSubject, valueChanges, or a router stream inside it. These do not complete. HttpClient calls complete, so they are fine.¶Also, if one source completes without emitting, forkJoin completes without emitting.¶Fixes: add take(1) or first() to the endless stream, or use combineLatest if I want values on every change. And add catchError, because one error cancels the whole forkJoin.
Q44. [Scenario] Upload a large file and show a progress bar. How?
I send FormData with HttpClient and set reportProgress true and observe events. Then the observable gives HttpEvents, not only the final response.¶I check the event type. For UploadProgress, I calculate the percentage from loaded and total, and update a signal for the progress bar. For the Response event, the upload is complete.¶For a very large file I use chunked upload, or a presigned URL to upload directly to cloud storage like S3, to reduce server load.¶Also add file type and size checks in the front end, a cancel button using unsubscribe, and error handling with a retry. The server must validate again.
Q45. [Tricky] We have an old NgModule app. How do you move to standalone safely?
I do it step by step, not in one big bang. Standalone and NgModules can live together, so the app keeps working.¶Angular gives a migration schematic: ng generate @angular/core:standalone. It runs in three modes: convert components, directives and pipes to standalone, then remove unnecessary NgModules, then switch bootstrap to bootstrapApplication.¶I run it per folder or feature, run tests after each step, and fix imports. Lazy routes change to loadComponent.¶Benefits: less boilerplate, clearer dependencies, better tree shaking. I also update third party libraries to versions that support standalone, and commit in small pieces so rollback is easy.
</script>

<script type="text/plain" id="d">
1. What is Angular?
Angular is a front-end framework from Google. We use it to build big web applications that run in the browser, mostly single page applications.¶The word framework matters. Angular gives everything in one box: components for UI, a router for pages, forms, an HTTP client for APIs, dependency injection and testing tools. In React you pick these extra parts yourself. In Angular they come ready.¶It is written in TypeScript, so we get type safety and good editor help. The app is built from small pieces called components, and each piece has its own HTML, CSS and logic.¶We use Angular mostly for enterprise apps like banking dashboards or admin portals, because the structure is strict, and a large team can follow the same pattern. Today Angular is standalone-first and uses signals for state.¶One line to finish: Angular is an opinionated, complete framework for building large, maintainable web apps.
2. Angular vs React vs Vue
The main difference is what each one is. Angular is a full framework. React is only a UI library. Vue is in the middle and is called a progressive framework.¶Angular gives router, forms, HTTP and dependency injection built in, and it uses TypeScript by default. So every team writes code in a similar way. It has a steeper learning curve, but it is good for big enterprise projects.¶React gives only the view layer. For routing, state and forms you choose extra libraries. It is very flexible and has a huge community, but different teams end up with different styles.¶Vue is easy to learn, has simple templates and a light core. It is popular for small and medium apps.¶Binding is another point. Angular supports two-way binding easily with ngModel. React is one-way data flow.¶If the interviewer asks which I prefer, I say: for a large team and long-term project I choose Angular, for a quick flexible UI I may choose React.
3. Angular architecture
Think of Angular as layers. At the top is the application, which starts in main.ts with bootstrapApplication. The app is a tree of components.¶Each component has a template, which is the HTML, a class for the logic, and styles. Components show data and handle user actions.¶The business logic and API calls do not go inside components. They go inside services. Angular gives these services to components using dependency injection, so we do not create them with new.¶Then we have the router, which maps a URL to a component, and directives and pipes, which add behaviour and format data in templates.¶Earlier, Angular grouped these pieces in NgModules. Now we use standalone components, where each component declares its own imports. This is simpler.¶In short: components for the UI, services for the logic, DI to connect them, router for navigation.
4. Angular CLI
The CLI is the command line tool that makes development fast. It creates, runs, tests and builds the project, so we do not set up webpack or configs by hand.¶Main commands I use every day: ng new to create a project, ng serve to run it locally with live reload, ng generate to create a component, service or guard, ng test for unit tests, and ng build for the production bundle.¶ng generate has short forms. ng g c user-list creates a component with its files. ng g s api creates a service.¶We also use ng add to install packages with setup, like Angular Material, and ng update to upgrade Angular versions safely.¶The benefit is a standard structure and best practice built in, so every developer in the team gets the same setup.
ng new my-app --standalone
ng serve
ng g c user-list
ng build --configuration production
5. Angular project structure
When I run ng new, I get a few important places. The src folder holds the code. Inside it, main.ts is the entry point, which boots the app. The app folder has the root component and app.config.ts for global providers like the router and HttpClient. The routes live in app.routes.ts.¶index.html is the single page where the app is loaded, with the app-root tag. styles.css has global styles. The public or assets folder keeps images and static files.¶Outside src, angular.json controls build and serve settings, package.json has the dependencies, and tsconfig.json has the TypeScript rules.¶For a real project, I do not keep everything in app. I make folders like core for singletons such as the auth service and interceptors, shared for reusable components and pipes, and features for each business area, like orders or employees.¶That keeps the project clean as it grows.
6. Components
A component is the basic building block of an Angular app. It controls one part of the screen.¶It has three parts: a TypeScript class with data and methods, an HTML template for the view, and CSS for style. We connect them with the @Component decorator, where we set the selector, which is the custom tag name, the template, the styles, and imports.¶For example, a header, a product card or a login form can each be a component. The page is then a tree of components, and a parent can use a child by writing its selector tag.¶Components are reusable and easy to test, because each one has one clear job. Best practice is to keep the component thin: only UI logic. API calls and business rules go to services.¶Today we write them as standalone, so no NgModule is needed.
@Component({
  selector: 'app-hello',
  standalone: true,
  template: '<h1>Hello {{ name }}</h1>'
})
export class HelloComponent { name = 'Rahul'; }
7. Templates
A template is the HTML of a component, plus Angular syntax. It decides what the user sees. It can be inline or in a separate html file using templateUrl.¶Inside the template we can show data with interpolation, bind properties and events, use pipes to format values, and use control flow to show or repeat elements.¶In the new syntax we write @if, @else, @for and @switch. Earlier it was ngIf and ngFor. The new one is faster and easier to read, and @for needs a track expression so Angular can reuse DOM nodes.¶Templates are not plain HTML. Angular compiles them into code that updates only what changed. We cannot use script tags in them, and expressions should be simple, with no heavy logic, because they run on every change detection.¶Rule I follow: calculate in the class, display in the template.
@if (items.length) {
  @for (i of items; track i.id) { <li>{{ i.name }}</li> }
} @else { <p>No data</p> }
8. Data binding
Data binding connects the component class with the template, so the screen and the data stay in sync without manual DOM code.¶There are four types. Interpolation shows a value as text with double curly braces. Property binding sets an element property from the class, with square brackets. Event binding listens to a user action and calls a method, with round brackets. Two-way binding does both together with the banana-in-a-box syntax.¶The direction matters. Interpolation and property binding go from class to view. Event binding goes from view to class. Two-way goes both ways.¶A common interview point: binding to a property is not the same as setting an HTML attribute. Property binding changes the live DOM property, which is what we usually want.¶So: binding keeps UI and data connected, and Angular updates the view when the data changes.
9. Interpolation
Interpolation is the simplest binding. We write an expression inside double curly braces, and Angular shows its result as text in the HTML.¶The expression can be a property, a small calculation, a method call or a pipe. For example, a user name, a total price or a date with the date pipe.¶It is one-way, from class to view. When the value changes, Angular updates the text.¶Limits: we cannot use assignments, new, or multiple statements inside the braces. Also avoid calling heavy methods there, because they run on every change detection and slow the page. Use computed signals or a pipe instead.¶Angular also escapes the content, so if the value has HTML or script, it is shown as text. This protects us from basic XSS.
<h2>Welcome, {{ user.name }}</h2>
<p>Total: {{ price * qty | currency }}</p>
10. Property binding
Property binding sets a property of an element or a component from the class. We use square brackets around the property name.¶For example, setting the src of an image, the disabled state of a button, or passing data into a child component with an input. When the class value changes, the DOM property updates automatically.¶It is one-way, class to view. The right side is an expression, not a string, so [disabled]="isLoading" uses the variable.¶Key difference from interpolation: interpolation always gives a string. Property binding keeps the real type, such as boolean, object or array. That is why for disabled or for passing objects to a child we must use property binding.¶Also, it is about DOM properties, not HTML attributes. For attributes like aria-label we use attr.aria-label.
<img [src]="imgUrl" [alt]="title">
<button [disabled]="isLoading">Save</button>
<input [attr.aria-label]="label">
11. Event binding
Event binding lets the template tell the class that something happened, like a click, key press or form submit. We write the event name in round brackets and call a method.¶For example, click calls save. We can also pass the event object using the dollar event keyword, to read things like the typed value or the key pressed.¶It is one-way, view to class. The method then changes data, and Angular updates the screen.¶Useful points: key events can be filtered, like keyup.enter, so the method runs only on Enter. For custom child components, the same round bracket syntax listens to an Output event emitted by the child.¶Best practice: keep the handler small, and move business logic to a service.
<button (click)="save()">Save</button>
<input (keyup.enter)="search($event)">
<app-child (selected)="onSelect($event)"></app-child>
12. Two-way binding
Two-way binding keeps the view and the class in sync in both directions. If the user types in the input, the class variable changes. If the class variable changes, the input updates.¶The syntax is square brackets inside round brackets, called banana in a box. With forms, it is ngModel, and we must import FormsModule.¶Internally it is just a short form of two things: a property binding for the value and an event binding for the change. So [(ngModel)]="name" means [ngModel]="name" and (ngModelChange)="name=$event".¶It is the same for our own components. A child can have an input called value and an output called valueChange, and then the parent can use banana syntax. In modern Angular we can use the model signal for this.¶Where to use: simple forms. For big forms with validation I prefer reactive forms.
<input [(ngModel)]="name">
<p>Hello {{ name }}</p>
13. Directives
A directive is a class that adds behaviour to an element in the DOM. It is a way to change how the HTML looks or acts, without writing a full component.¶There are three kinds. Components are directives with a template. Structural directives change the DOM layout by adding or removing elements, like ngIf and ngFor. Attribute directives change the look or behaviour of an existing element, like ngClass and ngStyle.¶We can create our own with the @Directive decorator, and use it as an attribute. For example, a highlight directive that changes the background on hover, or an auto-focus directive.¶Why use them: to reuse DOM logic in many places and keep components clean.
@Directive({ selector: '[appHighlight]', standalone: true })
export class HighlightDirective {
  constructor(el: ElementRef) { el.nativeElement.style.background = 'yellow'; }
}
14. Structural and attribute directives
Structural directives change the structure of the DOM. They add, remove or repeat elements. Examples are if, for and switch. In the new syntax they are control flow blocks like @if and @for. In the old syntax they have a star, like ngIf, which hides the element by removing it from the DOM completely.¶Attribute directives do not add or remove elements. They only change appearance or behaviour of an existing element. Examples are ngClass to add CSS classes, ngStyle to set styles, and our own custom directives.¶Simple way to remember: structural decides whether the element exists, attribute decides how the element looks.¶An important point: only one structural directive can be on one element in the old syntax. And for lists, always use track, or trackBy in the old way, so Angular does not rebuild the whole list when data changes.
@for (u of users; track u.id) { <li [ngClass]="{active: u.on}">{{u.name}}</li> }
15. Pipes
A pipe transforms a value in the template before showing it, without changing the original data. We use the pipe symbol.¶Angular gives built-in pipes: date, currency, uppercase, lowercase, percent, json, slice, and async. For example a date pipe turns a raw date into a readable format, and the async pipe subscribes to an observable and shows its value.¶Pipes can take parameters, like date with a format string, and we can chain them one after another.¶Pure vs impure is a popular question. A pure pipe runs only when its input value or reference changes, so it is fast. An impure pipe runs on every change detection, so it can be slow. Async is impure by design.¶Use a pipe for formatting. Do not put heavy logic in it.
{{ today | date:'dd MMM yyyy' }}
{{ price | currency:'INR' }}
{{ users$ | async | json }}
16. Custom pipes
When the built-in pipes are not enough, we create our own. It is a class with the @Pipe decorator, a name, and a transform method.¶The transform method gets the input value as the first argument, and extra parameters after that. It returns the new value.¶For example, a pipe to shorten long text, to show a file size in KB or MB, or to mask a phone number.¶Pipes are pure by default, which is good for performance. I make it impure only if I must react to changes inside the same object, but I avoid it for heavy work.¶Why use a pipe instead of a method in the template: a pure pipe is cached by input, while a method runs on every change detection.
@Pipe({ name: 'truncate', standalone: true })
export class TruncatePipe implements PipeTransform {
  transform(v: string, n = 20): string {
    return v.length > n ? v.slice(0, n) + '...' : v;
  }
}
17. Lifecycle hooks
Lifecycle hooks are methods Angular calls at special moments in a component's life, from creation to destruction. We implement them to run our code at the right time.¶Order I explain: ngOnChanges runs when an input value changes. ngOnInit runs once after the first inputs are set, and it is the place for initial API calls. ngDoCheck runs on every change detection. ngAfterViewInit runs after the view and child views are ready, so we can use ViewChild there. ngOnDestroy runs just before the component is removed, to clean up subscriptions and timers.¶Common question: constructor vs ngOnInit. The constructor is for dependency injection only. ngOnInit is for logic, because inputs are available by then.¶Best practice: always clean up in ngOnDestroy, or use takeUntilDestroyed, to avoid memory leaks.
ngOnInit() { this.load(); }
ngOnDestroy() { this.sub.unsubscribe(); }
18. Component communication
Components must talk to each other, and the way depends on their relationship.¶Parent to child: the parent passes data with an input. Child to parent: the child sends an event with an output and the parent listens. This is the most common pattern.¶A parent can also read a child directly with ViewChild, to call its method, but I use it only when needed.¶For unrelated components, like siblings or far away components, we use a shared service. The service holds a BehaviorSubject or a signal, and both components use it. For large apps, a store like NgRx.¶A routed page can also pass data with route parameters or query parameters.¶Rule: data goes down, events go up. Keep the child dumb and reusable.
19. @Input and @Output
Input and Output are how a parent and child talk. @Input lets a child receive data from its parent. @Output lets a child tell the parent something happened.¶For an input, the parent uses property binding: [name]="userName". Inside the child, the value is available as a normal property, and we can detect changes in ngOnChanges or use a setter.¶For an output, the child creates an EventEmitter and calls emit with a value. The parent listens with event binding: (selected)="onSelect($event)".¶In new Angular we also have the signal based functions input() and output(), and required inputs. They give better type safety and work well with signals.¶Good practice: do not change the input object inside the child. Emit an event and let the parent decide.
@Input() name!: string;
@Output() selected = new EventEmitter<string>();
pick() { this.selected.emit(this.name); }
20. ViewChild and ContentChild
Both are used to get a reference to something from inside the component class. The difference is where the element lives.¶ViewChild finds an element, directive or child component that is in the component's own template. For example, an input element with a template reference variable, so I can call focus on it. We can use it safely after ngAfterViewInit.¶ContentChild finds an element that the parent projected into our component using ng-content. It is available after ngAfterContentInit.¶Simple memory: ViewChild is what I wrote in my own template. ContentChild is what someone else put inside my tag.¶There are also ViewChildren and ContentChildren for many items. In the modern version we have signal based viewChild() and contentChild().¶Use carefully. Direct DOM access should be small, because binding is the cleaner way.
@ViewChild('box') box!: ElementRef;
ngAfterViewInit() { this.box.nativeElement.focus(); }
</script>
